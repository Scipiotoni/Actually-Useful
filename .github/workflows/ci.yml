name: CI

on:
  push:
    # au-learn only holds learning progress (see AU_LEARN_BRANCH); nothing to test there.
    branches-ignore: [au-learn]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check syntax of browser scripts
        run: |
          for file in public/*.js public/learn/*.js; do node --check "$file"; done
      - name: Run tests
        run: npm test
