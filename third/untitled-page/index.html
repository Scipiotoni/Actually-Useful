<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRIKE OPS — Browser FPS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#000; font-family:Arial, sans-serif; color:#fff; }
  canvas { display:block; }

  #menu {
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at center, #14202c, #05080c);
  }
  .panel {
    width:min(680px, 92vw); padding:34px; border-radius:18px;
    background:rgba(10,16,22,.92); border:1px solid #2b3a48;
    box-shadow:0 25px 80px rgba(0,0,0,.7); text-align:center;
  }
  h1 { font-size:44px; letter-spacing:5px; color:#ffcc33; text-shadow:0 0 24px rgba(255,204,51,.35); }
  .sub { margin:8px 0 22px; color:#9fb0bd; font-size:15px; }
  .keys { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; text-align:left; margin-bottom:24px; }
  .key { background:#101820; border:1px solid #26333f; padding:10px 12px; border-radius:9px; font-size:13px; color:#c8d4dc; }
  b { color:#ffcc33; }
  button {
    padding:14px 34px; font-size:17px; font-weight:bold; cursor:pointer;
    color:#101820; background:#ffcc33; border:none; border-radius:10px;
    transition:.15s; letter-spacing:1px;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(255,204,51,.3); }

  #hud { position:fixed; inset:0; z-index:10; pointer-events:none; display:none; }
  #crosshair {
    position:absolute; left:50%; top:50%; width:26px; height:26px;
    transform:translate(-50%,-50%);
  }
  #crosshair::before, #crosshair::after {
    content:""; position:absolute; background:#7dff9b; box-shadow:0 0 3px #000;
  }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }

  #healthbar {
    position:absolute; left:24px; bottom:24px; width:270px;
    background:rgba(0,0,0,.55); border:1px solid #32404d; border-radius:10px; padding:10px;
  }
  .label { font-size:11px; color:#9fb0bd; margin-bottom:5px; letter-spacing:1px; }
  .bar { height:9px; background:#222c35; border-radius:5px; overflow:hidden; }
  .fill { height:100%; width:100%; background:linear-gradient(90deg,#39d353,#7dff9b); transition:width .15s; }

  #ammo {
    position:absolute; right:24px; bottom:24px; text-align:right;
    background:rgba(0,0,0,.55); border:1px solid #32404d; border-radius:10px; padding:10px 16px;
  }
  #ammoNum { font-size:30px; font-weight:bold; color:#ffcc33; }
  #ammoMax { font-size:13px; color:#9fb0bd; }

  #roundInfo {
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.55); border:1px solid #32404d; border-radius:10px;
    padding:8px 18px; font-size:15px; letter-spacing:1px;
  }
  #score { color:#7dff9b; font-weight:bold; }
  #kills { color:#ffcc33; font-weight:bold; }

  #hitmarker {
    position:absolute; left:50%; top:50%; width:34px; height:34px;
    transform:translate(-50%,-50%) rotate(45deg); opacity:0;
  }
  #hitmarker div {
    position:absolute; background:#fff; width:12px; height:2px;
  }
  #hitmarker div:nth-child(1) { left:0; top:0; }
  #hitmarker div:nth-child(2) { right:0; top:0; transform:rotate(90deg); }
  #hitmarker div:nth-child(3) { left:0; bottom:0; }
  #hitmarker div:nth-child(4) { right:0; bottom:0; transform:rotate(90deg); }

  #damageFlash {
    position:absolute; inset:0; background:rgba(255,0,0,.28); opacity:0; transition:opacity .25s;
  }

  #minimap {
    position:absolute; right:24px; top:24px; width:170px; height:170px;
    background:rgba(0,0,0,.6); border:1px solid #32404d; border-radius:10px;
  }

  #endScreen {
    position:fixed; inset:0; z-index:25; display:none;
    align-items:center; justify-content:center; background:rgba(0,0,0,.82);
  }
</style>
</head>
<body>

<div id="menu">
  <div class="panel">
    <h1>STRIKE OPS</h1>
    <div class="sub">Tactical browser FPS • Eliminate all hostiles to win the round</div>
    <div class="keys">
      <div class="key"><b>WASD</b> — Move</div>
      <div class="key"><b>Mouse</b> — Aim</div>
      <div class="key"><b>Left Click</b> — Fire</div>
      <div class="key"><b>R</b> — Reload</div>
      <div class="key"><b>Shift</b> — Sprint</div>
      <div class="key"><b>Space</b> — Jump</div>
      <div class="key"><b>1 / 2</b> — Rifle / Pistol</div>
      <div class="key"><b>Esc</b> — Pause</div>
    </div>
    <button id="startBtn">DEPLOY</button>
  </div>
</div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="hitmarker"><div></div><div></div><div></div><div></div></div>
  <div id="damageFlash"></div>
  <div id="roundInfo">ROUND <span id="round">1</span> • ENEMIES <span id="enemiesLeft">0</span> • SCORE <span id="score">0</span> • KILLS <span id="kills">0</span></div>
  <div id="healthbar">
    <div class="label">HEALTH</div>
    <div class="bar"><div class="fill" id="healthFill"></div></div>
  </div>
  <div id="ammo">
    <div id="ammoNum">30</div>
    <div id="ammoMax">/ 90 • RIFLE</div>
  </div>
  <canvas id="minimap" width="170" height="170"></canvas>
</div>

<div id="endScreen">
  <div class="panel">
    <h1 id="endTitle">ROUND COMPLETE</h1>
    <div class="sub" id="endText"></div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1016);
scene.fog = new THREE.Fog(0x0b1016, 35, 130);

const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, .1, 300);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new PointerLockControls(camera, renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0x8fb4d8, 0x1a222b, .75));
const sun = new THREE.DirectionalLight(0xfff0c8, 1.35);
sun.position.set(28, 46, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -70;
sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70;
sun.shadow.camera.bottom = -70;
scene.add(sun);

// Arena
const world = new THREE.Group();
scene.add(world);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(150, 150),
  new THREE.MeshStandardMaterial({ color:0x2c343c, roughness:.95 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
world.add(ground);

function box(x,y,z,w,h,d,color,rough=.8){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ color, roughness:rough })
  );
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  world.add(m);
  return m;
}

// Outer walls
const wallColor = 0x3a4652;
box(0, 5, -60, 120, 10, 2, wallColor);
box(0, 5, 60, 120, 10, 2, wallColor);
box(-60, 5, 0, 2, 10, 120, wallColor);
box(60, 5, 0, 2, 10, 120, wallColor);

// Map structures
const crate = 0x7a5a34;
const concrete = 0x4b5661;
const metal = 0x5c6a77;

box(-22, 1, -18, 8, 2, 8, crate);
box(-22, 3, -18, 6, 2, 6, crate);
box(20, 1, -24, 10, 2, 6, concrete);
box(0, 2, -34, 26, 4, 2, concrete);
box(-34, 1.5, 12, 2, 3, 22, metal);
box(34, 1.5, 12, 2, 3, 22, metal);
box(0, 1, 18, 16, 2, 4, concrete);
box(-12, 2.5, 34, 4, 5, 4, crate);
box(12, 2.5, 34, 4, 5, 4, crate);
box(0, 4, 0, 6, 8, 6, concrete);
box(-42, 1, -38, 10, 2, 10, crate);
box(42, 1, 38, 10, 2, 10, crate);
box(-45, 2, 35, 6, 4, 6, metal);
box(45, 2, -35, 6, 4, 6, metal);

// Collision boxes
const colliders = [];
world.children.forEach(o => {
  if (o !== ground) {
    const b = new THREE.Box3().setFromObject(o);
    colliders.push(b);
  }
});

// Player
const player = {
  health:100, maxHealth:100,
  velocity:new THREE.Vector3(),
  onGround:true,
  radius:.45,
  height:1.7
};
camera.position.set(0, player.height, 45);

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') reload();
  if (e.code === 'Digit1') switchWeapon(0);
  if (e.code === 'Digit2') switchWeapon(1);
});
addEventListener('keyup', e => keys[e.code] = false);

// Weapons
const weapons = [
  { name:'RIFLE', damage:26, fireRate:.105, mag:30, reserve:90, spread:.012, recoil:.025, auto:true, sound:520 },
  { name:'PISTOL', damage:38, fireRate:.24, mag:12, reserve:48, spread:.006, recoil:.018, auto:false, sound:760 }
];
let currentWeapon = 0;
weapons.forEach(w => { w.ammo = w.mag; });

let shooting = false;
let lastShot = 0;
let reloading = false;

addEventListener('mousedown', e => {
  if (e.button === 0) shooting = true;
});
addEventListener('mouseup', e => {
  if (e.button === 0) shooting = false;
});

function switchWeapon(i){
  if (i === currentWeapon || reloading) return;
  currentWeapon = i;
  updateHUD();
}

function reload(){
  const w = weapons[currentWeapon];
  if (reloading || w.ammo === w.mag || w.reserve <= 0) return;
  reloading = true;
  setTimeout(() => {
    const need = w.mag - w.ammo;
    const take = Math.min(need, w.reserve);
    w.ammo += take;
    w.reserve -= take;
    reloading = false;
    updateHUD();
  }, 1100);
}

// Audio
let audioCtx;
function beep(freq, duration=.08, type='square', volume=.08){
  if (!audioCtx) audioCtx = new AudioContext();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.value = volume;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + duration);
  o.stop(audioCtx.currentTime + duration);
}

// Enemies
const enemies = [];
const enemyGeo = new THREE.CapsuleGeometry(.45, 1, 6, 12);
const enemyMat = new THREE.MeshStandardMaterial({ color:0xd94b3a, roughness:.55 });
const enemyHeadMat = new THREE.MeshStandardMaterial({ color:0x2a2f36 });

function spawnEnemy(){
  const g = new THREE.Group();

  const body = new THREE.Mesh(enemyGeo, enemyMat);
  body.position.y = 1;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(.32, 16, 12), enemyHeadMat);
  head.position.y = 2;
  head.castShadow = true;
  g.add(head);

  const edge = 52;
  const x = (Math.random()*2-1) * edge;
  const z = (Math.random()*2-1) * edge;
  g.position.set(x, 0, z);

  scene.add(g);
  enemies.push({
    mesh:g, head, health:100,
    speed:2.5 + Math.random()*1.6,
    lastAttack:0,
    alive:true
  });
}

function clearEnemies(){
  enemies.forEach(e => scene.remove(e.mesh));
  enemies.length = 0;
}

// Bullets / tracers
const tracers = [];
function shoot(){
  const now = performance.now()/1000;
  const w = weapons[currentWeapon];

  if (reloading || now - lastShot < w.fireRate) return;
  if (w.ammo <= 0){
    beep(180, .08, 'sawtooth', .04);
    reload();
    return;
  }

  lastShot = now;
  w.ammo--;
  updateHUD();
  beep(w.sound, .06, 'square', .07);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  dir.x += (Math.random()-.5) * w.spread;
  dir.y += (Math.random()-.5) * w.spread;
  dir.z += (Math.random()-.5) * w.spread;
  dir.normalize();

  const ray = new THREE.Raycaster(camera.position.clone(), dir, 0, 180);
  const targets = [];
  enemies.forEach(e => { if (e.alive) targets.push(e.mesh); });
  const hits = ray.intersectObjects(targets, true);

  // Tracer
  const start = camera.position.clone().add(dir.clone().multiplyScalar(.7));
  let end = start.clone().add(dir.clone().multiplyScalar(120));

  if (hits.length){
    end = hits[0].point.clone();
    const enemyGroup = hits[0].object.parent;
    const enemy = enemies.find(e => e.mesh === enemyGroup);

    if (enemy){
      const isHead = hits[0].object === enemy.head;
      const dmg = isHead ? w.damage * 3.2 : w.damage;
      enemy.health -= dmg;
      showHitmarker();
      beep(isHead ? 1250 : 900, .05, 'sine', .05);

      if (enemy.health <= 0){
        enemy.alive = false;
        scene.remove(enemy.mesh);
        score += isHead ? 250 : 100;
        kills++;
        updateHUD();
        beep(300, .18, 'triangle', .09);
      }
    }
  }

  const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
  const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color:0xffe27a, transparent:true, opacity:.8 }));
  scene.add(line);
  tracers.push({ line, life:.06 });
}

function showHitmarker(){
  const h = document.getElementById('hitmarker');
  h.style.opacity = 1;
  setTimeout(() => h.style.opacity = 0, 90);
}

function damagePlayer(amount){
  player.health = Math.max(0, player.health - amount);
  updateHUD();

  const flash = document.getElementById('damageFlash');
  flash.style.opacity = .8;
  setTimeout(() => flash.style.opacity = 0, 90);
  beep(140, .12, 'sawtooth', .09);

  if (player.health <= 0) endGame(false);
}

// Collision
function collides(position){
  const p = new THREE.Box3(
    new THREE.Vector3(position.x-player.radius, position.y-player.height, position.z-player.radius),
    new THREE.Vector3(position.x+player.radius, position.y, position.z+player.radius)
  );
  return colliders.some(c => p.intersectsBox(c));
}

function moveWithCollision(delta){
  const speed = keys['ShiftLeft'] ? 9.5 : 5.8;
  const forward = new THREE.Vector3();
  const right = new THREE.Vector3();

  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  right.crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);

  if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed * delta);

  const next = camera.position.clone();
  next.x += move.x;
  if (!collides(next)) camera.position.x = next.x;

  next.copy(camera.position);
  next.z += move.z;
  if (!collides(next)) camera.position.z = next.z;

  // Gravity and jump
  player.velocity.y -= 23 * delta;
  camera.position.y += player.velocity.y * delta;

  if (camera.position.y <= player.height){
    camera.position.y = player.height;
    player.velocity.y = 0;
    player.onGround = true;
  }

  if (keys['Space'] && player.onGround){
    player.velocity.y = 8.2;
    player.onGround = false;
  }

  // Arena bounds
  camera.position.x = THREE.MathUtils.clamp(camera.position.x, -57, 57);
  camera.position.z = THREE.MathUtils.clamp(camera.position.z, -57, 57);
}

// HUD
let score = 0;
let kills = 0;
let round = 1;
let enemiesToSpawn = 4;
let roundActive = false;

function updateHUD(){
  const w = weapons[currentWeapon];
  document.getElementById('ammoNum').textContent = reloading ? '--' : w.ammo;
  document.getElementById('ammoMax').textContent = `/ ${w.reserve} • ${w.name}`;
  document.getElementById('healthFill').style.width = player.health + '%';
  document.getElementById('round').textContent = round;
  document.getElementById('score').textContent = score;
  document.getElementById('kills').textContent = kills;
  document.getElementById('enemiesLeft').textContent = enemies.filter(e => e.alive).length + Math.max(0, enemiesToSpawn);
}

function startRound(){
  roundActive = true;
  enemiesToSpawn = 3 + round * 2;
  updateHUD();
}

function endGame(win){
  roundActive = false;
  controls.unlock();
  document.getElementById('endScreen').style.display = 'flex';
  document.getElementById('endTitle').textContent = win ? 'VICTORY' : 'YOU DIED';
  document.getElementById('endTitle').style.color = win ? '#7dff9b' : '#ff5d5d';
  document.getElementById('endText').textContent =
    `Round ${round} • Score ${score} • Kills ${kills}`;
}

function restart(){
  player.health = player.maxHealth;
  score = 0;
  kills = 0;
  round = 1;
  enemiesToSpawn = 4;
  weapons.forEach(w => { w.ammo = w.mag; w.reserve = w.name === 'RIFLE' ? 90 : 48; });
  camera.position.set(0, player.height, 45);
  clearEnemies();
  document.getElementById('endScreen').style.display = 'none';
  updateHUD();
  startRound();
  controls.lock();
}

document.getElementById('startBtn').onclick = () => {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  audioCtx = new AudioContext();
  updateHUD();
  startRound();
  controls.lock();
};

document.getElementById('restartBtn').onclick = restart;

controls.addEventListener('unlock', () => {
  if (roundActive && player.health > 0){
    document.getElementById('menu').style.display = 'flex';
    document.getElementById('startBtn').textContent = 'RESUME';
  }
});

controls.addEventListener('lock', () => {
  document.getElementById('menu').style.display = 'none';
});

// Minimap
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');

function drawMinimap(){
  mctx.clearRect(0,0,170,170);
  mctx.fillStyle = 'rgba(8,12,16,.9)';
  mctx.fillRect(0,0,170,170);

  const scale = 170/120;
  const cx = 85, cy = 85;

  mctx.fillStyle = '#3c4a56';
  world.children.forEach(o => {
    if (o === ground) return;
    const p = o.position;
    mctx.fillRect(cx + p.x*scale - 2, cy + p.z*scale - 2, 4, 4);
  });

  enemies.forEach(e => {
    if (!e.alive) return;
    mctx.fillStyle = '#ff5d5d';
    mctx.beginPath();
    mctx.arc(cx + e.mesh.position.x*scale, cy + e.mesh.position.z*scale, 3.5, 0, Math.PI*2);
    mctx.fill();
  });

  mctx.fillStyle = '#7dff9b';
  mctx.beginPath();
  mctx.arc(cx + camera.position.x*scale, cy + camera.position.z*scale, 4.5, 0, Math.PI*2);
  mctx.fill();
}

// Game loop
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), .05);

  if (controls.isLocked && roundActive){
    moveWithCollision(delta);

    const w = weapons[currentWeapon];
    if (shooting && (w.auto || !shooting || performance.now()/1000 - lastShot > w.fireRate)){
      shoot();
    }

    // Enemy AI
    const playerPos = camera.position;
    enemies.forEach(enemy => {
      if (!enemy.alive) return;

      const target = new THREE.Vector3(playerPos.x, 0, playerPos.z);
      const pos = enemy.mesh.position;
      const dir = target.clone().sub(pos).setY(0);

      const distance = dir.length();
      dir.normalize();

      if (distance > 7){
        const next = pos.clone().add(dir.multiplyScalar(enemy.speed * delta));
        next.y = 0;
        if (!collides(next)) enemy.mesh.position.copy(next);
      }

      enemy.mesh.lookAt(playerPos.x, 0, playerPos.z);

      if (distance < 24 && performance.now()/1000 - enemy.lastAttack > 1.1){
        enemy.lastAttack = performance.now()/1000;
        if (Math.random() < .58){
          damagePlayer(7 + Math.random()*7);
        }
        beep(220, .05, 'square', .05);
      }
    });

    // Round progression
    const alive = enemies.filter(e => e.alive).length;
    if (alive < 4 && enemiesToSpawn > 0){
      spawnEnemy();
      enemiesToSpawn--;
      updateHUD();
    }

    if (alive === 0 && enemiesToSpawn === 0){
      round++;
      player.health = Math.min(player.maxHealth, player.health + 35);
      weapons.forEach(w => w.reserve += 30);
      updateHUD();
      endGame(true);
    }
  }

  // Tracers
  for (let i = tracers.length-1; i >= 0; i--){
    tracers[i].life -= delta;
    tracers[i].line.material.opacity = Math.max(0, tracers[i].life / .06);
    if (tracers[i].life <= 0){
      scene.remove(tracers[i].line);
      tracers.splice(i,1);
    }
  }

  drawMinimap();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
