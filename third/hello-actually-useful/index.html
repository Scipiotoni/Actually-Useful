<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' role='img' aria-label='MathPath logo'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2314b8a6'/%3E%3Cstop offset='1' stop-color='%230b6e63'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url%28%23g%29'/%3E%3Cpath d='M15 47V19l17 19 17-19v28' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='49' cy='47' r='5.5' fill='%23f59e0b' stroke='%230b6e63' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f6f8;--c:#fff;--t:#14213d;--m:#667085;--p:#0f8f7e;--pl:#dff5f1;--w:#f59e0b;--r:#d92d20;--b:#e3e8ee}
body.d{--bg:#0e1522;--c:#172033;--t:#eaf0fa;--m:#98a4b8;--pl:#12372f;--b:#26324a}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--c);border-bottom:1px solid var(--b);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--p)}.sp{flex:1}
.pill{background:var(--pl);color:var(--p);border-radius:99px;padding:3px 12px;font-weight:600;font-size:14px}
nav{display:flex;gap:4px;padding:8px 20px;overflow-x:auto}
nav button,.btn{font:inherit;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;background:none;color:var(--m);font-weight:600}
nav button.on{background:var(--c);color:var(--t);box-shadow:0 0 0 1px var(--b)}
.btn{background:var(--p);color:#fff}.btn.s{background:var(--c);color:var(--t);box-shadow:0 0 0 1px var(--b)}.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--w);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:12px 20px 60px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.t{cursor:pointer;text-align:left;font:inherit;color:var(--t)}.t:hover{border-color:var(--p)}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
h2{margin:22px 0 8px;font-size:20px}h3{margin:18px 0 6px;font-size:17px}small,.m{color:var(--m)}
.q{font-size:30px;font-weight:700;margin:18px 0;word-break:break-word}
input[type=text],input[type=number]{font:inherit;font-size:22px;padding:10px 14px;border:2px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);width:180px}
.av{font-size:34px;border:2px solid var(--b);border-radius:14px;background:var(--c);padding:6px;cursor:pointer;text-align:center}.av.on{border-color:var(--p)}.av.lk{opacity:.4;cursor:not-allowed}

.col{display:flex;gap:6px;align-items:flex-end;height:90px}.col div{flex:1;background:var(--p);border-radius:6px 6px 0 0;min-height:3px}

ol li{margin:6px 0}@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
body.big{font-size:20px}.fade{animation:fi .45s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}

textarea{width:100%;height:70px;font:12px monospace;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px}
input[type=range]{vertical-align:middle}
@media print{header,nav,button{display:none!important}}
header{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--b)}
.logo{display:flex;align-items:center}.mk{margin-right:8px;flex-shrink:0}
.card{box-shadow:0 1px 2px rgba(16,24,40,.05)}.btn{border-radius:8px;padding:9px 18px;box-shadow:0 1px 2px rgba(16,24,40,.12)}.btn:hover{filter:brightness(1.07)}.btn.s{box-shadow:0 0 0 1px var(--b)}
h2{letter-spacing:-.3px}.sel{border-color:var(--p);box-shadow:0 0 0 2px var(--p)}
nav button b{font-weight:400;margin-right:8px}
body.pc nav{position:fixed;left:0;top:var(--hh,58px);bottom:0;width:200px;flex-direction:column;padding:16px 12px;background:var(--c);border-right:1px solid var(--b);overflow-y:auto;z-index:4}
body.pc nav button{text-align:left;width:100%}body.pc main{margin:0 0 0 200px;max-width:1100px;padding:20px 32px 60px}
body.ph #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--b)}
body.ph nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:var(--c);border-top:1px solid var(--b);padding:6px;justify-content:space-around;z-index:6}
body.ph nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 4px;min-width:0}body.ph nav button b{font-size:20px;margin:0}
body.ph main{padding:12px 14px 96px}body.ph .btn{min-height:44px}body.ph .grid{grid-template-columns:1fr 1fr}body.ph .q{font-size:26px}
body.ph input[type=number],body.ph input[type=text]{width:100%;margin-bottom:8px}body.ph header{padding:10px 14px}
.calc{max-width:300px;margin:10px 0}.cd{background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:8px 10px;font:600 20px monospace;text-align:right;min-height:42px;overflow-x:auto}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.ck button{font-size:18px;font-weight:600;padding:10px 0;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);cursor:pointer}.ck .w{grid-column:span 2;font-size:14px}.ck .e{background:var(--p);color:#fff;border-color:var(--p)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:20;animation:fi .4s}
body.hc{--t:#000;--m:#222;--b:#555;--p:#066;--bg:#fff;--c:#fff}body.hc.d{--t:#fff;--m:#ddd;--b:#aaa;--p:#4de1cf;--bg:#000;--c:#000}
body.dy{font-family:"Trebuchet MS","Comic Sans MS",Verdana,sans-serif;letter-spacing:.03em;line-height:1.7}.pad{border:1px solid var(--b);border-radius:8px;background:#fff;touch-action:none;max-width:100%;margin-top:10px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--t);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--p) calc(var(--v)*1%),var(--b) 0);display:grid;place-items:center;flex-shrink:0}
.ring::after{content:attr(data-t);width:50px;height:50px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:700;font-size:13px}
.top{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--b)}header{position:static;box-shadow:none}
.fu{background:var(--pl);color:var(--p);font-size:14px;font-weight:600;padding:2px 20px}.fu .r{display:flex;align-items:center}.fu button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:6px 4px}.fu ul{margin:2px 0 6px;padding-left:20px;font-weight:400;color:var(--t)}.fu small{display:block;padding-bottom:6px;font-weight:400}body.ph .fu{padding:2px 14px}
input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);width:100%;margin-top:10px}
.cf{position:fixed;top:-30px;font-size:24px;z-index:30;pointer-events:none;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.cf{display:none}}
[hidden]{display:none!important}.ic{vertical-align:-3px;flex-shrink:0}
.btn,.chip,nav button,.pill{display:inline-flex;align-items:center;gap:6px}a.btn{text-decoration:none}nav button b{display:inline-flex;margin:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.card{border-radius:12px}.t:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,24,40,.08)}
input[type=password]{font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);width:220px;margin-bottom:8px}
details.card summary{cursor:pointer;font-weight:600}
body.rm *{animation:none!important;transition:none!important}
.dots{display:flex;gap:4px;margin:8px 0;min-height:10px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--b)}.dots i.y{background:var(--p)}.dots i.n{background:var(--r)}
@media print{.top{display:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=n=>n<0?`(${n})`:n,F=n=>+n.toFixed(2);
// [grade, name, concept, generator -> [question, answer, hint]]
const T=[
[1,'Add within 20','Adding means putting groups together. Count up from the bigger number.',()=>{let a=R(1,10),b=R(1,10);return[`${a} + ${b}`,a+b,'Start at the bigger number and count up.']}],
[1,'Subtract within 20','Subtracting means taking away. Count back, or think: what plus the small number makes the big one?',()=>{let a=R(8,20),b=R(1,8);return[`${a} − ${b}`,a-b,'Count back from the first number.']}],
[2,'Add 2-digit numbers','Add the ones, then the tens. Carry 1 ten if the ones make 10 or more.',()=>{let a=R(11,89),b=R(11,89);return[`${a} + ${b}`,a+b,'Add ones first, then tens.']}],
[2,'Subtract 2-digit numbers','Subtract ones, then tens. Borrow a ten when the top ones digit is smaller.',()=>{let a=R(40,99),b=R(11,39);return[`${a} − ${b}`,a-b,'Subtract the tens, then the ones.']}],
[2,'Place value','In a 2-digit number, the left digit counts tens and the right digit counts ones.',()=>{let n=R(11,99);return[`How many tens are in ${n}?`,Math.floor(n/10),'Look at the left digit.']}],
[3,'Multiplication facts','Multiplication is repeated addition: 4 × 3 means 4 groups of 3.',()=>{let a=R(2,10),b=R(2,10);return[`${a} × ${b}`,a*b,`Add ${a} together ${b} times.`]}],
[3,'Division facts','Division splits into equal groups. It is the opposite of multiplication.',()=>{let b=R(2,10),c=R(2,10);return[`${b*c} ÷ ${b}`,c,`What times ${b} makes ${b*c}?`]}],
[3,'Fractions of a number','To find 1/d of a number, divide it by d.',()=>{let d=R(2,5),n=d*R(2,8);return[`1/${d} of ${n}`,n/d,`Divide ${n} by ${d}.`]}],
[4,'Multi-digit multiplication','Multiply each place value separately, then add the partial products.',()=>{let a=R(12,99),b=R(3,9);return[`${a} × ${b}`,a*b,'Break it up: tens × ones, then ones × ones.']}],
[4,'Perimeter and area','Perimeter = 2 × (length + width). Area = length × width.',()=>{let l=R(3,15),w=R(2,10);return[`Area of a ${l} by ${w} rectangle`,l*w,'Multiply length by width.']}],
[4,'Remainders','When a division is not exact, the leftover is the remainder.',()=>{let a=R(20,99),b=R(3,9);return[`Remainder of ${a} ÷ ${b}`,a%b,`Find the biggest multiple of ${b} that fits.`]}],
[5,'Decimal addition','Line up the decimal points, then add as usual.',()=>{let a=R(11,99)/10,b=R(11,99)/10;return[`${a} + ${b}`,F(a+b),'Line up the decimal points.']}],
[5,'Order of operations','Do parentheses first, then multiplication and division, then addition and subtraction.',()=>{let a=R(2,9),b=R(2,9),c=R(2,9);return[`${a} + ${b} × ${c}`,a+b*c,'Multiply before you add.']}],
[5,'Volume of a box','Volume = length × width × height.',()=>{let l=R(2,9),w=R(2,9),h=R(2,9);return[`Volume of a ${l} × ${w} × ${h} box`,l*w*h,'Multiply all three sides.']}],
[6,'Percent of a number','Percent means "per 100". 25% of n = n × 25 ÷ 100.',()=>{let p=[10,20,25,50][R(0,3)],n=R(1,10)*20;return[`${p}% of ${n}`,p*n/100,'Multiply, then divide by 100.']}],
[6,'Unit rates','A unit rate compares a quantity to exactly 1 unit. Divide the total by the count.',()=>{let k=R(2,9),p=R(2,9);return[`${k} pens cost $${k*p}. Cost of 1 pen ($)?`,p,'Divide cost by number of pens.']}],
[6,'Mean (average)','Mean = sum of values ÷ number of values.',()=>{let m=R(15,30),x=[1,2,3,4].map(()=>R(m-4,m+4)),l=5*m-x.reduce((a,b)=>a+b);x.push(l);return[`Mean of ${x.join(', ')}`,m,'Add them all, divide by 5.']}],
[7,'Integer operations','Adding a negative is like subtracting. Negative × negative = positive.',()=>{let a=R(-12,12),b=R(-12,12);return[`${a} + ${P(b)}`,a+b,'Think of a number line.']}],
[7,'Two-step equations','Undo addition/subtraction first, then undo multiplication/division.',()=>{let x=R(-9,9),a=R(2,9),b=R(1,15);return[`${a}x + ${b} = ${a*x+b}. x = ?`,x,'Subtract b from both sides, then divide.']}],
[7,'Proportions','In a proportion, cross-multiply to solve for the unknown.',()=>{let a=R(2,6),b=R(2,6),k=R(2,5);return[`x / ${b*k} = ${a} / ${b}. x = ?`,a*k,`Multiply ${a} by ${k}.`]}],
[8,'Slope','Slope = rise ÷ run = (y₂ − y₁) ÷ (x₂ − x₁).',()=>{let m=R(-5,5)||2,x=R(-3,3),y=R(-3,3),d=R(1,4);return[`Slope through (${x}, ${y}) and (${x+d}, ${y+m*d})`,m,'Rise over run.']}],
[8,'Pythagorean theorem','In a right triangle, a² + b² = c², where c is the hypotenuse.',()=>{let t=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[7,24,25]][R(0,4)];return[`Legs ${t[0]} and ${t[1]}. Hypotenuse?`,t[2],'Add the squares, then take the root.']}],
[8,'Square roots','√n is the number that multiplies by itself to give n.',()=>{let n=R(2,15);return[`√${n*n}`,n,`What times itself is ${n*n}?`]}],
[9,'Equations with variables on both sides','Collect x terms on one side and numbers on the other.',()=>{let x=R(-6,9),a=R(3,9),c=R(1,a-1),b=R(1,9),d=(a-c)*x+b;return[`${a}x + ${b} = ${c}x + ${d<0?'('+d+')':d}. x = ?`,x,`Subtract ${c}x from both sides.`]}],
[9,'Systems of equations','Add the equations to cancel y, then solve for x.',()=>{let x=R(1,8),y=R(1,8);return[`x + y = ${x+y} and x − y = ${x-y}. x = ?`,x,'Add the two equations.']}],
[9,'Factoring quadratics','x² − (p+q)x + pq = (x−p)(x−q). Roots are p and q.',()=>{let p=R(1,9),q=R(1,9);return[`Larger root of x² − ${p+q}x + ${p*q} = 0`,Math.max(p,q),'Find two numbers: product '+p*q+', sum '+(p+q)+'.']}],
[10,'Triangle angles','Angles in a triangle add up to 180°.',()=>{let a=R(30,80),b=R(30,80);return[`Angles ${a}° and ${b}°. Third angle?`,180-a-b,'Subtract from 180.']}],
[10,'Circle area','Area = πr². Here, give the coefficient of π.',()=>{let r=R(2,12);return[`Area of circle, radius ${r}, in multiples of π`,r*r,'Square the radius.']}],
[10,'Distance formula','Distance = √((x₂−x₁)² + (y₂−y₁)²). It is the Pythagorean theorem on a grid.',()=>{let k=R(1,5),x=R(-4,4),y=R(-4,4);return[`Distance from (${x}, ${y}) to (${x+3*k}, ${y+4*k})`,5*k,'Use the 3-4-5 triangle.']}],
[11,'Logarithms','log_b(x) asks: what power of b gives x?',()=>{let b=R(2,5),n=R(1,4);return[`log base ${b} of ${b**n}`,n,`${b}^? = ${b**n}`]}],
[11,'Arithmetic series','Sum = n/2 × (2a + (n−1)d).',()=>{let a=R(1,9),d=R(1,5),n=R(5,12);return[`Sum of first ${n} terms: ${a}, ${a+d}, ${a+2*d}, …`,n*(2*a+(n-1)*d)/2,'Use the sum formula.']}],
[11,'Geometric sequences','nth term = a × r^(n−1).',()=>{let a=R(1,5),r=R(2,3),n=R(3,6);return[`Term ${n} of ${a}, ${a*r}, ${a*r*r}, …`,a*r**(n-1),`Multiply by ${r} each time.`]}],
[12,'Derivatives','The power rule: d/dx (a·xⁿ) = a·n·xⁿ⁻¹.',()=>{let a=R(2,6),n=R(2,4),c=R(1,3);return[`f(x) = ${a}x^${n}. Find f′(${c})`,a*n*c**(n-1),'Bring the power down, reduce it by 1.']}],
[12,'Combinations','nCr = n! ÷ (r!(n−r)!). Order does not matter.',()=>{let n=R(5,10),k=R(2,4),f=x=>x<2?1:x*f(x-1);return[`${n} choose ${k}`,f(n)/(f(k)*f(n-k)),'Use the factorial formula.']}],
[12,'Definite integrals','∫ kx dx = kx²/2. Evaluate at the top and subtract the bottom.',()=>{let k=2*R(1,4),n=R(2,6);return[`∫ from 0 to ${n} of ${k}x dx`,k*n*n/2,'Antiderivative is kx²/2.']}],
[12,'Limits','If a limit gives 0/0, factor and cancel first.',()=>{let a=R(2,9);return[`lim x→${a} of (x² − ${a*a}) ÷ (x − ${a})`,2*a,'Factor the top as (x−a)(x+a).']}],
[6,'Median','The median is the middle value when numbers are in order.',()=>{let a=[R(1,9),R(10,20),R(21,30),R(31,40),R(41,50)];return[`Median of ${[...a].sort(()=>Math.random()-.5).join(', ')}`,a[2],'Put them in order, pick the middle.']}],
[7,'Probability','Probability = favorable outcomes ÷ total outcomes. Give the answer as a percent.',()=>{let t=[4,5,10][R(0,2)],f=R(1,t-1);return[`A bag has ${t} equal marbles and ${f} are red. Chance of red (%)?`,f*100/t,'Favorable ÷ total × 100.']}],
[7,'Simple interest','Interest = principal × rate × time.',()=>{let p=R(1,9)*100,r=R(2,9),y=R(2,5);return[`$${p} at ${r}% simple interest for ${y} years. Interest ($)?`,p*r*y/100,'Multiply, then divide by 100.']}],
[10,'Trig ratios','sin = opposite ÷ hypotenuse, cos = adjacent ÷ hypotenuse, tan = opposite ÷ adjacent.',()=>{let k=R(1,5),f=[['sin',3,5],['cos',4,5],['tan',3,4]][R(0,2)];return[`Right triangle with sides ${3*k}, ${4*k}, ${5*k}. ${f[0]} of the angle opposite the ${3*k} side?`,f[1]/f[2],'Pick the right two sides, then divide.']}],
[1,'Number bonds to 10','Number bonds are pairs that make 10, like 6 and 4.',()=>{let a=R(1,9);return[`${a} + ? = 10`,10-a,'Count up to 10.']}],
[1,'Skip counting','Count by 2s, 5s or 10s to move fast.',()=>{let s=[2,5,10][R(0,2)],a=R(1,5)*s;return[`${a}, ${a+s}, ${a+2*s}, ?`,a+3*s,`Add ${s} each time.`]}],
[2,'Counting money','Quarter = 25¢, dime = 10¢, nickel = 5¢, penny = 1¢.',()=>{let q=R(1,3),d=R(1,3),n=R(0,2);return[`${q} quarters, ${d} dimes and ${n} nickels. How many cents?`,25*q+10*d+5*n,'Add each coin value.']}],
[3,'Rounding','Look at the digit to the right. 5 or more rounds up.',()=>{let n=R(101,989);return[`Round ${n} to the nearest ten`,Math.round(n/10)*10,'Check the ones digit.']}],
[4,'Equivalent fractions','Multiply the top and bottom by the same number.',()=>{let a=R(1,3),b=R(a+1,5),k=R(2,5);return[`${a}/${b} = ?/${b*k}`,a*k,`Multiply ${a} by ${k}.`]}],
[4,'Add like fractions','With the same bottom number, add the tops.',()=>{let d=R(5,12),a=R(1,d-2),b=R(1,d-a-1);return[`${a}/${d} + ${b}/${d} = ?/${d}. Top number?`,a+b,'Add the tops only.']}],
[4,'Factors','A factor divides a number with no remainder.',()=>{let n=[12,18,20,24,30,36][R(0,5)],c=0;for(let i=1;i<=n;i++)if(n%i==0)c++;return[`How many factors does ${n} have?`,c,'Test each number up to '+n+'.']}],
[5,'Powers of 10','Multiplying by 10ⁿ moves the decimal point n places right.',()=>{let a=R(11,99)/10,n=R(1,3);return[`${a} × ${10**n}`,F(a*10**n),`Move the decimal ${n} place${n>1?'s':''} right.`]}],
[5,'Greatest common factor','The GCF is the biggest number that divides both.',()=>{let g=R(2,9),q=[[2,3],[3,4],[2,5],[3,5],[4,5]][R(0,4)];return[`GCF of ${g*q[0]} and ${g*q[1]}`,g,'Both numbers are multiples of it.']}],
[6,'Absolute value','Absolute value is the distance from 0, so it is never negative.',()=>{let a=R(-20,-1),b=R(1,20);return[`|${a}| + |${b}|`,b-a,'Make each part positive, then add.']}],
[6,'One-step equations','Do the opposite operation to both sides.',()=>{let x=R(2,15),a=R(2,12);return[`x + ${a} = ${x+a}. x = ?`,x,`Subtract ${a} from both sides.`]}],
[6,'Area of a triangle','Area = ½ × base × height.',()=>{let b=2*R(2,9),h=R(2,9);return[`Triangle with base ${b} and height ${h}. Area?`,b*h/2,'Half of base × height.']}],
[6,'Exponents','aⁿ means multiply a by itself n times.',()=>{let a=R(2,9),n=R(2,3);return[`${a}^${n}`,a**n,`Multiply ${a} by itself ${n} times.`]}],
[7,'Percent discount','Sale price = price − (price × percent ÷ 100).',()=>{let p=R(2,10)*10,d=[10,20,25,50][R(0,3)];return[`A $${p} item is ${d}% off. Sale price ($)?`,p-p*d/100,'Subtract the discount.']}],
[7,'Circumference','Circumference = 2πr. Use π ≈ 3.14.',()=>{let r=R(1,10);return[`Circle with radius ${r}. Circumference (π ≈ 3.14)?`,F(6.28*r),'2 × 3.14 × r.']}],
[8,'Exponent rules','Same base: multiplying adds the exponents, dividing subtracts them, and a power of a power multiplies them. Anything to the power 0 is 1, and a negative exponent means 1 over the power.',()=>{let k=R(0,4),m=R(2,6),n=R(2,5),b=[2,5,10][R(0,2)];if(k==0)return[`x^${m} × x^${n} = x^?  (type just the exponent)`,m+n,'Same base, multiplying: add the exponents.'];if(k==1)return[`x^${m+n} ÷ x^${n} = x^?  (type just the exponent)`,m,'Same base, dividing: subtract the exponents.'];if(k==2)return[`(x^${m})^${n} = x^?  (type just the exponent)`,m*n,'Power of a power: multiply the exponents.'];if(k==3)return[`What is ${R(2,9)}^0?`,1,'Any nonzero number to the power 0 is 1.'];let e=R(1,2);return[`${b}^(−${e}) as a decimal`,F(1/b**e),`${b}^(−${e}) means 1 ÷ ${b**e}.`]}],
[8,'Linear function values','Plug x into the formula to find y.',()=>{let m=R(-4,5),b=R(-6,9),x=R(-3,5);return[`y = ${m}x ${b<0?'−':'+'} ${Math.abs(b)}. Find y when x = ${x}`,m*x+b,'Replace x, then compute.']}],
[9,'Solve inequalities','Solve like an equation. Flip the sign if you multiply or divide by a negative.',()=>{let x=R(2,12),a=R(2,6);return[`${a}x < ${a*x}. Largest whole number x?`,x-1,`x must be less than ${x}.`]}],
[9,'Discriminant','For ax² + bx + c, the discriminant is b² − 4ac.',()=>{let a=R(1,4),b=R(-6,6),c=R(-5,5);return[`Discriminant of ${a}x² ${b<0?'−':'+'} ${Math.abs(b)}x ${c<0?'−':'+'} ${Math.abs(c)}`,b*b-4*a*c,'Compute b² − 4ac.']}],
[10,'Polygon angle sum','Interior angles of an n-sided polygon add to (n − 2) × 180°.',()=>{let n=R(4,10);return[`Sum of interior angles of a ${n}-sided polygon`,(n-2)*180,'Use (n − 2) × 180.']}],
[11,'Function composition','f(g(x)) means put g(x) inside f.',()=>{let a=R(2,5),b=R(1,6),x=R(1,4);return[`f(x) = ${a}x and g(x) = x + ${b}. Find f(g(${x}))`,a*(x+b),'Compute g first.']}],
[11,'Log properties','log(ab) = log a + log b.',()=>{let n=R(1,4),m=R(1,4);return[`log₁₀(${10**n}) + log₁₀(${10**m})`,n+m,'Each log is a power of 10.']}],
[12,'Chain rule','d/dx f(g(x)) = f′(g(x)) × g′(x).',()=>{let a=R(2,5),c=R(1,3);return[`d/dx of (${a}x)² at x = ${c}`,2*a*a*c,'The derivative is 2a²x.']}],
[1,'Doubles','A double adds a number to itself, like 4 + 4. Doubles are quick facts that make harder sums easier.',()=>{let a=R(1,10);return[`${a} + ${a}`,2*a,'Say the number twice.']},'Read the number|Add it to itself|Say the total','Adding the next number instead of the same number.'],
[1,'Compare numbers','Compare numbers by looking at the tens first, then the ones. A bigger tens digit means a bigger number.',()=>{let a=R(10,99),b=R(10,99);while(b==a)b=R(10,99);return[`Which is bigger, ${a} or ${b}? Type that number.`,Math.max(a,b),'Compare the tens digits first.']},'Look at the tens digits|If they match, look at the ones|Pick the bigger number','Comparing only the ones digits.'],
[2,'Equal groups','Multiplication counts equal groups quickly. In an array, rows × columns gives the total.',()=>{let r=R(2,6),c=R(2,9);return[`${r} rows with ${c} dots in each row. How many dots?`,r*c,'Multiply rows by dots per row.']},'Find how many groups|Find how many are in each group|Multiply','Adding the numbers instead of multiplying.'],
[2,'Add three numbers','Add two numbers first, then add the third. Look for pairs that make 10 to go faster.',()=>{let a=R(2,9),b=R(2,9),c=R(2,9);return[`${a} + ${b} + ${c}`,a+b+c,'Add the first two, then the third.']},'Spot a pair that makes 10|Add that pair|Add the last number','Skipping one of the numbers.'],
[3,'Multiply by multiples of 10','To multiply by 20, 30 or 40, multiply by the tens digit first, then add a zero.',()=>{let a=R(2,9),b=R(2,9)*10;return[`${a} × ${b}`,a*b,`Do ${a} × ${b/10}, then add a zero.`]},'Ignore the zero for now|Multiply the digits|Put the zero back','Forgetting to add the zero back.'],
[3,'Perimeter','Perimeter is the distance around a shape. For a rectangle, add all four sides.',()=>{let l=R(3,15),w=R(2,10);return[`Perimeter of a ${l} by ${w} rectangle`,2*(l+w),'Add length and width, then double.']},'Write the four sides|Add them all|Check the units','Finding the area instead of the perimeter.'],
[4,'Tenths place','In a decimal, the first digit after the point is the tenths place and the second is the hundredths place.',()=>{let a=R(1,9),b=R(1,9),c=R(1,9);return[`Which digit is in the tenths place of ${a}.${b}${c}?`,b,'It is the first digit after the point.']},'Find the decimal point|Look to the right of it|The first digit is tenths','Mixing up tenths and hundredths.'],
[4,'Complementary angles','Two angles that together make a right angle add up to 90°.',()=>{let a=R(10,80);return[`An angle of ${a}°. What is its complement?`,90-a,'Subtract from 90.']},'Remember the total is 90°|Subtract the known angle|Check the sum','Using 180 instead of 90.'],
[5,'Fraction of a whole number','To find a/d of a number, divide by d, then multiply by a.',()=>{let d=[2,4,5][R(0,2)],k=R(2,8),a=R(1,d-1);return[`${a}/${d} of ${d*k}`,a*k,`Divide ${d*k} by ${d}, then multiply by ${a}.`]},'Divide by the bottom number|Multiply by the top number|Check the size makes sense','Multiplying by the bottom number instead of dividing.'],
[5,'Metric conversion','To change centimeters to meters, divide by 100. To change meters to centimeters, multiply by 100.',()=>{let c=R(11,99)*5;return[`${c} cm = ? m`,F(c/100),'Divide by 100.']},'Decide which way you are converting|Choose ×100 or ÷100|Move the decimal point','Multiplying when you should divide.'],
[6,'Equivalent ratios','A ratio stays equal when you multiply both parts by the same number.',()=>{let a=R(2,5),b=R(2,7),k=R(2,6);return[`${a}:${b} = ${a*k}:?`,b*k,`Multiply ${b} by ${k}.`]},'Find the multiplier|Apply it to the other part|Check the ratio','Adding instead of multiplying.'],
[6,'Evaluate expressions','Replace the variable with its value, then follow the order of operations.',()=>{let a=R(2,9),b=R(1,9),x=R(2,9);return[`${a}x + ${b} when x = ${x}`,a*x+b,'Substitute, multiply, then add.']},'Substitute the value for x|Multiply first|Then add','Reading 3x as 3 + x.'],
[6,'Range','Range = largest value − smallest value. It shows how spread out the data is.',()=>{let a=[1,2,3,4,5].map(()=>R(1,30));return[`Range of ${a.join(', ')}`,Math.max(...a)-Math.min(...a),'Largest minus smallest.']},'Find the biggest value|Find the smallest value|Subtract','Subtracting the first and last numbers instead of the biggest and smallest.'],
[6,'Least common multiple','The LCM is the smallest number that both numbers divide into evenly.',()=>{let q=[[2,3],[4,6],[3,5],[6,8],[4,10],[5,6]][R(0,5)],i=Math.max(...q);while(!(i%q[0]==0&&i%q[1]==0))i++;return[`LCM of ${q[0]} and ${q[1]}`,i,'List multiples of the bigger number.']},'List multiples of the bigger number|Find the first one the other divides into|That is the LCM','Giving a common multiple that is not the smallest.'],
[7,'Multiply integers','The same signs give a positive product. Different signs give a negative product.',()=>{let a=R(-9,9)||2,b=R(-9,9)||3;return[`${P(a)} × ${P(b)}`,a*b,'Decide the sign first.']},'Multiply the sizes|Decide the sign|Write the answer','Making the answer positive when the signs differ.'],
[7,'Combine like terms','Terms with the same variable can be added together: 3x + 5x = 8x.',()=>{let a=R(2,9),b=R(2,9);return[`${a}x + ${b}x = ?x. Type the number.`,a+b,'Add the coefficients.']},'Spot the like terms|Add the numbers in front|Keep the variable','Changing the variable or its exponent.'],
[7,'Percent increase','New value = old value × (1 + percent ÷ 100).',()=>{let o=R(2,10)*10,q=[10,20,50][R(0,2)];return[`A price of $${o} rises ${q}%. New price ($)?`,o+o*q/100,'Find the increase, then add it.']},'Find the percent of the old value|Add it to the old value|Check the result is bigger','Subtracting instead of adding.'],
[8,'Cube roots','The cube root of n is the number that, multiplied by itself three times, gives n.',()=>{let n=R(2,10);return[`Cube root of ${n**3}`,n,`What number cubed is ${n**3}?`]},'Try small whole numbers|Cube each one|Match the target','Confusing it with the square root.'],
[8,'Volume of a cylinder','Volume = π × r² × h. Here, give the coefficient of π.',()=>{let r=R(2,6),h=R(2,9);return[`Cylinder with radius ${r} and height ${h}. Volume in multiples of π?`,r*r*h,'Square the radius, then multiply by the height.']},'Square the radius|Multiply by the height|Keep π as a symbol','Using the diameter instead of the radius.'],
[9,'Vertex of a parabola','For y = ax² + bx + c, the vertex has x = −b ÷ 2a.',()=>{let a=R(1,4),h=R(-5,5),b=-2*a*h;return[`x-coordinate of the vertex of y = ${a}x² ${b<0?'−':'+'} ${Math.abs(b)}x + 1`,h,'Use −b ÷ 2a.']},'Identify a and b|Compute −b ÷ 2a|Check the sign','Forgetting the minus sign in −b.'],
[9,'Arithmetic sequences','The nth term is a + (n − 1)d, where d is the common difference.',()=>{let a=R(1,9),d=R(2,6),n=R(5,15);return[`Term ${n} of ${a}, ${a+d}, ${a+2*d}, …`,a+(n-1)*d,'Use a + (n − 1)d.']},'Find the difference d|Put the numbers in the formula|Compute','Using n instead of n − 1.'],
[10,'Surface area of a box','Surface area = 2(lw + lh + wh). It adds the area of all six faces.',()=>{let l=R(2,8),w=R(2,8),h=R(2,8);return[`Box ${l} × ${w} × ${h}. Surface area?`,2*(l*w+l*h+w*h),'Find three face areas, add, then double.']},'Find lw, lh and wh|Add them|Multiply by 2','Forgetting to double.'],
[10,'Similar triangles','Similar shapes have equal angles and sides in proportion.',()=>{let k=R(2,5),a=R(2,6),b=R(7,9);return[`Triangle A has sides ${a} and ${b}. Triangle B is ${k} times bigger. Its longer side?`,b*k,'Multiply by the scale factor.']},'Find the scale factor|Pick the matching side|Multiply','Adding the scale factor instead of multiplying.'],
[11,'Powers of i','Since i² = −1, the powers of i repeat in a cycle of four.',()=>{let k=R(1,6),r=R(0,1);return[`i^${4*k+2*r} = ?  (type 1 or −1)`,r?-1:1,'i⁴ = 1 and i² = −1.']},'Divide the power by 4|Look at the remainder|Use i⁰ = 1 and i² = −1','Thinking i² = 1.'],
[11,'Remainder theorem','The remainder when p(x) is divided by x − c is p(c).',()=>{let a=R(1,4),b=R(-5,5),c=R(-5,5),x=R(1,4);return[`p(x) = ${a}x² ${b<0?'−':'+'} ${Math.abs(b)}x ${c<0?'−':'+'} ${Math.abs(c)}. Find p(${x})`,a*x*x+b*x+c,'Substitute x and compute.']},'Substitute the value for x|Do the powers first|Add the terms','Skipping the square.'],
[12,'Permutations','nPr = n! ÷ (n − r)!. Use it when order matters.',()=>{let n=R(4,9),r=R(2,3),a=1;for(let i=0;i<r;i++)a*=n-i;return[`${n}P${r}`,a,`Multiply ${r} numbers counting down from ${n}.`]},'Start at n|Count down r numbers|Multiply them','Using combinations when order matters.'],
[12,'Expected value','Expected value = the sum of (value × probability) over all outcomes.',()=>{let a=R(2,10)*10,d=[2,4,5][R(0,2)];return[`Win $${a} with probability 1/${d}, otherwise $0. Expected value ($)?`,a/d,'Value × probability.']},'List the outcomes|Multiply each by its probability|Add the results','Forgetting outcomes that pay $0.'],
[12,'Derivative at a point','For f(x) = ax² + bx, the derivative is f′(x) = 2ax + b.',()=>{let a=R(1,5),b=R(-5,5),c=R(1,4);return[`f(x) = ${a}x² ${b<0?'−':'+'} ${Math.abs(b)}x. Find f′(${c})`,2*a*c+b,'Differentiate, then substitute.']},'Apply the power rule|Differentiate each term|Substitute x','Forgetting to substitute x at the end.'],
[11,'Matrix determinants','The determinant of [[a, b], [c, d]] is ad − bc. A determinant of 0 means the matrix has no inverse.',()=>{let a=R(-4,6),b=R(-4,6),c=R(-4,6),d=R(-4,6);return[`det [[${a}, ${b}], [${c}, ${d}]]`,a*d-b*c,'Multiply the diagonals and subtract.']},'Identify a, b, c and d|Compute ad|Compute bc and subtract it','Subtracting in the wrong order (bc − ad).'],
[11,'Dot product','The dot product multiplies matching parts of two vectors and adds them: (a, b) · (c, d) = ac + bd.',()=>{let a=R(-5,7),b=R(-5,7),c=R(-5,7),d=R(-5,7);return[`(${a}, ${b}) · (${c}, ${d})`,a*c+b*d,'Multiply matching parts, then add.']},'Pair up matching parts|Multiply each pair|Add the results','Multiplying across (a·d and b·c).'],
[11,'Vector magnitude','The magnitude of (a, b) is √(a² + b²), the length of the arrow.',()=>{let t=[[3,4,5],[5,12,13],[8,15,17],[6,8,10]][R(0,3)],k=R(1,3);return[`Magnitude of (${t[0]*k}, ${t[1]*k})`,t[2]*k,'Square, add, then take the root.']},'Square each part|Add the squares|Take the square root','Forgetting the square root.'],
[11,'Radians and degrees','π radians equal 180°. To convert radians to degrees, replace π with 180°.',()=>{let n=[2,3,4,6][R(0,3)],k=R(1,2);return[`${k==1?'':k}π/${n} radians in degrees`,k*180/n,'Replace π with 180.']},'Replace π with 180|Simplify the fraction|Write the degrees','Using 360 instead of 180.'],
[11,'Special trig values','Memorize sin 30° = 1/2, cos 60° = 1/2, tan 45° = 1, sin 90° = 1, cos 0° = 1, sin 0° = 0 and cos 90° = 0.',()=>{let q=[['sin(30°)',.5],['cos(60°)',.5],['tan(45°)',1],['sin(90°)',1],['cos(0°)',1],['sin(0°)',0],['cos(90°)',0]][R(0,6)];return[`${q[0]} = ?`,q[1],'Recall the unit circle values.']},'Place the angle on the unit circle|Read the x (cos) or y (sin) value|Check the sign','Swapping sine and cosine.'],
[12,'Infinite geometric series','If |r| < 1, the series a + ar + ar² + … adds up to a ÷ (1 − r).',()=>{let a=R(1,9),r=[2,3][R(0,1)];return[`Sum of ${a} + ${a}/${r} + ${a}/${r*r} + …`,F(a/(1-1/r)),'Use a ÷ (1 − r), where r is 1/'+r+'.']},'Find a and r|Check that |r| < 1|Compute a ÷ (1 − r)','Using the formula when |r| ≥ 1.'],
[12,'Limits at infinity','As x grows without bound, a ratio of polynomials of equal degree approaches the ratio of the leading coefficients.',()=>{let a=R(2,9),b=R(1,5);return[`lim x→∞ of (${a*b}x² + 5x) ÷ (${b}x² − 3)`,a,'Divide the leading coefficients.']},'Find the highest power|Compare the leading coefficients|Divide them','Using the smaller terms instead of the leading ones.'],
[12,'Product rule','(f·g)′ = f′g + fg′. Use it when two functions are multiplied.',()=>{let b=R(1,5),c=R(1,4);return[`f(x) = x²(x + ${b}). Find f′(${c})`,2*c*(c+b)+c*c,'Apply f′g + fg′.']},'Name f and g|Find f′ and g′|Plug into f′g + fg′, then substitute','Differentiating each factor and multiplying the results.'],
[12,'Definite integrals of polynomials','Integrate each term with the power rule, then subtract the value at the bottom limit from the value at the top limit.',()=>{let a=3*R(1,3),b=2*R(1,4),n=R(1,3);return[`∫ from 0 to ${n} of (${a}x² + ${b}x) dx`,a*n**3/3+b*n*n/2,'The antiderivative is ax³/3 + bx²/2.']},'Find the antiderivative|Evaluate at the top limit|Subtract the bottom value','Forgetting to divide by the new power.'],
[12,'Derivatives of eˣ and ln x','d/dx e^(kx) = k·e^(kx), and d/dx ln x = 1 ÷ x.',()=>{if(R(0,1)){let k=R(2,9);return[`f(x) = e^(${k}x). Find f′(0)`,k,'The derivative is k·e^(kx), and e⁰ = 1.']}let c=[2,4,5][R(0,2)];return[`f(x) = ln x. Find f′(${c}) as a decimal`,1/c,'The derivative of ln x is 1 ÷ x.']},'Recall the rule|Substitute the value|Simplify','Forgetting the factor k from the chain rule.'],
[12,'Binomial expansion','In (x + a)ⁿ, the coefficient of x^(n−r) is nCr · aʳ.',()=>{let n=R(3,6),a=R(2,3),f=x=>x<2?1:x*f(x-1);return[`Coefficient of x^${n-2} in (x + ${a})^${n}`,f(n)/(2*f(n-2))*a*a,'Use nC2 · a².']},'Pick r (here r = 2)|Compute nCr|Multiply by a to the power r','Forgetting the power of a.'],
[12,'z-scores','z = (x − μ) ÷ σ. It counts how many standard deviations a value is from the mean.',()=>{let sd=R(2,10),z=R(-3,3),m=R(40,80);return[`Mean ${m}, standard deviation ${sd}. z-score of ${m+z*sd}?`,z,'Subtract the mean, then divide by σ.']},'Subtract the mean|Divide by the standard deviation|Keep the sign','Dividing before subtracting.'],
[12,'Complex multiplication','(a + bi)(c + di) = (ac − bd) + (ad + bc)i, because i² = −1.',()=>{let a=R(1,5),b=R(1,5),c=R(1,5),d=R(1,5);return[`Real part of (${a} + ${b}i)(${c} + ${d}i)`,a*c-b*d,'The real part is ac − bd.']},'Expand the product|Replace i² with −1|Collect the real parts','Treating i² as +1.'],
[12,'Second derivatives','The second derivative f″ tells you about concavity. For f(x) = ax³ + bx², f″(x) = 6ax + 2b.',()=>{let a=R(1,4),b=R(-4,4),c=R(1,3);return[`f(x) = ${a}x³ ${b<0?'−':'+'} ${Math.abs(b)}x². Find f″(${c})`,6*a*c+2*b,'Differentiate twice, then substitute.']},'Find f′|Differentiate again|Substitute x','Stopping after the first derivative.'],
[12,'Optimization','A downward parabola f(x) = −x² + bx has its maximum at x = b ÷ 2.',()=>{let b=2*R(1,6);return[`Maximum value of f(x) = −x² + ${b}x`,b*b/4,'The maximum is at x = b/2. Plug that in.']},'Find the vertex x = b/2|Substitute it into f|Read the maximum value','Reporting x instead of the maximum value.'],
[12,'Separable equations','If dy/dx = f(x), integrate both sides and use the starting value to find the constant.',()=>{let c=R(1,9),n=R(2,5);return[`dy/dx = 2x and y(0) = ${c}. Find y(${n})`,n*n+c,'y = x² + C, and C = y(0).']},'Integrate both sides|Use y(0) to find C|Substitute x','Forgetting the constant C.'],
[12,'Eigenvalues of triangular matrices','For a triangular matrix, the eigenvalues are the numbers on the diagonal.',()=>{let a=R(1,9),d=R(1,9),b=R(1,9);return[`Larger eigenvalue of [[${a}, ${b}], [0, ${d}]]`,Math.max(a,d),'Read the diagonal.']},'Check the matrix is triangular|Read the diagonal|Pick the larger value','Including the off-diagonal entry.'],
[12,'Conditional probability','P(A given B) = P(A and B) ÷ P(B).',()=>{let b=R(2,8)*10,k=R(1,4);return[`P(B) = ${b}% and P(A and B) = ${b*k/10}%. P(A given B) as a percent?`,k*10,'Divide, then convert to a percent.']},'Write P(A and B) over P(B)|Divide|Convert to a percent','Dividing by P(A) instead of P(B).']];

const diag=(v,a)=>a&&Math.abs(v+a)<.001?'Check the sign: you got the opposite.':Math.abs(Math.abs(v-a)-1)<.001?'You were off by 1, so recheck your last step.':Math.abs(v-2*a)<.001&&a?'Your answer is double the right one.':Math.abs(2*v-a)<.001&&a?'Your answer is half the right one.':'Re-read the problem and check each step of your work.';
const expl=(ok,v)=>{let t=T[Q.ci],a=Q.c[1],st=t[4]?t[4].split('|'):['Read the problem carefully.','Recall the rule: '+t[2].split('. ')[0].replace(/\.$/,'')+'.','Apply it one step at a time.'];if(ok)return`<br><small>Why: ${esc(Q.c[2])}</small>`;return`<div class=card style="margin-top:10px;background:var(--pl)"><b>Let's fix it</b><p style="margin:6px 0">You answered <b>${esc(String(Q.val))}</b>. The correct answer is <b class=ok>${a}</b>. ${diag(v,a)}</p><p style="margin:6px 0"><b>How to solve it:</b></p><ol style="margin:4px 0 4px 18px">${st.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p style="margin:6px 0"><b>Worked out:</b> ${esc(Q.c[0])} = ${a}. ${esc(Q.c[2])}</p>${t[5]?`<p style="margin:6px 0"><b>Watch out:</b> ${esc(t[5])}</p>`:''}</div>`};
