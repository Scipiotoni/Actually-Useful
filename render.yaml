# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploying this: in the Render dashboard choose New → Blueprint, point it at
# this repository, and fill in the values it asks for.
#
# Set AU_GITHUB_TOKEN and AU_GITHUB_REPO to keep published pages permanently
# (see "Never lose a published page" in README.md). Without them, pages are
# written to the container's disk, which the free plan erases on every restart.
services:
  - type: web
    name: actually-useful
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Render routes traffic to the container, so bind to all interfaces.
      - key: HOST
        value: 0.0.0.0
      # sync:false means Render prompts you for it and never stores it in git.
      # The server refuses to start on a public bind without a password.
      - key: AU_PASSWORD
        sync: false
      # Optional: a second, independent account with its own pages, images
      # and progress, for whoever signs in with this code. Leave blank for none.
      - key: AU_ALT_PASSWORD
        sync: false
      # A fine-grained GitHub token with Contents: read and write on the repo
      # below. Leave blank to fall back to the (erasable) container disk.
      - key: AU_GITHUB_TOKEN
        sync: false
      - key: AU_GITHUB_REPO
        value: Scipiotoni/Actually-Useful

  # The open version: same code, no password, publishing turned off. Visitors
  # keep their work in their own browser and in backup files, and their C++
  # runs on Compiler Explorer (godbolt.org) rather than on this server.
  # It needs no secrets — deliberately no GitHub token here.
  - type: web
    name: actually-useful-open
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AU_OPEN
        value: "1"
