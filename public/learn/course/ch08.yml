        hints:
          - "For each word `w` at position `i`, count how many words equal `w` (a nested loop). Keep the best count and its word, updating only on a strictly bigger count — so the earliest wins ties."
        solution: |
          #include <cctype>
          #include <iomanip>
          #include <iostream>
          #include <string>
          #include <vector>

          std::vector<std::string> wordsIn(const std::string& line) {
              std::vector<std::string> words{};
              std::string current{};
              for (char c : line) {
                  unsigned char u = static_cast<unsigned char>(c);
                  if (std::isalpha(u)) {
                      current += static_cast<char>(std::tolower(u));
                  } else if (!current.empty()) {
                      words.push_back(current);
                      current.clear();
                  }
              }
              if (!current.empty()) {
                  words.push_back(current);
              }
              return words;
          }

          int countOf(const std::vector<std::string>& words, const std::string& target) {
              int count{0};
              for (const auto& w : words) {
                  if (w == target) {
                      ++count;
                  }
              }
              return count;
          }

          int main() {
              std::string line{};
              int lines{0};
              int characters{0};
              std::vector<std::string> words{};
              while (std::getline(std::cin, line)) {
                  ++lines;
                  characters += static_cast<int>(line.size());
                  for (const auto& w : wordsIn(line)) {
                      words.push_back(w);
                  }
              }

              std::string longest{"-"};
              std::size_t totalLength{0};
              std::vector<int> counts(26, 0);
              for (const auto& w : words) {
                  if (longest == "-" || w.size() > longest.size()) {
                      longest = w;
                  }
                  totalLength += w.size();
                  for (char c : w) {
                      ++counts[c - 'a'];
                  }
              }
              double average = words.empty() ? 0.0 : static_cast<double>(totalLength) / static_cast<double>(words.size());

              std::cout << "Lines: " << lines << '\n';
              std::cout << "Characters: " << characters << '\n';
              std::cout << "Words: " << words.size() << '\n';
              std::cout << "Longest: " << longest << '\n';
              std::cout << std::fixed << std::setprecision(2) << "Average length: " << average << '\n';

              int best{0};
              for (int i{1}; i < 26; ++i) {
                  if (counts[i] > counts[best]) {
                      best = i;
                  }
              }
              if (counts[best] == 0) {
                  std::cout << "Top letter: -\n";
              } else {
                  std::cout << "Top letter: " << static_cast<char>('a' + best) << " (" << counts[best] << ")\n";
              }

              std::string topWord{"-"};
              int topCount{0};
              for (const auto& w : words) {
                  int c = countOf(words, w);
                  if (c > topCount) {
                      topCount = c;
                      topWord = w;
                  }
              }
              if (topCount == 0) {
                  std::cout << "Top word: -\n";
              } else {
                  std::cout << "Top word: " << topWord << " (" << topCount << ")\n";
              }
              return 0;
          }
        explain: |
          The word count is O(n²) — every word is compared with every other.
          For a book of 100,000 words that's 10 billion comparisons. In
          Chapter 13, `std::map` or `std::unordered_map` turns it into a single
          pass. Notice how splitting the work into `wordsIn` and `countOf`
          kept `main` manageable as the report grew.

  - type: challenge
    id: c8-ch-caesar
    title: Caesar cipher
    difficulty: 1
    tags: [strings, chars]
    prompt: |
      Julius Caesar encrypted messages by shifting every letter along the
      alphabet: with shift 3, `a` → `d`, `x` → `a` (it wraps around). Write
      `std::string caesar(const std::string& text, int shift)`:

      - Shift lower-case letters within `a–z` and upper-case within `A–Z`.
      - Leave every other character unchanged.
      - `shift` can be negative (decrypting) or bigger than 26.
    starter: |
      #include <string>

      std::string caesar(const std::string& text, int shift) {
          return text;
      }
    harness: |
      CHECK(caesar("abc", 3), "def");
      CHECK(caesar("xyz", 3), "abc");
      CHECK(caesar("Hello, World!", 13), "Uryyb, Jbeyq!");
      CHECK(caesar("def", -3), "abc");
      CHECK(caesar("abc", 29), "def");
      CHECK(caesar("Zoo", -27), "Ynn");
    hints:
      - "Normalise the shift into 0–25 first: `int s = ((shift % 26) + 26) % 26;` handles negatives."
      - "For a lower-case letter: `'a' + (c - 'a' + s) % 26`."
    solution: |
      #include <string>

      std::string caesar(const std::string& text, int shift) {
          int s = ((shift % 26) + 26) % 26;
          std::string out{text};
          for (char& c : out) {
              if (c >= 'a' && c <= 'z') {
                  c = static_cast<char>('a' + (c - 'a' + s) % 26);
              } else if (c >= 'A' && c <= 'Z') {
                  c = static_cast<char>('A' + (c - 'A' + s) % 26);
              }
          }
          return out;
      }
    explain: |
      `((shift % 26) + 26) % 26` is the standard trick for a "true" modulo
      that's never negative: C++'s `%` keeps the sign of the left side, so −3
      % 26 is −3; adding 26 and taking % 26 again gives 23.

  - type: challenge
    id: c8-ch-palindrome
    title: Sentence palindrome
    difficulty: 2
    tags: [strings, two pointers]
    prompt: |
      Write `bool isPalindrome(const std::string& s)` that ignores case and
      every character that isn't a letter or a digit. "A man, a plan, a
      canal: Panama!" is a palindrome. An empty string counts as one.
    starter: |
      #include <cctype>
      #include <string>

      bool isPalindrome(const std::string& s) {
          return false;
      }
    harness: |
      CHECK(isPalindrome("A man, a plan, a canal: Panama!"), true);
      CHECK(isPalindrome("racecar"), true);
      CHECK(isPalindrome("Hello"), false);
      CHECK(isPalindrome(""), true);
      CHECK(isPalindrome("No 'x' in Nixon"), true);
      CHECK(isPalindrome("12321"), true);
      CHECK(isPalindrome("ab"), false);
    hints:
      - Build a cleaned copy with only `std::isalnum` characters, lower-cased.
      - "Then compare it with its reverse — or use two indexes moving inwards."
    solution: |
      #include <cctype>
      #include <string>

      bool isPalindrome(const std::string& s) {
          std::string clean{};
          for (char c : s) {
              unsigned char u = static_cast<unsigned char>(c);
              if (std::isalnum(u)) {
                  clean += static_cast<char>(std::tolower(u));
              }
          }
          std::size_t n = clean.size();
          for (std::size_t i{0}; i < n / 2; ++i) {
              if (clean[i] != clean[n - 1 - i]) {
                  return false;
              }
          }
          return true;
      }

