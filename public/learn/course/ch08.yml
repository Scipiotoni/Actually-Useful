      - type: code
        prompt: |
          Write `int countWords(const std::string& s)` that returns the number
          of words, where words are separated by one or more spaces.
          `"  hello   big world "` has 3.
        starter: |
          #include <string>

          int countWords(const std::string& s) {
              return 0;
          }
        harness: |
          CHECK(countWords("  hello   big world "), 3);
          CHECK(countWords(""), 0);
          CHECK(countWords("     "), 0);
          CHECK(countWords("one"), 1);
          CHECK(countWords("a b c d"), 4);
        solution: |
          #include <sstream>
          #include <string>

          int countWords(const std::string& s) {
              std::istringstream in{s};
              std::string w{};
              int count{0};
              while (in >> w) {
                  ++count;
              }
              return count;
          }
      - type: code
        prompt: |
          Write `std::string initials(const std::string& name)` returning the
          upper-case first letter of each word followed by a dot:
          `"grace brewster hopper"` → `"G.B.H."`.
        starter: |
          #include <cctype>
          #include <string>

          std::string initials(const std::string& name) {
              return "";
          }
        harness: |
          CHECK(initials("grace brewster hopper"), "G.B.H.");
          CHECK(initials("Ada"), "A.");
          CHECK(initials("  alan   turing "), "A.T.");
          CHECK(initials(""), "");
        solution: |
          #include <cctype>
          #include <sstream>
          #include <string>

          std::string initials(const std::string& name) {
              std::istringstream in{name};
              std::string word{};
              std::string out{};
              while (in >> word) {
                  out += static_cast<char>(std::toupper(static_cast<unsigned char>(word[0])));
                  out += '.';
              }
              return out;
          }
