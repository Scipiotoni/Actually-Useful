  - type: project
    id: c8-project
    title: "Project: Text Analyzer"
    body: |
      Build a tool that reads any text and reports statistics about it — the
      kind of thing a word processor's "word count" does, and more. Each
      milestone adds one report; by the end your program prints all of them.

      A **word** is a maximal run of letters (so `don't` is two words, `don`
      and `t`, and `C++` is the word `C`). Words are compared ignoring case.
    milestones:
      - title: Counting
        prompt: |
          Read all the input, line by line, and print:

          ```text
          Lines: 2
          Characters: 27
          Words: 6
          ```

          *Characters* counts every character on every line, not the newlines.
          Use the definition of a word above (runs of letters).

          For this input:

          ```text
          Hello, world!
          C++ is 2x fun.
          ```

          the words are `Hello`, `world`, `C`, `is`, `x`, `fun`.
        starter: |
          #include <cctype>
          #include <iostream>
          #include <string>
          #include <vector>

          int main() {

              return 0;
          }
        tests:
          - in: |
              Hello, world!
              C++ is 2x fun.
            out: |
              Lines: 2
              Characters: 27
              Words: 6
          - in: ""
            out: |
              Lines: 0
              Characters: 0
              Words: 0
          - in: |
              one
              two  three

              four!!!
            out: |
              Lines: 4
              Characters: 20
              Words: 4
        hints:
          - "Read with `while (std::getline(std::cin, line))`, adding `line.size()` to the character count."
          - "To split into words, walk each line: while you're on letters, add them to the current word; when you hit a non-letter (or the end of the line) and the current word isn't empty, you've finished a word."
          - "Store the words (lower-cased) in a `std::vector<std::string>` — the next milestones need them."
        solution: |
          #include <cctype>
          #include <iostream>
          #include <string>
          #include <vector>

          std::vector<std::string> wordsIn(const std::string& line) {
              std::vector<std::string> words{};
              std::string current{};
              for (char c : line) {
                  unsigned char u = static_cast<unsigned char>(c);
                  if (std::isalpha(u)) {
                      current += static_cast<char>(std::tolower(u));
                  } else if (!current.empty()) {
                      words.push_back(current);
                      current.clear();
                  }
              }
              if (!current.empty()) {
                  words.push_back(current);
              }
              return words;
          }

          int main() {
              std::string line{};
              int lines{0};
              int characters{0};
              std::vector<std::string> words{};
              while (std::getline(std::cin, line)) {
                  ++lines;
                  characters += static_cast<int>(line.size());
                  for (const auto& w : wordsIn(line)) {
                      words.push_back(w);
                  }
              }
              std::cout << "Lines: " << lines << '\n';
              std::cout << "Characters: " << characters << '\n';
              std::cout << "Words: " << words.size() << '\n';
              return 0;
          }
      - title: Longest word and average length
        prompt: |
          Add two lines to the report: the **longest** word (the first one if
          there's a tie, in lower case) and the **average word length** with 2
          decimals. With no words, print `Longest: -` and `Average length: 0.00`.

          ```text
          Lines: 2
          Characters: 27
          Words: 6
          Longest: hello
          Average length: 2.83
          ```
        tests:
          - in: |
              Hello, world!
              C++ is 2x fun.
            out: |
              Lines: 2
              Characters: 27
              Words: 6
              Longest: hello
              Average length: 2.83
          - in: ""
