  - type: challenge
    id: c8-ch-wrap
    title: Word wrap
    difficulty: 3
    tags: [strings, algorithms]
    prompt: |
      Read a width `w`, then all the remaining words of the input. Print the
      words on lines at most `w` characters long, separated by single spaces,
      putting as many words on each line as fit. A word longer than `w` goes
      on a line of its own. For width `16` and the text
      `The quick brown fox jumps over the lazy dog`:

      ```text
      The quick brown
      fox jumps over
      the lazy dog
      ```
    starter: |
      #include <iostream>
      #include <string>

      int main() {
          std::size_t width{};
          std::cin >> width;

          return 0;
      }
    tests:
      - in: "16 The quick brown fox jumps over the lazy dog"
        out: |
          The quick brown
          fox jumps over
          the lazy dog
      - in: |
          10
          a bb ccc dddd eeeee ffffff
        out: |
          a bb ccc
          dddd eeeee
          ffffff
      - in: "4 hello hi a b"
        out: |
          hello
          hi a
          b
      - in: "20"
        out: ""
    hints:
      - "Build the current line in a string. For each word: if the line is empty, the word starts it; otherwise, if `line.size() + 1 + word.size() <= width`, append a space and the word; otherwise print the line and start a new one with the word."
      - Don't forget to print the last line after the loop — if it isn't empty.
    solution: |
      #include <iostream>
      #include <string>

      int main() {
          std::size_t width{};
          std::cin >> width;
          std::string word{};
          std::string line{};
          while (std::cin >> word) {
              if (line.empty()) {
                  line = word;
              } else if (line.size() + 1 + word.size() <= width) {
                  line += ' ';
                  line += word;
              } else {
                  std::cout << line << '\n';
                  line = word;
              }
          }
          if (!line.empty()) {
              std::cout << line << '\n';
          }
          return 0;
      }
    explain: |
      This is the *greedy* algorithm most text editors use: fill each line as
      much as possible. (Typesetting programs like TeX use a cleverer method
      that balances the whole paragraph — look up the Knuth–Plass algorithm
      if you're curious.)

  - type: review
    id: c8-review
    title: "Chapter 8 review"
    body: |
      ## Cheat sheet

      ```cpp static
      s[i]  s.size()  s.empty()  s.front()  s.back()  s += 'x';  s += "abc";
      s.substr(pos, len)       s.substr(pos)            // pieces
      s.find(x)  s.rfind(x)  s.find(x, from)          // std::string::npos if absent
      s.erase(pos, len)  s.insert(pos, t)  s.replace(pos, len, t)
      s.find_first_not_of(" ")  s.find_last_not_of(" ")

      #include <cctype>   // isalpha isdigit isalnum isspace isupper islower toupper tolower
      std::isalpha(static_cast<unsigned char>(c))

      std::getline(std::cin, line);                // whole line
      std::getline(std::cin >> std::ws, line);     // after >>
      while (std::getline(std::cin, line)) { }     // every line
      std::getline(in, part, ',');                 // split on ','

      #include <sstream>
      std::istringstream in{line};  while (in >> w) { }
      std::ostringstream out;  out << ...;  out.str();
      std::to_string(42);  std::stoi("42");  std::stod("4.2");
      ```

      ## Key ideas

      - A string behaves like a vector of `char`.
      - Always check `find` against `std::string::npos`, and store its result in a `std::size_t`.
      - `>>` reads words; `getline` reads lines; `std::ws` fixes the mix.
      - `getline` + `istringstream` handles line-based input with several values per line.
      - Normalise text (case, punctuation) before comparing it.
      - Letter tables: `counts[c - 'a']`.
    questions:
      - type: output
        prompt: Interleaving functions, loops and strings.
        code: |
          #include <iostream>
          #include <string>

          std::string compress(const std::string& s) {
              std::string out{};
              for (char c : s) {
                  if (out.empty() || out.back() != c) {
                      out += c;
                  }
              }
              return out;
          }

          int main() {
              std::cout << compress("aaabbbcaa") << '\n';
              return 0;
          }
        answer: |
          abca
        why: "A character is added only if it differs from the last one added."
      - type: output
        code: |
          #include <iostream>
          #include <string>
          #include <vector>

          int main() {
              std::vector<std::string> v{"pear", "fig", "banana"};
              std::size_t total{0};
              for (const auto& s : v) {
                  total += s.find('a') == std::string::npos ? 0 : s.find('a');
              }
              std::cout << total << '\n';
              return 0;
          }
        answer: |
          3
        why: "pear: 'a' at 2; fig: none (0); banana: 'a' at 1 — total 3."
