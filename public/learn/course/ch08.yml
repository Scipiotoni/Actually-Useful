            out: |
              Lines: 1
              Characters: 45
              Words: 4
              Longest: supercalifragilistic
              Average length: 10.25
        hints:
          - "The max pattern over `word.size()`, and a total of all lengths divided by the number of words."
          - "`#include <iomanip>` and `std::fixed << std::setprecision(2)` for the average."
        solution: |
          #include <cctype>
          #include <iomanip>
          #include <iostream>
          #include <string>
          #include <vector>

          std::vector<std::string> wordsIn(const std::string& line) {
              std::vector<std::string> words{};
              std::string current{};
              for (char c : line) {
                  unsigned char u = static_cast<unsigned char>(c);
                  if (std::isalpha(u)) {
                      current += static_cast<char>(std::tolower(u));
                  } else if (!current.empty()) {
                      words.push_back(current);
                      current.clear();
                  }
              }
              if (!current.empty()) {
                  words.push_back(current);
              }
              return words;
          }

          int main() {
              std::string line{};
              int lines{0};
              int characters{0};
              std::vector<std::string> words{};
              while (std::getline(std::cin, line)) {
                  ++lines;
                  characters += static_cast<int>(line.size());
                  for (const auto& w : wordsIn(line)) {
                      words.push_back(w);
                  }
              }

              std::string longest{"-"};
              std::size_t totalLength{0};
              for (const auto& w : words) {
                  if (longest == "-" || w.size() > longest.size()) {
                      longest = w;
                  }
                  totalLength += w.size();
              }
              double average = words.empty() ? 0.0 : static_cast<double>(totalLength) / static_cast<double>(words.size());

              std::cout << "Lines: " << lines << '\n';
              std::cout << "Characters: " << characters << '\n';
              std::cout << "Words: " << words.size() << '\n';
              std::cout << "Longest: " << longest << '\n';
              std::cout << std::fixed << std::setprecision(2) << "Average length: " << average << '\n';
              return 0;
          }
      - title: Letter frequency
        prompt: |
          Add a line with the **most common letter** and how many times it
          appears (the earliest in the alphabet if there's a tie), counting
          letters case-insensitively. With no letters, print `Top letter: -`.

          ```text
          Top letter: l (3)
          ```

          (For the first example, `l` and `o`… count them: h-e-l-l-o w-o-r-l-d
          c i-s x f-u-n → `l` appears 3 times, `o` twice.)
        tests:
          - in: |
