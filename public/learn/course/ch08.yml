  - type: lesson
    id: c8-getline
    title: Reading whole lines
    minutes: 18
    objectives:
      - Read a whole line, spaces included, with `std::getline`
      - Mix `>>` and `std::getline` correctly
      - Process every line of the input
    body: |
      `std::cin >> s` reads one word. To read a whole line — spaces and all —
      use **`std::getline`**:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string fullName{};
          std::getline(std::cin, fullName);
          std::cout << "Hello, " << fullName << "!\n";
          return 0;
      }
      ```

      ```stdin
      Ada King, Countess of Lovelace
      ```

      ```output
      Hello, Ada King, Countess of Lovelace!
      ```

      `std::getline(std::cin, line)` reads everything up to the end of the
      line, stores it (without the newline) in `line`, and moves on to the
      next line.

      ## The `>>` then `getline` trap

      This looks right, and fails:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          int age{};
          std::string name{};
          std::cin >> age;
          std::getline(std::cin, name);
          std::cout << "[" << name << "] is " << age << '\n';
          return 0;
      }
      ```

      ```stdin
      36
      Ada Lovelace
      ```

      ```output
      [] is 36
      ```

      Why is the name empty? `>> age` reads `36` and **stops right before the
      newline**. `getline` then reads from there — finds the end of the line
      immediately — and returns an empty string.

      The fix: skip the leftover whitespace before `getline` with
      **`std::ws`**:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          int age{};
          std::string name{};
          std::cin >> age;
          std::getline(std::cin >> std::ws, name);
          std::cout << "[" << name << "] is " << age << '\n';
          return 0;
      }
      ```

      ```stdin
      36
      Ada Lovelace
      ```

      ```output
      [Ada Lovelace] is 36
      ```

      > [!remember]
      > After a `>>`, read a line with `std::getline(std::cin >> std::ws, line)`.

      ## Every line of the input

      Like `>>`, `getline` can be used as a condition — it's false when there
      are no more lines:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string line{};
          int number{1};
          while (std::getline(std::cin, line)) {
              std::cout << number << ": " << line << '\n';
              ++number;
          }
          return 0;
      }
      ```

      ```stdin
      First line
      Second line, with spaces
      Third
      ```

      ```output
      1: First line
      2: Second line, with spaces
      3: Third
      ```

      {{check getline-trap}}

      {{task longest-line}}
    checks:
      - id: getline-trap
        type: mcq
        prompt: "After `std::cin >> n;`, why does `std::getline(std::cin, s);` often give an empty `s`?"
        options:
          - "`getline` can't be used after `>>`"
          - "`>>` leaves the newline behind, and `getline` reads up to it immediately"
          - "`s` must be initialised first"
          - "`getline` only reads numbers"
        answer: 1
        why: "Skip the leftover whitespace with `std::cin >> std::ws` before `getline`."
      - id: getline-output
        type: output
        prompt: "The Input box contains two lines: `3` and `a b c`."
        code: |
          #include <iostream>
          #include <string>

          int main() {
              int n{};
              std::string line{};
              std::cin >> n;
              std::getline(std::cin >> std::ws, line);
              std::cout << n * static_cast<int>(line.size()) << '\n';
              return 0;
          }
        stdin: |
          3
          a b c
        answer: |
          15
        why: "The line is `a b c`, 5 characters (spaces count); 3 × 5 = 15."
    tasks:
      - id: longest-line
        title: The longest line
        prompt: |
          Read lines until the input ends and print the longest one (the first
          one, if several tie). Print nothing if there are no lines.
        starter: |
          #include <iostream>
          #include <string>

          int main() {

              return 0;
          }
        tests:
          - in: |
              short
              a much longer line
              medium line
            out: a much longer line
          - in: |
              tie one
              tie two
            out: tie one
          - in: ""
            out: ""
        hints:
          - "`while (std::getline(std::cin, line))` with the max pattern on `line.size()`."
        solution: |
          #include <iostream>
          #include <string>

          int main() {
              std::string line{};
              std::string longest{};
              bool any{false};
              while (std::getline(std::cin, line)) {
                  if (!any || line.size() > longest.size()) {
                      longest = line;
                      any = true;
                  }
              }
              if (any) {
                  std::cout << longest << '\n';
              }
              return 0;
          }
    cards:
      - front: How do you read a whole line into `line`?
        back: "`std::getline(std::cin, line);`"
      - front: "How do you read a line right after `std::cin >> x;`?"
        back: "`std::getline(std::cin >> std::ws, line);` — `std::ws` skips the leftover newline."
      - front: How do you process every line of the input?
        back: "`while (std::getline(std::cin, line)) { ... }`"

  - type: lesson
    id: c8-convert
    title: Numbers and text, and string streams
    minutes: 20
    objectives:
      - Convert numbers to strings with `std::to_string` and back with `std::stoi` / `std::stod`
      - Split a line into words with `std::istringstream`
      - Build a formatted string with `std::ostringstream`
    body: |
      ## Numbers to text and back

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          int score{42};
          std::string label = "Score: " + std::to_string(score);
          std::cout << label << '\n';

          std::string typed{"1234"};
          int value = std::stoi(typed);      // string to int
          double price = std::stod("9.95");  // string to double
          std::cout << value + 1 << ' ' << price * 2 << '\n';
          return 0;
      }
      ```

      ```output
      Score: 42
      1235 19.9
      ```

      `std::stoi` ("string to int") throws an exception if the text isn't a
      number at all — Chapter 15 shows how to catch that. (Note that
      `std::to_string` of a `double` always uses 6 decimals: `"9.950000"`; use
      a string stream for nicer formatting.)

      ## String streams

      A **string stream** is like `std::cin` or `std::cout`, but reading from
      or writing to a string. Include `<sstream>`.

      `std::istringstream` lets you use `>>` on a string — the easiest way to
      split a line into words or numbers:

      ```cpp
      #include <iostream>
      #include <sstream>
      #include <string>

      int main() {
          std::string line{"apples 3 1.25"};
          std::istringstream in{line};
          std::string item{};
          int count{};
          double price{};
          in >> item >> count >> price;
          std::cout << count << ' ' << item << " cost " << count * price << '\n';

          std::istringstream words{"the quick  brown   fox"};
          std::string w{};
          int n{0};
          while (words >> w) {
              ++n;
          }
          std::cout << n << " words\n";
          return 0;
      }
      ```

      ```output
      3 apples cost 3.75
      4 words
      ```

      Combining `getline` (one line at a time) with `istringstream` (the
      pieces of that line) is how you handle input where each line has a
      meaning:

      ```cpp
      #include <iostream>
      #include <sstream>
      #include <string>

      int main() {
          std::string line{};
          while (std::getline(std::cin, line)) {
              std::istringstream in{line};
              int x{};
              int sum{0};
              while (in >> x) {
                  sum += x;
              }
              std::cout << sum << '\n';
          }
          return 0;
      }
      ```

      ```stdin
      1 2 3
      10 20
      7
      ```

      ```output
      6
      30
      7
      ```

      `std::ostringstream` goes the other way: write to it with `<<` —
      manipulators and all — then get the result with `.str()`:

      ```cpp
      #include <iomanip>
      #include <iostream>
      #include <sstream>
      #include <string>

      std::string money(double amount) {
          std::ostringstream out{};
          out << std::fixed << std::setprecision(2) << amount << " EUR";
          return out.str();
      }

      int main() {
          std::string m = money(3.5);
          std::cout << m << " (" << m.size() << " characters)\n";
          return 0;
      }
      ```

      ```output
      3.50 EUR (8 characters)
      ```

