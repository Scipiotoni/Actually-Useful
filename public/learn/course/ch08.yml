  - type: challenge
    id: c8-ch-rle
    title: Run-length encoding
    difficulty: 2
    tags: [strings, compression]
    prompt: |
      **Run-length encoding** compresses runs of repeated characters:
      `aaabccdddd` becomes `a3b1c2d4`. Write:

      - `std::string encode(const std::string& s)` — each run as its character followed by its length.
      - `std::string decode(const std::string& s)` — the reverse. Counts can have several digits (`x12`).

      The input to `encode` never contains digits.
    starter: |
      #include <string>

      std::string encode(const std::string& s) {
          return "";
      }

      std::string decode(const std::string& s) {
          return "";
      }
    harness: |
      CHECK(encode("aaabccdddd"), "a3b1c2d4");
      CHECK(encode(""), "");
      CHECK(encode("z"), "z1");
      CHECK(encode("xxxxxxxxxxxx"), "x12");
      CHECK(decode("a3b1c2d4"), "aaabccdddd");
      CHECK(decode("x12"), "xxxxxxxxxxxx");
      CHECK(decode(""), "");
      CHECK(decode(encode("hello  world")), "hello  world");
    hints:
      - "`encode`: walk with an index `i`; count how far the same character continues (`j`), append `s[i]` and `std::to_string(j - i)`, then jump `i = j`."
      - "`decode`: read a character, then read all the digits after it into a number, then append that many copies: `std::string(count, c)`."
    solution: |
      #include <cctype>
      #include <string>

      std::string encode(const std::string& s) {
          std::string out{};
          std::size_t i{0};
          while (i < s.size()) {
              std::size_t j{i};
              while (j < s.size() && s[j] == s[i]) {
                  ++j;
              }
              out += s[i];
              out += std::to_string(j - i);
              i = j;
          }
          return out;
      }

      std::string decode(const std::string& s) {
          std::string out{};
          std::size_t i{0};
          while (i < s.size()) {
              char c = s[i];
              ++i;
              std::size_t count{0};
              while (i < s.size() && std::isdigit(static_cast<unsigned char>(s[i]))) {
                  count = count * 10 + static_cast<std::size_t>(s[i] - '0');
                  ++i;
              }
              out += std::string(count, c);
          }
          return out;
      }

  - type: challenge
    id: c8-ch-anagram
    title: Anagrams
    difficulty: 2
    tags: [strings, frequency]
    prompt: |
      Two phrases are **anagrams** if they use exactly the same letters the
      same number of times, ignoring case and anything that isn't a letter:
      "Listen" / "Silent", "Dormitory" / "Dirty room!". Write
      `bool areAnagrams(const std::string& a, const std::string& b)`.
    starter: |
      #include <cctype>
      #include <string>
      #include <vector>

      bool areAnagrams(const std::string& a, const std::string& b) {
          return false;
      }
    harness: |
      CHECK(areAnagrams("Listen", "Silent"), true);
      CHECK(areAnagrams("Dormitory", "Dirty room!"), true);
      CHECK(areAnagrams("Hello", "World"), false);
      CHECK(areAnagrams("aab", "abb"), false);
      CHECK(areAnagrams("", "  !!"), true);
    hints:
      - "Build a 26-slot letter count for each phrase and compare the two vectors with `==`."
    solution: |
      #include <cctype>
      #include <string>
      #include <vector>

      std::vector<int> letterCounts(const std::string& s) {
          std::vector<int> counts(26, 0);
          for (char c : s) {
              unsigned char u = static_cast<unsigned char>(c);
              if (std::isalpha(u)) {
                  ++counts[std::tolower(u) - 'a'];
              }
          }
          return counts;
      }

      bool areAnagrams(const std::string& a, const std::string& b) {
          return letterCounts(a) == letterCounts(b);
      }
    explain: |
      Vectors can be compared with `==` — same size, same elements in the
      same order. Comparing letter counts avoids sorting and runs in one pass.

