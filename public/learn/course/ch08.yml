  - type: lesson
    id: c8-patterns
    title: Text-processing patterns
    minutes: 24
    objectives:
      - Split a string on a delimiter character
      - Trim spaces from both ends of a string
      - Count letter frequencies with a table indexed by letter
      - Compare strings ignoring case and punctuation
    body: |
      Some text tasks come up so often they're worth knowing by heart.

      ## Split on a delimiter

      Data often comes as *comma-separated values* (CSV): `Ada,36,London`.
      `std::getline` can read up to any character you choose, not just `'\n'`:

      ```cpp
      #include <iostream>
      #include <sstream>
      #include <string>
      #include <vector>

      std::vector<std::string> split(const std::string& text, char delimiter) {
          std::vector<std::string> parts{};
          std::istringstream in{text};
          std::string part{};
          while (std::getline(in, part, delimiter)) {
              parts.push_back(part);
          }
          return parts;
      }

      int main() {
          for (const auto& p : split("Ada,36,London", ',')) {
              std::cout << '[' << p << "] ";
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      [Ada] [36] [London]
      ```

      ## Trim

      Remove spaces at both ends — `find_first_not_of` and
      `find_last_not_of` find the first and last characters that are **not**
      in a given set:

      ```cpp
      #include <iostream>
      #include <string>

      std::string trim(const std::string& s) {
          std::size_t first = s.find_first_not_of(" \t");
          if (first == std::string::npos) {
              return "";
          }
          std::size_t last = s.find_last_not_of(" \t");
          return s.substr(first, last - first + 1);
      }

      int main() {
          std::cout << '[' << trim("   hello world  ") << "]\n";
          std::cout << '[' << trim("     ") << "]\n";
          return 0;
      }
      ```

      ```output
      [hello world]
      []
      ```

      ## A frequency table

      To count each letter, use a vector of 26 counters. The letter `c` goes
      in slot `c - 'a'` — `'a'` in 0, `'b'` in 1… — the char arithmetic from
      Chapter 2 doing real work:

      ```cpp
      #include <cctype>
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::string text{"Hello World"};
          std::vector<int> counts(26, 0);
          for (char c : text) {
              unsigned char u = static_cast<unsigned char>(c);
              if (std::isalpha(u)) {
                  ++counts[std::tolower(u) - 'a'];
              }
          }
          for (int i{0}; i < 26; ++i) {
              if (counts[i] > 0) {
                  std::cout << static_cast<char>('a' + i) << ':' << counts[i] << ' ';
              }
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      d:1 e:1 h:1 l:3 o:2 r:1 w:1
      ```

      ## Normalise, then compare

      "Is *A man, a plan, a canal: Panama* a palindrome?" Only if you ignore
      case, spaces and punctuation. The trick for all such questions: first
      build a **cleaned-up** copy (only letters, all lower case), then compare
      that.

