id: ch08
number: 8
part: p2
title: Strings and Text
blurb: Text is everywhere — names, messages, files, commands. Learn to take it apart, change it and build it up.
hours: 5.5
goals:
  - Treat a string as a sequence of characters you can index and loop over
  - Classify and convert characters with `<cctype>`
  - Search, cut and change strings with `find`, `substr`, `erase`, `insert` and `replace`
  - Read whole lines with `std::getline`, including after `>>`
  - Convert between numbers and text, and split lines into words with string streams
  - Apply the classic text-processing patterns — counting, splitting, cleaning, frequency tables

items:
  - type: lesson
    id: c8-chars
    title: A string is a sequence of characters
    minutes: 18
    objectives:
      - Read and change individual characters of a string by index
      - Loop over every character of a string
      - Build a new string character by character
    body: |
      A `std::string` is really a **vector of characters**. Everything you
      learned about vectors works on it: indexes from 0, `size()`, `[]`,
      `.at()`, range-based `for`, `push_back`, `back()`…

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string word{"planet"};
          std::cout << word[0] << word[word.size() - 1] << '\n';

          word[0] = 'P';
          std::cout << word << '\n';

          for (char c : word) {
              std::cout << c << '-';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      pt
      Planet
      P-l-a-n-e-t-
      ```

      Each element is a `char`, so `word[0] = 'P'` needs **single** quotes.

      ## Counting and searching character by character

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string text{"Mississippi"};
          int count{0};
          for (char c : text) {
              if (c == 's') {
                  ++count;
              }
          }
          std::cout << count << " s's\n";
          return 0;
      }
      ```

      ```output
      4 s's
      ```

      ## Building a string

      Start empty and add characters with `+=` (or `push_back`). Here's
      reversing a string by walking it backwards:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string original{"stressed"};
          std::string reversed{};
          for (int i = static_cast<int>(original.size()) - 1; i >= 0; --i) {
              reversed += original[i];
          }
          std::cout << reversed << '\n';
          return 0;
      }
      ```

      ```output
      desserts
      ```

      {{check char-loop}}

      {{task count-char}}
    checks:
      - id: char-loop
        type: output
        code: |
          #include <iostream>
          #include <string>

          int main() {
              std::string s{"banana"};
              std::string out{};
              for (std::size_t i{0}; i < s.size(); i += 2) {
                  out += s[i];
              }
              std::cout << out << '\n';
              return 0;
          }
        answer: |
          bnn
        why: "Indexes 0, 2, 4: b, n, n."
      - id: single-quote
        type: mcq
        prompt: "Which line changes the first letter of `name` to Z?"
        options:
          - "`name[0] = \"Z\";`"
          - "`name[0] = 'Z';`"
          - "`name[1] = 'Z';`"
          - "`name.first = 'Z';`"
        answer: 1
        why: "Each element is a `char`, written in single quotes, and the first index is 0."
    tasks:
      - id: count-char
        title: Count a letter
        prompt: |
          Write `int countChar(const std::string& text, char target)` that
          returns how many times `target` appears in `text`.
        starter: |
          #include <string>

          int countChar(const std::string& text, char target) {
              return 0;
          }
        harness: |
          CHECK(countChar("Mississippi", 's'), 4);
          CHECK(countChar("Mississippi", 'M'), 1);
          CHECK(countChar("Mississippi", 'm'), 0);
          CHECK(countChar("", 'a'), 0);
        hints:
          - "`for (char c : text)` and the counter pattern."
        solution: |
          #include <string>

          int countChar(const std::string& text, char target) {
              int count{0};
              for (char c : text) {
                  if (c == target) {
                      ++count;
                  }
              }
              return count;
          }
    cards:
      - front: How do you get the first and last characters of a string `s`?
        back: "`s[0]` and `s[s.size() - 1]` (or `s.front()` and `s.back()`) — if it isn't empty."
      - front: How do you add a character to the end of a string?
        back: "`s += 'x';` or `s.push_back('x');`"

  - type: lesson
    id: c8-cctype
    title: "Classifying characters: <cctype>"
    minutes: 16
    objectives:
      - Test characters with `std::isalpha`, `std::isdigit`, `std::isspace` and friends
      - Change case with `std::toupper` and `std::tolower`
    body: |
      Is this character a letter? A digit? A space? The **`<cctype>`** header
      answers these questions:

      | Function | True for |
      |---|---|
      | `std::isalpha(c)` | letters `a–z`, `A–Z` |
      | `std::isdigit(c)` | digits `0–9` |
      | `std::isalnum(c)` | letters or digits |
      | `std::isspace(c)` | space, tab, newline… |
      | `std::isupper(c)`, `std::islower(c)` | upper / lower case letters |
      | `std::ispunct(c)` | punctuation such as `! , . ?` |

      And two converters: `std::toupper(c)` and `std::tolower(c)` return the
      other-case version of a letter (and leave anything else alone).

      ```cpp
      #include <cctype>
      #include <iostream>
      #include <string>

      int main() {
          std::string text{"Hello, World 2024!"};
          int letters{0};
          int digits{0};
          std::string shout{};
          for (char c : text) {
              if (std::isalpha(static_cast<unsigned char>(c))) {
                  ++letters;
              } else if (std::isdigit(static_cast<unsigned char>(c))) {
                  ++digits;
              }
              shout += static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
          }
          std::cout << letters << " letters, " << digits << " digits\n";
          std::cout << shout << '\n';
          return 0;
      }
      ```

      ```output
      10 letters, 4 digits
      HELLO, WORLD 2024!
      ```

      ## About those casts

      Two awkward details, both inherited from C:

      1. These functions take and return an `int`, not a `char` — so `std::toupper(c)` gives an `int`, and you cast it back with `static_cast<char>(...)`.
      2. Passing a `char` with a negative value (which happens for accented letters like `é` in UTF-8 text) is undefined behaviour. Casting to `unsigned char` first avoids it.

      A tiny helper hides all that once and for all:

      ```cpp static
      char upper(char c) {
          return static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
      }
      ```

      > [!note]
      > `<cctype>` only understands plain English letters. Proper handling of
      > accents and other alphabets (Unicode) needs dedicated libraries — a
      > topic for much later.

      {{check classify}}

      {{task to-upper}}
    checks:
      - id: classify
        type: output
        code: |
          #include <cctype>
          #include <iostream>
          #include <string>

          int main() {
              std::string s{"a1 B2?"};
              int a{0};
              int d{0};
              int other{0};
              for (char c : s) {
                  unsigned char u = static_cast<unsigned char>(c);
                  if (std::isalpha(u)) {
                      ++a;
                  } else if (std::isdigit(u)) {
                      ++d;
                  } else {
                      ++other;
                  }
              }
              std::cout << a << d << other << '\n';
              return 0;
          }
        answer: |
          222
        why: "Letters a, B; digits 1, 2; other: the space and `?`."
    tasks:
      - id: to-upper
        title: Shout
        prompt: |
          Write `std::string toUpper(const std::string& s)` that returns an
          upper-case copy of `s`.
        starter: |
          #include <cctype>
          #include <string>

          std::string toUpper(const std::string& s) {
              return s;
          }
        harness: |
          CHECK(toUpper("hello"), "HELLO");
          CHECK(toUpper("Mixed Case 123!"), "MIXED CASE 123!");
          CHECK(toUpper(""), "");
        hints:
          - "Copy `s` into a result, then `for (char& c : result) c = static_cast<char>(std::toupper(static_cast<unsigned char>(c)));`"
        solution: |
          #include <cctype>
          #include <string>

          std::string toUpper(const std::string& s) {
              std::string result{s};
              for (char& c : result) {
                  c = static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
              }
              return result;
          }
    cards:
      - front: Which header has `std::isdigit`, `std::isalpha`, `std::toupper`?
        back: "`<cctype>`"
      - front: Why cast a `char` to `unsigned char` before `std::isalpha` etc.?
        back: A negative `char` (e.g. part of an accented letter) is undefined behaviour for these functions.
      - front: What type does `std::toupper(c)` return?
        back: An `int` — cast it back with `static_cast<char>(...)`.

  - type: lesson
    id: c8-ops
    title: Searching and changing strings
    minutes: 22
    objectives:
      - Extract part of a string with `substr`
      - Search with `find` and `rfind`, and check for `std::string::npos`
      - Change strings with `erase`, `insert` and `replace`
    body: |
      `std::string` comes with a toolbox of member functions. These are the
      ones you'll use constantly.

      ## `substr`: a piece of a string

      `s.substr(pos, len)` returns `len` characters starting at index `pos`.
      Leave out `len` to go to the end:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string date{"2024-09-24"};
          std::string year = date.substr(0, 4);
          std::string month = date.substr(5, 2);
          std::string day = date.substr(8);
          std::cout << day << '/' << month << '/' << year << '\n';
          return 0;
      }
      ```

      ```output
      24/09/2024
      ```

      ## `find`: where is it?

      `s.find(x)` returns the index of the **first** occurrence of `x` (a
      character or a string), searching from the start. `s.rfind(x)` searches
      from the end. If it isn't there, they return the special value
      **`std::string::npos`** — always check for it:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string email{"ada.lovelace@example.com"};
          std::size_t at = email.find('@');
          if (at != std::string::npos) {
              std::cout << "User: " << email.substr(0, at) << '\n';
              std::cout << "Domain: " << email.substr(at + 1) << '\n';
          }
          std::cout << (email.find("xyz") == std::string::npos ? "no xyz" : "has xyz") << '\n';
          return 0;
      }
      ```

      ```output
      User: ada.lovelace
      Domain: example.com
      no xyz
      ```

      `find` can also start from a given position: `s.find(x, from)`. That's
      how you find **every** occurrence:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string text{"the cat sat on the mat"};
          std::size_t pos = text.find("at");
          while (pos != std::string::npos) {
              std::cout << pos << ' ';
              pos = text.find("at", pos + 1);
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      5 9 20
      ```

      > [!mistake] Storing the result in an `int`
      > `npos` is the largest `std::size_t` value. Put the result of `find` in a
      > `std::size_t` (or `auto`) and compare it with `std::string::npos` —
      > don't compare with `-1`.

      ## Changing a string

      | Call | Does |
      |---|---|
      | `s.erase(pos, len)` | removes `len` characters starting at `pos` |
      | `s.insert(pos, text)` | inserts `text` before index `pos` |
      | `s.replace(pos, len, text)` | replaces `len` characters at `pos` with `text` |

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string s{"I like tea."};
          s.replace(s.find("tea"), 3, "coffee");
          std::cout << s << '\n';
          s.insert(2, "really ");
          std::cout << s << '\n';
          s.erase(0, 2);
          std::cout << s << '\n';
          return 0;
      }
      ```

      ```output
      I like coffee.
      I really like coffee.
      really like coffee.
      ```

      {{check substr}}

      {{check find}}

      {{task ext}}

      {{task replace-all}}
    checks:
      - id: substr
        type: output
        code: |
          #include <iostream>
          #include <string>

          int main() {
              std::string s{"programming"};
              std::cout << s.substr(3, 4) << ' ' << s.substr(7) << '\n';
              return 0;
          }
        answer: |
          gram ming
        why: "From index 3, four characters: g-r-a-m. From index 7 to the end: m-i-n-g."
      - id: find
        type: mcq
        prompt: "What does `std::string{\"hello\"}.find('z')` return?"
        options:
          - "-1"
          - "0"
          - "`std::string::npos`"
          - "5"
        answer: 2
        why: "`npos` means \"not found\". It's a huge unsigned value, not −1."
    tasks:
      - id: ext
        title: File extension
        prompt: |
          Write `std::string extension(const std::string& filename)` that
          returns the part after the **last** dot (`"photo.jpg"` → `"jpg"`,
          `"archive.tar.gz"` → `"gz"`), or an empty string if there's no dot.
        starter: |
          #include <string>

          std::string extension(const std::string& filename) {
              return "";
          }
        harness: |
          CHECK(extension("photo.jpg"), "jpg");
          CHECK(extension("archive.tar.gz"), "gz");
          CHECK(extension("README"), "");
          CHECK(extension("notes."), "");
        hints:
          - "`rfind('.')` finds the last dot."
          - "If it's `npos`, return `\"\"`; otherwise return `substr(dot + 1)`."
        solution: |
          #include <string>

          std::string extension(const std::string& filename) {
              std::size_t dot = filename.rfind('.');
              if (dot == std::string::npos) {
                  return "";
              }
              return filename.substr(dot + 1);
          }
      - id: replace-all
        title: Replace every occurrence
        prompt: |
          Write `std::string replaceAll(std::string text, const std::string& from, const std::string& to)`
          that replaces **every** occurrence of `from` (never empty) with `to`.
          Be careful when `to` contains `from`!
        starter: |
          #include <string>

          std::string replaceAll(std::string text, const std::string& from, const std::string& to) {
              return text;
          }
        harness: |
          CHECK(replaceAll("a cat and a hat", "at", "og"), "a cog and a hog");
          CHECK(replaceAll("aaa", "a", "b"), "bbb");
          CHECK(replaceAll("aaa", "a", "aa"), "aaaaaa");
          CHECK(replaceAll("nothing here", "xyz", "!"), "nothing here");
        hints:
          - "Loop with `pos = text.find(from, pos)` while it isn't `npos`."
          - "After replacing at `pos`, continue searching from `pos + to.size()` — that skips over the text you just inserted."
        solution: |
          #include <string>

          std::string replaceAll(std::string text, const std::string& from, const std::string& to) {
              std::size_t pos = text.find(from);
              while (pos != std::string::npos) {
                  text.replace(pos, from.size(), to);
                  pos = text.find(from, pos + to.size());
              }
              return text;
          }
    cards:
      - front: What does `s.substr(4, 3)` return?
        back: Three characters of `s` starting at index 4. (`s.substr(4)` goes to the end.)
      - front: What does `s.find(x)` return when `x` isn't in `s`?
        back: "`std::string::npos` — always compare the result against it."
      - front: How do you find every occurrence of `x` in `s`?
        back: "`pos = s.find(x); while (pos != npos) { ...; pos = s.find(x, pos + 1); }`"
      - front: Name three functions that change a string in place.
        back: "`erase(pos, len)`, `insert(pos, text)`, `replace(pos, len, text)`."

