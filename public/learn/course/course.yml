title: Learn C++ from Zero
subtitle: From never having written a line of code to writing real C++ fluently.

intro: |
  A complete course in C++: twenty chapters, each with lessons you can run,
  checks, exercises, challenges and an exam. It assumes you know nothing about
  programming — and ends with you building real programs on your own.

parts:
  - id: p1
    title: Part I — First Steps
    blurb: What a program is, and the core of every language — values, variables, decisions, loops and functions. After this part you can write small programs that do real work.
  - id: p2
    title: Part II — Working with Data
    blurb: Collections of values, text, your own types, and how memory really works. After this part you can model real problems as data.
  - id: p3
    title: Part III — Object-Oriented C++
    blurb: Classes, encapsulation, inheritance and polymorphism — how C++ programs are organised into objects that keep their promises.
  - id: p4
    title: Part IV — The Standard Library and Modern C++
    blurb: The containers and algorithms every C++ programmer uses daily, lambdas, smart pointers, move semantics, error handling and templates.
  - id: p5
    title: Part V — Becoming Fluent
    blurb: Professional habits, problem-solving strategies and classic algorithms — and a capstone project and final exam that prove you can do it on your own.

