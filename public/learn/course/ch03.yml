  - type: review
    id: c3-review
    title: "Chapter 3 review"
    body: |
      ## Cheat sheet

      | Expression | Value | Why |
      |---|---|---|
      | `2 + 3 * 4` | `14` | `*` before `+` |
      | `7 / 2` | `3` | integer division drops the fraction |
      | `7 % 2` | `1` | remainder |
      | `7 / 2.0` | `3.5` | one side is a double |
      | `static_cast<double>(7) / 2` | `3.5` | convert *before* dividing |
      | `static_cast<int>(3.9)` | `3` | truncates towards zero |
      | `std::round(3.5)` | `4` | nearest, halves away from zero |
      | `n % 10`, `n / 10` | last digit, number without it | |
      | `x += 3` | `x = x + 3` | also `-= *= /= %=` |

      ```cpp static
      #include <cmath>      // std::sqrt std::pow std::abs std::round std::floor std::ceil
      #include <algorithm>  // std::max std::min
      #include <iomanip>    // std::fixed std::setprecision std::setw std::left std::setfill
      #include <limits>     // std::numeric_limits<int>::max()

      std::cout << std::fixed << std::setprecision(2) << price;   // 4.50
      std::cout << std::setw(8) << value;                          // padded, once
      ```

      ## Key ideas

      - Integer division is the #1 surprise: both sides `int` ⇒ fraction dropped.
      - `/` and `%` together split numbers into units and digits.
      - Mixed `int`/`double` arithmetic converts the `int` to `double`.
      - Doubles are binary approximations: never test exact equality after arithmetic.
      - `int` overflow is undefined behaviour; `unsigned` wraps around. Use `int`, or `long long` for big values.
    questions:
      - type: output
        prompt: "Interleaving: this uses Chapters 1–3. Input: `17`"
        code: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              std::cout << "\"" << n / 5 << "r" << n % 5 << "\"\n";
              return 0;
          }
        stdin: "17"
        answer: |
          "3r2"
        why: "17 / 5 = 3 remainder 2, printed between escaped quotes."
      - type: output
        code: |
          #include <iostream>
          #include <string>

          int main() {
              std::string s{"abc"};
              int len = s.length();
              std::cout << len * 2 / 4 << ' ' << len * 2 % 4 << '\n';
              return 0;
          }
        answer: |
          1 2
        why: "len is 3, so len × 2 = 6; 6 / 4 = 1, 6 % 4 = 2."
      - type: mcq
        prompt: Which is the best type for a population count that could exceed 3 billion?
        options:
          - "`int`"
          - "`unsigned int`"
          - "`long long`"
          - "`double`"
        answer: 2
        why: "`int` tops out at about 2.1 billion. `long long` holds whole numbers up to about 9.2 × 10¹⁸."

