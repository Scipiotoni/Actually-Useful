      - type: code
        prompt: |
          Write `std::vector<int> evensThenOdds(const std::vector<int>& v)`
          returning all even elements (in order) followed by all odd ones (in
          order). `{1, 2, 3, 4, 5}` gives `{2, 4, 1, 3, 5}`.
        starter: |
          #include <vector>

          std::vector<int> evensThenOdds(const std::vector<int>& v) {
              return v;
          }
        harness: |
          CHECK(evensThenOdds({1, 2, 3, 4, 5}), (std::vector<int>{2, 4, 1, 3, 5}));
          CHECK(evensThenOdds({}), (std::vector<int>{}));
          CHECK(evensThenOdds({7, 9}), (std::vector<int>{7, 9}));
          CHECK(evensThenOdds({-2, -1, 0}), (std::vector<int>{-2, 0, -1}));
        solution: |
          #include <vector>

          std::vector<int> evensThenOdds(const std::vector<int>& v) {
              std::vector<int> result{};
              for (int x : v) {
                  if (x % 2 == 0) {
                      result.push_back(x);
                  }
              }
              for (int x : v) {
                  if (x % 2 != 0) {
                      result.push_back(x);
                  }
              }
              return result;
          }
      - type: code
        prompt: |
          Read `n`, then `n` whole numbers. Print the numbers that are
          **strictly greater than the average** of all `n`, in their original
          order, separated by spaces (print an empty line if none). For input
          `5 1 2 3 4 10`, the average is 4, so print `10`.
        starter: |
          #include <iostream>
          #include <vector>

          int main() {

              return 0;
          }
        tests:
          - in: "5 1 2 3 4 10"
            out: "10"
          - in: "4 1 2 3 4"
            out: "3 4"
          - in: "3 5 5 5"
            out: ""
        solution: |
          #include <iostream>
          #include <vector>

          int main() {
              int n{};
              std::cin >> n;
              std::vector<int> v(n);
              long long sum{0};
              for (int& x : v) {
                  std::cin >> x;
                  sum += x;
              }
              double average = static_cast<double>(sum) / n;
              bool first{true};
              for (int x : v) {
                  if (x > average) {
                      if (!first) {
                          std::cout << ' ';
                      }
                      std::cout << x;
                      first = false;
                  }
              }
              std::cout << '\n';
              return 0;
          }
