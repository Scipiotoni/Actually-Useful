        prompt: |
          Write `int* maxElement(int* begin, int* end)` returning a pointer to
          the largest element of `[begin, end)` (the first one on a tie), or
          `end` if the range is empty.
        starter: |
          int* maxElement(int* begin, int* end) {
              return end;
          }
        harness: |
          int a[6]{3, 8, 1, 8, 2, 7};
          CHECK(maxElement(a, a + 6) == a + 1, true);
          CHECK(*maxElement(a + 2, a + 6), 8);
          CHECK(maxElement(a + 2, a + 6) == a + 3, true);
          CHECK(maxElement(a, a) == a, true);
          CHECK(maxElement(a + 4, a + 5) == a + 4, true);
        solution: |
          int* maxElement(int* begin, int* end) {
              if (begin == end) {
                  return end;
              }
              int* best = begin;
              for (int* p = begin + 1; p != end; ++p) {
                  if (*p > *best) {
                      best = p;
                  }
              }
              return best;
          }
      - type: code
        prompt: |
          With the `Node` struct, write `int countIf(const Node* head, int limit)`
          returning how many values are **greater than** `limit`, and
          `Node* nth(Node* head, int n)` returning the node at position `n`
          (0-based), or `nullptr` if the list is too short.
        starter: |
          struct Node {
              int value{0};
              Node* next{nullptr};
          };

          int countIf(const Node* head, int limit) {
              return 0;
          }

          Node* nth(Node* head, int n) {
              return nullptr;
          }
        harness: |
          Node c{9, nullptr};
          Node b{2, &c};
          Node a{5, &b};
          CHECK(countIf(&a, 4), 2);
          CHECK(countIf(&a, 100), 0);
          CHECK(countIf(nullptr, 0), 0);
          CHECK(nth(&a, 0) == &a, true);
          CHECK(nth(&a, 2) == &c, true);
          CHECK(nth(&a, 3) == nullptr, true);
          CHECK(nth(nullptr, 0) == nullptr, true);
        solution: |
          struct Node {
              int value{0};
              Node* next{nullptr};
          };

          int countIf(const Node* head, int limit) {
              int count{0};
              for (const Node* n = head; n != nullptr; n = n->next) {
                  if (n->value > limit) {
                      ++count;
                  }
              }
              return count;
          }

          Node* nth(Node* head, int n) {
              Node* current{head};
              for (int i{0}; i < n && current != nullptr; ++i) {
                  current = current->next;
              }
              return current;
          }
