      - type: output
        code: |
          #include <iostream>

          struct Node {
              int value{0};
              Node* next{nullptr};
          };

          int main() {
              Node* head{nullptr};
              for (int i{1}; i <= 3; ++i) {
                  head = new Node{i, head};
              }
              for (Node* n = head; n != nullptr; n = n->next) {
                  std::cout << n->value;
