  - type: challenge
    id: c10-ch-find
    title: Find a record
    difficulty: 2
    tags: [pointers, structs]
    prompt: |
      With `struct Book { std::string title{}; int year{0}; };`, write
      `Book* findByTitle(std::vector<Book>& books, const std::string& title)`
      returning a pointer to the matching book (so the caller can change it),
      or `nullptr` if there's none.
    starter: |
      #include <string>
      #include <vector>

      struct Book {
          std::string title{};
          int year{0};
      };

      Book* findByTitle(std::vector<Book>& books, const std::string& title) {
          return nullptr;
      }
    harness: |
      std::vector<Book> shelf{{"Dune", 1965}, {"Neuromancer", 1984}, {"Hyperion", 1989}};
      Book* b = findByTitle(shelf, "Neuromancer");
      CHECK(b != nullptr, true);
      CHECK(b == &shelf[1], true);
      b->year = 1985;
      CHECK(shelf[1].year, 1985);
      CHECK(findByTitle(shelf, "Foundation") == nullptr, true);
      std::vector<Book> none{};
      CHECK(findByTitle(none, "Dune") == nullptr, true);
    hints:
      - "Loop with a reference: `for (Book& b : books)`, and on a match `return &b;`."
    solution: |
      #include <string>
      #include <vector>

      struct Book {
          std::string title{};
          int year{0};
      };

      Book* findByTitle(std::vector<Book>& books, const std::string& title) {
          for (Book& b : books) {
              if (b.title == title) {
                  return &b;
              }
          }
          return nullptr;
      }
    explain: |
      The returned pointer is only valid while `books` doesn't change size —
      the lifetime rule from lesson 10.6.

  - type: challenge
    id: c10-ch-reverse
    title: Reverse with two pointers
    difficulty: 2
    tags: [pointers, arrays]
    prompt: |
      Write `void reverseRange(int* begin, int* end)` that reverses the
      elements of `[begin, end)` in place, using only pointers. It must work
      for empty ranges.
    starter: |
      void reverseRange(int* begin, int* end) {

      }
    harness: |
      int a[5]{1, 2, 3, 4, 5};
      reverseRange(a, a + 5);
      CHECK(a[0], 5);
      CHECK(a[2], 3);
      CHECK(a[4], 1);
      int b[4]{1, 2, 3, 4};
      reverseRange(b + 1, b + 4);
      CHECK(b[0], 1);
      CHECK(b[1], 4);
      CHECK(b[3], 2);
      int c[1]{9};
      reverseRange(c, c);
      reverseRange(c, c + 1);
      CHECK(c[0], 9);
    hints:
      - "`end` points one past the last element, so the last element is at `end - 1`."
      - "`while (begin < end - 1)`… or more safely: `--end; while (begin < end) { swap; ++begin; --end; }` after checking the range isn't empty."
    solution: |
      void reverseRange(int* begin, int* end) {
          if (begin == end) {
              return;
          }
          --end;
          while (begin < end) {
              int temp = *begin;
              *begin = *end;
              *end = temp;
              ++begin;
              --end;
          }
      }

  - type: challenge
    id: c10-ch-strlen
    title: C string tools
    difficulty: 2
    tags: [pointers, C strings]
    prompt: |
      Without using `<cstring>` or `std::string`, write:

      - `int cLength(const char* s)` — the number of characters before `'\0'`.
      - `int countChar(const char* s, char c)`.
      - `bool cEqual(const char* a, const char* b)` — the same characters, same length.
    starter: |
      int cLength(const char* s) {
          return 0;
      }

      int countChar(const char* s, char c) {
          return 0;
      }

      bool cEqual(const char* a, const char* b) {
          return false;
      }
    harness: |
      CHECK(cLength("hello"), 5);
      CHECK(cLength(""), 0);
      CHECK(countChar("banana", 'a'), 3);
      CHECK(countChar("", 'a'), 0);
      CHECK(cEqual("abc", "abc"), true);
      CHECK(cEqual("abc", "abd"), false);
      CHECK(cEqual("abc", "ab"), false);
      CHECK(cEqual("", ""), true);
    hints:
      - "Walk a pointer: `for (const char* p = s; *p != '\\0'; ++p)`."
      - "`cEqual`: advance both while the characters match and neither is at `'\\0'`; they're equal if both end together."
    solution: |
      int cLength(const char* s) {
          int n{0};
          for (const char* p = s; *p != '\0'; ++p) {
              ++n;
          }
          return n;
      }

      int countChar(const char* s, char c) {
          int n{0};
          for (const char* p = s; *p != '\0'; ++p) {
              if (*p == c) {
                  ++n;
              }
          }
          return n;
      }

      bool cEqual(const char* a, const char* b) {
          while (*a != '\0' && *a == *b) {
              ++a;
              ++b;
          }
          return *a == *b;
      }

  - type: challenge
    id: c10-ch-list-ops
    title: Linked list operations
    difficulty: 2
    tags: [linked list, pointers]
    prompt: |
      Using the `Node` struct, write:

      - `void pushBack(Node*& head, int value)`
      - `bool contains(const Node* head, int value)`
      - `bool removeFirst(Node*& head, int value)` — deletes the first node holding `value` and returns `true`, or returns `false` if there is none.
      - `void clear(Node*& head)` — deletes every node and leaves `head` as `nullptr`.
    starter: |
      struct Node {
          int value{0};
          Node* next{nullptr};
      };

      void pushBack(Node*& head, int value) {
      }

      bool contains(const Node* head, int value) {
          return false;
      }

      bool removeFirst(Node*& head, int value) {
          return false;
      }

      void clear(Node*& head) {
      }
    harness_pre: |
      std::vector<int> toVector(const Node* head) {
          std::vector<int> out;
          for (const Node* n = head; n != nullptr; n = n->next) out.push_back(n->value);
          return out;
      }
    harness: |
      Node* list{nullptr};
      pushBack(list, 1);
      pushBack(list, 2);
      pushBack(list, 3);
      pushBack(list, 2);
      CHECK(toVector(list), (std::vector<int>{1, 2, 3, 2}));
      CHECK(contains(list, 3), true);
      CHECK(contains(list, 9), false);
      CHECK(removeFirst(list, 2), true);
      CHECK(toVector(list), (std::vector<int>{1, 3, 2}));
      CHECK(removeFirst(list, 1), true);
      CHECK(toVector(list), (std::vector<int>{3, 2}));
      CHECK(removeFirst(list, 7), false);
      clear(list);
      CHECK(list == nullptr, true);
      CHECK(removeFirst(list, 1), false);
    hints:
      - "Removing the head is a special case: `Node* old = head; head = head->next; delete old;`."
      - "Otherwise walk with a pointer to the node **before** the one to remove: `prev->next = victim->next; delete victim;`."
    solution: |
      struct Node {
          int value{0};
          Node* next{nullptr};
      };

      void pushBack(Node*& head, int value) {
          Node* fresh = new Node{value, nullptr};
          if (head == nullptr) {
              head = fresh;
              return;
          }
          Node* last = head;
          while (last->next != nullptr) {
              last = last->next;
          }
          last->next = fresh;
      }

      bool contains(const Node* head, int value) {
          for (const Node* n = head; n != nullptr; n = n->next) {
              if (n->value == value) {
                  return true;
              }
          }
          return false;
      }

      bool removeFirst(Node*& head, int value) {
          if (head == nullptr) {
              return false;
          }
          if (head->value == value) {
              Node* old = head;
              head = head->next;
              delete old;
              return true;
          }
          for (Node* prev = head; prev->next != nullptr; prev = prev->next) {
              if (prev->next->value == value) {
                  Node* victim = prev->next;
                  prev->next = victim->next;
                  delete victim;
                  return true;
              }
          }
          return false;
      }

      void clear(Node*& head) {
          while (head != nullptr) {
              Node* next = head->next;
              delete head;
              head = next;
          }
      }

  - type: challenge
    id: c10-ch-list-reverse
    title: Reverse a linked list
    difficulty: 3
    tags: [linked list, pointers]
    prompt: |
      Write `void reverse(Node*& head)` that reverses a linked list **in
      place** — without creating or deleting any node, only by changing
      `next` pointers. A famous interview question!
    starter: |
      struct Node {
          int value{0};
          Node* next{nullptr};
      };

      void reverse(Node*& head) {
      }
    harness_pre: |
      std::vector<int> toVector(const Node* head) {
          std::vector<int> out;
          for (const Node* n = head; n != nullptr; n = n->next) out.push_back(n->value);
          return out;
      }
    harness: |
      Node d{4, nullptr};
      Node c{3, &d};
      Node b{2, &c};
      Node a{1, &b};
      Node* head = &a;
      reverse(head);
      CHECK(toVector(head), (std::vector<int>{4, 3, 2, 1}));
      CHECK(head == &d, true);
      reverse(head);
      CHECK(toVector(head), (std::vector<int>{1, 2, 3, 4}));
      Node* empty{nullptr};
      reverse(empty);
      CHECK(empty == nullptr, true);
      Node solo{7, nullptr};
      Node* one = &solo;
      reverse(one);
      CHECK(toVector(one), (std::vector<int>{7}));
    hints:
      - "Walk the list keeping three pointers: `prev` (starts `nullptr`), `current` (starts `head`) and `next`."
      - "At each node: save `next = current->next`, point `current->next = prev`, then move `prev = current` and `current = next`."
      - "When `current` is `nullptr`, `prev` is the new head."
    solution: |
      struct Node {
          int value{0};
          Node* next{nullptr};
      };

      void reverse(Node*& head) {
          Node* prev{nullptr};
          Node* current{head};
          while (current != nullptr) {
              Node* next = current->next;
              current->next = prev;
              prev = current;
              current = next;
          }
          head = prev;
      }
    explain: |
      Draw it on paper with boxes and arrows — it's the only way pointer code
      really makes sense. Each step flips one arrow to point backwards; `next`
      remembers the rest of the list before its arrow is flipped.

  - type: review
    id: c10-review
    title: "Chapter 10 review"
    body: |
      ## Cheat sheet

      ```cpp static
      int x{5};
      int& r = x;        // reference: another name for x (must be initialised, can't be reseated)
      int* p = &x;       // pointer: holds x's address
      *p = 7;            // dereference: x is now 7
      p = nullptr;       // points at nothing — check before dereferencing!
      obj->member;       // (*obj).member

      int a[4]{};  int* q = a;   q[2] == *(q + 2);    // arrays decay; pointer arithmetic
      const char* s = "Hi";      // 'H' 'i' '\0'

      int* h = new int{1};       delete h;            // single object
      int* arr = new int[n];     delete[] arr;        // array
      ```

      ## Key ideas

      - Every object lives at an address. `&x` gets it; `*p` follows it.
      - References: always valid (unless dangling), never null, never reseated. Pointers: can be null, can move.
      - Prefer references; use pointers for "maybe nothing", changing targets, and data structures.
      - Arrays decay to pointers and forget their size; `std::vector`/`std::array` don't.
      - Heap objects live until deleted: watch for leaks, dangling pointers and double deletes.
      - Every object has a lifetime and (ideally) one owner. References/pointers into a vector can dangle after it grows.
      - Modern C++: containers and smart pointers instead of raw `new`/`delete`.
    questions:
      - type: output
        prompt: "Interleaving: functions, vectors and pointers."
        code: |
          #include <iostream>
          #include <vector>

          int* largest(std::vector<int>& v) {
              if (v.empty()) {
                  return nullptr;
              }
              int* best = &v[0];
              for (int& x : v) {
                  if (x > *best) {
                      best = &x;
                  }
              }
              return best;
          }

          int main() {
              std::vector<int> v{3, 9, 4};
              *largest(v) = 0;
              std::cout << v[0] << v[1] << v[2] << ' ' << *largest(v) << '\n';
              return 0;
          }
        answer: |
          304 4
        why: "The first call finds 9 and sets it to 0; the largest is then 4."
