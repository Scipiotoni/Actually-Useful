      - type: code
        prompt: |
          Write `class Countdown` with `explicit Countdown(int start)` (negative
          values become 0), `bool tick()` which decrements and returns `true`,
          or returns `false` without changing anything when already at 0,
          `int remaining() const`, and `bool finished() const`.
        starter: |
          class Countdown {
          public:
              explicit Countdown(int start) {
              }

              bool tick() {
                  return false;
              }

              int remaining() const { return 0; }
              bool finished() const { return false; }

          private:
              int left_{0};
          };
        harness: |
          Countdown c{2};
          CHECK(c.remaining(), 2);
          CHECK(c.finished(), false);
          CHECK(c.tick(), true);
          CHECK(c.tick(), true);
          CHECK(c.finished(), true);
          CHECK(c.tick(), false);
          CHECK(c.remaining(), 0);
          Countdown n{-5};
          CHECK(n.remaining(), 0);
          const Countdown& view = c;
          CHECK(view.finished(), true);
        solution: |
          class Countdown {
          public:
              explicit Countdown(int start) : left_{start < 0 ? 0 : start} {}

              bool tick() {
                  if (left_ == 0) {
                      return false;
                  }
                  --left_;
                  return true;
              }

              int remaining() const { return left_; }
              bool finished() const { return left_ == 0; }

          private:
              int left_{0};
          };
      - type: code
        prompt: |
          `struct Vec3 { double x{0}; double y{0}; double z{0}; };` Add free
          functions `operator+`, `operator-`, `operator*` (a `Vec3` times a
          `double`), `double dot(const Vec3&, const Vec3&)` and `operator==`.
        starter: |
          struct Vec3 {
              double x{0};
              double y{0};
              double z{0};
          };

          Vec3 operator+(const Vec3& a, const Vec3& b) {
              return {};
          }

          Vec3 operator-(const Vec3& a, const Vec3& b) {
              return {};
          }

          Vec3 operator*(const Vec3& v, double k) {
              return {};
          }

          double dot(const Vec3& a, const Vec3& b) {
              return 0;
          }

          bool operator==(const Vec3& a, const Vec3& b) {
              return false;
          }
        harness: |
          Vec3 a{1, 2, 3};
          Vec3 b{4, 5, 6};
          Vec3 s = a + b;
          CHECK(s.x, 5.0);
          CHECK(s.z, 9.0);
          Vec3 d = b - a;
          CHECK(d.y, 3.0);
          Vec3 m = a * 2.0;
          CHECK(m.z, 6.0);
          CHECK(dot(a, b), 32.0);
          CHECK(a == Vec3{1, 2, 3}, true);
          CHECK(a == b, false);
        solution: |
          struct Vec3 {
              double x{0};
              double y{0};
              double z{0};
          };

          Vec3 operator+(const Vec3& a, const Vec3& b) {
              return {a.x + b.x, a.y + b.y, a.z + b.z};
          }

          Vec3 operator-(const Vec3& a, const Vec3& b) {
              return {a.x - b.x, a.y - b.y, a.z - b.z};
          }

          Vec3 operator*(const Vec3& v, double k) {
              return {v.x * k, v.y * k, v.z * k};
          }

          double dot(const Vec3& a, const Vec3& b) {
              return a.x * b.x + a.y * b.y + a.z * b.z;
          }

          bool operator==(const Vec3& a, const Vec3& b) {
              return a.x == b.x && a.y == b.y && a.z == b.z;
          }
