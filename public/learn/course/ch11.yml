      // TODO: Matrix operator*(const Matrix& a, const Matrix& b)
    starter_broken: true
    harness: |
      Matrix a{2, 3};
      CHECK(a.rows(), 2);
      CHECK(a.cols(), 3);
      CHECK(a.at(1, 2), 0.0);
      a.at(0, 0) = 1; a.at(0, 1) = 2; a.at(0, 2) = 3;
      a.at(1, 0) = 4; a.at(1, 1) = 5; a.at(1, 2) = 6;
      Matrix b{3, 2};
      b.at(0, 0) = 7;  b.at(0, 1) = 8;
      b.at(1, 0) = 9;  b.at(1, 1) = 10;
      b.at(2, 0) = 11; b.at(2, 1) = 12;
      Matrix p = a * b;
      CHECK(p.rows(), 2);
      CHECK(p.cols(), 2);
      CHECK(p.at(0, 0), 58.0);
      CHECK(p.at(0, 1), 64.0);
      CHECK(p.at(1, 0), 139.0);
      CHECK(p.at(1, 1), 154.0);
      Matrix i = Matrix::identity(3);
      CHECK(i.at(1, 1), 1.0);
      CHECK(i.at(0, 2), 0.0);
      Matrix same = a * i;
      CHECK(same.at(1, 2), 6.0);
      const Matrix& view = p;
      CHECK(view.at(1, 0), 139.0);
    hints:
      - "Constructor: `: rows_{rows}, cols_{cols}, data_(rows * cols, 0.0)` — parentheses, to get the size!"
      - "`at` returns `data_[r * cols_ + c]` — the non-const version returns a reference so it can be assigned."
      - "Multiplication is a triple loop over r, c and k."
    solution: |
      #include <vector>

      class Matrix {
      public:
          Matrix(int rows, int cols)
              : rows_{rows}, cols_{cols}, data_(static_cast<std::size_t>(rows * cols), 0.0) {}

          int rows() const { return rows_; }
          int cols() const { return cols_; }

          double& at(int r, int c) { return data_[static_cast<std::size_t>(r * cols_ + c)]; }
          double at(int r, int c) const { return data_[static_cast<std::size_t>(r * cols_ + c)]; }

          static Matrix identity(int n) {
              Matrix m{n, n};
              for (int i{0}; i < n; ++i) {
                  m.at(i, i) = 1.0;
              }
              return m;
          }

      private:
          int rows_{0};
          int cols_{0};
          std::vector<double> data_{};
      };

      Matrix operator*(const Matrix& a, const Matrix& b) {
          Matrix result{a.rows(), b.cols()};
          for (int r{0}; r < a.rows(); ++r) {
              for (int c{0}; c < b.cols(); ++c) {
                  double sum{0.0};
                  for (int k{0}; k < a.cols(); ++k) {
                      sum += a.at(r, k) * b.at(k, c);
                  }
                  result.at(r, c) = sum;
              }
          }
          return result;
      }
    explain: |
      Two overloads of `at` — one `const` returning a value, one non-const
      returning a reference — is the standard way to give read access to
      const objects and write access to others. Storing a grid in one flat
      vector is faster than a vector of vectors: one allocation, and the
      elements sit next to each other in memory.

  - type: challenge
    id: c11-ch-inventory
    title: Inventory manager
    difficulty: 3
    tags: [classes, design, parsing]
    prompt: |
      Write a program around a class `Inventory` that processes commands, one
      per line:

      - `add NAME QTY` — add stock (a new item starts at 0).
      - `remove NAME QTY` — remove stock; if there isn't enough (or no such item), print `Not enough NAME` and change nothing.
      - `count NAME` — print `NAME: QTY` (0 for unknown items).
      - `report` — print every item with quantity > 0 as `NAME QTY`, in the order the items were first added, then a line `Total: N` with the sum of all quantities.

      For example:

      ```text
      add apple 5
      add pear 2
      remove apple 3
      remove pear 5
      count apple
      report
      ```

      prints

      ```text
      Not enough pear
      apple: 2
      apple 2
      pear 2
      Total: 4
      ```
    starter: |
      #include <iostream>
      #include <string>
      #include <vector>

      class Inventory {
      public:

      private:
      };

      int main() {

          return 0;
      }
    tests:
      - in: |
          add apple 5
          add pear 2
          remove apple 3
          remove pear 5
          count apple
          report
        out: |
          Not enough pear
          apple: 2
          apple 2
          pear 2
          Total: 4
      - in: |
          count ghost
          remove ghost 1
          add x 1
          remove x 1
          report
        out: |
          ghost: 0
          Not enough ghost
          Total: 0
      - in: |
          add a 1
          add b 2
          add a 10
          report
        out: |
          a 11
          b 2
          Total: 13
    hints:
      - "Inside `Inventory`, keep a `std::vector<Item>` where `struct Item { std::string name; int qty; };` — a private helper `Item* find(const std::string&)` returns the item or `nullptr`."
      - "Public operations: `void add(name, qty)`, `bool remove(name, qty)`, `int count(name) const`, `void report(std::ostream&) const`."
      - "`main` reads a command word with `>>`, then the arguments it needs."
    solution: |
      #include <iostream>
      #include <string>
      #include <vector>

      class Inventory {
      public:
          void add(const std::string& name, int qty) {
              Item* item = find(name);
              if (item == nullptr) {
                  items_.push_back({name, 0});
                  item = &items_.back();
              }
              item->qty += qty;
          }

          bool remove(const std::string& name, int qty) {
              Item* item = find(name);
              if (item == nullptr || item->qty < qty) {
                  return false;
              }
              item->qty -= qty;
              return true;
          }

          int count(const std::string& name) const {
              for (const auto& item : items_) {
                  if (item.name == name) {
                      return item.qty;
                  }
              }
              return 0;
          }

          void report(std::ostream& out) const {
              int total{0};
              for (const auto& item : items_) {
                  if (item.qty > 0) {
                      out << item.name << ' ' << item.qty << '\n';
                      total += item.qty;
                  }
              }
              out << "Total: " << total << '\n';
          }

      private:
          struct Item {
              std::string name;
              int qty;
          };

          Item* find(const std::string& name) {
              for (auto& item : items_) {
                  if (item.name == name) {
                      return &item;
                  }
              }
              return nullptr;
          }

          std::vector<Item> items_{};
      };

      int main() {
          Inventory inv{};
          std::string command{};
          while (std::cin >> command) {
              if (command == "add") {
                  std::string name{};
                  int qty{};
                  std::cin >> name >> qty;
                  inv.add(name, qty);
              } else if (command == "remove") {
                  std::string name{};
                  int qty{};
                  std::cin >> name >> qty;
                  if (!inv.remove(name, qty)) {
                      std::cout << "Not enough " << name << '\n';
                  }
              } else if (command == "count") {
                  std::string name{};
                  std::cin >> name;
                  std::cout << name << ": " << inv.count(name) << '\n';
              } else if (command == "report") {
                  inv.report(std::cout);
              }
          }
          return 0;
      }
    explain: |
      `Item` is a **nested** struct — private to `Inventory`, because nobody
      else needs it. `report` takes any `std::ostream&`, so it can print to
      `std::cout`, a string stream or (Chapter 17) a file: design for reuse
      costs nothing here.

  - type: review
    id: c11-review
    title: "Chapter 11 review"
    body: |
      ## Cheat sheet

      ```cpp static
      class Account {
      public:
          Account() = default;
          explicit Account(double initial) : balance_{initial < 0 ? 0 : initial} {}
          ~Account() = default;

          bool withdraw(double amount);        // modifies
          double balance() const;              // doesn't modify
          Account& add(double x) { ...; return *this; }   // chainable

          static int count();                  // belongs to the class
          friend std::ostream& operator<<(std::ostream&, const Account&);

      private:
          double balance_{0.0};
          static inline int count_{0};
      };

      Vec2& operator+=(const Vec2&);  Vec2 operator+(Vec2, const Vec2&);
      bool operator==(const T&, const T&);  bool operator<(const T&, const T&);
      std::ostream& operator<<(std::ostream& out, const T& x) { ...; return out; }

      T(const T&) = delete;  T& operator=(const T&) = delete;   // no copies
      ```

      ## Key ideas

      - Encapsulation: private data, a public interface of meaningful operations.
      - An **invariant** is always true: constructors establish it, member functions preserve it.
      - Initialise members in the initialiser list, in declaration order.
      - `const` member functions for everything that doesn't modify.
      - Destructors run automatically, in reverse order, however a scope is left — the basis of **RAII**.
      - A class that owns a raw resource must not be copied naively.
      - Overload operators only where the meaning is obvious; build `+` on `+=`.
    questions:
      - type: output
        prompt: "Interleaving: classes, vectors and loops."
        code: |
          #include <iostream>
          #include <vector>

          class Bag {
          public:
              void add(int w) {
                  if (total_ + w <= limit_) {
                      items_.push_back(w);
                      total_ += w;
                  }
              }
              int count() const { return static_cast<int>(items_.size()); }
              int total() const { return total_; }
          private:
              std::vector<int> items_{};
              int total_{0};
              int limit_{10};
          };

          int main() {
              Bag b{};
              for (int w : {4, 5, 3, 1}) {
                  b.add(w);
              }
              std::cout << b.count() << ' ' << b.total() << '\n';
              return 0;
          }
        answer: |
          3 10
        why: "4 and 5 fit (9); 3 would make 12 (rejected); 1 fits (10)."
      - type: mcq
        prompt: "Which member function should NOT be `const`?"
        options:
          - "`double area() const`"
          - "`void resize(double factor)`"
          - "`std::string name() const`"
          - "`bool isEmpty() const`"
        answer: 1
        why: "`resize` changes the object."
      - type: output
        code: |
          #include <iostream>

          class T {
          public:
              explicit T(int n) : n_{n} { std::cout << "c" << n_; }
              ~T() { std::cout << "d" << n_; }
          private:
              int n_;
          };

          T make(int n) {
              return T{n};
          }

          int main() {
              T a = make(1);
              {
                  T b{2};
              }
              std::cout << '\n';
              return 0;
          }
        answer: |
          c1c2d2
          d1
        why: "`make` builds the object directly in `a` (guaranteed copy elision); b is created and destroyed in the inner block; a is destroyed when main ends — after the newline, so `d1` lands on the second line."

