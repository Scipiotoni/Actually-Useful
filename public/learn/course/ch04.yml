      - in: "60 1.5 1"
        out: "Shipping: 9.98"
      - in: "20 12.2 0"
        out: "Shipping: 12.49"
      - in: "80 40 0"
        out: Too heavy
      - in: "100 10 0"
        out: "Shipping: 0.00"
        hidden: true
      - in: "100 11 0"
        out: "Shipping: 9.49"
        hidden: true
      - in: "5 2 1"
        out: "Shipping: 9.98"
        hidden: true
    hints:
      - Deal with `Too heavy` first and stop there.
      - "Extra kilograms over 10, rounded up: `std::ceil(weight - 10)`."
      - Compute the base cost, then set it to 0 if free shipping applies, then double it if express.
    solution: |
      #include <cmath>
      #include <iomanip>
      #include <iostream>

      int main() {
          double total{};
          double weight{};
          bool express{};
          std::cin >> total >> weight >> express;

          if (weight > 30) {
              std::cout << "Too heavy\n";
              return 0;
          }

          double cost{};
          if (weight <= 2) {
              cost = 4.99;
          } else if (weight <= 10) {
              cost = 7.99;
          } else {
              cost = 7.99 + 1.50 * std::ceil(weight - 10);
          }

          bool freeShipping = total >= 50 && !express && weight <= 10;
          if (freeShipping) {
              cost = 0;
          }
          if (express) {
              cost *= 2;
          }

          std::cout << std::fixed << std::setprecision(2) << "Shipping: " << cost << '\n';
          return 0;
      }
    explain: |
      Real-world rules are rarely one neat condition. The trick is to handle
      them in a clear order, one rule per step, and name the tricky ones
      (`freeShipping`). Note the early `return 0;` for the `Too heavy` case:
      once there's nothing more to do, leaving `main` is the simplest code.

  - type: review
    id: c4-review
    title: "Chapter 4 review"
    body: |
      ## Cheat sheet

      ```cpp static
      if (a > b) {
          // ...
      } else if (a == b) {
          // ...
      } else {
          // ...
      }

      switch (ch) {
      case 'a':
      case 'A':
          // ...
          break;
      default:
          // ...
      }

      int biggest = (a > b) ? a : b;

      if (x >= 1 && x <= 10) { }       // in range
      if (x < 1 || x > 10) { }         // out of range
      if (n != 0 && total / n > 5) { } // short-circuit guard
      if (std::cin >> n) { }           // read succeeded
      if (std::abs(a - b) < 1e-9) { }  // doubles "equal"
      ```

      ## Key ideas

      - Comparisons produce `bool`. `==` compares; `=` assigns.
      - An `if`/`else if`/`else` chain runs the **first** true branch only — order matters.
      - Variables declared in a block die at its `}` (scope).
      - `&&` needs both, `||` needs one, `!` flips. `&&` binds tighter than `||`.
      - Short-circuit evaluation lets the left side guard the right.
      - `switch` jumps to a matching `case` and runs until `break`. Integer-like values only.
      - Always use braces. Watch for `=` vs `==`, stray `;`, and `1 <= x <= 10`.
      - Never trust input: check that reads succeed and values make sense.
    questions:
      - type: output
        prompt: "Mixing chapters. Input: `7 2`"
        code: |
          #include <iostream>

          int main() {
              int a{};
              int b{};
              std::cin >> a >> b;
              double r = (b != 0) ? static_cast<double>(a) / b : 0.0;
              std::cout << (r > 3 ? "big " : "small ") << r << '\n';
              return 0;
          }
        stdin: "7 2"
        answer: |
          big 3.5
        why: "b isn't 0, so r = 7.0 / 2 = 3.5, which is > 3."
      - type: output
        code: |
          #include <iostream>
          #include <string>

          int main() {
              std::string w{"level"};
              char first = 'l';
              if (w.length() > 4 && first == 'l') {
                  std::cout << "yes " << w.length() % 3 << '\n';
              } else {
                  std::cout << "no\n";
              }
              return 0;
          }
        answer: |
          yes 2
        why: "Both conditions hold (5 > 4, and first is 'l'); 5 % 3 = 2."
