id: ch04
number: 4
part: p1
title: Making Decisions
blurb: Programs that choose — comparisons, if and else, logic, switch, and the traps that catch everyone.
hours: 4.5
goals:
  - Compare values with `== != < > <= >=` and predict the `bool` result
  - Write `if`, `else if` and `else` chains that choose exactly one path
  - Combine conditions with `&&`, `||` and `!`, including range checks
  - Use `switch` to choose between many fixed values
  - Use the conditional operator `?:` for simple choices
  - Spot the classic bugs — `=` for `==`, a stray `;`, missing braces
  - Detect invalid input and react to it

items:
  - type: lesson
    id: c4-compare
    title: Comparisons
    minutes: 16
    objectives:
      - Use the six comparison operators
      - Predict the `bool` result of a comparison
      - Compare strings, and doubles safely
    body: |
      Decisions start with questions: *Is the score above 100? Is the
      password right? Is the list empty?* In C++ you ask them with
      **comparison operators**, and the answer is a `bool`: `true` or `false`.

      | Operator | Asks | `5 ? 3` |
      |---|---|---|
      | `==` | equal to? | `false` |
      | `!=` | not equal to? | `true` |
      | `<` | less than? | `false` |
      | `>` | greater than? | `true` |
      | `<=` | less than or equal? | `false` |
      | `>=` | greater than or equal? | `true` |

      ```cpp
      #include <iostream>

      int main() {
          int age{16};
          std::cout << std::boolalpha;
          std::cout << (age >= 18) << '\n';
          std::cout << (age == 16) << '\n';
          std::cout << (age != 16) << '\n';

          bool isTeen = age >= 13 && age <= 19;   // more on && soon
          std::cout << isTeen << '\n';
          return 0;
      }
      ```

      ```output
      false
      true
      false
      true
      ```

      (The parentheses around the comparisons are needed when printing,
      because `<<` binds more tightly than `>=`.)

      > [!mistake] `=` versus `==`
      > `=` **assigns**; `==` **compares**. Mixing them up is one of the most
      > common bugs in C-family languages, and the next lessons show why
      > it's so sneaky.

      {{check compare}}

      ## Comparing strings

      `==` and `!=` work on `std::string` as you'd hope: same characters in the
      same order. `<` and `>` compare alphabetically — character by character,
      using the character codes. That means **uppercase comes before
      lowercase** (`'Z'` is 90, `'a'` is 97):

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string a{"apple"};
          std::string b{"banana"};
          std::cout << std::boolalpha;
          std::cout << (a < b) << '\n';
          std::cout << (a == "apple") << '\n';
          std::cout << (std::string{"Zebra"} < "apple") << '\n';
          return 0;
      }
      ```

      ```output
      true
      true
      true
      ```

      ## Comparing doubles

      Remember that doubles carry tiny rounding errors. So this is `false`:

      ```cpp
      #include <iostream>

      int main() {
          std::cout << std::boolalpha << (0.1 + 0.2 == 0.3) << '\n';
          return 0;
      }
      ```

      ```output
      false
      ```

      Instead of testing *equal*, test *close enough*: is the difference
      smaller than a tiny tolerance?

      ```cpp
      #include <cmath>
      #include <iostream>

      int main() {
          double x{0.1 + 0.2};
          constexpr double tolerance{1e-9};
          std::cout << std::boolalpha << (std::abs(x - 0.3) < tolerance) << '\n';
          return 0;
      }
      ```

      ```output
      true
      ```

      {{check strings}}
    checks:
      - id: compare
        type: output
        code: |
          #include <iostream>

          int main() {
              int a{7};
              int b{10};
              std::cout << (a < b) << (a == b) << (b - a >= 3) << '\n';
              return 0;
          }
        answer: |
          101
        why: "Without `boolalpha`, true prints as 1 and false as 0: 7 < 10 is true, 7 == 10 is false, 3 >= 3 is true."
      - id: strings
        type: mcq
        prompt: "Which of these is `true`?"
        options:
          - "`std::string{\"cat\"} == \"Cat\"`"
          - "`std::string{\"cat\"} < \"dog\"`"
          - "`std::string{\"b\"} < \"a\"`"
          - "`std::string{\"apple\"} > \"apples\"`"
        answer: 1
        why: "Comparison is character by character: 'c' < 'd'. \"cat\" ≠ \"Cat\" (case matters), 'b' > 'a', and \"apple\" is a prefix of \"apples\", so it is smaller."
    cards:
      - front: What are the six comparison operators?
        back: "`==` equal, `!=` not equal, `<`, `>`, `<=`, `>=`. Each gives a `bool`."
      - front: What's the difference between `=` and `==`?
        back: "`=` assigns a value; `==` compares two values and gives `true` or `false`."
      - front: How do you check whether two doubles are "equal"?
        back: "Check whether they're close: `std::abs(a - b) < tolerance`, with a small tolerance like `1e-9`."
      - front: "Is `\"Zebra\" < \"apple\"` for std::string?"
        back: "Yes — comparison uses character codes, and all uppercase letters (65–90) come before lowercase ones (97–122)."

  - type: lesson
    id: c4-if
    title: if and else
    minutes: 20
    objectives:
      - Run code only when a condition is true with `if`
      - Choose between two paths with `if` / `else`
      - Explain the scope of a variable declared inside a block
    body: |
      An **`if` statement** runs a block of code only when a condition is
      true:

      ```cpp
      #include <iostream>

      int main() {
          int temperature{};
          std::cin >> temperature;

          if (temperature > 30) {
              std::cout << "It's hot! Drink water.\n";
          }
          std::cout << "Have a nice day.\n";
          return 0;
      }
      ```

      ```stdin
      35
      ```

      ```output
      It's hot! Drink water.
      Have a nice day.
      ```

      The condition goes in **parentheses**; the code to run goes in a block
      `{ }`. If the condition is false, the whole block is skipped and the
      program carries on after it. Edit the input to `20` and run it again.

      ## `else`: the other path

      Add `else` to run something when the condition is **false**. Exactly one
      of the two blocks runs — never both, never neither.

      ```cpp
      #include <iostream>

      int main() {
          int number{};
          std::cin >> number;

          if (number % 2 == 0) {
              std::cout << number << " is even\n";
          } else {
              std::cout << number << " is odd\n";
          }
          return 0;
      }
      ```

      ```stdin
      7
      ```

      ```output
      7 is odd
      ```

      > [!tip] Always use braces
      > C++ lets you leave out `{ }` when a branch is a single statement. Don't.
      > Sooner or later someone adds a second line, indents it to look like
      > it's inside — and it isn't. Braces every time; it's one of the
      > cheapest bug-preventers there is.

      {{check if-else}}

      ## Scope: variables live inside their block

      A variable declared **inside** a block exists only until that block's
      closing `}`. That region is called its **scope**.

      ```cpp error
      #include <iostream>

      int main() {
          int age{20};
          if (age >= 18) {
              int yearsAdult = age - 18;
              std::cout << "Adult for " << yearsAdult << " years\n";
          }
          std::cout << yearsAdult << '\n';   // error: out of scope
          return 0;
      }
      ```

      If you need a value after the `if`, declare the variable **before** it:

      ```cpp
      #include <iostream>

      int main() {
          int price{50};
          bool member{true};

          int toPay{price};          // declared outside, so it's visible after
          if (member) {
              toPay = price * 9 / 10;
          }
          std::cout << "To pay: " << toPay << '\n';
          return 0;
      }
      ```

      ```output
      To pay: 45
      ```

      Notice `if (member)`: a `bool` is already a condition, so you don't need
      `member == true`.

      {{check scope}}

      {{task abs}}
    checks:
      - id: if-else
        type: output
        prompt: The Input box contains `-3`. What is printed?
        code: |
          #include <iostream>

          int main() {
              int x{};
              std::cin >> x;
              if (x > 0) {
                  std::cout << "positive ";
              } else {
                  std::cout << "not positive ";
              }
              std::cout << "done\n";
              return 0;
          }
        stdin: "-3"
        answer: |
          not positive done
        why: "−3 > 0 is false, so the `else` block runs. `done` is after the if/else, so it always prints."
      - id: scope
        type: mcq
        prompt: "Why doesn't this compile?"
        code: |
          #include <iostream>

          int main() {
              int score{80};
              if (score > 50) {
                  int bonus{10};
              }
              std::cout << score + bonus << '\n';
              return 0;
          }
        compiles: error
        options:
          - "`bonus` is uninitialised"
          - "`bonus` only exists inside the `if` block"
          - "`score + bonus` is too big"
          - You can't declare variables inside `if`
        answer: 1
        why: "`bonus` is declared inside the block, so its scope ends at that block's `}`. Declare it before the `if` to use it after."
    tasks:
      - id: abs
        title: Distance from zero
        prompt: |
          Read a whole number and print its distance from zero — without using
          `std::abs`. For input `-12` print `12`; for `5` print `5`.
        starter: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;

              return 0;
          }
        tests:
          - in: "-12"
            out: "12"
          - in: "5"
            out: "5"
          - in: "0"
            out: "0"
            hidden: true
        hints:
          - "If `n` is negative, make it positive: `n = -n;`"
        solution: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              if (n < 0) {
                  n = -n;
              }
              std::cout << n << '\n';
              return 0;
          }
    cards:
      - front: What does `if (condition) { ... } else { ... }` guarantee?
        back: Exactly one of the two blocks runs — the first if the condition is true, the second otherwise.
      - front: What is the **scope** of a variable declared inside `{ }`?
        back: From its declaration to the closing `}` of that block. After that, it doesn't exist.
      - front: Why always use braces with `if`, even for one statement?
        back: So a line added later can't silently end up outside the `if` while looking as if it's inside.

  - type: lesson
    id: c4-elseif
    title: Choosing among many with else if
    minutes: 18
    objectives:
      - Write an `if` / `else if` / `else` chain that picks one of several paths
      - Order the conditions of a chain correctly
      - Nest one `if` inside another when a decision depends on a previous one
    body: |
      When there are more than two possibilities, chain them with
      **`else if`**. C++ tests the conditions **top to bottom** and runs the
      **first** branch whose condition is true — then skips the rest. The
      final `else` catches everything else.

      ```cpp
      #include <iostream>

      int main() {
          int score{};
          std::cin >> score;

          if (score >= 90) {
              std::cout << "A\n";
          } else if (score >= 80) {
              std::cout << "B\n";
          } else if (score >= 70) {
              std::cout << "C\n";
          } else if (score >= 60) {
              std::cout << "D\n";
          } else {
              std::cout << "F\n";
          }
          return 0;
      }
      ```

      ```stdin
      84
      ```

      ```output
      B
      ```

      Trace it with 84: `84 >= 90`? No. `84 >= 80`? Yes → print `B`, and the
      rest of the chain is skipped. That's why the second condition doesn't
      need to say `score >= 80 && score < 90`: by the time we get there, we
      already know it's below 90.

      ## Order matters

      Put the same conditions in the wrong order and the program breaks
      without any error:

      ```cpp
      #include <iostream>

      int main() {
          int score{95};
          if (score >= 60) {
              std::cout << "D\n";
          } else if (score >= 90) {
              std::cout << "A\n";   // never reached for 95!
          }
          return 0;
      }
      ```

      ```output
      D
      ```

      A 95 is also `>= 60`, so the first branch wins. In a chain, put the
      **most specific** (or highest) conditions first.

      {{check chain}}

      ## Nested ifs

      An `if` can sit inside another. Use it when the second question only
      makes sense after the first:

      ```cpp
      #include <iostream>

      int main() {
          int age{};
          bool hasTicket{};
          std::cin >> age >> hasTicket;

          if (hasTicket) {
              if (age >= 12) {
                  std::cout << "Enjoy the film!\n";
              } else {
                  std::cout << "You need an adult with you.\n";
              }
          } else {
              std::cout << "Please buy a ticket first.\n";
          }
          return 0;
      }
      ```

      ```stdin
      10 1
      ```

      ```output
      You need an adult with you.
      ```

      (Reading a `bool` with `>>` expects `1` or `0`.)

      Deep nesting gets hard to read quickly. If you find yourself three
      levels deep, a chain or combined conditions (next lesson) are usually
      clearer.

      {{check nested}}

      {{task sign}}
    checks:
      - id: chain
        type: output
        prompt: The Input box contains `15`. What is printed?
        code: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              if (n % 15 == 0) {
                  std::cout << "FizzBuzz\n";
              } else if (n % 3 == 0) {
                  std::cout << "Fizz\n";
              } else if (n % 5 == 0) {
                  std::cout << "Buzz\n";
              } else {
                  std::cout << n << '\n';
              }
              return 0;
          }
        stdin: "15"
        answer: |
          FizzBuzz
        why: "15 is divisible by 15, so the first branch runs and the rest are skipped — even though 15 is also divisible by 3 and 5."
      - id: nested
        type: mcq
        prompt: "In an `if` / `else if` / `else` chain, how many branches run?"
        options:
          - All branches whose condition is true
          - Exactly one
          - At most one, unless there's no `else`
          - None, unless the first condition is true
        answer: 1
        why: "The first true condition's branch runs and the rest are skipped; if none is true, the `else` runs. With a final `else`, exactly one branch always runs."
    tasks:
      - id: sign
        title: Positive, negative or zero
        prompt: |
          Read a whole number and print `positive`, `negative` or `zero`.
        starter: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;

              return 0;
          }
        tests:
          - in: "42"
            out: positive
          - in: "-7"
            out: negative
          - in: "0"
            out: zero
        hints:
          - "`if (n > 0) { ... } else if (n < 0) { ... } else { ... }`"
        solution: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              if (n > 0) {
                  std::cout << "positive\n";
              } else if (n < 0) {
                  std::cout << "negative\n";
              } else {
                  std::cout << "zero\n";
              }
              return 0;
          }
    cards:
      - front: How does an `if` / `else if` / `else` chain decide what to run?
        back: It tests conditions top to bottom and runs the **first** true branch, skipping all the rest. If none is true, the `else` runs.
      - front: Why does the order of an `else if` chain matter?
        back: Earlier branches win. If a broad condition (`score >= 60`) comes before a narrow one (`score >= 90`), the narrow one is never reached.

  - type: quiz
    id: c4-quiz1
    title: "Quiz: if and else"
    questions:
      - type: output
        prompt: The Input box contains `12`.
        code: |
          #include <iostream>

          int main() {
              int h{};
              std::cin >> h;
              if (h < 12) {
                  std::cout << "Good morning\n";
              } else if (h < 18) {
                  std::cout << "Good afternoon\n";
              } else {
                  std::cout << "Good evening\n";
              }
              return 0;
          }
        stdin: "12"
        answer: |
          Good afternoon
        why: "12 < 12 is false; 12 < 18 is true."
      - type: output
        code: |
          #include <iostream>

          int main() {
              int x{5};
              if (x > 3) {
                  x = x * 2;
              }
              if (x > 8) {
                  x = x + 1;
              }
              std::cout << x << '\n';
              return 0;
          }
        answer: |
          11
        why: "These are two *separate* ifs, not a chain: both are checked. 5 > 3 → x = 10; 10 > 8 → x = 11."
      - type: mcq
        prompt: "What does `if (isReady)` mean when `isReady` is a `bool`?"
        options:
          - It's a compile error; you must write `== true`
          - The same as `if (isReady == true)`
          - It checks whether `isReady` exists
          - It sets `isReady` to true
        answer: 1
        why: A `bool` is already a condition. `== true` is redundant.
      - type: spot
        prompt: This should print `Big` only for numbers over 100, but prints `Big` for 5. Which line is the bug?
        code: |
          #include <iostream>

          int main() {
              int n{5};
              if (n > 100); {
                  std::cout << "Big\n";
              }
              return 0;
          }
        answer: 5
        why: "The `;` right after the condition ends the `if` with an empty statement. The block below is then just a normal block that always runs."
      - type: tf
        prompt: A variable declared inside an `if` block can be used after the block ends.
        answer: false
        why: Its scope ends at the block's closing brace.

  - type: lesson
    id: c4-logic
    title: "Combining conditions: &&, || and !"
    minutes: 20
    objectives:
      - Combine conditions with `&&` (and), `||` (or) and `!` (not)
      - Write a correct range check
      - Use short-circuit evaluation to avoid errors
    body: |
      Real questions often have parts: *is it a weekend **and** sunny?* *Is the
      user an admin **or** the owner?* C++ has three **logical operators**:

      | Operator | Name | True when |
      |---|---|---|
      | `a && b` | and | **both** `a` and `b` are true |
      | `a \|\| b` | or | **at least one** of them is true |
      | `!a` | not | `a` is false |

      ```cpp
      #include <iostream>

      int main() {
          int age{25};
          bool hasLicence{true};
          bool isWeekend{false};

          if (age >= 18 && hasLicence) {
              std::cout << "Can drive\n";
          }
          if (isWeekend || age < 18) {
              std::cout << "No work today\n";
          }
          if (!isWeekend) {
              std::cout << "It's a weekday\n";
          }
          return 0;
      }
      ```

      ```output
      Can drive
      It's a weekday
      ```

      `&&` binds more tightly than `||` (like `*` and `+`), and `!` binds
      tightest of all. When mixing `&&` and `||`, **use parentheses** so the
      meaning is obvious: `(a && b) || c`.

      ## Range checks

      To check that `x` is between 1 and 10, you must write **two**
      comparisons joined by `&&`:

      ```cpp static
      if (x >= 1 && x <= 10) { ... }   // correct
      ```

      > [!mistake] `1 <= x <= 10`
      > This compiles, and it's always true! C++ evaluates it left to right:
      > `1 <= x` is `true` or `false` — that is, `1` or `0` — and both `1 <= 10`
      > and `0 <= 10` are true. Maths notation doesn't work here.

      ```cpp ub
      #include <iostream>

      int main() {
          int x{50};
          if (1 <= x <= 10) {
              std::cout << "Looks in range, but it isn't!\n";
          }
          if (x >= 1 && x <= 10) {
              std::cout << "Really in range\n";
          }
          return 0;
      }
      ```

      ```output
      Looks in range, but it isn't!
      ```

      (Notice the compiler warning when you run it.) And the opposite —
      *outside* the range — is `x < 1 || x > 10`.

      {{check range}}

      ## Short-circuit evaluation

      `&&` and `||` evaluate their left side first, and **only look at the
      right side if they need to**. If the left side of `&&` is false, the
      answer is already false; if the left side of `||` is true, it's already
      true. This lets you guard a risky test:

      ```cpp
      #include <iostream>

      int main() {
          int total{50};
          int count{0};
          if (count != 0 && total / count > 10) {
              std::cout << "High average\n";
          } else {
              std::cout << "No data or low average\n";
          }
          return 0;
      }
      ```

      ```output
      No data or low average
      ```

      Because `count != 0` is false, `total / count` is never evaluated — so
      no division by zero. Swap the two conditions and the program would
      crash.

      > [!deep] De Morgan's laws
      > "Not (A and B)" is the same as "(not A) or (not B)", and "not (A or B)"
      > is "(not A) and (not B)". So `!(x >= 1 && x <= 10)` can be rewritten
      > `x < 1 || x > 10`. Useful for simplifying conditions.

      {{check short}}

      {{check demorgan}}

      {{task leap}}
    checks:
      - id: range
        type: mcq
        prompt: Which condition is true exactly when `h` is a valid hour from 0 to 23?
        options:
          - "`0 <= h <= 23`"
          - "`h >= 0 || h <= 23`"
          - "`h >= 0 && h <= 23`"
          - "`h > 0 && h < 23`"
        answer: 2
        why: "Both limits must hold (`&&`), and both are inclusive. `||` would accept every number; `0 <= h <= 23` is always true."
      - id: short
        type: output
        code: |
          #include <iostream>

          int main() {
              int a{0};
              bool r1 = (a == 0) || (10 / a > 1);
              bool r2 = (a != 0) && (10 / a > 1);
              std::cout << r1 << r2 << '\n';
              return 0;
          }
        answer: |
          10
        why: "In `r1`, `a == 0` is true, so `||` stops: true. In `r2`, `a != 0` is false, so `&&` stops: false. The division by zero is never evaluated."
      - id: demorgan
        type: mcq
        prompt: "Which is the same as `!(rain || cold)`?"
        options:
          - "`!rain || !cold`"
          - "`!rain && !cold`"
          - "`rain && cold`"
          - "`!rain || cold`"
        answer: 1
        why: "\"Not (rain or cold)\" means \"no rain and not cold\" — De Morgan's law."
    tasks:
      - id: leap
        title: Leap year
        prompt: |
          A year is a **leap year** if it's divisible by 4 — except years
          divisible by 100, which aren't — except years divisible by 400,
          which are. Read a year and print `leap` or `common`.

          (2024 → leap, 1900 → common, 2000 → leap, 2023 → common.)
        starter: |
          #include <iostream>

          int main() {
              int year{};
              std::cin >> year;

              return 0;
          }
        tests:
          - in: "2024"
            out: leap
          - in: "1900"
            out: common
          - in: "2000"
            out: leap
          - in: "2023"
            out: common
          - in: "2100"
            out: common
            hidden: true
        hints:
          - "\"Divisible by k\" is `year % k == 0`."
          - "One way: `(year % 4 == 0 && year % 100 != 0) || year % 400 == 0`."
        solution: |
          #include <iostream>

          int main() {
              int year{};
              std::cin >> year;
              bool leap = (year % 4 == 0 && year % 100 != 0) || year % 400 == 0;
              if (leap) {
                  std::cout << "leap\n";
              } else {
                  std::cout << "common\n";
              }
              return 0;
          }
    cards:
      - front: When is `a && b` true? `a || b`? `!a`?
        back: "`a && b`: both true. `a || b`: at least one true. `!a`: `a` is false."
      - front: How do you check that `x` is between 1 and 10 inclusive?
        back: "`x >= 1 && x <= 10` — never `1 <= x <= 10`, which is always true."
      - front: What is **short-circuit evaluation**?
        back: "`&&` skips its right side if the left is false; `||` skips it if the left is true. Useful as a guard: `n != 0 && total / n > 5`."
      - front: "Which binds tighter: `&&` or `||`?"
        back: "`&&` (like `*` over `+`). Use parentheses when mixing them."

  - type: lesson
    id: c4-switch
    title: switch
    minutes: 16
    objectives:
      - Choose between many fixed values with `switch`
      - Use `break` and `default` correctly
      - Group several cases that share code
    body: |
      When you compare **one** value against many **fixed** possibilities, a
      `switch` is often clearer than a long `else if` chain:

      ```cpp
      #include <iostream>

      int main() {
          int day{};
          std::cin >> day;

          switch (day) {
          case 1:
              std::cout << "Monday\n";
              break;
          case 2:
              std::cout << "Tuesday\n";
              break;
          case 3:
              std::cout << "Wednesday\n";
              break;
          case 6:
          case 7:
              std::cout << "Weekend!\n";
              break;
          default:
              std::cout << "Some other day\n";
              break;
          }
          return 0;
      }
      ```

      ```stdin
      7
      ```

      ```output
      Weekend!
      ```

      How it works:

      - The value in `switch ( )` is compared with each `case`. Execution **jumps** to the matching case.
      - It then runs **until a `break`**, which leaves the switch.
      - `default:` runs if no case matches (like a final `else`).
      - Several `case` labels in a row share the same code — that's how 6 and 7 both print *Weekend!*.

      > [!mistake] Forgetting `break`
      > Without `break`, execution **falls through** into the next case's code
      > — and the next, until a `break` or the end. Run this with 2:
      >
      > ```cpp static
      > case 1: std::cout << "one ";
      > case 2: std::cout << "two ";
      > case 3: std::cout << "three ";
      > ```
      >
      > It prints `two three`. Compilers warn about this; if you really want it,
      > write `[[fallthrough]];` to say so.

      ## What can you switch on?

      Only **integer-like** values: `int`, `char`, `bool`, and enumerations
      (Chapter 9) — each `case` being a constant. You **can't** switch on a
      `std::string` or a `double`; use `if` / `else if` for those.

      ```cpp
      #include <iostream>

      int main() {
          char answer{};
          std::cin >> answer;
          switch (answer) {
          case 'y':
          case 'Y':
              std::cout << "Great!\n";
              break;
          case 'n':
          case 'N':
              std::cout << "Maybe next time.\n";
              break;
          default:
              std::cout << "Please answer y or n.\n";
          }
          return 0;
      }
      ```

      ```stdin
      N
      ```

      ```output
      Maybe next time.
      ```

      {{check fall}}

      {{task menu}}
    checks:
      - id: fall
        type: output
        prompt: What does this print? (Look carefully for `break`s.)
        code: |
          #include <iostream>

          int main() {
              int level{2};
              switch (level) {
              case 1:
                  std::cout << "easy ";
                  break;
              case 2:
                  std::cout << "medium ";
                  [[fallthrough]];
              case 3:
                  std::cout << "hard ";
                  break;
              default:
                  std::cout << "unknown ";
              }
              std::cout << '\n';
              return 0;
          }
        answer: |
          medium hard
        why: "Execution jumps to `case 2`, prints `medium`, then falls through (no `break`) into `case 3`, prints `hard`, and stops at that `break`."
      - id: switch-string
