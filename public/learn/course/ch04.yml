  - type: challenge
    id: c4-ch-clock
    title: 24-hour to 12-hour clock
    difficulty: 2
    tags: [if, formatting]
    prompt: |
      Read a time in 24-hour format as two whole numbers, hours and minutes
      (e.g. `13 5`). Print it in 12-hour format with `AM`/`PM`, minutes always
      as two digits:

      | Input | Output |
      |---|---|
      | `13 5` | `1:05 PM` |
      | `0 30` | `12:30 AM` |
      | `12 0` | `12:00 PM` |
      | `9 45` | `9:45 AM` |

      If the hours aren't 0–23 or the minutes 0–59, print `Invalid time`.
    starter: |
      #include <iomanip>
      #include <iostream>

      int main() {
          int h{};
          int m{};
          std::cin >> h >> m;

          return 0;
      }
    tests:
      - in: "13 5"
        out: "1:05 PM"
      - in: "0 30"
        out: "12:30 AM"
      - in: "12 0"
        out: "12:00 PM"
      - in: "9 45"
        out: "9:45 AM"
      - in: "24 0"
        out: Invalid time
      - in: "23 59"
        out: "11:59 PM"
        hidden: true
      - in: "7 60"
        out: Invalid time
        hidden: true
    hints:
      - "AM if `h < 12`, otherwise PM."
      - "The 12-hour number is `h % 12`, except that 0 must become 12."
      - "Two-digit minutes: `std::setfill('0') << std::setw(2) << m`."
    solution: |
      #include <iomanip>
      #include <iostream>

      int main() {
          int h{};
          int m{};
          std::cin >> h >> m;

          if (h < 0 || h > 23 || m < 0 || m > 59) {
              std::cout << "Invalid time\n";
          } else {
              int hour12 = h % 12;
              if (hour12 == 0) {
                  hour12 = 12;
              }
              std::cout << hour12 << ':' << std::setfill('0') << std::setw(2) << m
                        << (h < 12 ? " AM" : " PM") << '\n';
          }
          return 0;
      }

