        back: It leaves the switch. Without it, execution **falls through** into the next case's code.
      - front: What does `default:` do in a `switch`?
        back: It runs when no `case` matches — like a final `else`.
      - front: What types can a `switch` use?
        back: Integer-like types — `int`, `char`, `bool`, enumerations. Not `std::string` or `double`.

  - type: lesson
    id: c4-traps
    title: The conditional operator, bad input and classic traps
    minutes: 20
    objectives:
      - Use `condition ? a : b` for simple choices between two values
      - Detect when `std::cin` failed to read a number
      - Recognise the classic `if` bugs before they bite
    body: |
      ## The conditional operator `?:`

      When you just need to pick one of two **values**, there's a compact
      form: `condition ? valueIfTrue : valueIfFalse`.

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          int items{1};
          std::cout << "You have " << items << (items == 1 ? " item" : " items") << '\n';

          int a{8};
          int b{3};
          int larger = (a > b) ? a : b;
          std::cout << larger << '\n';
          return 0;
      }
      ```

      ```output
      You have 1 item
      8
      ```

      It's an *expression* — it produces a value — so it can go inside a
      `std::cout` or an initialisation, where an `if` can't. Keep it for
      short, simple choices; for anything bigger, `if` is clearer. And put it
      in parentheses when printing it.

      {{check ternary}}

      ## Reacting to bad input

      If the user types letters when your program reads a number, the read
      **fails**. You can test it — a read used as a condition is true only if
      it succeeded:

      ```cpp
      #include <iostream>

      int main() {
          int age{};
          if (std::cin >> age) {
              std::cout << "You are " << age << '\n';
          } else {
              std::cout << "That's not a number!\n";
          }
          return 0;
      }
      ```

      ```stdin
      twelve
      ```

      ```output
      That's not a number!
      ```

      The other kind of bad input is a number that makes no sense — an age of
      `-5`. That's just an `if`: check the range and report the problem. Good
      programs **never trust input**.

      ## The classic traps

      Every one of these compiles. Learn to see them:

      **1. Assignment instead of comparison**

      ```cpp ub
      #include <iostream>

      int main() {
          int lives{0};
          if (lives = 3) {           // assigns 3, which counts as true!
              std::cout << "Still alive, lives = " << lives << '\n';
          }
          return 0;
      }
      ```

      `lives = 3` stores 3 and produces 3, and any non-zero number counts as
      `true`. The compiler warns — another reason to read warnings.

      **2. A stray semicolon**

      ```cpp static
      if (x > 10);          // the ; is the (empty) body of the if
      {
          std::cout << "Always printed!\n";
      }
      ```

      **3. Missing braces**

      ```cpp static
      if (x > 10)
          std::cout << "Big\n";
          std::cout << "Very big\n";   // NOT part of the if, despite the indent
      ```

      **4. Exact comparison of doubles** — use a tolerance.

      **5. `else if` in the wrong order** — the general case swallows the specific one.

      {{check traps}}

      {{task validate}}
    checks:
      - id: ternary
        type: output
        code: |
          #include <iostream>

          int main() {
              int t{-4};
              std::cout << (t < 0 ? "freezing" : "fine") << ' ' << (t % 2 == 0 ? t / 2 : t) << '\n';
              return 0;
          }
        answer: |
          freezing -2
        why: "−4 < 0, so the first gives `freezing`. −4 is even, so the second gives −4 / 2 = −2."
      - id: traps
        type: output
        warnings: true
        prompt: What does this print? It compiles, with a warning.
        code: |
          #include <iostream>

          int main() {
              int x{2};
              if (x > 5)
                  std::cout << "big ";
                  std::cout << "huge ";
              std::cout << "end\n";
              return 0;
          }
        answer: |
          huge end
        why: "Without braces, only the first statement belongs to the `if`. `huge` is printed regardless of the indentation. Always use braces."
    tasks:
      - id: validate
        title: Validate a percentage
        prompt: |
          Read a whole number. Print:

          - `not a number` if the read fails,
          - `out of range` if it isn't between 0 and 100 (inclusive),
          - otherwise `ok: ` followed by the number and `%`, e.g. `ok: 45%`.
        starter: |
          #include <iostream>

          int main() {
              int value{};

              return 0;
          }
        tests:
          - in: "45"
            out: "ok: 45%"
          - in: "abc"
            out: not a number
          - in: "101"
            out: out of range
          - in: "-1"
            out: out of range
          - in: "0"
            out: "ok: 0%"
            hidden: true
        hints:
          - "`if (!(std::cin >> value))` is true when the read failed."
          - "Then `else if (value < 0 || value > 100)`."
        solution: |
          #include <iostream>

          int main() {
              int value{};
              if (!(std::cin >> value)) {
                  std::cout << "not a number\n";
              } else if (value < 0 || value > 100) {
                  std::cout << "out of range\n";
              } else {
                  std::cout << "ok: " << value << "%\n";
              }
              return 0;
          }
    cards:
      - front: What does `cond ? a : b` produce?
        back: The value `a` if `cond` is true, otherwise `b`. It's an expression, so it can go inside `std::cout` or an initialisation.
      - front: How do you check whether `std::cin >> n` succeeded?
        back: "Use the read as a condition: `if (std::cin >> n) { ok } else { failed }`."
      - front: "Why does `if (x = 5)` always run its block?"
        back: "`x = 5` assigns 5 and produces 5, which is non-zero, so it counts as true. You meant `==`."
      - front: What does a `;` right after `if (...)` do?
        back: It ends the if with an empty statement, so the following block always runs.

  - type: quiz
    id: c4-quiz2
    title: "Quiz: logic and switch"
    questions:
      - type: output
        code: |
          #include <iostream>

          int main() {
              bool a{true};
              bool b{false};
              std::cout << (a && b) << (a || b) << (!a || b) << (!(a && b)) << '\n';
              return 0;
          }
        answer: |
          0101
        why: "true && false = false; true || false = true; false || false = false; !(false) = true."
      - type: mcq
        prompt: Which condition is true when `c` is a lowercase letter?
        options:
          - "`c >= 'a' || c <= 'z'`"
          - "`c >= 'a' && c <= 'z'`"
          - "`'a' <= c <= 'z'`"
          - "`c == 'a' && c == 'z'`"
        answer: 1
        why: "Both limits must hold. `||` would accept everything, and the chained form is always true."
      - type: output
        code: |
          #include <iostream>

          int main() {
              int n{3};
              switch (n) {
              case 1:
                  std::cout << "a";
                  break;
              case 3:
                  std::cout << "b";
                  break;
              case 4:
                  std::cout << "c";
                  break;
              default:
                  std::cout << "d";
              }
              std::cout << '\n';
              return 0;
          }
        answer: |
          b
        why: Execution jumps to `case 3`, prints `b`, and `break` leaves the switch.
      - type: fill
        prompt: Complete it so `status` is `"adult"` for ages 18 and over, otherwise `"minor"`.
        code: |
          std::string status = (age >= 18) ___ "adult" ___ "minor";
        blanks:
          - ['?']
          - [':']
        why: "The conditional operator: `condition ? ifTrue : ifFalse`."
      - type: tf
        prompt: "In `x != 0 && 100 / x > 2`, the division is never done when `x` is 0."
        answer: true
        why: "Short-circuit: `x != 0` is false, so `&&` doesn't evaluate its right side."
      - type: spot
        prompt: Which line makes this program print `Correct!` whatever the guess is?
        code: |
          #include <iostream>

          int main() {
              int secret{7};
              int guess{};
              std::cin >> guess;
              if (guess = secret) {
                  std::cout << "Correct!\n";
              }
              return 0;
          }
        answer: 7
        why: "`guess = secret` assigns 7 (which counts as true). It should be `guess == secret`."

  - type: challenge
    id: c4-ch-grade
    title: Grade calculator
    difficulty: 1
    tags: [if, validation]
    prompt: |
      Read a score. Print `Invalid` if it's not a number or not between 0 and
      100. Otherwise print the grade letter and a message:

      | Score | Output |
      |---|---|
      | 90–100 | `A - Excellent` |
      | 75–89 | `B - Good` |
      | 60–74 | `C - Pass` |
      | 0–59 | `F - Fail` |
    starter: |
      #include <iostream>

      int main() {

          return 0;
      }
    tests:
      - in: "95"
        out: A - Excellent
      - in: "75"
        out: B - Good
      - in: "74"
        out: C - Pass
      - in: "12"
        out: F - Fail
      - in: "101"
        out: Invalid
      - in: "hello"
        out: Invalid
        hidden: true
      - in: "0"
        out: F - Fail
        hidden: true
      - in: "-3"
        out: Invalid
        hidden: true
    hints:
      - Check for invalid input first, then go from the top grade down.
      - "`if (!(std::cin >> score) || score < 0 || score > 100)` handles every invalid case at once."
    solution: |
      #include <iostream>

      int main() {
          int score{};
          if (!(std::cin >> score) || score < 0 || score > 100) {
              std::cout << "Invalid\n";
          } else if (score >= 90) {
              std::cout << "A - Excellent\n";
          } else if (score >= 75) {
              std::cout << "B - Good\n";
          } else if (score >= 60) {
              std::cout << "C - Pass\n";
          } else {
              std::cout << "F - Fail\n";
          }
          return 0;
      }
    explain: |
      Short-circuit evaluation makes the first condition safe: if the read
      fails, the range checks aren't even looked at.

  - type: challenge
    id: c4-ch-triangle
    title: What kind of triangle?
    difficulty: 2
    tags: [logic]
    prompt: |
      Read three side lengths (whole numbers). Three lengths only make a
      triangle if every one is positive and each side is **shorter than the
      sum of the other two**. Print:

      - `not a triangle`, or else
      - `equilateral` (all three equal),
      - `isosceles` (exactly two equal),
      - `scalene` (all different).
    starter: |
      #include <iostream>

      int main() {
          int a{};
          int b{};
          int c{};
          std::cin >> a >> b >> c;

          return 0;
      }
    tests:
      - in: "3 3 3"
        out: equilateral
      - in: "3 4 5"
        out: scalene
      - in: "5 5 8"
        out: isosceles
      - in: "1 2 3"
        out: not a triangle
      - in: "8 5 5"
        out: isosceles
        hidden: true
      - in: "0 4 4"
        out: not a triangle
        hidden: true
      - in: "2 9 3"
        out: not a triangle
        hidden: true
    hints:
      - "Valid: `a > 0 && b > 0 && c > 0 && a < b + c && b < a + c && c < a + b`."
      - "After ruling out non-triangles, check equilateral before isosceles."
      - "Isosceles: `a == b || b == c || a == c`."
    solution: |
      #include <iostream>

      int main() {
          int a{};
          int b{};
          int c{};
          std::cin >> a >> b >> c;

          bool positive = a > 0 && b > 0 && c > 0;
          bool closes = a < b + c && b < a + c && c < a + b;

          if (!positive || !closes) {
              std::cout << "not a triangle\n";
          } else if (a == b && b == c) {
              std::cout << "equilateral\n";
          } else if (a == b || b == c || a == c) {
              std::cout << "isosceles\n";
          } else {
              std::cout << "scalene\n";
          }
          return 0;
      }
    explain: |
      Naming the parts of a complicated condition with `bool` variables
      (`positive`, `closes`) makes the `if` read almost like English.

  - type: challenge
    id: c4-ch-calc
    title: Pocket calculator
    difficulty: 2
    tags: [switch, validation]
    prompt: |
      Read a calculation like `7 * 6`: a number, an operator character and a
      number (decimals allowed). Print the result. Support `+ - * /`.

      - Division by zero prints `Error: division by zero`.
      - Any other operator prints `Error: unknown operator`.

      Results are printed normally with `std::cout` (so `7 / 2` prints `3.5`).
    starter: |
      #include <iostream>

      int main() {
          double a{};
          char op{};
          double b{};
          std::cin >> a >> op >> b;

          return 0;
      }
    tests:
      - in: "7 * 6"
        out: "42"
      - in: "7 / 2"
        out: "3.5"
      - in: "1.5 + 2.25"
        out: "3.75"
      - in: "10 - 25"
        out: "-15"
      - in: "4 / 0"
        out: "Error: division by zero"
      - in: "2 ^ 3"
        out: "Error: unknown operator"
        hidden: true
    hints:
      - "`switch (op)` with `case '+':` etc."
      - "Inside `case '/':`, use an `if` to check `b == 0` before dividing. (Comparing a double with exactly 0 is fine here — it was typed, not calculated.)"
    solution: |
      #include <iostream>

      int main() {
          double a{};
          char op{};
          double b{};
          std::cin >> a >> op >> b;

          switch (op) {
          case '+':
              std::cout << a + b << '\n';
              break;
          case '-':
              std::cout << a - b << '\n';
              break;
          case '*':
              std::cout << a * b << '\n';
              break;
          case '/':
              if (b == 0) {
                  std::cout << "Error: division by zero\n";
              } else {
                  std::cout << a / b << '\n';
              }
              break;
          default:
              std::cout << "Error: unknown operator\n";
              break;
          }
          return 0;
      }

  - type: challenge
    id: c4-ch-rps
    title: Rock, paper, scissors
    difficulty: 1
    tags: [logic]
    prompt: |
      Read two characters — player 1's and player 2's choice: `R` (rock), `P`
      (paper) or `S` (scissors). Rock beats scissors, scissors beat paper,
      paper beats rock. Print `Player 1 wins`, `Player 2 wins` or `Draw`.
