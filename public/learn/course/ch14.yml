      - id: strict
        type: mcq
        prompt: "Why must a sort comparison never use `<=`?"
        options:
          - It's slower
          - "`std::sort` requires a strict ordering where `comp(a, a)` is false; `<=` breaks that and causes undefined behaviour"
          - "`<=` sorts in descending order"
          - It doesn't matter
        answer: 1
        why: "The algorithm relies on \"a comes before b\" never being true for equal elements."
    tasks:
      - id: by-length
        title: Sort words by length, then alphabetically
        prompt: |
          Write `void sortWords(std::vector<std::string>& words)` that sorts
          shortest first, and words of the same length alphabetically.
        starter: |
          #include <algorithm>
          #include <string>
          #include <vector>

          void sortWords(std::vector<std::string>& words) {
          }
        harness: |
          std::vector<std::string> w{"pear", "fig", "banana", "kiwi", "apple", "yam"};
          sortWords(w);
          CHECK(w, (std::vector<std::string>{"fig", "yam", "kiwi", "pear", "apple", "banana"}));
        hints:
          - "`if (a.size() != b.size()) return a.size() < b.size(); return a < b;`"
        solution: |
          #include <algorithm>
          #include <string>
          #include <vector>

          void sortWords(std::vector<std::string>& words) {
              std::sort(words.begin(), words.end(), [](const std::string& a, const std::string& b) {
                  if (a.size() != b.size()) {
                      return a.size() < b.size();
                  }
                  return a < b;
              });
          }
    cards:
      - front: What must a custom sort comparison `comp(a, b)` return?
        back: "`true` if `a` should come before `b`. It must be strict: `comp(a, a)` is false (use `<`/`>`, never `<=`/`>=`)."
      - front: How do you sort by several criteria?
        back: Compare by the first criterion; only if equal, compare by the next — or use `std::tie(...) < std::tie(...)`.
      - front: "`std::sort` vs `std::stable_sort`?"
        back: "`stable_sort` keeps equal elements in their original order; `sort` may reorder them."

  - type: lesson
    id: c14-function
    title: "Functions as values: std::function"
    minutes: 18
    objectives:
      - Store any callable in a `std::function`
      - Write functions that take functions as parameters
      - Return a lambda from a function
    body: |
      Every lambda has its own unique, unnamed type — that's why you store
      them with `auto`. But to keep different lambdas in one vector, or accept
      "any function taking an `int` and returning an `int`" as a parameter, you
      need one type that can hold them all: **`std::function`** from
      `<functional>`.

      ```cpp
      #include <functional>
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::pair<std::string, std::function<int(int, int)>>> ops{
              {"add", [](int a, int b) { return a + b; }},
              {"mul", [](int a, int b) { return a * b; }},
              {"max", [](int a, int b) { return a > b ? a : b; }}
          };
          for (const auto& [name, op] : ops) {
              std::cout << name << "(6, 7) = " << op(6, 7) << '\n';
          }
          return 0;
      }
      ```

      ```output
      add(6, 7) = 13
      mul(6, 7) = 42
      max(6, 7) = 7
      ```

      `std::function<int(int, int)>` reads "a function taking two `int`s and
      returning an `int`". It can hold a lambda, an ordinary function, or any
      object with `operator()`.

      ## Functions that take functions

      A function taking another function as a parameter is called a
      **higher-order function** — like `std::sort` taking a comparison. You
      can write your own:

      ```cpp
      #include <functional>
      #include <iostream>

      int applyTwice(const std::function<int(int)>& f, int x) {
          return f(f(x));
      }

      std::function<int(int)> makeAdder(int n) {
          return [n](int x) { return x + n; };    // captures n by value: safe to return
      }

      int main() {
          auto add5 = makeAdder(5);
          std::cout << applyTwice(add5, 1) << '\n';
          std::cout << applyTwice([](int x) { return x * x; }, 3) << '\n';
          return 0;
      }
      ```

      ```output
      11
      81
      ```

      `makeAdder` builds a new function on demand. Note that it captures `n`
      **by value** — capturing it by reference would leave the returned lambda
      referring to a parameter that no longer exists.

      > [!pro] `std::function` or a template?
      > `std::function` has a small cost (it may allocate and adds an
      > indirection). For performance-critical code, standard algorithms take
      > the callable as a **template** parameter instead — Chapter 16.

      {{check fn-output}}

      {{task compose}}
    checks:
      - id: fn-output
        type: output
        code: |
          #include <functional>
          #include <iostream>
          #include <vector>

          int main() {
              std::vector<std::function<int(int)>> steps{
                  [](int x) { return x + 1; },
                  [](int x) { return x * 10; },
                  [](int x) { return x - 3; }
              };
              int v{2};
              for (const auto& step : steps) {
                  v = step(v);
              }
              std::cout << v << '\n';
              return 0;
          }
        answer: |
          27
        why: "2 + 1 = 3, × 10 = 30, − 3 = 27."
    tasks:
      - id: compose
        title: Compose two functions
        prompt: |
          Write `std::function<int(int)> compose(std::function<int(int)> f, std::function<int(int)> g)`
          returning a function that computes `f(g(x))`.
        starter: |
          #include <functional>

          std::function<int(int)> compose(std::function<int(int)> f, std::function<int(int)> g) {
              return [](int x) { return x; };
          }
        harness: |
          auto inc = [](int x) { return x + 1; };
          auto dbl = [](int x) { return x * 2; };
          CHECK(compose(inc, dbl)(5), 11);
          CHECK(compose(dbl, inc)(5), 12);
          CHECK(compose(inc, inc)(0), 2);
        hints:
          - "Capture both by value: `return [f, g](int x) { return f(g(x)); };`"
        solution: |
          #include <functional>

          std::function<int(int)> compose(std::function<int(int)> f, std::function<int(int)> g) {
              return [f, g](int x) { return f(g(x)); };
          }
    cards:
      - front: What is `std::function<int(int)>`?
        back: A type that can hold any callable taking an `int` and returning an `int` — lambda, function, function object.
      - front: What is a **higher-order function**?
        back: A function that takes a function as a parameter (like `std::sort`'s comparison) or returns one.
      - front: Why capture by value when returning a lambda?
        back: Captured references would refer to locals/parameters that are destroyed when the function returns.

