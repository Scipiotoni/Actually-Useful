  - type: lesson
    id: c14-predicates
    title: Algorithms with predicates
    minutes: 24
    objectives:
      - Count and find by a condition with `count_if` and `find_if`
      - Ask questions about a whole range with `any_of`, `all_of`, `none_of`
      - Change every element with `transform`
      - Remove by condition with the erase–remove idiom
    body: |
      A **predicate** is a function returning `bool` — a yes/no question about
      an element. Many algorithms have an `_if` version that takes one:

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> scores{72, 45, 90, 38, 66, 81};
          auto passed = [](int s) { return s >= 50; };

          std::cout << std::count_if(scores.begin(), scores.end(), passed) << " passed\n";

          auto firstFail = std::find_if(scores.begin(), scores.end(),
                                        [](int s) { return s < 50; });
          std::cout << "first fail: " << *firstFail << '\n';

          std::cout << std::boolalpha
                    << std::any_of(scores.begin(), scores.end(), [](int s) { return s > 85; }) << ' '
                    << std::all_of(scores.begin(), scores.end(), passed) << ' '
                    << std::none_of(scores.begin(), scores.end(), [](int s) { return s < 0; }) << '\n';
          return 0;
      }
      ```

      ```output
      4 passed
      first fail: 45
      true false true
      ```

      ## `transform`: change every element

      `std::transform` applies a function to each element and writes the
      results — back into the same range, or into another one:

      ```cpp
      #include <algorithm>
      #include <cctype>
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<double> prices{10.0, 20.0, 5.0};
          std::transform(prices.begin(), prices.end(), prices.begin(),
                         [](double p) { return p * 1.21; });   // add 21% tax, in place
          std::cout << prices[0] << ' ' << prices[2] << '\n';

          std::string word{"shout"};
          std::transform(word.begin(), word.end(), word.begin(),
                         [](unsigned char c) { return static_cast<char>(std::toupper(c)); });
          std::cout << word << '\n';
          return 0;
      }
      ```

      ```output
      12.1 6.05
      SHOUT
      ```

      ## Removing by condition: erase–remove

      Here's a surprise: `std::remove_if` doesn't actually remove anything. It
      can't change the container's size — it only has iterators. Instead it
      **moves the elements to keep to the front** and returns an iterator to
      the new logical end. Then the container's own `erase` chops off the
      leftovers:

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4, 5, 6, 7, 8};
          auto newEnd = std::remove_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
          v.erase(newEnd, v.end());
          for (int x : v) {
              std::cout << x << ' ';
          }
          std::cout << "(size " << v.size() << ")\n";
          return 0;
      }
      ```

      ```output
      1 3 5 7 (size 4)
      ```

      This **erase–remove idiom** is O(n) — much better than erasing elements
      one by one, which shifts the rest every time. (C++20 wraps it up as
      `std::erase_if(v, predicate)`.) The same works for removing a value:
      `v.erase(std::remove(v.begin(), v.end(), 0), v.end());`.

      {{check pred-output}}

      {{check remove}}

      {{task clean-words}}
    checks:
      - id: pred-output
        type: output
        code: |
          #include <algorithm>
          #include <iostream>
          #include <string>
          #include <vector>

          int main() {
              std::vector<std::string> w{"apple", "kiwi", "banana", "fig"};
              auto longWord = std::find_if(w.begin(), w.end(),
                                           [](const std::string& s) { return s.size() > 4; });
              int shortOnes = static_cast<int>(std::count_if(w.begin(), w.end(),
                                           [](const std::string& s) { return s.size() <= 4; }));
              std::cout << *longWord << ' ' << shortOnes << '\n';
              return 0;
          }
        answer: |
          apple 2
        why: "The first word longer than 4 letters is apple; kiwi and fig have 4 or fewer."
      - id: remove
        type: mcq
        prompt: "After `auto e = std::remove(v.begin(), v.end(), 0);` without calling `erase`, what is `v.size()`?"
        options:
          - Smaller — the zeros are gone
          - Unchanged — remove only moves the kept elements forward and returns the new logical end
          - Zero
          - It depends on the compiler
        answer: 1
        why: "Algorithms can't change a container's size. Follow up with `v.erase(e, v.end())`."
    tasks:
      - id: clean-words
        title: Tidy a word list
        prompt: |
          Write `void tidy(std::vector<std::string>& words)` that, using
          algorithms, removes every empty string and every word that starts
          with `#`, then lower-cases the remaining words.
        starter: |
          #include <algorithm>
          #include <cctype>
          #include <string>
          #include <vector>

          void tidy(std::vector<std::string>& words) {
          }
        harness: |
          std::vector<std::string> w{"Hello", "", "#tag", "World", "#", "OK"};
          tidy(w);
          CHECK(w, (std::vector<std::string>{"hello", "world", "ok"}));
          std::vector<std::string> none{"", "#a"};
          tidy(none);
          CHECK(none.size(), 0);
        hints:
          - "Erase–remove with the predicate `[](const std::string& s) { return s.empty() || s[0] == '#'; }`."
          - "Then, for each word, `std::transform` its characters with `std::tolower`."
        solution: |
          #include <algorithm>
          #include <cctype>
          #include <string>
          #include <vector>

          void tidy(std::vector<std::string>& words) {
              words.erase(std::remove_if(words.begin(), words.end(),
                                         [](const std::string& s) { return s.empty() || s[0] == '#'; }),
                          words.end());
              for (auto& w : words) {
                  std::transform(w.begin(), w.end(), w.begin(),
                                 [](unsigned char c) { return static_cast<char>(std::tolower(c)); });
              }
          }
    cards:
      - front: What is a **predicate**?
        back: A function returning `bool` — a yes/no question about an element, used by `count_if`, `find_if`, `remove_if`, …
      - front: What do `any_of`, `all_of` and `none_of` answer?
        back: Whether the predicate is true for at least one element, for every element, or for no element.
      - front: What is the **erase–remove idiom**?
        back: "`v.erase(std::remove_if(v.begin(), v.end(), pred), v.end());` — remove_if moves kept elements forward; erase trims the rest. O(n)."
      - front: What does `std::transform(b, e, out, f)` do?
        back: Writes `f(x)` for each element x of [b, e) to `out` (which can be `b` itself, to change in place).

  - type: lesson
    id: c14-sorting
    title: Sorting your way
    minutes: 22
    objectives:
      - Sort structs by a member, and by several criteria
      - Use `std::stable_sort` to keep equal elements in order
      - Explain why a comparison must be a strict "less than"
    body: |
      `std::sort` takes an optional third argument: a function `comp(a, b)`
      that returns `true` when **`a` should come before `b`**. With lambdas you
      can sort by anything:

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      struct Player {
          std::string name;
          int score;
      };

      int main() {
          std::vector<Player> table{{"Ada", 90}, {"Bo", 75}, {"Cy", 90}, {"Di", 82}};

          // Highest score first; equal scores in alphabetical order.
          std::sort(table.begin(), table.end(), [](const Player& a, const Player& b) {
              if (a.score != b.score) {
                  return a.score > b.score;
              }
              return a.name < b.name;
          });

          for (const auto& p : table) {
              std::cout << p.name << ' ' << p.score << '\n';
          }
          return 0;
      }
      ```

      ```output
      Ada 90
      Cy 90
      Di 82
      Bo 75
      ```

      The pattern for several criteria: compare by the first; **only if they
      tie**, compare by the next; and so on.

      > [!deep] A neat shortcut: `std::tie`
      > `std::tie(b.score, a.name) < std::tie(a.score, b.name)` compares
      > element by element like a pair — a compact way to write multi-level
      > comparisons (from `<tuple>`). Note the swapped `a`/`b` for the
      > descending score.

      ## The rule: strictly less

      The comparison must behave like `<`, never like `<=`: `comp(a, a)` must
      be `false`. Using `<=` breaks `std::sort`'s assumptions and is undefined
      behaviour — it can even crash. For descending order, use `>`, not `>=`.

      ## Stable sorting

      `std::sort` may reorder elements that compare **equal**. When their
      existing order matters (say, a list already in order of arrival, now
      sorted by priority), use **`std::stable_sort`**, which keeps equal
      elements in their original order:

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> words{"pear", "fig", "kiwi", "plum", "yam", "date"};
          std::stable_sort(words.begin(), words.end(),
                           [](const std::string& a, const std::string& b) { return a.size() < b.size(); });
          for (const auto& w : words) {
              std::cout << w << ' ';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      fig yam pear kiwi plum date
      ```

      Sorted by length — and within each length, still in the original order.

      {{check sort-output}}

      {{task by-length}}
