  - type: challenge
    id: c14-ch-intervals
    title: Merge intervals
    difficulty: 3
    tags: [sorting, algorithms]
    prompt: |
      Given a list of closed intervals `[start, end]`, merge all overlapping
      (or touching) ones. Write
      `std::vector<std::pair<int, int>> merge(std::vector<std::pair<int, int>> intervals)`
      returning the merged intervals sorted by start.

      `{[1,3], [8,10], [2,6], [15,18]}` → `{[1,6], [8,10], [15,18]}`;
      `{[1,4], [4,5]}` → `{[1,5]}`.
    starter: |
      #include <algorithm>
      #include <utility>
      #include <vector>

      std::vector<std::pair<int, int>> merge(std::vector<std::pair<int, int>> intervals) {
          return intervals;
      }
    harness: |
      using I = std::vector<std::pair<int, int>>;
      CHECK(merge(I{{1, 3}, {8, 10}, {2, 6}, {15, 18}}), (I{{1, 6}, {8, 10}, {15, 18}}));
      CHECK(merge(I{{1, 4}, {4, 5}}), (I{{1, 5}}));
      CHECK(merge(I{}), (I{}));
      CHECK(merge(I{{5, 7}, {1, 10}}), (I{{1, 10}}));
      CHECK(merge(I{{1, 2}, {3, 4}}), (I{{1, 2}, {3, 4}}));
    hints:
      - "Sort by start first (pairs already compare by `first`, then `second`)."
      - "Walk the sorted list: if an interval starts at or before the end of the last merged one, extend that end with `std::max`; otherwise start a new merged interval."
    solution: |
      #include <algorithm>
      #include <utility>
      #include <vector>

      std::vector<std::pair<int, int>> merge(std::vector<std::pair<int, int>> intervals) {
          std::sort(intervals.begin(), intervals.end());
          std::vector<std::pair<int, int>> out{};
          for (const auto& [start, end] : intervals) {
              if (!out.empty() && start <= out.back().second) {
                  out.back().second = std::max(out.back().second, end);
              } else {
                  out.push_back({start, end});
              }
          }
          return out;
      }
    explain: |
      Sorting first is the key insight: once intervals are ordered by start,
      any interval that overlaps anything overlaps the **last** merged one.
      Many problems become easy after the right sort — "sort, then sweep" is
      a pattern worth remembering.

  - type: challenge
    id: c14-ch-ranking
    title: Competition ranking
    difficulty: 2
    tags: [sorting, structs]
    prompt: |
      Read lines `NAME SCORE` until the input ends. Print a ranking: highest
      score first, ties in alphabetical order, each line `RANK. NAME SCORE`.
      Players with equal scores share a rank, and the next rank skips
      accordingly ("1, 2, 2, 4" — standard competition ranking).

      For:

      ```text
      Bo 70
      Ada 90
      Cy 70
      Di 50
      ```

      print

      ```text
      1. Ada 90
      2. Bo 70
      2. Cy 70
      4. Di 50
      ```
    starter: |
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {

          return 0;
      }
    tests:
      - in: |
          Bo 70
          Ada 90
          Cy 70
          Di 50
        out: |
          1. Ada 90
          2. Bo 70
          2. Cy 70
          4. Di 50
      - in: |
          A 1
          B 1
          C 1
        out: |
          1. A 1
          1. B 1
          1. C 1
      - in: ""
        out: ""
    hints:
      - "Read into a vector of structs, sort with a two-level comparison."
      - "Walking the sorted list, position `i` (0-based) gets rank `i + 1`, unless its score equals the previous one — then it keeps the previous rank."
    solution: |
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      struct Entry {
          std::string name;
          int score;
      };

      int main() {
          std::vector<Entry> entries{};
          std::string name{};
          int score{};
          while (std::cin >> name >> score) {
              entries.push_back({name, score});
          }
          std::sort(entries.begin(), entries.end(), [](const Entry& a, const Entry& b) {
              if (a.score != b.score) {
                  return a.score > b.score;
              }
              return a.name < b.name;
          });
          int rank{0};
          for (std::size_t i{0}; i < entries.size(); ++i) {
              if (i == 0 || entries[i].score != entries[i - 1].score) {
                  rank = static_cast<int>(i) + 1;
              }
              std::cout << rank << ". " << entries[i].name << ' ' << entries[i].score << '\n';
          }
          return 0;
      }

  - type: challenge
    id: c14-ch-normalise
    title: Normalise to 0–1
    difficulty: 2
    tags: [algorithms, lambdas]
    prompt: |
      Write `std::vector<double> normalise(const std::vector<double>& v)` that
      rescales the values so the smallest becomes 0 and the largest 1
      (`(x - min) / (max - min)`). If all values are equal (or `v` is empty),
      return a vector of zeros of the same size. Use `std::minmax_element`
      (or min/max_element) and `std::transform` — no hand-written loops.
    starter: |
      #include <algorithm>
      #include <vector>

      std::vector<double> normalise(const std::vector<double>& v) {
          return v;
      }
    harness: |
      CHECK(normalise({2, 4, 6}), (std::vector<double>{0, 0.5, 1}));
      CHECK(normalise({5, 5}), (std::vector<double>{0, 0}));
      CHECK(normalise({}), (std::vector<double>{}));
      CHECK(normalise({10, 0, 5}), (std::vector<double>{1, 0, 0.5}));
    hints:
      - "`auto [lo, hi] = std::minmax_element(v.begin(), v.end());` gives two iterators."
      - "`std::transform(v.begin(), v.end(), out.begin(), [min, range](double x) { return (x - min) / range; });` with `out` sized like `v`."
    solution: |
      #include <algorithm>
      #include <vector>

      std::vector<double> normalise(const std::vector<double>& v) {
          std::vector<double> out(v.size(), 0.0);
          if (v.empty()) {
              return out;
          }
          auto [lo, hi] = std::minmax_element(v.begin(), v.end());
          double min = *lo;
          double range = *hi - *lo;
          if (range == 0) {
              return out;
          }
          std::transform(v.begin(), v.end(), out.begin(),
                         [min, range](double x) { return (x - min) / range; });
          return out;
      }

  - type: challenge
    id: c14-ch-pipeline
    title: A function pipeline
    difficulty: 2
    tags: [std::function, lambdas]
    prompt: |
      Write a class `Pipeline` that stores a sequence of steps, each a
      `std::function<double(double)>`:

      - `Pipeline& then(std::function<double(double)> step)` — appends a step and returns `*this` for chaining.
      - `double run(double x) const` — applies every step in order.
      - `int size() const`.
    starter: |
      #include <functional>
      #include <vector>

      class Pipeline {
      public:
          Pipeline& then(std::function<double(double)> step) {
              return *this;
          }

          double run(double x) const {
              return x;
          }

          int size() const {
              return 0;
          }

      private:
          std::vector<std::function<double(double)>> steps_{};
      };
    harness: |
      Pipeline p{};
      p.then([](double x) { return x + 1; })
       .then([](double x) { return x * x; })
       .then([](double x) { return x / 2; });
      CHECK(p.size(), 3);
      CHECK(p.run(3), 8.0);
      CHECK(p.run(-1), 0.0);
      Pipeline empty{};
      CHECK(empty.run(42), 42.0);
      double factor{10};
      Pipeline scale{};
      scale.then([factor](double x) { return x * factor; });
      factor = 0;
      CHECK(scale.run(2), 20.0);
    hints:
      - "`then`: `steps_.push_back(step); return *this;`"
      - "`run`: `for (const auto& s : steps_) x = s(x); return x;`"
    solution: |
      #include <functional>
      #include <vector>

      class Pipeline {
      public:
          Pipeline& then(std::function<double(double)> step) {
              steps_.push_back(std::move(step));
              return *this;
          }

          double run(double x) const {
              for (const auto& step : steps_) {
                  x = step(x);
              }
              return x;
          }

          int size() const {
              return static_cast<int>(steps_.size());
          }

      private:
          std::vector<std::function<double(double)>> steps_{};
      };

  - type: challenge
    id: c14-ch-no-loops
    title: No raw loops
    difficulty: 2
    tags: [algorithms, style]
    prompt: |
      Write these without any `for` or `while` loop — only standard
      algorithms (and lambdas):

      - `int countVowels(const std::string& s)` (a, e, i, o, u, either case)
      - `bool allDigits(const std::string& s)` (true for an empty string)
      - `std::string reversed(std::string s)`
      - `double averageLength(const std::vector<std::string>& words)` (0.0 if empty)
    starter: |
      #include <algorithm>
      #include <cctype>
      #include <numeric>
      #include <string>
      #include <vector>

      int countVowels(const std::string& s) {
          return 0;
      }

      bool allDigits(const std::string& s) {
          return false;
      }

      std::string reversed(std::string s) {
          return s;
      }

      double averageLength(const std::vector<std::string>& words) {
          return 0.0;
      }
    harness: |
      CHECK(countVowels("Programming In C++"), 4);
      CHECK(countVowels(""), 0);
      CHECK(allDigits("2024"), true);
      CHECK(allDigits("20x4"), false);
      CHECK(allDigits(""), true);
      CHECK(reversed("stressed"), "desserts");
      CHECK(averageLength({"a", "bbb"}), 2.0);
      CHECK(averageLength({}), 0.0);
    hints:
      - "`std::count_if` with a lambda that checks `std::string{\"aeiouAEIOU\"}.find(c) != std::string::npos`."
      - "`std::all_of` with `std::isdigit` (cast to `unsigned char`); `std::reverse`; `std::accumulate` with a lambda adding `w.size()` — start at `0.0`."
    solution: |
      #include <algorithm>
      #include <cctype>
      #include <numeric>
      #include <string>
      #include <vector>

      int countVowels(const std::string& s) {
          return static_cast<int>(std::count_if(s.begin(), s.end(), [](char c) {
              return std::string{"aeiouAEIOU"}.find(c) != std::string::npos;
          }));
      }

      bool allDigits(const std::string& s) {
          return std::all_of(s.begin(), s.end(), [](unsigned char c) { return std::isdigit(c) != 0; });
      }

      std::string reversed(std::string s) {
          std::reverse(s.begin(), s.end());
          return s;
      }

      double averageLength(const std::vector<std::string>& words) {
          if (words.empty()) {
              return 0.0;
          }
          double total = std::accumulate(words.begin(), words.end(), 0.0,
                                         [](double sum, const std::string& w) { return sum + static_cast<double>(w.size()); });
          return total / static_cast<double>(words.size());
      }
    explain: |
      "No raw loops" is a well-known guideline (from Sean Parent): an
      algorithm's name says *what* happens, while a loop makes the reader work
      it out. You won't always follow it — but reaching for an algorithm
      first is a good habit.

  - type: review
    id: c14-review
    title: "Chapter 14 review"
    body: |
      ## Cheat sheet

      ```cpp static
      #include <algorithm>
      #include <numeric>
      #include <functional>

      std::sort(v.begin(), v.end());                                // ascending
      std::sort(v.begin(), v.end(), [](auto& a, auto& b) { return a > b; });
      std::stable_sort(...);                                        // keeps ties in order
      std::reverse(b, e);   std::fill(b, e, x);   std::iota(b, e, 0);
      auto it = std::find(b, e, x);      auto it2 = std::find_if(b, e, pred);
      std::count(b, e, x);               std::count_if(b, e, pred);
      std::any_of / all_of / none_of(b, e, pred);
      *std::min_element(b, e);   *std::max_element(b, e);   std::minmax_element(b, e);
      std::accumulate(b, e, 0.0);        std::transform(b, e, out, f);
      v.erase(std::remove_if(v.begin(), v.end(), pred), v.end());   // erase–remove

      auto f = [captured, &byRef](int x) { return x + captured; };
      std::function<int(int)> g = f;
      ```

      ## Key ideas

      - Algorithms take ranges (begin, end) and often return iterators.
      - Lambdas: `[captures](params) { body }`. Copy `[x]` or reference `[&x]`.
      - Predicates answer yes/no; `_if` algorithms use them.
      - `remove`/`remove_if` don't shrink the container — follow with `erase`.
      - Sort comparisons are strict (`<`, `>`), and compare by the next criterion only on ties.
      - `std::function` stores any callable with a given signature.
    questions:
      - type: output
        prompt: "Interleaving: maps, lambdas and algorithms."
        code: |
          #include <algorithm>
          #include <iostream>
          #include <map>
          #include <string>
          #include <vector>

          int main() {
              std::map<std::string, int> stock{{"apple", 3}, {"fig", 0}, {"kiwi", 7}};
              std::vector<std::string> inStock{};
              for (const auto& [name, n] : stock) {
                  if (n > 0) {
                      inStock.push_back(name);
                  }
              }
              std::sort(inStock.begin(), inStock.end(), [&stock](const std::string& a, const std::string& b) {
                  return stock.at(a) > stock.at(b);
              });
              std::cout << inStock[0] << ' ' << inStock.size() << '\n';
              return 0;
          }
        answer: |
          kiwi 2
        why: "fig is out of stock; kiwi (7) sorts before apple (3)."
      - type: mcq
        prompt: "Which removes all zeros from `v` in O(n)?"
        options:
          - "`std::remove(v.begin(), v.end(), 0);`"
          - "`v.erase(std::remove(v.begin(), v.end(), 0), v.end());`"
          - "A loop calling `v.erase(it)` for each zero"
          - "`v.clear();`"
        answer: 1
        why: "The erase–remove idiom."
      - type: output
        code: |
          #include <functional>
          #include <iostream>

          std::function<int()> counter() {
              int count{0};
              return [count]() mutable { return ++count; };
          }

          int main() {
              auto c = counter();
              c();
              c();
              std::cout << c() << '\n';
              return 0;
          }
        answer: |
          3
        why: "The lambda owns its own copy of `count`; `mutable` lets it change that copy between calls."

