      - type: code
        prompt: |
          `struct Book { std::string title; int year; double rating; };`
          Write `std::vector<std::string> bestSince(std::vector<Book> books, int year, int k)`
          returning the titles of the `k` highest-rated books published in
          `year` or later (fewer if there aren't `k`), best first; equal
          ratings in alphabetical order of title.
        starter: |
          #include <algorithm>
          #include <string>
          #include <vector>

          struct Book {
              std::string title;
              int year;
              double rating;
          };

          std::vector<std::string> bestSince(std::vector<Book> books, int year, int k) {
              return {};
          }
        harness: |
          std::vector<Book> b{{"Dune", 1965, 4.5}, {"Hyperion", 1989, 4.3}, {"Anathem", 2008, 4.4},
                              {"Blindsight", 2006, 4.4}, {"Old", 1950, 5.0}};
          CHECK(bestSince(b, 1960, 3), (std::vector<std::string>{"Dune", "Anathem", "Blindsight"}));
          CHECK(bestSince(b, 2000, 5), (std::vector<std::string>{"Anathem", "Blindsight"}));
          CHECK(bestSince(b, 2020, 2), (std::vector<std::string>{}));
        solution: |
          #include <algorithm>
          #include <string>
          #include <vector>

          struct Book {
              std::string title;
              int year;
              double rating;
          };

          std::vector<std::string> bestSince(std::vector<Book> books, int year, int k) {
              books.erase(std::remove_if(books.begin(), books.end(),
                                         [year](const Book& b) { return b.year < year; }),
                          books.end());
              std::sort(books.begin(), books.end(), [](const Book& a, const Book& b) {
                  if (a.rating != b.rating) {
                      return a.rating > b.rating;
                  }
                  return a.title < b.title;
              });
              std::vector<std::string> titles{};
              for (const auto& b : books) {
                  if (static_cast<int>(titles.size()) == k) {
                      break;
                  }
                  titles.push_back(b.title);
              }
              return titles;
          }
