        prompt: |
          Write `std::function<bool(int)> allOf(std::vector<std::function<bool(int)>> tests)`
          returning a predicate that is true only when **every** test passes
          (true if there are no tests).
        starter: |
          #include <functional>
          #include <vector>

          std::function<bool(int)> allOf(std::vector<std::function<bool(int)>> tests) {
              return [](int) { return false; };
          }
        harness: |
          auto positive = [](int x) { return x > 0; };
          auto even = [](int x) { return x % 2 == 0; };
          auto both = allOf({positive, even});
          CHECK(both(4), true);
          CHECK(both(3), false);
          CHECK(both(-2), false);
          CHECK(allOf({})(7), true);
        solution: |
          #include <algorithm>
          #include <functional>
          #include <vector>

          std::function<bool(int)> allOf(std::vector<std::function<bool(int)>> tests) {
              return [tests](int x) {
                  return std::all_of(tests.begin(), tests.end(),
                                     [x](const std::function<bool(int)>& t) { return t(x); });
              };
          }
