id: ch14
number: 14
part: p4
title: Algorithms and Lambdas
blurb: Stop writing the same loops — say what you want done, and let the standard library do it, correctly and fast.
hours: 5
goals:
  - Sort, search, count, reverse and sum ranges with `<algorithm>` and `<numeric>`
  - Write lambdas, and capture variables by value or by reference
  - Use algorithms with predicates — `count_if`, `find_if`, `any_of`, `transform`
  - Remove elements with the erase–remove idiom
  - Sort by any criterion with a custom comparison
  - Pass and store functions with `std::function`

items:
  - type: lesson
    id: c14-algorithms
    title: The algorithm library
    minutes: 22
    objectives:
      - Call standard algorithms on a range given by `begin()` and `end()`
      - Sort, reverse, find, count and find the minimum or maximum
      - Sum a range with `std::accumulate`
    body: |
      You've written loops to sum, search, count and reverse many times. The
      standard library already has all of them — tested, optimised, and with
      names that say what the code does. They live in **`<algorithm>`** (and a
      few in **`<numeric>`**), and they work on **ranges** given as two
      iterators, a begin and an end:

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <numeric>
      #include <vector>

      int main() {
          std::vector<int> v{5, 3, 9, 1, 3, 7};

          std::cout << "sum " << std::accumulate(v.begin(), v.end(), 0) << '\n';
          std::cout << "3 appears " << std::count(v.begin(), v.end(), 3) << " times\n";
          std::cout << "max " << *std::max_element(v.begin(), v.end()) << '\n';

          std::sort(v.begin(), v.end());
          for (int x : v) {
              std::cout << x << ' ';
          }
          std::cout << '\n';

          std::reverse(v.begin(), v.end());
          std::cout << "first after reverse: " << v.front() << '\n';
          return 0;
      }
      ```

      ```output
      sum 28
      3 appears 2 times
      max 9
      1 3 3 5 7 9
      first after reverse: 9
      ```

      Some of the most useful:

      | Algorithm | Does |
      |---|---|
      | `std::sort(b, e)` | sorts ascending — O(n log n) |
      | `std::reverse(b, e)` | reverses in place |
      | `std::find(b, e, x)` | iterator to the first `x`, or `e` |
      | `std::count(b, e, x)` | how many equal `x` |
      | `std::min_element`, `std::max_element` | iterator to the smallest / largest |
      | `std::accumulate(b, e, start)` | `start` plus every element (`<numeric>`) |
      | `std::fill(b, e, x)` | sets every element to `x` |
      | `std::iota(b, e, start)` | fills with start, start+1, … (`<numeric>`) |
      | `std::binary_search(b, e, x)` | is `x` there? — on a **sorted** range, O(log n) |

      ## Results are iterators

      `find`, `min_element` and friends return **iterators**, so you
      dereference them for the value and compare with `end()` for "not
      found". The **position** is the distance from the beginning:

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> names{"Grace", "Ada", "Linus"};
          auto it = std::find(names.begin(), names.end(), "Ada");
          if (it != names.end()) {
              std::cout << "Found at index " << (it - names.begin()) << '\n';
          }
          auto shortest = std::min_element(names.begin(), names.end());
          std::cout << "Alphabetically first: " << *shortest << '\n';
          return 0;
      }
      ```

      ```output
      Found at index 1
      Alphabetically first: Ada
      ```

      > [!tip] Algorithms work on parts of ranges too
      > `std::sort(v.begin(), v.begin() + 3)` sorts only the first three
      > elements. And they work on any container with iterators — strings
      > included: `std::reverse(s.begin(), s.end())` reverses a string.

      > [!warning] `accumulate`'s starting value sets the type
      > `std::accumulate(v.begin(), v.end(), 0)` adds in `int` — for doubles,
      > start with `0.0`, or the fractions are lost at every step.

      {{check algo-output}}

      {{task median}}
    checks:
      - id: algo-output
        type: output
        code: |
          #include <algorithm>
          #include <iostream>
          #include <numeric>
          #include <vector>

          int main() {
              std::vector<int> v(5);
              std::iota(v.begin(), v.end(), 1);
              std::reverse(v.begin(), v.begin() + 3);
              for (int x : v) {
                  std::cout << x;
              }
              std::cout << ' ' << std::accumulate(v.begin(), v.end(), 100) << '\n';
              return 0;
          }
        answer: |
          32145 115
        why: "iota fills 1 2 3 4 5; reversing the first three gives 3 2 1 4 5; the sum starts at 100: 115."
      - id: accumulate-type
        type: mcq
        prompt: "`std::vector<double> v{0.5, 0.5};` What's `std::accumulate(v.begin(), v.end(), 0)`?"
        options:
          - "1.0"
          - "0 — the starting value is an `int`, so each addition is truncated"
          - "1"
          - A compile error
        answer: 1
        why: "The sum is computed in the type of the starting value: 0 + 0.5 → 0, 0 + 0.5 → 0. Use `0.0`."
    tasks:
      - id: median
        title: Median
        prompt: |
          Write `double median(std::vector<double> v)` (it takes a copy, so it
          may sort it): the middle value of the sorted numbers, or the average
          of the two middle ones if the count is even. `v` is never empty.
        starter: |
          #include <algorithm>
          #include <vector>

          double median(std::vector<double> v) {
              return 0.0;
          }
        harness: |
          CHECK(median({3, 1, 2}), 2.0);
          CHECK(median({4, 1, 3, 2}), 2.5);
          CHECK(median({7}), 7.0);
          CHECK(median({5, 5, 1, 9}), 5.0);
        hints:
          - "`std::sort(v.begin(), v.end());` then look at index `n / 2` (and `n / 2 - 1` when `n` is even)."
        solution: |
          #include <algorithm>
          #include <vector>

          double median(std::vector<double> v) {
              std::sort(v.begin(), v.end());
              std::size_t n = v.size();
              if (n % 2 == 1) {
                  return v[n / 2];
              }
              return (v[n / 2 - 1] + v[n / 2]) / 2;
          }
    cards:
      - front: How do you sort a vector `v`?
        back: "`std::sort(v.begin(), v.end());` (from `<algorithm>`) — ascending, O(n log n)."
      - front: What does `std::find` return when the value isn't there?
        back: The end iterator of the range, e.g. `v.end()`.
      - front: How do you get the index from an iterator `it` into a vector `v`?
        back: "`it - v.begin()`."
      - front: Where is `std::accumulate`, and what's the trap?
        back: In `<numeric>`. The sum uses the starting value's type — start with `0.0` for doubles.

  - type: lesson
    id: c14-lambda
    title: Lambdas
    minutes: 22
    objectives:
      - Write a lambda and call it
      - Capture variables by value `[x]` and by reference `[&x]`
      - Pass a lambda to an algorithm
    body: |
      A **lambda** is a small, unnamed function written right where it's
      needed:

      ```cpp
      #include <iostream>

      int main() {
          auto square = [](int x) { return x * x; };
          std::cout << square(5) << '\n';

          auto greet = [](const std::string& name) {
              std::cout << "Hello, " << name << "!\n";
          };
          greet("Ada");
          return 0;
      }
      ```

      ```output
      25
      Hello, Ada!
      ```

      The parts: `[]` the **capture list** (more below), `(int x)` the
      parameters, `{ ... }` the body. The return type is worked out from the
      `return` statement. Stored in an `auto` variable, a lambda is called like
      any function.

      ## Captures

      A lambda's body can't see the local variables around it — unless it
      **captures** them:

      | Capture | Meaning |
      |---|---|
      | `[x]` | a **copy** of `x`, taken when the lambda is created |
      | `[&x]` | a **reference** to `x` — sees and can change the original |
      | `[=]` | copies of everything used |
      | `[&]` | references to everything used |

      ```cpp
      #include <iostream>

      int main() {
          int threshold{10};
          auto isBig = [threshold](int v) { return v > threshold; };

          int calls{0};
          auto counted = [&calls](int v) { ++calls; return v * 2; };

          threshold = 100;   // isBig still has its own copy: 10
          std::cout << isBig(50) << ' ' << counted(1) << counted(2) << ' ' << calls << '\n';
          return 0;
      }
      ```

      ```output
      1 24 2
      ```

      Prefer listing captures explicitly (`[threshold]`, `[&calls]`) — it
      documents what the lambda depends on. And beware: a lambda that captures
      a local **by reference** must not be used after that local is destroyed
      (a dangling reference again).

      ## Where lambdas shine

      Algorithms often take a function that says **how** to do something —
      like a sort order. Before lambdas you had to write a separate named
      function; now you write it in place:

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{5, -9, 2, -1, 7};
          std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });   // descending
          for (int x : v) {
              std::cout << x << ' ';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      7 5 2 -1 -9
      ```

      {{check capture}}

      {{task make-counter}}
    checks:
      - id: capture
        type: output
        code: |
          #include <iostream>

          int main() {
              int a{1};
              int b{1};
              auto f = [a, &b]() { return a + b; };
              a = 10;
              b = 10;
              std::cout << f() << '\n';
              return 0;
          }
        answer: |
          11
        why: "`a` was copied when the lambda was created (1); `b` is captured by reference, so it sees 10."
      - id: lambda-parts
        type: mcq
        prompt: "In `[&total](int x) { total += x; }`, what does `[&total]` mean?"
        options:
          - "`total` is a parameter"
          - "The lambda uses the outer `total` by reference, so it can change it"
          - "The lambda returns `total`"
          - "`total` is copied into the lambda"
        answer: 1
        why: "`&` in the capture list means capture by reference."
    tasks:
      - id: make-counter
        title: Sum with a lambda
        prompt: |
          Write `int sumIf(const std::vector<int>& v, int minimum)` that uses
          **`std::for_each`** with a lambda (capturing a running total by
          reference) to add up the elements that are at least `minimum`.
        starter: |
          #include <algorithm>
          #include <vector>

          int sumIf(const std::vector<int>& v, int minimum) {
              int total{0};

              return total;
          }
        harness: |
          CHECK(sumIf({1, 5, 10, 3}, 4), 15);
          CHECK(sumIf({}, 0), 0);
          CHECK(sumIf({-2, -1}, -1), -1);
        hints:
          - "`std::for_each(v.begin(), v.end(), [&total, minimum](int x) { ... });`"
        solution: |
          #include <algorithm>
          #include <vector>

          int sumIf(const std::vector<int>& v, int minimum) {
              int total{0};
              std::for_each(v.begin(), v.end(), [&total, minimum](int x) {
                  if (x >= minimum) {
                      total += x;
                  }
              });
              return total;
          }
    cards:
      - front: What is a **lambda**?
        back: "An unnamed function written in place: `[captures](params) { body }`."
      - front: "`[x]` vs `[&x]` in a lambda?"
        back: "`[x]` copies x when the lambda is created; `[&x]` refers to the original x (sees later changes, can modify it)."
      - front: How do you sort a vector in descending order with a lambda?
        back: "`std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });`"

