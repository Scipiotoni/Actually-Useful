              return false;
          }
        harness: |
          CHECK(isIsomorphic("egg", "add"), true);
          CHECK(isIsomorphic("foo", "bar"), false);
          CHECK(isIsomorphic("paper", "title"), true);
          CHECK(isIsomorphic("ab", "aa"), false);
          CHECK(isIsomorphic("", ""), true);
          CHECK(isIsomorphic("abc", "ab"), false);
        solution: |
          #include <string>
          #include <unordered_map>

          bool isIsomorphic(const std::string& a, const std::string& b) {
              if (a.size() != b.size()) {
                  return false;
              }
              std::unordered_map<char, char> forward{};
              std::unordered_map<char, char> backward{};
              for (std::size_t i{0}; i < a.size(); ++i) {
                  auto f = forward.find(a[i]);
                  auto g = backward.find(b[i]);
                  if (f != forward.end() && f->second != b[i]) {
                      return false;
                  }
                  if (g != backward.end() && g->second != a[i]) {
                      return false;
                  }
                  forward[a[i]] = b[i];
                  backward[b[i]] = a[i];
              }
              return true;
          }
