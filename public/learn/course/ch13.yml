      - type: mcq
        prompt: How do you check whether a `std::map` contains a key without inserting it?
        options:
          - "`if (m[key])`"
          - "`if (m.find(key) != m.end())` or `if (m.count(key))`"
          - "`if (m.at(key))`"
          - "`if (key in m)`"
