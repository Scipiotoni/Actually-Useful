id: ch13
number: 13
part: p4
title: The Standard Library Containers
blurb: The data structures every C++ programmer reaches for — maps, sets, stacks, queues — and how to choose between them.
hours: 6
goals:
  - Choose a container by what the program needs to do quickly
  - Store and look up values by key with `std::map` and `std::unordered_map`
  - Keep unique values with `std::set` and `std::unordered_set`
  - Use iterators to walk and modify containers, including erasing while iterating
  - Use `std::stack`, `std::queue`, `std::deque` and `std::priority_queue`
  - Describe how long common operations take with Big-O notation

items:
  - type: lesson
    id: c13-choose
    title: A map of the containers
    minutes: 18
    objectives:
      - Name the main standard containers and what each is good at
      - Read simple Big-O notation — O(1), O(log n), O(n)
      - Default to `std::vector`, and know when not to
    body: |
      You've used `std::vector`, `std::array` and `std::string`. The standard
      library has more **containers**, each organised differently so that
      *some* operation is fast. Choosing well can turn a program that takes
      an hour into one that takes a second.

      ## Measuring "fast": Big-O

      Programmers describe how an operation's time **grows** with the number
      of elements `n` using **Big-O** notation:

      | Notation | Name | Meaning | Example |
      |---|---|---|---|
      | O(1) | constant | same time however big `n` is | `v[i]`, `v.push_back(x)` |
      | O(log n) | logarithmic | doubling `n` adds one step | finding a key in a `std::map` |
      | O(n) | linear | time grows with `n` | searching an unsorted vector |
      | O(n²) | quadratic | double `n`, four times the time | comparing every pair |

      For a million elements, O(log n) is about 20 steps, O(n) a million, and
      O(n²) a trillion. That's the difference that matters.

      ## The main containers

      | Container | Organised as | Fast at |
      |---|---|---|
      | `std::vector` | contiguous array | index access, adding/removing at the end |
      | `std::deque` | chunks | adding/removing at **both** ends |
      | `std::map` | sorted tree of key → value | lookup by key, O(log n); keeps keys **in order** |
      | `std::unordered_map` | hash table of key → value | lookup by key, O(1) on average; no order |
      | `std::set` / `std::unordered_set` | like the maps, keys only | "is this in the set?" |
      | `std::stack`, `std::queue`, `std::priority_queue` | adapters on top of the others | last-in-first-out, first-in-first-out, "biggest first" |

      > [!remember] The default
      > **Use `std::vector` unless you have a reason not to.** It's the
      > fastest container for most tasks in practice, because its elements sit
      > next to each other in memory. Reach for a map or set when you need to
      > **look things up by key** or **check membership** often.

      {{check bigo}}

      {{check choose}}
    checks:
      - id: bigo
        type: mcq
        prompt: An operation is O(n). How does its time change when the container grows from 1,000 to 1,000,000 elements?
        options:
          - It stays the same
          - About 1,000 times longer
          - About 10 steps longer
          - About a million times longer
        answer: 1
        why: "Linear: 1000 times the elements, 1000 times the time."
      - id: choose
        type: mcq
        prompt: "A program must repeatedly look up a user's score by username. Best container?"
        options:
          - "`std::vector<std::pair<std::string, int>>`, searched each time"
          - "`std::unordered_map<std::string, int>` (or `std::map`)"
          - "`std::stack<int>`"
          - "`std::array<int, 100>`"
        answer: 1
        why: "Lookups by key are what maps are for: O(1) average or O(log n) instead of O(n) per search."
    cards:
      - front: What does O(1), O(log n), O(n), O(n²) mean?
        back: "How time grows with n: constant, logarithmic (doubling n adds a step), linear, quadratic (doubling n quadruples time)."
      - front: What's the default container in C++?
        back: "`std::vector` — use something else only when you need fast lookup by key, membership tests, or both-end insertion."
      - front: "`std::map` vs `std::unordered_map`?"
        back: "`map` keeps keys sorted, O(log n) lookup; `unordered_map` is a hash table, O(1) average lookup, no order."

  - type: lesson
    id: c13-map
    title: "std::map: look things up by key"
    minutes: 26
    objectives:
      - Insert, read and update entries in a `std::map`
      - Check whether a key exists without creating it
      - Loop over a map in key order with structured bindings
      - Count occurrences with a map
    body: |
      A **map** stores **key → value** pairs, like a dictionary: look up a
      word (the key) to find its definition (the value). Each key appears at
      most once.

      ```cpp
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, int> ages{};
          ages["Ada"] = 36;
          ages["Alan"] = 41;
          ages["Grace"] = 85;
          ages["Ada"] = 37;          // same key: updates the value

          std::cout << ages["Grace"] << '\n';
          std::cout << ages.size() << " people\n";

          for (const auto& [name, age] : ages) {
              std::cout << name << ": " << age << '\n';
          }
          return 0;
      }
      ```

      ```output
      85
      3 people
      Ada: 37
      Alan: 41
      Grace: 85
      ```

      - `std::map<std::string, int>` — keys are strings, values are ints (from `<map>`).
      - `ages["Ada"] = 36;` inserts the key, or updates it if it's already there.
      - A range-based loop visits the entries **sorted by key**. Each element is a `std::pair<const Key, Value>` — structured bindings unpack it.

      ## The `[]` trap

      Reading with `m[key]` when the key **isn't there** doesn't fail — it
      **inserts** the key with a default value (0 for an int, "" for a
      string):

      ```cpp
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, int> stock{{"apple", 5}};
          std::cout << stock["banana"] << '\n';   // inserts banana -> 0!
          std::cout << stock.size() << '\n';
          return 0;
      }
      ```

      ```output
      0
      2
      ```

      To **check** for a key without inserting it, use `find` (which returns
      an iterator — the next lesson explains them — equal to `end()` if the key
      is missing) or `count` (0 or 1). And `.at(key)` reads without inserting,
      throwing an exception if the key is missing:

      ```cpp
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, std::string> capitals{{"France", "Paris"}, {"Japan", "Tokyo"}};

          auto it = capitals.find("Japan");
          if (it != capitals.end()) {
              std::cout << it->first << " -> " << it->second << '\n';
          }
          std::cout << capitals.count("Peru") << '\n';
          std::cout << capitals.at("France") << '\n';

          capitals.erase("France");
          std::cout << capitals.size() << '\n';
          return 0;
      }
      ```

      ```output
      Japan -> Tokyo
      0
      Paris
      1
      ```

      (C++20 adds the friendlier `capitals.contains("Peru")`.)

      ## Counting with a map

      The `[]` behaviour becomes a feature when **counting**: a new key starts
      at 0, so `++counts[x]` just works:

      ```cpp
      #include <iostream>
      #include <map>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream text{"the cat and the hat and the bat"};
          std::map<std::string, int> counts{};
          std::string word{};
          while (text >> word) {
              ++counts[word];
          }
          for (const auto& [w, n] : counts) {
              std::cout << w << ' ' << n << '\n';
          }
          return 0;
      }
      ```

      ```output
      and 2
      bat 1
      cat 1
      hat 1
      the 3
      ```

      Compare that with the O(n²) word counting you wrote in Chapter 8: this
      is O(n log n), and far simpler.

      {{check map-trap}}

      {{check map-output}}

      {{task letters}}
    checks:
      - id: map-trap
        type: output
        code: |
          #include <iostream>
          #include <map>

          int main() {
              std::map<int, int> m{{1, 10}};
              if (m[2] == 0) {
                  m[3] = 30;
              }
              std::cout << m.size() << ' ' << m.count(2) << '\n';
              return 0;
          }
        answer: |
          3 1
        why: "Reading `m[2]` inserted key 2 with value 0, which then triggered inserting key 3."
      - id: map-output
        type: output
        code: |
          #include <iostream>
          #include <map>
          #include <string>

          int main() {
              std::map<std::string, int> m{};
              m["zeta"] = 1;
              m["alpha"] = 2;
              m["mid"] = 3;
              for (const auto& [k, v] : m) {
                  std::cout << k[0] << v;
              }
              std::cout << '\n';
              return 0;
          }
        answer: |
          a2m3z1
        why: "A `std::map` always iterates in sorted key order, whatever the insertion order."
    tasks:
      - id: letters
        title: Letter counts
        prompt: |
          Write `std::map<char, int> letterCounts(const std::string& text)`
          counting each character of `text` except spaces.
        starter: |
          #include <map>
          #include <string>

          std::map<char, int> letterCounts(const std::string& text) {
              return {};
          }
        harness: |
          auto m = letterCounts("hello world");
          CHECK(m['l'], 3);
          CHECK(m['o'], 2);
          CHECK(m['h'], 1);
          CHECK(m.count(' '), 0);
          CHECK(m.size(), 7);
          CHECK(letterCounts("").size(), 0);
        hints:
          - "`for (char c : text) { if (c != ' ') ++counts[c]; }`"
        solution: |
          #include <map>
          #include <string>

          std::map<char, int> letterCounts(const std::string& text) {
              std::map<char, int> counts{};
              for (char c : text) {
                  if (c != ' ') {
                      ++counts[c];
                  }
              }
              return counts;
          }
    cards:
      - front: What does `m[key] = value;` do in a `std::map`?
        back: Inserts the key with that value, or updates the value if the key exists.
      - front: What happens when you *read* `m[key]` for a missing key?
        back: The key is inserted with a default value (0, "", …). Use `find`, `count` or `at` to check without inserting.
      - front: In what order does a range-based loop visit a `std::map`?
        back: Sorted by key.
      - front: How do you count occurrences of things with a map?
        back: "`++counts[x];` — a new key starts at 0."

  - type: lesson
    id: c13-hash
    title: Hash maps and sets
    minutes: 22
    objectives:
      - Use `std::unordered_map` for fast lookups when order doesn't matter
      - Keep unique values with `std::set` and `std::unordered_set`
      - Test membership and remove duplicates
    body: |
      ## `std::unordered_map`

      `std::unordered_map` has almost the same interface as `std::map` —
      `[]`, `find`, `count`, `at`, `erase`, range-based loops — but it's built
      on a **hash table**: each key is turned into a number (its *hash*) that
      says directly where to store it. Lookups are **O(1) on average**. The
      price: iteration order is unpredictable.

      ```cpp
      #include <iostream>
      #include <string>
      #include <unordered_map>

      int main() {
          std::unordered_map<std::string, double> prices{{"tea", 2.5}, {"cake", 3.0}};
          prices["coffee"] = 2.8;
          std::string order{"coffee"};
          if (prices.count(order) > 0) {
              std::cout << order << " costs " << prices[order] << '\n';
          }
          return 0;
      }
      ```

      ```output
      coffee costs 2.8
      ```

      **Which map?** Use `std::unordered_map` for speed; use `std::map` when you
      need the keys in order (printing a sorted report, finding the smallest
      key, ranges of keys).

      ## Sets: unique values

      A **set** is a map with keys but no values: a collection of **unique**
      elements. Inserting something already there does nothing.

      ```cpp
      #include <iostream>
      #include <set>
      #include <vector>

      int main() {
          std::vector<int> rolls{4, 2, 4, 6, 2, 2, 1};
          std::set<int> seen(rolls.begin(), rolls.end());   // all the distinct values
          std::cout << seen.size() << " distinct:";
          for (int x : seen) {
              std::cout << ' ' << x;
          }
          std::cout << '\n';

          seen.insert(3);
          seen.insert(4);      // already there: no effect
          seen.erase(1);
          std::cout << seen.count(3) << seen.count(1) << ' ' << seen.size() << '\n';
          return 0;
      }
      ```

      ```output
      4 distinct: 1 2 4 6
      10 4
      ```

      `std::set` keeps its elements **sorted**; `std::unordered_set` is the
      hash version — faster, unordered. (`seen(rolls.begin(), rolls.end())`
      builds a set from a range — iterators, next lesson.)

      ## "Have I seen this before?"

      Sets make a classic question O(1): *is there a repeat?*

      ```cpp
      #include <iostream>
      #include <unordered_set>
      #include <vector>

      bool hasDuplicate(const std::vector<int>& v) {
          std::unordered_set<int> seen{};
          for (int x : v) {
              if (seen.count(x) > 0) {
                  return true;
              }
              seen.insert(x);
          }
          return false;
      }

      int main() {
          std::cout << hasDuplicate({3, 1, 4, 1, 5}) << hasDuplicate({2, 7, 1, 8}) << '\n';
          return 0;
      }
      ```

      ```output
      10
      ```

      Compare the nested loop you'd write without a set: O(n²) versus O(n).
      For a million numbers, that's the difference between a trillion steps
      and a million.

      > [!deep] `insert` tells you what happened
      > `s.insert(x)` returns a pair whose `.second` is `true` if `x` was
      > actually added. So the loop above can be just
      > `if (!seen.insert(x).second) return true;`.

      {{check set-output}}

      {{task unique-words}}
    checks:
      - id: set-output
        type: output
        code: |
          #include <iostream>
          #include <set>
          #include <string>

          int main() {
              std::set<std::string> s{"pear", "apple", "fig"};
              s.insert("apple");
              s.insert("banana");
              for (const auto& x : s) {
                  std::cout << x[0];
              }
              std::cout << ' ' << s.size() << '\n';
              return 0;
          }
        answer: |
          abfp 4
        why: "Duplicates are ignored, and a `std::set` iterates in sorted order: apple, banana, fig, pear."
      - id: which-set
        type: mcq
        prompt: "You need to print all distinct tags, **alphabetically**. Which container?"
        options:
          - "`std::unordered_set<std::string>`"
          - "`std::set<std::string>`"
          - "`std::vector<std::string>`"
          - "`std::stack<std::string>`"
        answer: 1
        why: "A set removes duplicates, and `std::set` keeps them sorted."
    tasks:
      - id: unique-words
        title: Count distinct words
        prompt: |
          Write `int distinctWords(const std::vector<std::string>& words)`
          returning how many different words there are, ignoring case
          (`"The"` and `"the"` are the same word).
        starter: |
          #include <cctype>
          #include <string>
          #include <unordered_set>
          #include <vector>

          int distinctWords(const std::vector<std::string>& words) {
              return 0;
          }
        harness: |
          CHECK(distinctWords({"The", "cat", "the", "CAT", "dog"}), 3);
          CHECK(distinctWords({}), 0);
          CHECK(distinctWords({"a", "A", "a"}), 1);
        hints:
          - "Lower-case each word, then insert it into an `std::unordered_set<std::string>`. The answer is the set's size."
        solution: |
          #include <cctype>
          #include <string>
          #include <unordered_set>
          #include <vector>

          int distinctWords(const std::vector<std::string>& words) {
              std::unordered_set<std::string> seen{};
              for (std::string w : words) {
                  for (char& c : w) {
                      c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
                  }
                  seen.insert(w);
              }
              return static_cast<int>(seen.size());
          }
    cards:
      - front: How is `std::unordered_map` different from `std::map`?
        back: It's a hash table — O(1) average lookup — but iterates in no particular order. `std::map` is a sorted tree, O(log n).
      - front: What is a **set**?
        back: A collection of unique elements. Inserting an existing element does nothing. `std::set` is sorted; `std::unordered_set` is a faster hash version.
      - front: How do you detect duplicates in O(n)?
        back: Walk the elements, checking and inserting each into an `std::unordered_set`; a hit means a duplicate.

