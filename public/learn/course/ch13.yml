          Write `bool isIsomorphic(const std::string& a, const std::string& b)`:
          two strings are isomorphic if the characters of `a` can be replaced
          to get `b`, with each character always mapping to the same character
          and no two characters mapping to the same one. `"egg"`/`"add"` → true,
