        why: "`[]` inserts; `at` throws if missing. `find`/`count` just check."
      - type: output
        code: |
          #include <iostream>
          #include <set>

          int main() {
              std::set<int> s{};
              for (int x : {5, 3, 5, 9, 3, 1}) {
                  s.insert(x * 2);
              }
              std::cout << s.size() << ' ' << *s.begin() << '\n';
              return 0;
          }
        answer: |
          4 2
        why: "The distinct values are 10, 6, 18, 2; `*s.begin()` is the smallest, 2."
      - type: tf
        prompt: "An `std::unordered_map` always iterates its keys in the order they were inserted."
        answer: false
        why: "Its order is unspecified (it depends on hashing). Neither map keeps insertion order."

  - type: lesson
    id: c13-iterators
    title: Iterators
    minutes: 24
    objectives:
      - Walk a container with `begin()`, `end()`, `*it` and `++it`
      - Use iterators returned by `find`
      - Erase elements while iterating, correctly
    body: |
      How can one range-based `for` loop work on vectors, maps, sets and
      strings, which are organised completely differently? Through
      **iterators**: objects that point at an element of a container and know
      how to move to the next one. They generalise the pointers you used to
      walk arrays in Chapter 10.

      Every container has:

      - `begin()` — an iterator to the first element,
      - `end()` — an iterator **one past** the last element (not an element! never dereference it),
      - and iterators support `*it` (the element), `it->member`, `++it` (move on), `==`/`!=`.

      ```cpp
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{10, 20, 30};
          for (auto it = v.begin(); it != v.end(); ++it) {
              *it += 1;
              std::cout << *it << ' ';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      11 21 31
      ```

      This is exactly what a range-based `for` does behind the scenes. (The
      type of `it` is `std::vector<int>::iterator` — which is why everyone
      writes `auto`.)

      ## Iterators as positions

      Many operations take or return iterators. `find` returns an iterator to
      what it found, or `end()`. `erase` removes the element an iterator
      points at. `insert` puts something before an iterator. Vectors can also
      jump: `v.begin() + 2` is the third element.

      ```cpp
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<char> letters{'a', 'b', 'd'};
          letters.insert(letters.begin() + 2, 'c');   // before 'd'
          letters.erase(letters.begin());              // remove 'a'
          for (char c : letters) {
              std::cout << c;
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      bcd
      ```

      ## Erasing while iterating

      Erasing an element **invalidates** the iterator pointing at it — you
      can't `++` it any more. `erase` returns an iterator to the element
      **after** the one removed; use it:

      ```cpp
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, int> stock{{"apple", 0}, {"pear", 4}, {"plum", 0}, {"fig", 2}};
          for (auto it = stock.begin(); it != stock.end(); ) {
              if (it->second == 0) {
                  it = stock.erase(it);   // continue from the next element
              } else {
                  ++it;
              }
          }
          for (const auto& [name, n] : stock) {
              std::cout << name << ' ' << n << '\n';
          }
          return 0;
      }
      ```

      ```output
      fig 2
      pear 4
      ```

      Notice the loop has **no** `++it` in its header: each iteration either
      erases (and gets the next iterator from `erase`) or moves on.

      > [!warning] Invalidation
      > Changing a container can invalidate iterators (and pointers and
      > references) into it. For a vector, `push_back` may invalidate **all** of
      > them (Chapter 10.6), and `erase` those at and after the erased element.
      > Maps and sets only invalidate iterators to erased elements.

      {{check iter-output}}

      {{task remove-odd}}
    checks:
      - id: iter-output
        type: output
        code: |
          #include <iostream>
          #include <vector>

          int main() {
              std::vector<int> v{1, 2, 3, 4, 5};
              auto it = v.begin();
              ++it;
              *it = 20;
              it += 2;
              std::cout << *it << ' ' << v[1] << ' ' << (v.end() - v.begin()) << '\n';
              return 0;
          }
        answer: |
          4 20 5
        why: "`it` moves to index 1 (changed to 20), then two more to index 3 (4). The distance from begin to end is the size, 5."
      - id: end-deref
        type: tf
        prompt: "`*v.end()` gives the last element of a vector."
        answer: false
        why: "`end()` is one past the last element; dereferencing it is undefined behaviour. The last element is `*(v.end() - 1)` or `v.back()`."
    tasks:
      - id: remove-odd
        title: Remove the odd numbers
        prompt: |
          Write `void removeOdd(std::vector<int>& v)` that erases every odd
          number from `v` in place, using iterators and `erase`.
        starter: |
          #include <vector>

          void removeOdd(std::vector<int>& v) {
          }
        harness: |
          std::vector<int> a{1, 2, 3, 4, 5, 6};
          removeOdd(a);
          CHECK(a, (std::vector<int>{2, 4, 6}));
          std::vector<int> b{1, 3, 5};
          removeOdd(b);
          CHECK(b, (std::vector<int>{}));
          std::vector<int> c{-3, -2, 0};
          removeOdd(c);
          CHECK(c, (std::vector<int>{-2, 0}));
        hints:
          - "`for (auto it = v.begin(); it != v.end(); ) { if (*it % 2 != 0) it = v.erase(it); else ++it; }`"
        solution: |
          #include <vector>

          void removeOdd(std::vector<int>& v) {
              for (auto it = v.begin(); it != v.end(); ) {
                  if (*it % 2 != 0) {
                      it = v.erase(it);
                  } else {
                      ++it;
                  }
              }
          }
        explain: |
          Each `erase` in a vector shifts everything after it, so this is O(n²)
          in the worst case. Chapter 14 shows the O(n) "erase-remove" idiom.
    cards:
      - front: What is an **iterator**?
        back: An object that points at an element of a container and can move to the next (`++it`); `*it` is the element.
      - front: What is `end()`?
        back: An iterator one past the last element — a stopping marker. Never dereference it.
      - front: How do you erase elements while iterating?
        back: "`it = c.erase(it);` when erasing, `++it` otherwise — no `++it` in the loop header."
      - front: What does it mean for an iterator to be **invalidated**?
        back: A change to the container made it unusable (e.g. its element was erased, or the vector reallocated).

  - type: lesson
    id: c13-adapters
    title: Stacks, queues and priority queues
    minutes: 24
    objectives:
      - Use `std::stack` for last-in-first-out processing
      - Use `std::queue` and `std::deque` for first-in-first-out processing
      - Use `std::priority_queue` to always take the biggest (or smallest) element
    body: |
      Three **container adapters** restrict a container to one very useful
      way of working. Fewer operations means fewer ways to misuse them, and
      code that says exactly what it does.

      ## `std::stack`: last in, first out

      Like a pile of plates: you only touch the top.

      ```cpp
      #include <iostream>
      #include <stack>
      #include <string>

      int main() {
          std::stack<std::string> history{};
          history.push("home");
          history.push("news");
          history.push("article");
          std::cout << "Current: " << history.top() << '\n';
          history.pop();                     // the Back button
          std::cout << "Back to: " << history.top() << '\n';
          std::cout << history.size() << " pages\n";
          return 0;
      }
      ```

      ```output
      Current: article
      Back to: news
      2 pages
      ```

      `push` adds on top, `top` reads it, `pop` removes it (and returns
      nothing — read `top` first). Stacks are everywhere: undo history, the
      call stack itself, checking that brackets match, evaluating expressions.

      ## `std::queue`: first in, first out

      Like a queue at a shop: join at the back, leave from the front.

      ```cpp
      #include <iostream>
      #include <queue>
      #include <string>

      int main() {
          std::queue<std::string> line{};
          line.push("Ada");
          line.push("Alan");
          line.push("Grace");
          while (!line.empty()) {
              std::cout << "Serving " << line.front() << '\n';
              line.pop();
          }
          return 0;
      }
      ```

      ```output
      Serving Ada
      Serving Alan
      Serving Grace
      ```

      Queues model anything processed in arrival order: print jobs, messages,
      and the *breadth-first search* you'll meet in Chapter 18.
      **`std::deque`** ("deck", double-ended queue) is the container underneath:
      it adds and removes at both ends quickly, and you can use it directly
      (`push_front`, `push_back`, `pop_front`, `pop_back`, `[]`).

      ## `std::priority_queue`: biggest first

      A priority queue always hands you the **largest** element, however they
      were added:

      ```cpp
      #include <functional>
      #include <iostream>
      #include <queue>
      #include <vector>

      int main() {
          std::priority_queue<int> urgent{};
          for (int p : {3, 9, 1, 7}) {
              urgent.push(p);
          }
          while (!urgent.empty()) {
              std::cout << urgent.top() << ' ';
              urgent.pop();
          }
          std::cout << '\n';

          // Smallest first: give it a "greater than" comparison.
          std::priority_queue<int, std::vector<int>, std::greater<int>> small{};
          for (int p : {3, 9, 1, 7}) {
              small.push(p);
          }
          std::cout << small.top() << '\n';
          return 0;
      }
      ```

      ```output
      9 7 3 1
      1
      ```

      Push and pop are O(log n). It's the tool for scheduling ("run the most
      important task next"), keeping the top *k* of a stream, and shortest
      paths (Dijkstra's algorithm).

      {{check stack-output}}

      {{task brackets}}
    checks:
      - id: stack-output
        type: output
        code: |
          #include <iostream>
          #include <queue>
          #include <stack>

          int main() {
              std::stack<int> s{};
              std::queue<int> q{};
              for (int i{1}; i <= 3; ++i) {
                  s.push(i);
                  q.push(i);
              }
              std::cout << s.top() << q.front() << ' ';
              s.pop();
              q.pop();
              std::cout << s.top() << q.front() << '\n';
              return 0;
          }
        answer: |
          31 22
        why: "The stack's top is the last pushed (3, then 2); the queue's front is the first pushed (1, then 2)."
      - id: which-adapter
        type: mcq
        prompt: "A printer handles jobs in the order they arrive. Which adapter models it?"
        options:
          - "`std::stack`"
          - "`std::queue`"
          - "`std::priority_queue`"
          - "`std::set`"
        answer: 1
        why: "First come, first served — first in, first out."
    tasks:
      - id: brackets
        title: Balanced brackets
        prompt: |
          Write `bool balanced(const std::string& s)` that returns `true` if
          every `(`, `[` and `{` is closed by the matching bracket in the right
          order. Other characters are ignored. `"a(b[c]{d})"` is balanced;
          `"(]"` and `"(("` are not.
        starter: |
          #include <stack>
          #include <string>

          bool balanced(const std::string& s) {
              return false;
          }
        harness: |
          CHECK(balanced("a(b[c]{d})"), true);
          CHECK(balanced(""), true);
          CHECK(balanced("(]"), false);
          CHECK(balanced("(("), false);
          CHECK(balanced("())"), false);
          CHECK(balanced("{[()()]}"), true);
          CHECK(balanced("([)]"), false);
        hints:
          - "Push every opening bracket. On a closing bracket, the stack must be non-empty and its top must be the matching opener — then pop."
          - "At the end, the stack must be empty."
        solution: |
          #include <stack>
          #include <string>

          bool balanced(const std::string& s) {
              std::stack<char> open{};
              for (char c : s) {
                  if (c == '(' || c == '[' || c == '{') {
                      open.push(c);
                  } else if (c == ')' || c == ']' || c == '}') {
                      char want = c == ')' ? '(' : c == ']' ? '[' : '{';
                      if (open.empty() || open.top() != want) {
                          return false;
                      }
                      open.pop();
                  }
              }
              return open.empty();
          }
        explain: |
          The most recently opened bracket must be the first to close — "last
          in, first out" — which is exactly a stack. Your compiler does this
          check every time it reports `expected '}' at end of input`.
    cards:
      - front: "`std::stack` operations?"
        back: "`push` (onto the top), `top` (read the top), `pop` (remove the top, returns nothing), `empty`, `size`. Last in, first out."
      - front: "`std::queue` operations?"
        back: "`push` (at the back), `front` (read the front), `pop` (remove the front), `empty`, `size`. First in, first out."
      - front: What does `std::priority_queue` do?
        back: Always gives the largest element at `top()` (O(log n) push/pop). Use `std::greater<T>` for smallest-first.

  - type: quiz
    id: c13-quiz2
    title: "Quiz: iterators and adapters"
    questions:
      - type: output
        code: |
          #include <iostream>
          #include <queue>

          int main() {
              std::priority_queue<int> pq{};
              for (int x : {4, 8, 1, 8, 3}) {
                  pq.push(x);
              }
              pq.pop();
              std::cout << pq.top() << ' ' << pq.size() << '\n';
              return 0;
          }
        answer: |
          8 4
        why: "The first 8 is popped; the other 8 is now on top. Four elements remain."
      - type: spot
        prompt: This loop is meant to erase every zero, but it's broken. Which line is the problem?
        code: |
          #include <vector>

          void removeZeros(std::vector<int>& v) {
              for (auto it = v.begin(); it != v.end(); ++it) {
                  if (*it == 0) {
                      v.erase(it);
                  }
              }
          }
        answer: 6
        why: "After `erase(it)`, `it` is invalid, yet the loop does `++it`. Use `it = v.erase(it);` and only `++it` when not erasing."
      - type: mcq
        prompt: "Why does `std::stack::pop()` return nothing?"
        options:
          - It's a bug in the standard library
          - So you read the element with `top()` first; pop only removes it
          - It returns the size instead
          - It returns a copy of the element
        answer: 1
        why: "Separating `top` (read) from `pop` (remove) keeps things safe and efficient."
      - type: output
        code: |
          #include <deque>
          #include <iostream>

          int main() {
              std::deque<int> d{};
              d.push_back(2);
              d.push_front(1);
              d.push_back(3);
              d.pop_front();
              std::cout << d.front() << d.back() << d.size() << '\n';
              return 0;
          }
        answer: |
          232
        why: "d goes {2} → {1, 2} → {1, 2, 3} → {2, 3}."

  - type: challenge
    id: c13-ch-frequency
    title: Word frequency report
    difficulty: 1
    tags: [map, text]
    prompt: |
      Read all the words of the input (split on whitespace, compared ignoring
      case, punctuation `.,!?;:` stripped from both ends). Print each distinct
      word and its count, in alphabetical order, as `word: count`.
    starter: |
      #include <iostream>
      #include <map>
      #include <string>

      int main() {

          return 0;
      }
    tests:
      - in: |
          The cat sat. The CAT ran!
        out: |
          cat: 2
          ran: 1
          sat: 1
          the: 2
      - in: ""
        out: ""
      - in: |
          Hello, hello... HELLO?! world
        out: |
          hello: 3
          world: 1
    hints:
      - "Read with `while (std::cin >> word)`, strip punctuation from both ends with `find_first_not_of` / `find_last_not_of`, lower-case, then `++counts[word]` — skipping words that became empty."
    solution: |
      #include <cctype>
      #include <iostream>
      #include <map>
      #include <string>

      std::string clean(const std::string& raw) {
          const std::string punct{".,!?;:"};
          std::size_t first = raw.find_first_not_of(punct);
          if (first == std::string::npos) {
              return "";
          }
          std::size_t last = raw.find_last_not_of(punct);
          std::string word = raw.substr(first, last - first + 1);
          for (char& c : word) {
              c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
          }
          return word;
      }

      int main() {
          std::map<std::string, int> counts{};
          std::string raw{};
          while (std::cin >> raw) {
              std::string word = clean(raw);
              if (!word.empty()) {
                  ++counts[word];
              }
          }
          for (const auto& [word, n] : counts) {
              std::cout << word << ": " << n << '\n';
          }
          return 0;
      }

  - type: challenge
    id: c13-ch-two-sum
    title: Two sum
    difficulty: 2
    tags: [hash map]
    prompt: |
      Write `std::pair<int, int> twoSum(const std::vector<int>& nums, int target)`
      returning the indexes `{i, j}` (with `i < j`) of the **first pair** of
      elements that add up to `target` — "first" meaning the pair whose
      second element comes earliest. Return `{-1, -1}` if there's none.

      Aim for **O(n)**: one pass with an `std::unordered_map` from value to
      index, not a double loop.
    starter: |
      #include <unordered_map>
      #include <utility>
      #include <vector>

      std::pair<int, int> twoSum(const std::vector<int>& nums, int target) {
          return {-1, -1};
      }
    harness: |
      CHECK(twoSum({2, 7, 11, 15}, 9), std::make_pair(0, 1));
      CHECK(twoSum({3, 2, 4}, 6), std::make_pair(1, 2));
      CHECK(twoSum({3, 3}, 6), std::make_pair(0, 1));
      CHECK(twoSum({1, 2, 3}, 100), std::make_pair(-1, -1));
      CHECK(twoSum({5, 1, 4, 1, 5}, 6), std::make_pair(0, 1));
      CHECK(twoSum({}, 0), std::make_pair(-1, -1));
    hints:
      - "For each index `j`, the partner you need is `target - nums[j]`. Have you seen it before? Look it up in the map."
      - "If not, store `nums[j] -> j` — but only if that value isn't already stored, so you keep the earliest index."
    solution: |
      #include <unordered_map>
      #include <utility>
      #include <vector>

      std::pair<int, int> twoSum(const std::vector<int>& nums, int target) {
          std::unordered_map<int, int> indexOf{};
          for (int j{0}; j < static_cast<int>(nums.size()); ++j) {
              auto it = indexOf.find(target - nums[j]);
              if (it != indexOf.end()) {
                  return {it->second, j};
              }
              if (indexOf.count(nums[j]) == 0) {
                  indexOf[nums[j]] = j;
              }
          }
          return {-1, -1};
      }
    explain: |
      The double loop checks every pair: O(n²). The hash map remembers every
      value seen so far, so each lookup is O(1) and the whole thing O(n). Trading
      memory for time like this is one of the most common optimisations there is.

  - type: challenge
    id: c13-ch-first-unique
    title: First unique character
    difficulty: 1
    tags: [map, strings]
    prompt: |
      Write `int firstUnique(const std::string& s)` returning the index of the
      first character that appears exactly once, or `-1`.
      `"leetcode"` → 0, `"loveleetcode"` → 2, `"aabb"` → −1.
    starter: |
      #include <string>
      #include <unordered_map>

      int firstUnique(const std::string& s) {
          return -1;
      }
    harness: |
      CHECK(firstUnique("leetcode"), 0);
      CHECK(firstUnique("loveleetcode"), 2);
      CHECK(firstUnique("aabb"), -1);
      CHECK(firstUnique(""), -1);
      CHECK(firstUnique("z"), 0);
    hints:
      - "Two passes: count every character, then find the first whose count is 1."
    solution: |
      #include <string>
      #include <unordered_map>

      int firstUnique(const std::string& s) {
          std::unordered_map<char, int> counts{};
          for (char c : s) {
              ++counts[c];
          }
          for (std::size_t i{0}; i < s.size(); ++i) {
              if (counts[s[i]] == 1) {
                  return static_cast<int>(i);
              }
          }
          return -1;
      }

  - type: challenge
    id: c13-ch-anagram-groups
    title: Group the anagrams
    difficulty: 3
    tags: [map, strings, sorting]
    prompt: |
      Read words until the input ends. Group words that are anagrams of each
      other (same letters, any order; all input is lower case). Print one
      group per line: its words separated by spaces, in the order they
      appeared. Order the groups by their **key** — the group's letters sorted
      alphabetically. For input `eat tea tan ate nat bat`:

      ```text
      bat
      eat tea ate
      tan nat
      ```

      (keys: `abt`, `aet`, `ant`.)
    starter: |
      #include <iostream>
      #include <map>
      #include <string>
      #include <vector>

      int main() {

          return 0;
      }
    tests:
      - in: "eat tea tan ate nat bat"
        out: |
          bat
          eat tea ate
          tan nat
      - in: "listen silent enlist google"
        out: |
          google
          listen silent enlist
      - in: ""
        out: ""
    hints:
      - "The key of a word is its letters in sorted order. With what you know: count the letters (26 counters) and rebuild a string from the counts — or peek ahead at `std::sort` (Chapter 14)."
      - "`std::map<std::string, std::vector<std::string>> groups;` then `groups[key].push_back(word);` — the map keeps keys sorted for you."
    solution: |
      #include <iostream>
      #include <map>
      #include <string>
      #include <vector>

      std::string keyOf(const std::string& word) {
          std::vector<int> counts(26, 0);
          for (char c : word) {
              ++counts[c - 'a'];
          }
          std::string key{};
          for (int i{0}; i < 26; ++i) {
              key += std::string(counts[i], static_cast<char>('a' + i));
          }
          return key;
      }

      int main() {
          std::map<std::string, std::vector<std::string>> groups{};
          std::string word{};
          while (std::cin >> word) {
              groups[keyOf(word)].push_back(word);
          }
          for (const auto& [key, words] : groups) {
              for (std::size_t i{0}; i < words.size(); ++i) {
                  if (i > 0) {
                      std::cout << ' ';
                  }
                  std::cout << words[i];
              }
              std::cout << '\n';
          }
          return 0;
      }
    explain: |
      A map from a **canonical form** to a list is a powerful pattern: all the
      things that are "the same" in some sense land in one bucket. Here the
      canonical form of a word is its sorted letters.

  - type: challenge
    id: c13-ch-rpn
    title: Reverse Polish calculator
    difficulty: 3
    tags: [stack, parsing]
    prompt: |
      In **Reverse Polish Notation**, operators come after their operands:
      `3 4 +` means 3 + 4, and `5 1 2 + 4 * + 3 -` means 5 + (1 + 2) × 4 − 3
      = 14. No brackets are ever needed. Write
      `long long evalRPN(const std::string& expr)` for integer tokens and the
      operators `+ - * /` (integer division), separated by spaces. The input
      is always valid.
    starter: |
      #include <sstream>
      #include <stack>
      #include <string>

      long long evalRPN(const std::string& expr) {
          return 0;
      }
    harness: |
      CHECK(evalRPN("3 4 +"), 7LL);
      CHECK(evalRPN("5 1 2 + 4 * + 3 -"), 14LL);
      CHECK(evalRPN("2 3 4 * +"), 14LL);
      CHECK(evalRPN("10 3 /"), 3LL);
      CHECK(evalRPN("-7"), -7LL);
      CHECK(evalRPN("4 -2 *"), -8LL);
      CHECK(evalRPN("1000000 1000000 *"), 1000000000000LL);
    hints:
      - "Read tokens with an `std::istringstream`. A number goes on the stack; an operator pops two values, applies itself, and pushes the result."
      - "Careful with order: the first value popped is the **right** operand."
      - "A token is an operator if it's exactly one of `+ - * /` — `-2` is a number."
    solution: |
      #include <sstream>
      #include <stack>
      #include <string>

      long long evalRPN(const std::string& expr) {
          std::stack<long long> values{};
          std::istringstream in{expr};
          std::string token{};
          while (in >> token) {
              if (token == "+" || token == "-" || token == "*" || token == "/") {
                  long long right = values.top();
                  values.pop();
                  long long left = values.top();
                  values.pop();
                  if (token == "+") {
                      values.push(left + right);
                  } else if (token == "-") {
                      values.push(left - right);
                  } else if (token == "*") {
                      values.push(left * right);
                  } else {
                      values.push(left / right);
                  }
              } else {
                  values.push(std::stoll(token));
              }
          }
          return values.top();
      }

  - type: challenge
    id: c13-ch-bank-queue
    title: Bank queue simulation
    difficulty: 2
    tags: [queue, simulation]
    prompt: |
      One cashier serves customers in arrival order. Each input line is a
      customer: `NAME ARRIVAL DURATION` (whole minutes; lines are sorted by
      arrival). The cashier starts serving a customer at their arrival or
      when the previous customer finishes, whichever is later. Print, for
      each customer, `NAME waits W` and finally `Average wait: X` with 2
      decimals.

      For:

      ```text
      Ada 0 5
      Bob 2 3
      Cy 10 1
      ```

      Ada starts at 0 (waits 0, done at 5); Bob starts at 5 (waits 3, done
      at 8); Cy arrives at 10 (waits 0).

      ```text
      Ada waits 0
      Bob waits 3
      Cy waits 0
      Average wait: 1.00
      ```
    starter: |
      #include <iomanip>
      #include <iostream>
      #include <queue>
      #include <string>

      int main() {

          return 0;
      }
    tests:
      - in: |
          Ada 0 5
          Bob 2 3
          Cy 10 1
        out: |
          Ada waits 0
          Bob waits 3
          Cy waits 0
          Average wait: 1.00
      - in: |
          A 0 10
          B 1 10
          C 2 10
        out: |
          A waits 0
          B waits 9
          C waits 18
          Average wait: 9.00
      - in: ""
        out: "Average wait: 0.00"
    hints:
      - "Keep `int clock{0};` — the time the cashier is next free."
      - "For each customer (read into a `std::queue` first, then served from its front): `start = std::max(clock, arrival)`, wait = `start - arrival`, then `clock = start + duration`."
    solution: |
      #include <algorithm>
      #include <iomanip>
      #include <iostream>
      #include <queue>
      #include <string>

      struct Customer {
          std::string name;
          int arrival;
          int duration;
      };

      int main() {
          std::queue<Customer> line{};
          std::string name{};
          int arrival{};
          int duration{};
          while (std::cin >> name >> arrival >> duration) {
              line.push({name, arrival, duration});
          }

          int clock{0};
          int served{0};
          long long totalWait{0};
          while (!line.empty()) {
              Customer c = line.front();
              line.pop();
              int start = std::max(clock, c.arrival);
              int wait = start - c.arrival;
              std::cout << c.name << " waits " << wait << '\n';
              totalWait += wait;
              ++served;
              clock = start + c.duration;
          }
          double average = served == 0 ? 0.0 : static_cast<double>(totalWait) / served;
          std::cout << std::fixed << std::setprecision(2) << "Average wait: " << average << '\n';
          return 0;
      }

  - type: challenge
    id: c13-ch-topk
    title: Top k most frequent
    difficulty: 2
    tags: [map, priority queue]
    prompt: |
      Write `std::vector<int> topK(const std::vector<int>& nums, int k)`
      returning the `k` most frequent values, most frequent first. Break ties
      by the **smaller value** first. `k` is never more than the number of
      distinct values.
    starter: |
      #include <map>
      #include <queue>
      #include <utility>
      #include <vector>

      std::vector<int> topK(const std::vector<int>& nums, int k) {
          return {};
      }
    harness: |
      CHECK(topK({1, 1, 1, 2, 2, 3}, 2), (std::vector<int>{1, 2}));
      CHECK(topK({4, 4, 5, 5, 6}, 2), (std::vector<int>{4, 5}));
      CHECK(topK({7}, 1), (std::vector<int>{7}));
      CHECK(topK({3, 1, 3, 2, 1, 3}, 3), (std::vector<int>{3, 1, 2}));
    hints:
      - "Count with a map, then push `{count, -value}` pairs into a `std::priority_queue<std::pair<int, int>>`: pairs compare by `first`, then `second`, so the highest count wins and, on a tie, the smaller value (larger `-value`) wins."
      - "Pop `k` times, turning `-value` back into `value`."
    solution: |
      #include <map>
      #include <queue>
      #include <utility>
      #include <vector>

      std::vector<int> topK(const std::vector<int>& nums, int k) {
          std::map<int, int> counts{};
          for (int x : nums) {
              ++counts[x];
          }
          std::priority_queue<std::pair<int, int>> pq{};
          for (const auto& [value, count] : counts) {
              pq.push({count, -value});
          }
          std::vector<int> result{};
          for (int i{0}; i < k; ++i) {
              result.push_back(-pq.top().second);
              pq.pop();
          }
          return result;
      }
    explain: |
      `std::pair` compares lexicographically — first by `first`, then by
      `second` — which makes it an easy way to express "by this, then by
      that" orderings. Negating the value flips the tie-break direction.

  - type: review
    id: c13-review
    title: "Chapter 13 review"
    body: |
      ## Cheat sheet

      ```cpp static
      std::map<std::string, int> m;          // sorted by key, O(log n)
      std::unordered_map<std::string, int> u; // hash table, O(1) average
      m[key] = v;          ++m[key];         // insert/update (reading [] inserts!)
      m.find(key) != m.end();  m.count(key); m.at(key);  m.erase(key);
      for (const auto& [k, v] : m) { }       // map: in key order

      std::set<int> s;  std::unordered_set<int> us;
      s.insert(x);  s.count(x);  s.erase(x);

      for (auto it = c.begin(); it != c.end(); ) {
          if (bad(*it)) it = c.erase(it); else ++it;
      }

      std::stack<int> st;   st.push(x); st.top(); st.pop();
      std::queue<int> q;    q.push(x);  q.front(); q.pop();
      std::priority_queue<int> pq;  pq.top();       // largest first
      std::priority_queue<int, std::vector<int>, std::greater<int>> minPq;
      ```

      ## Choosing

      | Need | Use |
      |---|---|
      | A list, index access, most things | `std::vector` |
      | Look up by key | `std::unordered_map` (or `std::map` for sorted keys) |
      | "Have I seen it?" / distinct values | `std::unordered_set` (or `std::set` sorted) |
      | Last in, first out | `std::stack` |
      | First in, first out | `std::queue` |
      | Always the biggest/smallest next | `std::priority_queue` |

      ## Key ideas

      - Big-O describes growth: O(1) < O(log n) < O(n) < O(n²).
      - Reading `m[key]` inserts a missing key; check with `find`/`count`.
      - Iterators generalise pointers; `end()` is one past the end.
      - Erasing invalidates iterators: use the one `erase` returns.
