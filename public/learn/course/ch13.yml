          #include <map>
          #include <string>
          #include <vector>

          std::map<int, std::vector<std::string>> byLength(const std::vector<std::string>& words) {
              std::map<int, std::vector<std::string>> groups{};
              for (const auto& w : words) {
                  groups[static_cast<int>(w.size())].push_back(w);
