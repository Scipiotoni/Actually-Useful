              7 x 1 = 7
              7 x 2 = 14
              7 x 3 = 21
              7 x 4 = 28
              7 x 5 = 35
              7 x 6 = 42
              7 x 7 = 49
              7 x 8 = 56
              7 x 9 = 63
              7 x 10 = 70
          - in: "12"
            out: |
              12 x 1 = 12
              12 x 2 = 24
              12 x 3 = 36
              12 x 4 = 48
              12 x 5 = 60
              12 x 6 = 72
              12 x 7 = 84
