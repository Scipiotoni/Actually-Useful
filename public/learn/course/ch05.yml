  - type: challenge
    id: c5-ch-prime
    title: Is it prime?
    difficulty: 2
    tags: [loops, search]
    prompt: |
      A **prime** is a whole number greater than 1 whose only divisors are 1
      and itself (2, 3, 5, 7, 11…). Read numbers until the input ends and, for
      each, print `N is prime` or `N is not prime`.

      Numbers can be as large as 2,000,000,000, so be clever: you only need
      to test divisors up to √N.
    starter: |
      #include <iostream>

      int main() {

          return 0;
      }
    tests:
      - in: "7 1 9 2"
        out: |
          7 is prime
          1 is not prime
          9 is not prime
          2 is prime
      - in: "97 100 0"
        out: |
          97 is prime
          100 is not prime
          0 is not prime
      - in: "1999999973 2000000000"
        out: |
          1999999973 is prime
          2000000000 is not prime
        hidden: true
    hints:
      - "Numbers below 2 are not prime. Then look for any divisor `d` with `n % d == 0`."
      - "If `n` has a divisor bigger than √n, it also has one smaller. So loop while `d * d <= n` — and use `long long` for `d * d`, or it can overflow near 2 billion."
    solution: |
      #include <iostream>

      int main() {
          long long n{};
          while (std::cin >> n) {
              bool prime = n >= 2;
              for (long long d{2}; d * d <= n; ++d) {
                  if (n % d == 0) {
                      prime = false;
                      break;
                  }
              }
              std::cout << n << (prime ? " is prime\n" : " is not prime\n");
          }
          return 0;
      }
    explain: |
      Testing up to √n instead of n turns ~2 billion steps into ~45,000 —
      the difference between a program that times out and one that answers
      instantly. Thinking about how much work a loop does is a skill you'll
      keep sharpening.

