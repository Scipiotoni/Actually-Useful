      - type: spot
        prompt: "This should print `*****` (5 stars) but prints 6. Which line is wrong?"
        code: |
          #include <iostream>

          int main() {
              int n{5};
              for (int i{0}; i <= n; ++i) {
                  std::cout << '*';
              }
              std::cout << '\n';
              return 0;
          }
        answer: 5
        why: "Starting at 0, `<=` makes it run n + 1 times. Use `i < n`."
      - type: mcq
        prompt: What does `std::uniform_int_distribution<int> d{1, 10};` produce when called with an engine?
        options:
          - Numbers from 1 to 9
          - Numbers from 0 to 10
          - Numbers from 1 to 10, all equally likely
          - Always 1, then 2, then 3…
        answer: 2
        why: Both ends are included for `uniform_int_distribution`.
