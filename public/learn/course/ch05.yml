      Min: 4.00
      Max: 42.00
      Average: 18.00
      ```
    starter: |
      #include <iomanip>
      #include <iostream>

      int main() {

          return 0;
      }
    tests:
      - in: "4 8 15 16 23 42"
        out: |
          Count: 6
          Sum: 108.00
          Min: 4.00
          Max: 42.00
          Average: 18.00
      - in: "-1.5 2.25"
        out: |
          Count: 2
          Sum: 0.75
          Min: -1.50
          Max: 2.25
          Average: 0.38
      - in: ""
        out: No data
      - in: "7"
        out: |
          Count: 1
          Sum: 7.00
          Min: 7.00
          Max: 7.00
          Average: 7.00
        hidden: true
    hints:
      - "Use the count to know whether a value is the first one: `if (count == 0 || x < minimum)`."
      - "Accumulator + counter + min + max, all in one loop."
    solution: |
      #include <iomanip>
      #include <iostream>

      int main() {
          double x{};
          int count{0};
          double sum{0};
          double minimum{0};
          double maximum{0};
          while (std::cin >> x) {
              if (count == 0 || x < minimum) {
                  minimum = x;
              }
              if (count == 0 || x > maximum) {
                  maximum = x;
              }
              sum += x;
              ++count;
          }
          if (count == 0) {
              std::cout << "No data\n";
              return 0;
          }
          std::cout << "Count: " << count << '\n';
          std::cout << std::fixed << std::setprecision(2);
          std::cout << "Sum: " << sum << '\n';
          std::cout << "Min: " << minimum << '\n';
          std::cout << "Max: " << maximum << '\n';
          std::cout << "Average: " << sum / count << '\n';
          return 0;
      }

