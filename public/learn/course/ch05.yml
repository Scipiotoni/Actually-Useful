        why: Include, open main, the loop header, its body, close the loop, return, close main.
      - type: code
        prompt: |
          Read whole numbers until the input ends, and print how many of them
          are **even** and how many are **odd**. For input `3 8 10 -5 0`:

          ```text
          Even: 3
          Odd: 2
          ```
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: "3 8 10 -5 0"
            out: |
              Even: 3
              Odd: 2
          - in: ""
            out: |
              Even: 0
              Odd: 0
          - in: "-7 -9 11"
            out: |
              Even: 0
              Odd: 3
        solution: |
          #include <iostream>

          int main() {
              int x{};
              int even{0};
              int odd{0};
              while (std::cin >> x) {
                  if (x % 2 == 0) {
                      ++even;
                  } else {
                      ++odd;
                  }
              }
              std::cout << "Even: " << even << '\n';
              std::cout << "Odd: " << odd << '\n';
              return 0;
          }
      - type: code
        prompt: |
          Read `n` and print a multiplication grid from 1×1 to n×n, each
          number followed by a single space (trailing spaces are ignored).
          For input `3`:

          ```text
          1 2 3
          2 4 6
          3 6 9
          ```
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: "3"
            out: |
              1 2 3
              2 4 6
              3 6 9
          - in: "1"
            out: "1"
          - in: "5"
            out: |
              1 2 3 4 5
              2 4 6 8 10
              3 6 9 12 15
              4 8 12 16 20
              5 10 15 20 25
        solution: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              for (int r{1}; r <= n; ++r) {
                  for (int c{1}; c <= n; ++c) {
                      std::cout << r * c << ' ';
                  }
                  std::cout << '\n';
              }
              return 0;
          }
      - type: code
        prompt: |
          A number is **perfect** if it equals the sum of its divisors smaller
          than itself (6 = 1 + 2 + 3). Read `n` and print all perfect numbers
          from 1 to `n`, one per line (print nothing if there are none).
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: "30"
            out: |
              6
              28
          - in: "5"
            out: ""
          - in: "10000"
            out: |
              6
              28
              496
              8128
        solution: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              for (int x{2}; x <= n; ++x) {
                  int sum{1};
                  for (int d{2}; d * d <= x; ++d) {
                      if (x % d == 0) {
                          sum += d;
                          if (d != x / d) {
                              sum += x / d;
                          }
                      }
                  }
                  if (sum == x) {
                      std::cout << x << '\n';
                  }
              }
              return 0;
          }
