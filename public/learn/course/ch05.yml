              12 x 9 = 108
              12 x 10 = 120
        hints:
          - "`for (int i{1}; i <= 10; ++i)` — and print `n`, `\" x \"`, `i`, `\" = \"`, `n * i`."
        solution: |
          #include <iostream>

          int main() {
