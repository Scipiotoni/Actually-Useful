id: ch05
number: 5
part: p1
title: Loops
blurb: Make the computer repeat work — thousands of times, correctly — and build your first real game.
hours: 6
goals:
  - Repeat code with `while`, `for` and `do`-`while`, choosing the right one
  - Trace a loop by hand, iteration by iteration
  - Avoid off-by-one errors and infinite loops
  - Leave or skip iterations with `break` and `continue`
  - Apply the classic loop patterns — accumulate, count, find min/max, process digits, read until the end
  - Use nested loops for tables and patterns
  - Generate random numbers with `<random>`

items:
  - type: lesson
    id: c5-while
    title: while loops
    minutes: 20
    objectives:
      - Write a `while` loop that repeats while a condition is true
      - Trace a loop with a table of variable values
      - Recognise and avoid an infinite loop
    body: |
      Print the numbers from 1 to 5. Easy — five lines. From 1 to 1000? You
      need a way to **repeat**. That's a **loop**, and the simplest is
      `while`:

      ```cpp
      #include <iostream>

      int main() {
          int i{1};
          while (i <= 5) {
              std::cout << i << '\n';
              ++i;
          }
          std::cout << "Done!\n";
          return 0;
      }
      ```

      ```output
      1
      2
      3
      4
      5
      Done!
      ```

      A `while` loop works like an `if` that keeps coming back:

      1. Check the condition. If it's **false**, skip the block and carry on after the loop.
      2. If it's **true**, run the block (the **body**) once — one **iteration**.
      3. Go back to step 1.

      ## Tracing a loop

      To understand a loop, trace it: write down the variables at each
      check of the condition. For the loop above:

      | Check | `i` | `i <= 5`? | Prints |
      |---|---|---|---|
      | 1st | 1 | true | 1 |
      | 2nd | 2 | true | 2 |
      | 3rd | 3 | true | 3 |
      | 4th | 4 | true | 4 |
      | 5th | 5 | true | 5 |
      | 6th | 6 | **false** | — loop ends |

      The body ran 5 times, but the condition was checked **6** times. And
      after the loop, `i` is 6.

      {{check trace-while}}

      ## Loops that do real work

      The body can do anything. This one doubles a value until it passes a
      limit — something you couldn't write without a loop, because you don't
      know in advance how many steps it takes:

      ```cpp
      #include <iostream>

      int main() {
          int bacteria{1};
          int minutes{0};
          while (bacteria < 1000) {
              bacteria *= 2;
              minutes += 20;
          }
          std::cout << "After " << minutes << " minutes: " << bacteria << " bacteria\n";
          return 0;
      }
      ```

      ```output
      After 200 minutes: 1024 bacteria
      ```

      ## Infinite loops

      If the condition never becomes false, the loop never ends. The most
      common cause: forgetting to change the variable the condition depends
      on.

      ```cpp static
      int i{1};
      while (i <= 5) {
          std::cout << i << '\n';
          // forgot ++i — i is 1 forever!
      }
      ```

      On your own computer, stop a stuck program with [[Ctrl+C]]. Here, the
      server stops any program after a few seconds and tells you why.

      > [!remember]
      > Every loop needs three things: a variable **initialised** before it, a
      > **condition** that tests it, and an **update** inside the body that
      > moves it towards making the condition false.

      {{check infinite}}

      {{task countdown}}
    checks:
      - id: trace-while
        type: output
        code: |
          #include <iostream>

          int main() {
              int n{10};
              int steps{0};
              while (n > 1) {
                  n = n / 2;
                  ++steps;
              }
              std::cout << n << ' ' << steps << '\n';
              return 0;
          }
        answer: |
          1 3
        why: "n goes 10 → 5 → 2 → 1 (integer division). That's 3 iterations; then 1 > 1 is false."
      - id: infinite
        type: mcq
        warnings: true
        prompt: Why does this loop never end?
        code: |
          #include <iostream>

          int main() {
              int x{10};
              while (x > 0) {
                  std::cout << x << '\n';
                  x = x + 1;
              }
              return 0;
          }
        options:
          - The condition should use `>=`
          - "`x` moves **away** from making `x > 0` false"
          - "`std::cout` inside a loop is not allowed"
          - It does end, after 10 iterations
        answer: 1
        why: "`x` grows, so `x > 0` stays true forever (in practice, until it overflows — which is undefined behaviour). It should be `x = x - 1`."
    tasks:
      - id: countdown
        title: Countdown
        prompt: |
          Read a whole number `n` and count down from `n` to 1, one number per
          line, then print `Liftoff!`. For input `3`:

          ```text
          3
          2
          1
          Liftoff!
          ```
        starter: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;

              return 0;
          }
        tests:
          - in: "3"
            out: |
              3
              2
              1
              Liftoff!
          - in: "1"
            out: |
              1
              Liftoff!
          - in: "0"
            out: |
              Liftoff!
            hidden: true
        hints:
          - "`while (n >= 1)` — print `n`, then decrease it."
        solution: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              while (n >= 1) {
                  std::cout << n << '\n';
                  --n;
              }
              std::cout << "Liftoff!\n";
              return 0;
          }
    cards:
      - front: How does a `while` loop run?
        back: Check the condition; if true, run the body and check again; if false, continue after the loop.
      - front: What three things does every loop need?
        back: A variable initialised before the loop, a condition that tests it, and an update in the body that moves it towards ending the loop.
      - front: "A `while (i <= 5)` loop starting at `i = 1` runs its body how many times, and how often is the condition checked?"
        back: The body runs 5 times; the condition is checked 6 times (the last check is false).

  - type: video
    id: c5-video-loop
    title: "Watch: a loop that adds up"
    body: |
      **What you just saw**

      - `for (int i{1}; i <= 4; ++i)` counts `i` from 1 to 4.
      - `sum += i;` adds each `i` to a running total that starts at 0 — the *accumulator* pattern.
      - When the condition turns false, the loop ends and the next line prints the result.
    video:
      steps:
        - scene: Adding up with a loop
          sub: 1 + 2 + 3 + 4
        - type: "#include <iostream>\n\nint main() {\n    int sum{0};\n    for (int i{1}; i <= 4; ++i) {\n        sum += i;\n    }\n    std::cout << sum << \"\\n\";\n}\n"
          speed: 2
          say: "A program that adds up 1 + 2 + 3 + 4."
        - say: "`sum` starts at **0**: nothing added yet."
          mark: "int sum{0};"
        - say: "The loop counts `i` from 1 while `i <= 4`…"
          mark:
            text: "int i{1}; i <= 4; ++i"
            color: pink
        - say: "…and each round adds `i` to `sum`."
          mark:
            text: "sum += i;"
            color: green
        - scene: Watch it run
          sub: One round at a time
        - run: true
          line: 4
          vars:
            sum: "0"
          hold: 1.4
        - line: 5
          vars:
            i: "1"
          say: "`i` is 1. `1 <= 4`, so in we go."
        - line: 6
          vars:
            sum: "1"
          say: "`sum += i`: 0 + 1 = **1**."
        - line: 5
          vars:
            i: "2"
          hold: 1
        - line: 6
          vars:
            sum: "3"
          say: "1 + 2 = **3**."
        - line: 5
          vars:
            i: "3"
          hold: 1
        - line: 6
          vars:
            sum: "6"
          say: "3 + 3 = **6**."
        - line: 5
          vars:
            i: "4"
          hold: 1
        - line: 6
          vars:
            sum: "10"
          say: "6 + 4 = **10**."
        - line: 5
          vars:
            i: "5"
          say: "`i` is 5: `5 <= 4` is **false**. The loop is done."
          mark:
            text: "i <= 4"
            color: pink
        - line: 8
          print: "10"
          say: "Then the next line prints the total: **10**."
        - line: 0
          say: "Change `4` to `100` and the same loop adds up to 5050 — in a blink."

  - type: lesson
    id: c5-for
    title: for loops
    minutes: 20
    objectives:
      - Write a counting loop with `for`
      - Count up, down and in steps
      - Avoid off-by-one errors
      - Choose between `for` and `while`
    body: |
      Most loops have the same three parts: set up a counter, test it, update
      it. The **`for`** loop puts all three on one line:

      ```cpp
      #include <iostream>

      int main() {
          for (int i{1}; i <= 5; ++i) {
              std::cout << i << ' ';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      1 2 3 4 5
      ```

      `for (init; condition; update)`:

      - **init** runs once, before anything else: `int i{1}`.
      - **condition** is checked before every iteration: `i <= 5`.
      - **update** runs after every iteration: `++i`.

      It does exactly what the `while` version did, but a reader sees the
      whole loop — where it starts, where it stops, how it moves — at a
      glance. And `i` exists only inside the loop (its scope is the loop).

      ## Different counts

      ```cpp
      #include <iostream>

      int main() {
          for (int i{10}; i > 0; i -= 3) {   // count down in threes
              std::cout << i << ' ';
          }
          std::cout << '\n';

          for (int i{0}; i < 5; ++i) {       // 5 times, starting at 0
              std::cout << i << ' ';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      10 7 4 1
      0 1 2 3 4
      ```

      The second form — start at **0**, test **`< n`** — is the standard way
      to do something `n` times. You'll see it everywhere, because (Chapter 7)
      positions in a list start at 0.

      {{check for-output}}

      ## Off-by-one errors

      The most common loop bug is running **one time too many or too few**:
      `<` instead of `<=`, starting at 1 instead of 0. Programmers even have a
      name for it: the **off-by-one error**. Defend yourself by checking the
      edges: *what's the first value? The last? How many iterations?* For
      `for (int i{0}; i < n; ++i)`: first 0, last `n - 1`, `n` iterations.

      {{check off-by-one}}

      ## `for` or `while`?

      - **`for`** when you know how the loop counts: "for each number from 1 to 100", "10 times".
      - **`while`** when you loop until something happens, and you don't know when: "until the user guesses right", "while there's input", "until the value passes 1000".

      {{task table}}

      {{task sum-to-n}}
    checks:
      - id: for-output
        type: output
        code: |
          #include <iostream>

          int main() {
              int total{0};
              for (int i{2}; i <= 10; i += 2) {
                  total += i;
              }
              std::cout << total << '\n';
              return 0;
          }
        answer: |
          30
        why: "i takes 2, 4, 6, 8, 10; their sum is 30."
      - id: off-by-one
        type: mcq
        prompt: How many times does `for (int i{1}; i < 10; ++i)` run its body?
        options:
          - "10"
          - "9"
          - "11"
          - "1"
        answer: 1
        why: "i goes from 1 to 9 (the loop stops when i reaches 10): 9 iterations."
      - id: which-loop
        type: mcq
        prompt: Which loop fits best for *keep asking for a password until it's right*?
        options:
          - "a `for` loop from 1 to 10"
          - a `while` (or `do`-`while`) loop
          - no loop — an `if` is enough
          - "a `switch`"
        answer: 1
        why: You don't know in advance how many attempts it takes, so loop *until* the condition changes.
    tasks:
