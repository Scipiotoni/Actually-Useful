    title: Quick statistics
    difficulty: 2
    tags: [loops, patterns, formatting]
    prompt: |
      Read decimal numbers until the input ends, and print how many there
      were, their sum, minimum, maximum and average — all but the count with
      2 decimals. If there are no numbers, print `No data`. For input
      `4 8 15 16 23 42`:

      ```text
      Count: 6
