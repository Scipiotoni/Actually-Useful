      - id: sum-to-n
        title: Sum 1 to n
        prompt: |
          Read `n` and print the sum 1 + 2 + … + n. For input `100`, print
          `5050`. (Use a loop — even if you know the formula!)
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: "100"
            out: "5050"
          - in: "1"
            out: "1"
          - in: "10"
            out: "55"
            hidden: true
        hints:
          - "Keep a running total that starts at 0: `int sum{0};`"
          - "Inside the loop: `sum += i;`"
        solution: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              int sum{0};
              for (int i{1}; i <= n; ++i) {
                  sum += i;
              }
              std::cout << sum << '\n';
              return 0;
          }
    cards:
      - front: "What are the three parts of `for (A; B; C)` and when does each run?"
        back: "A (init) runs once at the start; B (condition) is checked before each iteration; C (update) runs after each iteration."
      - front: What's the standard loop to do something `n` times?
        back: "`for (int i{0}; i < n; ++i)` — i goes 0, 1, …, n−1."
      - front: What is an **off-by-one error**?
        back: A loop that runs one time too many or too few, often from `<` vs `<=` or starting at 1 vs 0.
      - front: "`for` or `while`?"
        back: "`for` when you know how the loop counts; `while` when you loop until something happens."

  - type: lesson
    id: c5-dowhile
    title: do-while and reading until the end
    minutes: 18
    objectives:
      - Use `do`-`while` when the body must run at least once
      - Keep asking until the input is valid
      - Read and process any number of values with `while (std::cin >> x)`
    body: |
      ## `do`-`while`: test at the end

      A `while` loop may run zero times. Sometimes you need the body to run
      **at least once** — like asking a question before you can check the
      answer. That's **`do`-`while`**:

      ```cpp
      #include <iostream>

      int main() {
          int guess{};
          do {
              std::cout << "Pick a number from 1 to 10: ";
              std::cin >> guess;
          } while (guess < 1 || guess > 10);
          std::cout << "\nYou picked " << guess << '\n';
          return 0;
      }
      ```

      ```stdin
      0 42 7
      ```

      ```output
      Pick a number from 1 to 10: Pick a number from 1 to 10: Pick a number from 1 to 10:
      You picked 7
      ```

      The body runs, *then* the condition is tested. Note the `;` after
      `while (...)` — it's required here.

      ## Reading until the input runs out

      This is one of the most useful patterns in the whole course. A read
      used as a condition is true when it succeeds, and false when there's
      nothing left (or it isn't a number). So this loop processes **every**
      number the user types, however many:

      ```cpp
      #include <iostream>

      int main() {
          int value{};
          int sum{0};
          int count{0};
          while (std::cin >> value) {
              sum += value;
              ++count;
          }
          std::cout << count << " numbers, sum " << sum << '\n';
          return 0;
      }
      ```

      ```stdin
      4 8 15 16 23 42
      ```

      ```output
      6 numbers, sum 108
      ```

      Edit the input: add numbers, remove them, even leave it empty. The same
      code handles them all. (On a real keyboard, the user signals the end of
      input with [[Ctrl+D]] on Linux/Mac or [[Ctrl+Z]] then Enter on Windows.)

      ## A sentinel value

      Another common way to end input is a **sentinel**: a special value that
      means "stop", like `0` or `-1`:

      ```cpp
      #include <iostream>

      int main() {
          int total{0};
          int price{};
          std::cin >> price;
          while (price != 0) {
              total += price;
              std::cin >> price;
          }
          std::cout << "Total: " << total << '\n';
          return 0;
      }
      ```

      ```stdin
      5 12 3 0
      ```

      ```output
      Total: 20
      ```

      Notice the shape: read once **before** the loop, and again at the
      **end** of the body — so the sentinel is never added to the total.

      {{check do-once}}

      {{check read-all}}

      {{task max-input}}
    checks:
      - id: do-once
        type: output
        code: |
          #include <iostream>

          int main() {
              int n{100};
              do {
                  std::cout << n << '\n';
                  n = n + 1;
              } while (n < 50);
              return 0;
          }
        answer: |
          100
        why: "The body runs once before the condition is checked. Then 101 < 50 is false, so the loop ends."
      - id: read-all
        type: output
        prompt: "The Input box contains `3 9 -2 5`."
        code: |
          #include <iostream>

          int main() {
              int x{};
              int positives{0};
              while (std::cin >> x) {
                  if (x > 0) {
                      ++positives;
                  }
              }
              std::cout << positives << '\n';
              return 0;
          }
        stdin: "3 9 -2 5"
        answer: |
          3
        why: "The loop reads all four numbers, then the read fails (no more input) and the loop ends. Three were positive."
    tasks:
      - id: max-input
        title: The biggest number
        prompt: |
          Read whole numbers until the input ends, and print the largest one.
          There is always at least one number. For input `4 17 -3 9`, print
          `17`.
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: "4 17 -3 9"
            out: "17"
          - in: "-8 -3 -11"
            out: "-3"
          - in: "5"
            out: "5"
            hidden: true
        hints:
          - Don't start the maximum at 0 — what if every number is negative?
          - "Read the **first** number into `largest` before the loop, then `while (std::cin >> x)` compare each new one."
        solution: |
          #include <iostream>

          int main() {
              int largest{};
              std::cin >> largest;
              int x{};
              while (std::cin >> x) {
                  if (x > largest) {
                      largest = x;
                  }
              }
              std::cout << largest << '\n';
              return 0;
          }
    cards:
      - front: How is `do { ... } while (cond);` different from `while`?
        back: The body runs **at least once**; the condition is checked after each iteration. (And it ends with `;`.)
      - front: How do you process every number the user types, however many?
        back: "`while (std::cin >> x) { ... }` — the read is false when input runs out or isn't a number."
      - front: What is a **sentinel** value?
        back: A special input value that means "stop", like 0 or −1. Read before the loop and at the end of the body so it isn't processed.

  - type: lesson
    id: c5-break
    title: break and continue
    minutes: 14
    objectives:
      - Leave a loop early with `break`
      - Skip the rest of one iteration with `continue`
      - Write a `while (true)` loop with a clear exit
    body: |
      ## `break`: leave the loop now

      `break` (which you met in `switch`) immediately ends the loop, jumping
      to the first statement after it. It's perfect for **searching**: stop
      as soon as you've found what you're looking for.

      ```cpp
      #include <iostream>

      int main() {
          // Find the first number above 100 that is divisible by 17.
          int found{0};
          for (int n{101}; n < 1000; ++n) {
              if (n % 17 == 0) {
                  found = n;
                  break;
              }
          }
          std::cout << found << '\n';
          return 0;
      }
      ```

      ```output
      102
      ```

      ## `continue`: skip to the next iteration

      `continue` skips the rest of the current iteration and goes straight on
      to the next one (in a `for` loop, the update still runs).

      ```cpp
      #include <iostream>

      int main() {
          for (int i{1}; i <= 10; ++i) {
              if (i % 3 == 0) {
                  continue;          // skip multiples of 3
              }
              std::cout << i << ' ';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      1 2 4 5 7 8 10
      ```

      ## `while (true)` with a `break`

      Sometimes the natural place to decide whether to stop is in the
      **middle** of the loop. A common and readable pattern:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          std::string command{};
          while (true) {
              std::cin >> command;
              if (command == "quit") {
                  break;
              }
              std::cout << "You said: " << command << '\n';
          }
          std::cout << "Bye!\n";
          return 0;
      }
      ```

      ```stdin
      hello again quit ignored
      ```

      ```output
      You said: hello
      You said: again
      Bye!
      ```

      > [!warning]
      > `break` only leaves the **innermost** loop it's in. And if the input
      > ran out before `quit`, this loop would never end — a robust version
      > uses `if (!(std::cin >> command) || command == "quit")`.

      {{check break-output}}

      {{check continue-output}}
    checks:
      - id: break-output
        type: output
        code: |
          #include <iostream>

          int main() {
              int i{0};
              while (i < 10) {
                  i += 3;
                  if (i > 7) {
                      break;
                  }
                  std::cout << i << ' ';
              }
              std::cout << i << '\n';
              return 0;
          }
        answer: |
          3 6 9
        why: "i becomes 3 (printed), 6 (printed), then 9 — 9 > 7, so break before printing inside the loop. After the loop, 9 is printed."
      - id: continue-output
        type: output
        code: |
          #include <iostream>

          int main() {
              int sum{0};
              for (int i{1}; i <= 6; ++i) {
                  if (i % 2 == 0) {
                      continue;
                  }
                  sum += i;
              }
              std::cout << sum << '\n';
              return 0;
          }
        answer: |
          9
        why: "Even numbers are skipped; 1 + 3 + 5 = 9."
    cards:
      - front: What does `break` do in a loop?
        back: Ends the (innermost) loop immediately; execution continues after it.
      - front: What does `continue` do in a loop?
        back: Skips the rest of this iteration and moves on to the next (in a `for`, the update still runs).
      - front: When is `while (true) { ... break; ... }` a good idea?
        back: When the natural place to decide to stop is in the middle of the body — as long as there's always a way out.

