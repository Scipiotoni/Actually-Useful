          - "12"
        answer: 1
        why: "0 to 10 inclusive is 11 values."
      - type: output
        code: |
          #include <iostream>

          int main() {
              int n{0};
              int count{0};
              do {
                  ++count;
              } while (n > 0);
              std::cout << count << '\n';
              return 0;
          }
        answer: |
          1
        why: "A `do`-`while` body always runs at least once."
      - type: output
        prompt: "The Input box contains `2 4 6 0 8`."
        code: |
          #include <iostream>

          int main() {
              int x{};
              int sum{0};
              std::cin >> x;
              while (x != 0) {
                  sum += x;
                  std::cin >> x;
              }
              std::cout << sum << '\n';
              return 0;
          }
        stdin: "2 4 6 0 8"
        answer: |
          12
        why: "0 is the sentinel: reading stops there, so the 8 is never read. 2 + 4 + 6 = 12."
      - type: spot
        prompt: This should print 1 to 5 but never stops. Which line is wrong?
        code: |
          #include <iostream>

          int main() {
              int i{1};
              while (i <= 5) {
                  std::cout << i << '\n';
                  i - 1;
              }
              return 0;
          }
        answer: 7
        why: "`i - 1;` computes a value and throws it away — `i` never changes. It should be `++i;` (and the compiler warns: statement has no effect)."
      - type: order
        prompt: Arrange the lines into a program that prints the sum of all numbers in the input.
        lines:
          - "#include <iostream>"
          - "int main() {"
          - "    int x{};"
          - "    int sum{0};"
          - "    while (std::cin >> x) {"
          - "        sum += x;"
          - "    }"
          - "    std::cout << sum << '\\n';"
          - "}"
        alternatives:
          - [0, 1, 3, 2, 4, 5, 6, 7, 8]
        why: Declare the variables, loop over every input value adding it to the total, and print after the loop ends.

  - type: lesson
    id: c5-patterns
    title: Loop patterns you'll use forever
    minutes: 24
    objectives:
      - Recognise and write the accumulator, counter, min/max and search patterns
      - Process the digits of a number with a loop
      - Compute products like factorials without overflowing
    body: |
      Almost every loop you'll ever write is a variation of a handful of
      **patterns**. Learn to recognise them and half of every problem is
      already solved.

      ## 1. Accumulator: build up a total

      Start with a neutral value, and combine each item into it.

      ```cpp static
      int sum{0};                 // 0 for sums
      for (...) { sum += item; }

      long long product{1};       // 1 for products
      for (...) { product *= item; }
      ```

      ## 2. Counter: how many match?

      ```cpp static
      int count{0};
      for (...) {
          if (matches) { ++count; }
      }
      ```

      ## 3. Min / max: the best so far

      Keep the best value seen so far, and replace it when you find a better
      one. Start with the **first item** (not 0!).

      ## 4. Search: is there one? Where?

      Use a flag, and `break` once found.

      ```cpp
      #include <iostream>

      int main() {
          // Is there a multiple of 7 between 50 and 55?
          bool found{false};
          for (int n{50}; n <= 55; ++n) {
              if (n % 7 == 0) {
                  found = true;
                  break;
              }
          }
          std::cout << (found ? "yes" : "no") << '\n';
          return 0;
      }
      ```

      ```output
      no
      ```

      ## 5. Digit loop: take a number apart

      `n % 10` is the last digit, `n / 10` removes it. Repeat until nothing
      is left:

      ```cpp
      #include <iostream>

      int main() {
          int n{90417};
          int digits{0};
          int sum{0};
          while (n > 0) {
              int last = n % 10;
              sum += last;
              ++digits;
              n /= 10;
          }
          std::cout << digits << " digits, digit sum " << sum << '\n';
          return 0;
      }
      ```

      ```output
      5 digits, digit sum 21
      ```

      Trace it: `n` goes 90417 → 9041 → 904 → 90 → 9 → 0, and `last` takes
      7, 1, 4, 0, 9.

      > [!warning] The zero case
      > For `n = 0`, `while (n > 0)` doesn't run at all, so this counts **0**
      > digits. If 0 should count as one digit, handle it separately — or use a
      > `do`-`while`. Edge cases like 0, 1, negative numbers and empty input are
      > where bugs hide. Always test them.

      ## 6. Product: factorial

      n! (*n factorial*) is 1 × 2 × … × n. It grows **fast** — 13! is already
      too big for an `int` — so use `long long`:

      ```cpp
      #include <iostream>

      int main() {
          int n{20};
          long long factorial{1};
          for (int i{2}; i <= n; ++i) {
              factorial *= i;
          }
          std::cout << n << "! = " << factorial << '\n';
          return 0;
      }
      ```

      ```output
      20! = 2432902008176640000
      ```

      (21! doesn't fit even in a `long long`.)

      {{check pattern-which}}

      {{check digits-output}}

      {{task count-div}}

      {{task reverse}}
    checks:
      - id: pattern-which
        type: mcq
        prompt: "To find the **smallest** of the numbers read, what should the \"smallest so far\" start as?"
        options:
          - "0"
          - A very small number, like −1000000
          - The first number read
          - "1"
        answer: 2
        why: "Starting at 0 fails when all numbers are positive (0 would win). The first value is always a correct starting point."
      - id: digits-output
        type: output
        code: |
          #include <iostream>

          int main() {
              int n{1203};
              int product{1};
              while (n > 0) {
                  int d = n % 10;
                  if (d != 0) {
                      product *= d;
                  }
                  n /= 10;
              }
              std::cout << product << '\n';
              return 0;
          }
        answer: |
          6
        why: "The digits are 3, 0, 2, 1; zeros are skipped, so 3 × 2 × 1 = 6."
    tasks:
      - id: count-div
        title: Count the multiples
        prompt: |
          Read two numbers `n` and `k`, and print how many numbers from 1 to
          `n` are divisible by `k`. For input `20 3` print `6` (3, 6, 9, 12,
          15, 18).
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: "20 3"
            out: "6"
          - in: "10 10"
            out: "1"
          - in: "7 8"
            out: "0"
            hidden: true
        hints:
          - The counter pattern.
        solution: |
          #include <iostream>

          int main() {
              int n{};
              int k{};
              std::cin >> n >> k;
              int count{0};
              for (int i{1}; i <= n; ++i) {
                  if (i % k == 0) {
                      ++count;
                  }
              }
              std::cout << count << '\n';
              return 0;
          }
      - id: reverse
        title: Reverse a number
        prompt: |
          Read a positive whole number and print its digits in reverse order,
          as a number. For input `1234` print `4321`; for `1200` print `21`.
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: "1234"
            out: "4321"
          - in: "1200"
            out: "21"
          - in: "7"
            out: "7"
            hidden: true
        hints:
          - "Build the result as you go: `result = result * 10 + n % 10;`"
          - "Then `n /= 10;` — the digit loop pattern."
        solution: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              int result{0};
              while (n > 0) {
                  result = result * 10 + n % 10;
                  n /= 10;
              }
              std::cout << result << '\n';
              return 0;
          }
    cards:
      - front: Name the six classic loop patterns.
        back: Accumulator (total), counter (how many), min/max (best so far), search (flag + break), digit loop (`% 10`, `/ 10`), product (e.g. factorial).
      - front: What should an accumulator start at, for a sum and for a product?
        back: 0 for a sum, 1 for a product.
      - front: How do you loop over the digits of `n`?
        back: "`while (n > 0) { int d = n % 10; ...; n /= 10; }` — and handle `n = 0` separately if it matters."
      - front: Why use `long long` for factorials?
        back: They grow very fast — 13! already overflows an `int`. `long long` fits up to 20!.

  - type: lesson
    id: c5-nested
    title: Nested loops
    minutes: 20
    objectives:
      - Put a loop inside another loop, and trace it
      - Print grids and triangle patterns
      - Estimate how many times the inner body runs
    body: |
      A loop's body can contain another loop. For **each** iteration of the
      outer loop, the inner loop runs **completely**.

      ```cpp
      #include <iostream>

      int main() {
          for (int row{1}; row <= 3; ++row) {
              for (int col{1}; col <= 4; ++col) {
                  std::cout << row * col << '\t';
              }
              std::cout << '\n';
          }
          return 0;
      }
      ```

      ```output
      1	2	3	4
      2	4	6	8
      3	6	9	12
      ```

      The outer loop picks a row; the inner loop walks across its columns;
      then `'\n'` ends the row. The inner body runs 3 × 4 = **12** times.

      ## Patterns

      The inner loop's range can depend on the outer loop's variable. That's
      how you draw shapes:

      ```cpp
      #include <iostream>

      int main() {
          int height{4};
          for (int row{1}; row <= height; ++row) {
              for (int i{0}; i < row; ++i) {
                  std::cout << '*';
              }
              std::cout << '\n';
          }
          return 0;
      }
      ```

      ```output
      *
      **
      ***
      ****
      ```

      Row 1 gets 1 star, row 2 gets 2… The trick with any pattern: work out,
      for row number `row`, **how many** of each character to print. For a
      right-aligned triangle, each row starts with `height - row` spaces:

      ```cpp
      #include <iostream>

      int main() {
          int height{4};
          for (int row{1}; row <= height; ++row) {
              for (int s{0}; s < height - row; ++s) {
                  std::cout << ' ';
              }
              for (int i{0}; i < row; ++i) {
                  std::cout << '*';
              }
              std::cout << '\n';
          }
          return 0;
      }
      ```

      ```output
         *
        **
       ***
      ****
      ```

      > [!tip]
      > `std::string(n, '*')` builds a string of `n` stars — often simpler than
      > an inner loop for printing repeated characters. Both are good to know.

      ## How much work?

      If the outer loop runs `n` times and the inner loop `n` times, the body
      runs `n × n` times. For `n = 1000`, that's a million — fine. For `n` = a
      million, it's a trillion — far too slow. Chapter 18 turns this intuition
      into a tool (*Big-O*).

      {{check nested-count}}

      {{check pattern-output}}

      {{task square}}
    checks:
      - id: nested-count
        type: output
        code: |
          #include <iostream>

          int main() {
              int count{0};
              for (int i{0}; i < 4; ++i) {
                  for (int j{0}; j < i; ++j) {
                      ++count;
                  }
              }
              std::cout << count << '\n';
              return 0;
          }
        answer: |
          6
        why: "The inner loop runs 0, 1, 2 and 3 times: 0 + 1 + 2 + 3 = 6."
      - id: pattern-output
        type: output
        code: |
          #include <iostream>

          int main() {
              for (int r{3}; r >= 1; --r) {
                  for (int c{1}; c <= r; ++c) {
                      std::cout << c;
                  }
                  std::cout << '\n';
              }
              return 0;
          }
        answer: |
          123
          12
          1
        why: "Rows count down from 3 to 1; each row prints 1 up to the row number."
    tasks:
      - id: square
        title: Hollow square
        prompt: |
          Read `n` (at least 2) and print a hollow square of `#` with side `n`.
          For input `4`:

          ```text
          ####
          #  #
          #  #
          ####
          ```
        starter: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;

              return 0;
          }
        tests:
          - in: "4"
            out: |
              ####
              #  #
              #  #
              ####
          - in: "2"
            out: |
              ##
              ##
          - in: "5"
            out: |
              #####
              #   #
              #   #
              #   #
              #####
            hidden: true
        hints:
          - "Loop over rows and columns. A cell is `#` when it's on the edge: first/last row or first/last column."
          - "Edge test: `row == 0 || row == n - 1 || col == 0 || col == n - 1`."
        solution: |
          #include <iostream>

          int main() {
              int n{};
              std::cin >> n;
              for (int row{0}; row < n; ++row) {
                  for (int col{0}; col < n; ++col) {
                      bool edge = row == 0 || row == n - 1 || col == 0 || col == n - 1;
                      std::cout << (edge ? '#' : ' ');
                  }
                  std::cout << '\n';
              }
              return 0;
          }
    cards:
      - front: In nested loops, how often does the inner loop run?
        back: Completely, once for **each** iteration of the outer loop.
      - front: If the outer loop runs `n` times and the inner `m` times, how many times does the inner body run?
        back: "`n × m` times."
      - front: How do you approach printing a pattern with loops?
        back: For each row number, work out **how many** of each character to print (spaces, stars…), then use an inner loop (or `std::string(n, c)`) for each.

  - type: lesson
    id: c5-random
    title: Random numbers
    minutes: 16
    objectives:
      - Generate random integers in a range with `<random>`
      - Seed a generator, and explain why a fixed seed gives the same sequence
    body: |
      Games, simulations and tests need randomness. Modern C++ provides it in
      **`<random>`**, in two parts:

      - an **engine** that produces raw random bits — `std::mt19937` (the *Mersenne Twister*, a high-quality generator), and
      - a **distribution** that shapes them into what you want — for example `std::uniform_int_distribution`, whole numbers in a range, all equally likely.

      ```cpp
      #include <iostream>
      #include <random>

      int main() {
          std::mt19937 rng{std::random_device{}()};
          std::uniform_int_distribution<int> die{1, 6};

          for (int i{0}; i < 5; ++i) {
              std::cout << die(rng) << ' ';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      Run it several times — the numbers change each time.

      - `std::random_device{}()` asks the system for a truly unpredictable number, used as the **seed** (the starting point) for the engine.
      - `die(rng)` gives the next random number from 1 to 6. Make **one** engine and reuse it; don't create a new one every time you need a number.

      ## Seeds and repeatability

      An engine is really a very long, fixed sequence of numbers; the seed
      picks where it starts. The same seed always gives the **same**
      sequence — which is exactly what you want when testing a game:

      ```cpp
      #include <iostream>
      #include <random>

      int main() {
          std::mt19937 rng{42};   // fixed seed: same "random" numbers every run
          for (int i{0}; i < 3; ++i) {
              std::cout << rng() << '\n';
          }
          return 0;
      }
      ```

      ```output
      1608637542
      3421126067
      4083286876
      ```

      These three numbers are the same on every computer: the C++ standard
      defines exactly what `std::mt19937` produces. (Distributions are allowed
      to differ between compilers, so this course's graded exercises use
      `rng() % n` when they need exactly reproducible numbers.)

      > [!deep] Why not `rand()`?
      > Older code uses `std::rand()` from `<cstdlib>`. It's still there, but
      > its quality isn't guaranteed and `rand() % n` is subtly biased. Prefer
      > `<random>` in new code.

      {{check seed}}
    checks:
      - id: seed
        type: mcq
        prompt: Two programs create `std::mt19937 rng{123};` and print `rng()` three times. What do they print?
        options:
          - Different numbers each time they run
          - The same three numbers, every run, on every computer
          - 1, 2, 3
          - 123, 123, 123
        answer: 1
        why: "The seed fixes the starting point of the sequence, and `std::mt19937`'s sequence is defined by the standard."
      - id: one-engine
        type: tf
        prompt: You should create a new random engine every time you need a random number.
        answer: false
        why: Create one engine (seeded once) and keep drawing numbers from it.
    cards:
      - front: What are the two parts of generating random numbers with `<random>`?
        back: An **engine** (e.g. `std::mt19937`) that makes random bits, and a **distribution** (e.g. `std::uniform_int_distribution<int>{1, 6}`) that shapes them.
      - front: What is a **seed**?
        back: The starting point of a random engine's sequence. The same seed gives the same sequence; seed from `std::random_device` for unpredictability.

  - type: quiz
    id: c5-quiz2
    title: "Quiz: patterns and nesting"
    questions:
      - type: output
        code: |
          #include <iostream>

          int main() {
              for (int i{1}; i <= 3; ++i) {
                  for (int j{1}; j <= 2; ++j) {
                      std::cout << i << j << ' ';
                  }
              }
              std::cout << '\n';
              return 0;
          }
        answer: |
          11 12 21 22 31 32
        why: "For each i (1–3), j goes through 1 and 2 completely."
      - type: output
        code: |
          #include <iostream>

          int main() {
              int n{305};
              int count{0};
              while (n > 0) {
                  if (n % 10 == 0) {
                      ++count;
                  }
                  n /= 10;
              }
              std::cout << count << '\n';
              return 0;
          }
        answer: |
          1
        why: "The digits of 305 are 5, 0, 3; one of them is zero."
      - type: fill
        prompt: Complete the program so it prints the product 1 × 2 × 3 × 4 × 5.
        code: |
          #include <iostream>

          int main() {
              long long p{___};
              for (int i{1}; i <= 5; ++i) {
                  p ___ i;
              }
              std::cout << p << '\n';
              return 0;
          }
        blanks:
          - ['1']
          - ['*=']
        output: |
          120
        why: A product accumulator starts at 1 (starting at 0 would make everything 0) and multiplies each item in.
      - type: mcq
        prompt: A loop runs `n` times, and inside it another loop runs `n` times. For `n = 1000`, how many times does the innermost body run?
        options:
          - "1,000"
          - "2,000"
          - "1,000,000"
          - "1,000,000,000"
        answer: 2
        why: "1000 × 1000 = one million."
      - type: spot
        prompt: This should print the smallest of the input numbers (all positive), but always prints 0. Which line is the bug?
        code: |
          #include <iostream>

          int main() {
              int smallest{0};
              int x{};
              while (std::cin >> x) {
                  if (x < smallest) {
                      smallest = x;
                  }
              }
              std::cout << smallest << '\n';
              return 0;
          }
        answer: 4
        why: "Starting at 0, no positive number is ever smaller. Start with the first value read instead."

  - type: project
    id: c5-project
    title: "Project: Guess the Number"
    body: |
      Your first complete program: the classic number-guessing game. You'll
      build it in four milestones, each adding one idea — exactly how real
      programs are written. Your code carries over from one milestone to the
      next.

      Because this runs on a server, the game reads the player's guesses from
      the **Input** box instead of the keyboard. The logic is exactly what it
      would be on your own computer.
    milestones:
      - title: One guess
        prompt: |
          Read the **secret number**, then **one guess**. Print `Too low`,
          `Too high` or `Correct!`.

          For input `42 30`, print `Too low`.
        starter: |
          #include <iostream>

          int main() {
              int secret{};
              int guess{};
              std::cin >> secret >> guess;

              return 0;
          }
        tests:
          - in: "42 30"
            out: Too low
          - in: "42 50"
            out: Too high
          - in: "42 42"
            out: Correct!
        hints:
          - An `if` / `else if` / `else` chain comparing `guess` with `secret`.
        solution: |
          #include <iostream>

          int main() {
              int secret{};
              int guess{};
              std::cin >> secret >> guess;

              if (guess < secret) {
                  std::cout << "Too low\n";
              } else if (guess > secret) {
                  std::cout << "Too high\n";
              } else {
                  std::cout << "Correct!\n";
              }
              return 0;
          }
      - title: Keep guessing
        prompt: |
          Now read the secret, then keep reading guesses **until one is
          right**, printing a hint for each. When the player gets it, print
          `Correct! You got it in N guesses.`

          For input `42 50 30 42`:

          ```text
          Too high
          Too low
          Correct! You got it in 3 guesses.
          ```

          (You can assume the right answer always appears in the input.)
        tests:
          - in: "42 50 30 42"
            out: |
              Too high
              Too low
              Correct! You got it in 3 guesses.
          - in: "7 7"
            out: |
              Correct! You got it in 1 guesses.
          - in: "64 50 75 62 68 65 63 64"
            out: |
              Too low
              Too high
              Too low
              Too high
              Too high
              Too low
              Correct! You got it in 7 guesses.
        hints:
          - "A loop that reads a guess each time round: `do { ... } while (guess != secret);` fits well."
          - Count guesses with a counter that starts at 0.
        solution: |
          #include <iostream>

          int main() {
              int secret{};
              std::cin >> secret;

              int guess{};
              int guesses{0};
              do {
                  std::cin >> guess;
                  ++guesses;
                  if (guess < secret) {
                      std::cout << "Too low\n";
                  } else if (guess > secret) {
                      std::cout << "Too high\n";
                  }
              } while (guess != secret);

              std::cout << "Correct! You got it in " << guesses << " guesses.\n";
              return 0;
          }
      - title: A random secret
        prompt: |
          A real game picks the secret itself. The first input is now a
          **seed**; make the secret from it like this, so the game can be
          tested:

          ```cpp static
          std::mt19937 rng{seed};
          int secret = static_cast<int>(rng() % 100) + 1;   // 1 to 100
          ```

          (`#include <random>`. On your own computer you'd seed with
          `std::random_device{}()` instead.) Then play exactly as before. For
          input `42 50 30 43`, the secret is 43.

          To check your secret is right: seed `1` gives secret `46`, seed `42`
          gives `43`.
        tests:
          - in: "1 50 46"
            out: |
              Too high
              Correct! You got it in 2 guesses.
          - in: "42 43"
            out: |
              Correct! You got it in 1 guesses.
          - in: "7 50 25 12 18 15 16"
            out: |
              Too high
              Too high
              Too low
              Too high
              Too low
              Correct! You got it in 6 guesses.
        hints:
          - Read the seed first, build the engine from it, and compute `secret` before the loop.
          - "`rng() % 100` is 0–99; `+ 1` shifts it to 1–100."
        solution: |
          #include <iostream>
          #include <random>

          int main() {
              unsigned int seed{};
              std::cin >> seed;
              std::mt19937 rng{seed};
              int secret = static_cast<int>(rng() % 100) + 1;

              int guess{};
              int guesses{0};
              do {
                  std::cin >> guess;
                  ++guesses;
                  if (guess < secret) {
                      std::cout << "Too low\n";
                  } else if (guess > secret) {
                      std::cout << "Too high\n";
                  }
              } while (guess != secret);

              std::cout << "Correct! You got it in " << guesses << " guesses.\n";
              return 0;
          }
      - title: Seven tries and bad input
        prompt: |
          The final game:

          1. The player has **7 guesses**. If they haven't got it after 7, print `Out of guesses! The number was N.` and end.
          2. If the input runs out before the game ends, print `Game abandoned.` and end.
          3. A guess outside 1–100 prints `Out of range` and **doesn't** use up a try.
          4. On a win, print `Correct! You got it in N guesses.` — as before, counting only valid guesses.

          For input `1 150 50 46` (secret 46):

          ```text
          Out of range
          Too high
          Correct! You got it in 2 guesses.
          ```
        tests:
          - in: "1 150 50 46"
            out: |
              Out of range
              Too high
              Correct! You got it in 2 guesses.
          - in: "1 10 11 12 13 14 15 16"
            out: |
              Too low
              Too low
              Too low
              Too low
              Too low
              Too low
              Too low
              Out of guesses! The number was 46.
          - in: "1 50 0"
            out: |
              Too high
              Out of range
              Game abandoned.
          - in: "42 43"
            out: |
              Correct! You got it in 1 guesses.
        hints:
          - "Loop while `guesses < 7`. Inside, read with `if (!(std::cin >> guess))` to detect the end of input."
          - "For out-of-range guesses, print the message and `continue` — before counting the guess."
          - After the loop, you need to know *why* it ended. A `bool won{false};` set when the guess is right helps.
        solution: |
          #include <iostream>
          #include <random>

          int main() {
              constexpr int maxGuesses{7};
              unsigned int seed{};
              std::cin >> seed;
              std::mt19937 rng{seed};
              int secret = static_cast<int>(rng() % 100) + 1;

              int guesses{0};
              bool won{false};
              while (guesses < maxGuesses) {
                  int guess{};
                  if (!(std::cin >> guess)) {
                      std::cout << "Game abandoned.\n";
                      return 0;
                  }
                  if (guess < 1 || guess > 100) {
                      std::cout << "Out of range\n";
                      continue;
                  }
                  ++guesses;
                  if (guess < secret) {
                      std::cout << "Too low\n";
                  } else if (guess > secret) {
                      std::cout << "Too high\n";
                  } else {
                      won = true;
                      break;
                  }
              }

              if (won) {
                  std::cout << "Correct! You got it in " << guesses << " guesses.\n";
              } else {
                  std::cout << "Out of guesses! The number was " << secret << ".\n";
              }
              return 0;
          }
        explain: |
          Three ideas from this chapter meet here: a counting loop with an
          early `break`, `continue` to skip invalid input without counting it,
          and a read-as-condition to detect the end of input. The `won` flag
          records *why* the loop ended, so the code after it can react. With a
          smart strategy — always guess the middle of the remaining range —
          7 guesses are always enough for 1–100, because 2⁷ = 128 > 100.

  - type: challenge
