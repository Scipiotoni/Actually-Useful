          Fizz
          7
          8
          Fizz
          Buzz
          11
          Fizz
          13
          14
          FizzBuzz
      - in: "5"
        out: |
          1
          2
          Fizz
          4
          Buzz
    hints:
      - Check "both" first — a multiple of 15 is also a multiple of 3.
    solution: |
      #include <iostream>

      int main() {
