  - type: challenge
    id: c5-ch-diamond
    title: Diamond
    difficulty: 3
    tags: [nested loops, patterns]
    prompt: |
      Read an odd width `w` and print a diamond whose widest row has `w`
      stars. For input `5`:

      ```text
        *
       ***
      *****
       ***
        *
      ```
    starter: |
      #include <iostream>

      int main() {
          int w{};
          std::cin >> w;

          return 0;
      }
    tests:
      - in: "5"
        out: |
            *
           ***
          *****
           ***
            *
      - in: "1"
        out: |
          *
      - in: "7"
        out: |
             *
            ***
           *****
          *******
           *****
            ***
             *
        hidden: true
    hints:
      - "There are `w` rows. Row `r` (0 to w−1) is `d` steps away from the middle row, where `d = std::abs(r - w / 2)`."
      - "A row `d` steps from the middle has `d` spaces and `w - 2 * d` stars."
    solution: |
      #include <cstdlib>
      #include <iostream>
      #include <string>

      int main() {
          int w{};
          std::cin >> w;
          int middle = w / 2;
          for (int r{0}; r < w; ++r) {
              int d = std::abs(r - middle);
              std::cout << std::string(d, ' ') << std::string(w - 2 * d, '*') << '\n';
          }
          return 0;
      }
    explain: |
      Instead of two loops (one growing, one shrinking), this uses the
      distance from the middle row — one formula for the whole shape. Finding
      the right quantity to loop over often turns a fiddly problem into a
      simple one.

  - type: review
    id: c5-review
    title: "Chapter 5 review"
    body: |
      ## Cheat sheet

      ```cpp static
      while (condition) { ... }                 // may run 0 times
      do { ... } while (condition);             // runs at least once
      for (int i{0}; i < n; ++i) { ... }        // n times: i = 0 .. n-1
      for (int i{n}; i >= 1; --i) { ... }       // counting down
      while (std::cin >> x) { ... }             // every value in the input
      break;      // leave the innermost loop
      continue;   // next iteration

      std::mt19937 rng{std::random_device{}()};
      std::uniform_int_distribution<int> dist{1, 6};
      int roll = dist(rng);
      ```

      ## Patterns

      | Pattern | Shape |
      |---|---|
      | Accumulate | `total` starts at 0 (sum) or 1 (product), `total += x` |
      | Count | `if (matches) ++count;` |
      | Min / max | start with the **first** value |
      | Search | `found = true; break;` |
      | Digits | `while (n > 0) { d = n % 10; n /= 10; }` |
      | Separator between items | print it before every item except the first |

      ## Key ideas

      - Trace loops with a table. The condition is checked one more time than the body runs.
      - Every loop needs: initialisation, condition, update towards the end.
      - Off-by-one: check the first value, the last value and the count.
      - Nested loops multiply: n × m iterations.
      - Test edge cases: 0, 1, negative numbers, empty input.
    questions:
      - type: output
        prompt: "Interleaving. The Input box contains `hello 3`."
        code: |
          #include <iostream>
          #include <string>

          int main() {
              std::string w{};
              int n{};
              std::cin >> w >> n;
              for (int i{0}; i < n; ++i) {
                  std::cout << w.length() + i << (i < n - 1 ? "," : "\n");
              }
              return 0;
          }
        stdin: "hello 3"
        answer: |
          5,6,7
        why: "The length is 5; i adds 0, 1, 2. The ternary prints commas between items and a newline after the last."
      - type: output
        code: |
          #include <iostream>

          int main() {
              int x{17};
              int steps{0};
              while (x != 1) {
                  x = (x % 2 == 0) ? x / 2 : x - 1;
                  ++steps;
              }
              std::cout << steps << '\n';
              return 0;
          }
        answer: |
          5
        why: "17 → 16 → 8 → 4 → 2 → 1: five steps."
      - type: mcq
        prompt: Which loop best fits *print every line of a file, however many there are*?
        options:
          - "`for (int i{0}; i < 100; ++i)`"
          - "a `while` loop that reads until the input ends"
          - "a `switch`"
          - "`do { } while (false);`"
        answer: 1
        why: The number of lines isn't known in advance; loop while reading succeeds.

