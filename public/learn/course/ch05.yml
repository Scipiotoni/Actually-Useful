  - type: challenge
    id: c5-ch-gcd
    title: Greatest common divisor
    difficulty: 2
    tags: [loops, maths]
    prompt: |
      The **greatest common divisor** (GCD) of two numbers is the largest
      number that divides both. Euclid found a beautiful method 2,300 years
      ago: replace the pair `(a, b)` with `(b, a % b)` until `b` is 0 — then
      `a` is the answer.

      Read two positive numbers and print their GCD and their **least common
      multiple** (LCM = a × b / GCD). For input `12 18`:

      ```text
      GCD: 6
      LCM: 36
      ```
    starter: |
      #include <iostream>

      int main() {

          return 0;
      }
    tests:
      - in: "12 18"
        out: |
          GCD: 6
          LCM: 36
      - in: "7 13"
        out: |
          GCD: 1
          LCM: 91
      - in: "100000 250000"
        out: |
          GCD: 50000
          LCM: 500000
        hidden: true
    hints:
      - Keep copies of the original `a` and `b` — the loop destroys them, and you need them for the LCM.
      - "Inside the loop: `long long r = a % b; a = b; b = r;`"
      - Compute the LCM as `a / gcd * b` to keep intermediate values small.
    solution: |
      #include <iostream>

      int main() {
          long long a{};
          long long b{};
          std::cin >> a >> b;
          long long x{a};
          long long y{b};
          while (y != 0) {
              long long r = x % y;
              x = y;
              y = r;
          }
          std::cout << "GCD: " << x << '\n';
          std::cout << "LCM: " << a / x * b << '\n';
          return 0;
      }
    explain: |
      Why does it work? Any number dividing both `a` and `b` also divides
      `a % b` (which is `a` minus a multiple of `b`), so the pair's common
      divisors never change — while the numbers shrink fast.

