          int main() {
              Formal f{};
              Casual c{};
              std::cout << f.greet("Ada") << ' ' << c.greet("Al") << '\n';
              return 0;
          }
        answer: |
          Good day, Ada. Hey Al!
        why: "Casual doesn't override `close`, so it inherits the base version `!`."
      - type: mcq
        prompt: "`void show(Shape s)` is called with a `Circle`. What is `s` inside `show`?"
        options:
          - The Circle itself
          - A sliced copy — just the Shape part
          - A reference to the Circle
          - A compile error, always
        answer: 1
