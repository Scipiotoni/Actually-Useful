id: ch12
number: 12
part: p3
title: Inheritance and Polymorphism
blurb: Build families of related types and write code that works with all of them — without knowing which one it has.
hours: 6
goals:
  - Derive a class from a base class and call the base constructor
  - Use `protected`, and predict the order of construction and destruction
  - Make functions `virtual`, use `override`, and explain dynamic dispatch
  - Write abstract classes with pure virtual functions to define interfaces
  - Avoid object slicing, and give polymorphic bases a virtual destructor
  - Choose composition over inheritance when "has-a" fits better than "is-a"

items:
  - type: lesson
    id: c12-inherit
    title: "Inheritance: \"is a kind of\""
    minutes: 22
    objectives:
      - Derive a class from a base class with public inheritance
      - Call a base-class constructor from a derived constructor
      - Use `protected` members, and predict construction and destruction order
    body: |
      Many types are **special kinds** of other types. A `SavingsAccount` *is
      an* `Account` with interest. A `Dog` *is an* `Animal`. **Inheritance**
      lets a new class — the **derived** class — reuse everything a **base**
      class has, and add to it.

      ```cpp
      #include <iostream>
      #include <string>

      class Animal {
      public:
          explicit Animal(const std::string& name) : name_{name} {}

          void eat() const {
              std::cout << name_ << " is eating\n";
          }

          const std::string& name() const { return name_; }

      private:
          std::string name_;
      };

      class Dog : public Animal {
      public:
          explicit Dog(const std::string& name) : Animal{name} {}

          void fetch() const {
              std::cout << name() << " fetches the ball\n";
          }
      };

      int main() {
          Dog rex{"Rex"};
          rex.eat();      // inherited from Animal
          rex.fetch();    // Dog's own
          return 0;
      }
      ```

      ```output
      Rex is eating
      Rex fetches the ball
      ```

      - `class Dog : public Animal` — `Dog` derives from `Animal`. Every `Dog` contains an `Animal` part, and all of `Animal`'s public members are public members of `Dog` too.
      - `Dog`'s constructor must construct its `Animal` part: `: Animal{name}` in the initialiser list calls the base constructor.
      - `Dog` can't touch `name_` directly — it's `private` to `Animal`. It uses the public `name()` like everyone else.

      ## `protected`

      Between `public` and `private` there's **`protected`**: accessible to the
      class itself **and to classes derived from it**, but not to outside
      code. Use it sparingly — a derived class that can modify the base's data
      directly can break the base's invariants. Protected *functions* are
      usually fine; protected *data* often isn't.

      ## Construction and destruction order

      A derived object is built **base first**, then the derived part; it's
      destroyed in the **reverse** order:

      ```cpp
      #include <iostream>

      class Base {
      public:
          Base() { std::cout << "Base built\n"; }
          ~Base() { std::cout << "Base destroyed\n"; }
      };

      class Derived : public Base {
      public:
          Derived() { std::cout << "Derived built\n"; }
          ~Derived() { std::cout << "Derived destroyed\n"; }
      };

      int main() {
          Derived d{};
          std::cout << "--\n";
          return 0;
      }
      ```

      ```output
      Base built
      Derived built
      --
      Derived destroyed
      Base destroyed
      ```

      That makes sense: the derived part may use the base part, so the base
      must exist first and be destroyed last.

      {{check inherit-output}}

      {{check access}}
    checks:
      - id: inherit-output
        type: output
        code: |
          #include <iostream>

          class Counter {
          public:
              void add(int n) { total_ += n; }
              int total() const { return total_; }
          private:
              int total_{0};
          };

          class DoubleCounter : public Counter {
          public:
              void addTwice(int n) {
                  add(n);
                  add(n);
              }
          };

          int main() {
              DoubleCounter c{};
              c.add(1);
              c.addTwice(5);
              std::cout << c.total() << '\n';
              return 0;
          }
        answer: |
          11
        why: "`add` and `total` are inherited: 1 + 5 + 5 = 11."
      - id: access
        type: mcq
        prompt: "Class `B` derives publicly from `A`. `A` has a `private` member `x_` and a `protected` member `y_`. Inside `B`'s member functions, which can be used?"
        options:
          - Both
          - Only `y_`
          - Only `x_`
          - Neither
        answer: 1
        why: "Protected members are accessible to derived classes; private members are not."
    cards:
      - front: What does `class Dog : public Animal` mean?
        back: Dog derives from Animal — every Dog *is an* Animal and inherits Animal's members (public ones stay public).
      - front: How does a derived constructor initialise its base part?
        back: "By calling the base constructor in its initialiser list: `Dog(...) : Animal{name} {}`."
      - front: What does `protected` mean?
        back: Accessible inside the class and in derived classes, but not to outside code.
      - front: In what order are base and derived parts constructed and destroyed?
        back: Constructed base first, then derived; destroyed in reverse (derived first, then base).

  - type: lesson
    id: c12-virtual
    title: Virtual functions and polymorphism
    minutes: 26
    objectives:
      - Use a base-class reference or pointer to refer to a derived object
      - Make a function `virtual` so the derived version is called
      - Mark overriding functions with `override`
      - Write code that works with a whole family of types
    body: |
      A `Dog` is an `Animal`, so a `Dog` can be used wherever an `Animal&` or
      `Animal*` is expected. That's where inheritance gets its real power —
      and where there's a trap.

      ```cpp
      #include <iostream>

      class Animal {
      public:
          void speak() const { std::cout << "...\n"; }
      };

      class Dog : public Animal {
      public:
          void speak() const { std::cout << "Woof!\n"; }
      };

      void makeItSpeak(const Animal& a) {
          a.speak();
      }

      int main() {
          Dog d{};
          d.speak();
          makeItSpeak(d);
          return 0;
      }
      ```

      ```output
      Woof!
      ...
      ```

      Through the `Animal&`, the **Animal** version ran. By default, C++ picks
      the function from the **static type** — the type the code says
      (`Animal&`) — at compile time.

      ## `virtual`: choose at run time

      Mark the base function **`virtual`**, and C++ instead looks at the
      **actual object** at run time and calls *its* version. In the derived
      class, mark the replacement with **`override`**:

      ```cpp
      #include <iostream>
      #include <vector>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void speak() const { std::cout << "...\n"; }
      };

      class Dog : public Animal {
      public:
          void speak() const override { std::cout << "Woof!\n"; }
      };

      class Cat : public Animal {
      public:
          void speak() const override { std::cout << "Meow!\n"; }
      };

      int main() {
          Dog rex{};
          Cat tom{};
          Animal generic{};
          std::vector<const Animal*> zoo{&rex, &tom, &generic};
          for (const Animal* a : zoo) {
              a->speak();
          }
          return 0;
      }
      ```

      ```output
      Woof!
      Meow!
      ...
      ```

      One loop, one call `a->speak()` — and each object does its own thing.
      This is **polymorphism** ("many forms"): code written against the base
      class works for every derived class, **including ones written later**.
      Add a `Cow` next year and the loop handles it without changing a line.

      (The `virtual ~Animal() = default;` line is explained in lesson 12.4 —
      for now, always put one in a base class with virtual functions.)

      ## Why `override`?

      `override` asks the compiler to **check** that the function really
      overrides a virtual function of the base. A tiny mismatch — a missing
      `const`, a different parameter type — would otherwise silently create a
      *new* function instead of overriding, and the base version would keep
      being called:

      ```cpp error
      #include <iostream>

      class Shape {
      public:
          virtual ~Shape() = default;
          virtual double area() const { return 0; }
      };

      class Square : public Shape {
      public:
          double area() override { return 4; }   // forgot const: doesn't override!
      };

      int main() {
          Square s{};
          std::cout << s.area() << '\n';
          return 0;
      }
      ```

      With `override`, that mistake is a compile error instead of a bug.
      **Always write `override`.**

      > [!deep] How does it work?
      > A class with virtual functions gets a hidden table of function
      > pointers (the *vtable*), and each object a hidden pointer to its
      > class's table. A virtual call looks up the right function through it —
      > a tiny cost, paid only for virtual functions.

      {{check virtual-output}}

      {{task shapes}}
    checks:
      - id: virtual-output
        type: output
        code: |
          #include <iostream>

          class Base {
          public:
              virtual ~Base() = default;
              virtual char v() const { return 'B'; }
              char n() const { return 'b'; }
          };

          class Derived : public Base {
          public:
              char v() const override { return 'D'; }
              char n() const { return 'd'; }
          };

          int main() {
              Derived d{};
              const Base& r = d;
              std::cout << r.v() << r.n() << d.v() << d.n() << '\n';
              return 0;
          }
        answer: |
          DbDd
        why: "Through the Base reference, the virtual `v` uses the real object (D), but the non-virtual `n` uses the static type (b). Called on `d` directly, both are Derived's."
      - id: override-why
        type: mcq
        prompt: What does `override` do?
        options:
          - It makes the function virtual in the base class
          - It asks the compiler to check that the function really overrides a base virtual function
          - It prevents the function from being called
          - It makes the function faster
        answer: 1
        why: "A signature mismatch becomes a compile error instead of a silent bug."
    tasks:
      - id: shapes
        title: Shapes
        prompt: |
          The starter has a base class `Shape` with `virtual double area() const`.
          Write `Rectangle` (width, height) and `Circle` (radius; use
          `3.14159265358979` for π) that override it, and a function
          `double totalArea(const std::vector<const Shape*>& shapes)`.
        starter: |
          #include <vector>

          class Shape {
          public:
              virtual ~Shape() = default;
              virtual double area() const { return 0.0; }
          };

          class Rectangle : public Shape {
          public:
              Rectangle(double width, double height) : width_{width}, height_{height} {}
          private:
              double width_;
              double height_;
          };

          class Circle : public Shape {
          public:
              explicit Circle(double radius) : radius_{radius} {}
          private:
              double radius_;
          };

          double totalArea(const std::vector<const Shape*>& shapes) {
              return 0.0;
          }
        harness: |
          Rectangle r{3, 4};
          Circle c{1};
          CHECK(r.area(), 12.0);
          CHECK(c.area(), 3.14159265358979);
          const Shape& s = r;
          CHECK(s.area(), 12.0);
          CHECK(totalArea({&r, &c, &r}), 24 + 3.14159265358979);
          CHECK(totalArea({}), 0.0);
        hints:
          - "In `Rectangle`: `double area() const override { return width_ * height_; }`."
          - "`totalArea` loops over the pointers and adds `s->area()`."
        solution: |
          #include <vector>

          class Shape {
          public:
              virtual ~Shape() = default;
              virtual double area() const { return 0.0; }
          };

          class Rectangle : public Shape {
          public:
              Rectangle(double width, double height) : width_{width}, height_{height} {}
              double area() const override { return width_ * height_; }
          private:
              double width_;
              double height_;
          };

          class Circle : public Shape {
          public:
              explicit Circle(double radius) : radius_{radius} {}
              double area() const override { return 3.14159265358979 * radius_ * radius_; }
          private:
              double radius_;
          };

          double totalArea(const std::vector<const Shape*>& shapes) {
              double total{0.0};
              for (const Shape* s : shapes) {
                  total += s->area();
              }
              return total;
          }
    cards:
      - front: What does `virtual` do?
        back: Makes calls through a base reference/pointer choose the function of the **actual object** at run time (dynamic dispatch).
      - front: What is **polymorphism**?
        back: Code written against a base class that works with every derived class, each object behaving in its own way.
      - front: Why always write `override`?
        back: So the compiler checks it really overrides a base virtual function; a signature mistake becomes an error, not a silent bug.
      - front: Without `virtual`, which version does `baseRef.f()` call?
        back: The base class's version — chosen from the static type at compile time.

  - type: lesson
    id: c12-abstract
    title: Abstract classes and interfaces
    minutes: 20
    objectives:
      - Declare pure virtual functions with `= 0`
      - Explain why an abstract class can't be instantiated
      - Program against an interface
    body: |
      What's the area of a generic "shape"? The question makes no sense —
      only specific shapes have areas. Instead of returning a made-up 0, a
      base class can declare a function **pure virtual** with `= 0`: "every
      derived class must provide this; I don't have a version".

      ```cpp
      #include <iostream>
      #include <string>
      #include <vector>

      class Shape {
      public:
          virtual ~Shape() = default;
          virtual double area() const = 0;              // pure virtual
          virtual std::string name() const = 0;

          void describe() const {                        // ordinary function using them
              std::cout << name() << " with area " << area() << '\n';
          }
      };

      class Square : public Shape {
      public:
          explicit Square(double side) : side_{side} {}
          double area() const override { return side_ * side_; }
          std::string name() const override { return "square"; }
      private:
          double side_;
      };

      class Triangle : public Shape {
      public:
          Triangle(double base, double height) : base_{base}, height_{height} {}
          double area() const override { return base_ * height_ / 2; }
          std::string name() const override { return "triangle"; }
      private:
          double base_;
          double height_;
      };

      int main() {
          Square sq{3};
          Triangle tr{4, 5};
          std::vector<const Shape*> shapes{&sq, &tr};
          for (const Shape* s : shapes) {
              s->describe();
          }
          return 0;
      }
      ```

      ```output
      square with area 9
      triangle with area 10
      ```

      A class with at least one pure virtual function is **abstract**: you
      **can't create objects of it** — `Shape s{};` is a compile error. It
      exists only to be derived from. A derived class that doesn't override
      every pure virtual function is abstract too.

      Notice `describe()`: an ordinary function in the base that calls the
      virtual ones. The base defines the *algorithm*; derived classes fill in
      the *steps*.

      ## Interfaces

      An abstract class with **only** pure virtual functions (and a virtual
      destructor) is an **interface**: a pure contract, with no data and no
      code. Other code can depend on the interface alone:

      ```cpp
      #include <iostream>
      #include <string>

      class Logger {
      public:
          virtual ~Logger() = default;
          virtual void log(const std::string& message) = 0;
      };

      class ConsoleLogger : public Logger {
      public:
          void log(const std::string& message) override {
              std::cout << "[log] " << message << '\n';
          }
      };

      class CountingLogger : public Logger {
      public:
          void log(const std::string&) override { ++count_; }
          int count() const { return count_; }
      private:
          int count_{0};
      };

      void transfer(Logger& logger, int amount) {
          logger.log("transferring " + std::to_string(amount));
          logger.log("done");
      }

      int main() {
          ConsoleLogger console{};
          CountingLogger counter{};
          transfer(console, 50);
          transfer(counter, 50);
          std::cout << counter.count() << " messages counted\n";
          return 0;
      }
      ```

      ```output
      [log] transferring 50
      [log] done
      2 messages counted
      ```

      `transfer` doesn't know or care where messages go. In tests you pass a
      counting logger; in production, one that writes to a file. That's
      **programming to an interface** — one of the most useful design ideas
      there is.

      {{check abstract}}

      {{task animals}}
    checks:
      - id: abstract
        type: mcq
        prompt: "`class Instrument { public: virtual void play() const = 0; virtual ~Instrument() = default; };` Which line compiles?"
        options:
          - "`Instrument i{};`"
          - "`std::vector<Instrument> band;` then `band.push_back(Instrument{});`"
          - "`void perform(const Instrument& i) { i.play(); }`"
          - "`Instrument* p = new Instrument{};`"
        answer: 2
        why: "Abstract classes can't be instantiated, but references and pointers to them are fine — that's how they're used."
      - id: pure-output
        type: output
        code: |
          #include <iostream>

          class Step {
          public:
              virtual ~Step() = default;
              void run() const {
                  std::cout << '<' << body() << '>';
              }
          private:
              virtual char body() const = 0;
          };

          class A : public Step {
              char body() const override { return 'a'; }
          };

          class B : public Step {
              char body() const override { return 'b'; }
          };

          int main() {
              A a{};
              B b{};
              a.run();
              b.run();
              std::cout << '\n';
              return 0;
          }
        answer: |
          <a><b>
        why: "`run` is the fixed algorithm; each class supplies its own `body`. (A virtual function can even be private — derived classes can still override it.)"
    tasks:
      - id: animals
        title: Animal sounds
        prompt: |
          Make `Animal` abstract with `virtual std::string sound() const = 0;`
          and an ordinary member `std::string speak() const` returning
          `name + " says " + sound()`. Write `Dog` (`"Woof"`) and `Cow`
          (`"Moo"`). Both take their name in the constructor.
        starter: |
          #include <string>

          class Animal {
          public:
              explicit Animal(const std::string& name) : name_{name} {}
              virtual ~Animal() = default;

              std::string speak() const {
                  return "";
              }

          protected:
              std::string name_;
          };

          class Dog : public Animal {
          public:
              explicit Dog(const std::string& name) : Animal{name} {}
          };

          class Cow : public Animal {
          public:
              explicit Cow(const std::string& name) : Animal{name} {}
          };
        starter_broken: true
        harness: |
          Dog d{"Rex"};
          Cow c{"Daisy"};
          CHECK(d.speak(), "Rex says Woof");
          CHECK(c.speak(), "Daisy says Moo");
          const Animal& a = c;
          CHECK(a.sound(), "Moo");
        hints:
          - "In `Animal`, add the pure virtual `sound`, and make `speak` return `name_ + \" says \" + sound();`."
          - "Each derived class adds `std::string sound() const override { return \"Woof\"; }`."
        solution: |
          #include <string>

          class Animal {
          public:
              explicit Animal(const std::string& name) : name_{name} {}
              virtual ~Animal() = default;

              virtual std::string sound() const = 0;

              std::string speak() const {
                  return name_ + " says " + sound();
              }

          protected:
              std::string name_;
          };

          class Dog : public Animal {
          public:
              explicit Dog(const std::string& name) : Animal{name} {}
              std::string sound() const override { return "Woof"; }
          };

          class Cow : public Animal {
          public:
              explicit Cow(const std::string& name) : Animal{name} {}
              std::string sound() const override { return "Moo"; }
          };
    cards:
      - front: What is a **pure virtual** function?
        back: "A virtual function declared with `= 0` and no body in the base; every concrete derived class must override it."
      - front: What is an **abstract class**?
        back: A class with at least one pure virtual function. It can't be instantiated — only used through references/pointers to derived objects.
      - front: What is an **interface** in C++?
        back: An abstract class with only pure virtual functions (and a virtual destructor) — a contract other code can depend on.

  - type: quiz
    id: c12-quiz1
    title: "Quiz: inheritance and virtual functions"
    questions:
      - type: output
        code: |
          #include <iostream>

          class A {
          public:
              A() { std::cout << "A"; }
              ~A() { std::cout << "a"; }
          };

          class B : public A {
          public:
              B() { std::cout << "B"; }
              ~B() { std::cout << "b"; }
          };

          int main() {
              B x{};
              std::cout << '-';
              return 0;
          }
        answer: |
          AB-ba
        why: "Base constructed first, destroyed last."
      - type: output
        code: |
          #include <iostream>

          class Vehicle {
          public:
              virtual ~Vehicle() = default;
              virtual int wheels() const { return 0; }
          };

          class Bike : public Vehicle {
          public:
              int wheels() const override { return 2; }
          };

          class Car : public Vehicle {
          public:
              int wheels() const override { return 4; }
          };

          int count(const Vehicle& a, const Vehicle& b) {
              return a.wheels() + b.wheels();
          }

          int main() {
              Bike b{};
              Car c{};
              std::cout << count(b, c) << ' ' << count(c, c) << '\n';
              return 0;
          }
        answer: |
          6 8
        why: "Virtual calls use the real objects: 2 + 4 and 4 + 4."
      - type: mcq
        prompt: What happens if a derived class forgets to override one pure virtual function?
        options:
          - The base version is used
          - The derived class is abstract too — creating objects of it is a compile error
          - A run-time crash
          - It returns 0
        answer: 1
        why: "There is no base version; the class stays abstract."
      - type: spot
        prompt: "The loop should print each animal's own sound, but every animal prints `...`. Which line needs a keyword?"
        code: |
          #include <iostream>
          #include <vector>

          class Animal {
          public:
              void sound() const { std::cout << "...\n"; }
          };

          class Duck : public Animal {
          public:
              void sound() const { std::cout << "Quack\n"; }
          };

          int main() {
              Duck d{};
              std::vector<const Animal*> all{&d};
              for (const Animal* a : all) {
                  a->sound();
              }
              return 0;
          }
        answer: 6
        why: "Without `virtual` in the base, the call through `Animal*` always uses Animal's version."

  - type: lesson
    id: c12-pitfalls
    title: Slicing and virtual destructors
    minutes: 18
    objectives:
      - Recognise object slicing and avoid it by using references and pointers
      - Explain why a polymorphic base class needs a virtual destructor
    body: |
      Two classic traps come with polymorphism. Both have simple rules that
      avoid them completely.

      ## Object slicing

      A derived object can be **copied into** a base object — but only the
      base part is copied. The rest is **sliced off**, and the copy is a plain
      base object:

      ```cpp
      #include <iostream>
      #include <string>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual std::string sound() const { return "..."; }
      };

      class Dog : public Animal {
      public:
          std::string sound() const override { return "Woof"; }
      };

      void byValue(Animal a) { std::cout << a.sound() << '\n'; }
      void byReference(const Animal& a) { std::cout << a.sound() << '\n'; }

      int main() {
          Dog d{};
          byValue(d);       // sliced: a is just an Animal
          byReference(d);   // no copy: still the Dog
          return 0;
      }
      ```

      ```output
      ...
      Woof
      ```

      The same happens with `std::vector<Animal>` — `push_back(dog)` stores a
      sliced copy. **Rule: pass and store polymorphic objects by reference or
      pointer, never by value.** (That's why the examples used
      `std::vector<const Animal*>`. Chapter 15's `std::unique_ptr` makes owning
      containers of polymorphic objects safe.)

      ## Virtual destructors

      Suppose a derived object is created with `new` and deleted through a
      **base pointer**:

      ```cpp
      #include <iostream>

      class Base {
      public:
          virtual ~Base() { std::cout << "~Base\n"; }
      };

      class Derived : public Base {
      public:
          ~Derived() override { std::cout << "~Derived\n"; }
      };

      int main() {
          Base* p = new Derived{};
          delete p;
          return 0;
      }
      ```

      ```output
      ~Derived
      ~Base
      ```

      Because the destructor is `virtual`, `delete p` runs the **Derived**
      destructor first, then the Base one — everything is cleaned up. Without
      `virtual` on `~Base`, deleting a derived object through a base pointer is
      **undefined behaviour**: typically only `~Base` runs, and the derived
      part's resources leak.

      > [!remember]
      > **Any class with a virtual function gets a virtual destructor**:
      > `virtual ~Base() = default;`. It costs nothing extra (the class already
      > has a vtable) and prevents a nasty class of bugs.

      {{check slicing}}
    checks:
      - id: slicing
        type: output
        code: |
          #include <iostream>
          #include <vector>

          class Item {
          public:
              virtual ~Item() = default;
              virtual int price() const { return 1; }
          };

          class Gem : public Item {
          public:
              int price() const override { return 100; }
          };

          int main() {
              Gem g{};
              std::vector<Item> byValue{g};
              std::vector<const Item*> byPointer{&g};
              std::cout << byValue[0].price() << ' ' << byPointer[0]->price() << '\n';
              return 0;
          }
        answer: |
          1 100
        why: "The vector of `Item` stores a sliced copy — a plain Item. The vector of pointers still refers to the Gem."
      - id: vdtor
        type: mcq
        prompt: "Why does `class Base { public: virtual void f(); ~Base(); };` have a problem?"
        options:
          - It doesn't — the destructor is fine
          - Deleting a derived object through a `Base*` is undefined behaviour because the destructor isn't virtual
          - "`f` must be pure virtual"
          - Destructors can't be declared in classes with virtual functions
        answer: 1
        why: "A polymorphic base needs `virtual ~Base()` so `delete basePtr` runs the derived destructor too."
    cards:
      - front: What is **object slicing**?
        back: Copying a derived object into a base object by value — only the base part is copied, and the derived behaviour is lost.
      - front: How do you avoid slicing?
        back: Pass and store polymorphic objects by reference or pointer, never by value.
      - front: Why must a polymorphic base class have a virtual destructor?
        back: Deleting a derived object through a base pointer is undefined behaviour otherwise (the derived destructor wouldn't run).

  - type: lesson
    id: c12-composition
    title: Composition over inheritance
    minutes: 18
    objectives:
      - Tell an "is-a" relationship from a "has-a" relationship
      - Build a class by composing other objects
      - Explain the Liskov substitution principle with an example
    body: |
      Inheritance is powerful, and beginners tend to use it everywhere. Most
      experienced C++ programmers follow the opposite advice: **prefer
      composition**.

      ## is-a versus has-a

      - A dog **is an** animal → inheritance can fit.
      - A car **has an** engine → the engine is a **member**. A car is not a kind of engine!

      Building a class out of other objects is **composition**:

      ```cpp
      #include <iostream>
      #include <string>

      class Engine {
      public:
          explicit Engine(int horsepower) : hp_{horsepower} {}
          void start() const { std::cout << hp_ << "hp engine starts\n"; }
      private:
          int hp_;
      };

      class Car {
      public:
          Car(const std::string& model, int horsepower) : model_{model}, engine_{horsepower} {}
          void drive() const {
              engine_.start();
              std::cout << model_ << " drives off\n";
          }
      private:
          std::string model_;
          Engine engine_;   // a Car has an Engine
      };

      int main() {
          Car car{"Roadster", 300};
          car.drive();
          return 0;
      }
      ```

      ```output
      300hp engine starts
      Roadster drives off
      ```

      Composition keeps classes independent: `Car` uses only `Engine`'s public
      interface, and you can change either one without breaking the other.
      Inheritance ties the derived class tightly to the base's internals.

      ## The substitution test

      Inheritance promises that a derived object can be used **anywhere** a
      base object can, without surprises. This is the **Liskov substitution
      principle**. The famous violation: a `Square` derived from `Rectangle`.

      Mathematically a square *is* a rectangle. But if `Rectangle` has
      `setWidth` and `setHeight`, what should `Square::setWidth(5)` do? If it
      changes only the width, it's no longer a square. If it changes both,
      code that expects "setting the width doesn't change the height" breaks:

      ```cpp static
      void stretch(Rectangle& r) {
          r.setWidth(10);
          r.setHeight(2);
          // Code here expects area() == 20. For a Square, it isn't.
      }
      ```

      The lesson: "is-a" must hold for **behaviour**, not just for the
      real-world idea. If a derived class can't honour every promise of the
      base, don't derive — compose, or rethink the design.

      > [!tip] A rule of thumb
      > Use public inheritance when you need **polymorphism** — code that
      > works on a base reference and should accept many kinds of object. To
      > **reuse code**, use composition.

      {{check isa}}
    checks:
      - id: isa
        type: mcq
        prompt: Which relationship is best modelled with inheritance?
        options:
          - A `Library` and its `Book`s
          - A `Circle` and a `Shape` interface drawn by a renderer
          - A `Computer` and its `Keyboard`
          - A `Player` and their `Inventory`
        answer: 1
        why: "A circle *is a* shape, and the renderer needs polymorphism. The others are \"has-a\" — composition."
    cards:
      - front: "\"is-a\" vs \"has-a\"?"
        back: "is-a (a Dog is an Animal) may call for inheritance; has-a (a Car has an Engine) calls for composition — a member object."
      - front: What is the **Liskov substitution principle**?
        back: A derived object must be usable anywhere a base object is, without breaking expectations. (Square-derived-from-Rectangle is the classic violation.)
      - front: Composition or inheritance by default?
        back: Composition. Use public inheritance when you need polymorphism.

  - type: quiz
