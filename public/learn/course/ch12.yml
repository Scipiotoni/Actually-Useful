  - type: project
    id: c12-project
    title: "Project: Arena Battle"
    body: |
      A turn-based battle simulator — the core of every RPG — built with a
      class hierarchy. Each fighter class has its own rules, but the battle
      loop treats them all the same through a base-class interface. That's
      polymorphism doing real work.

      Rules common to all milestones: fighters take turns, **first fighter
      first**. Damage reduces health; health can't go below 0. When a
      fighter's health reaches 0, print `NAME is defeated!` then
      `WINNER wins!` and stop.
    milestones:
      - title: Two fighters
        prompt: |
          Write `class Fighter` with a name, health and power, and a battle
          between two fighters. Input: two lines `NAME HEALTH POWER`. On each
          turn the attacker deals damage equal to its power. Print each hit:

          ```text
          Ann hits Bob for 7 (Bob: 13)
          ```

          For input `Ann 30 7` / `Bob 20 9`:

          ```text
          Ann hits Bob for 7 (Bob: 13)
          Bob hits Ann for 9 (Ann: 21)
          Ann hits Bob for 7 (Bob: 6)
          Bob hits Ann for 9 (Ann: 12)
          Ann hits Bob for 7 (Bob: 0)
          Bob is defeated!
          Ann wins!
          ```
        starter: |
          #include <iostream>
          #include <string>

          class Fighter {
          public:

          private:
          };

          int main() {

              return 0;
          }
        tests:
          - in: |
              Ann 30 7
              Bob 20 9
            out: |
              Ann hits Bob for 7 (Bob: 13)
              Bob hits Ann for 9 (Ann: 21)
              Ann hits Bob for 7 (Bob: 6)
              Bob hits Ann for 9 (Ann: 12)
              Ann hits Bob for 7 (Bob: 0)
              Bob is defeated!
              Ann wins!
          - in: |
              Weak 5 1
              Strong 50 10
            out: |
              Weak hits Strong for 1 (Strong: 49)
              Strong hits Weak for 10 (Weak: 0)
              Weak is defeated!
              Strong wins!
        hints:
          - "`Fighter` needs: a constructor, `name()`, `health()`, `alive()`, `power()` and `takeDamage(int)` that keeps health ≥ 0."
          - "The battle: two references `attacker` and `defender`; after each hit, if the defender is dead, announce and stop; otherwise swap roles."
          - "Swapping roles with references isn't possible (they can't be reseated) — use pointers: `Fighter* attacker = &a; Fighter* defender = &b;` and `std::swap(attacker, defender)`."
        solution: |
          #include <iostream>
          #include <string>
          #include <utility>

          class Fighter {
          public:
              Fighter(const std::string& name, int health, int power)
                  : name_{name}, health_{health}, power_{power} {}

              const std::string& name() const { return name_; }
              int health() const { return health_; }
              int power() const { return power_; }
              bool alive() const { return health_ > 0; }

              void takeDamage(int amount) {
                  health_ -= amount;
                  if (health_ < 0) {
                      health_ = 0;
                  }
              }

          private:
              std::string name_;
              int health_;
              int power_;
          };

          int main() {
              std::string n1{};
              std::string n2{};
              int h1{};
              int p1{};
              int h2{};
              int p2{};
              std::cin >> n1 >> h1 >> p1 >> n2 >> h2 >> p2;
              Fighter a{n1, h1, p1};
              Fighter b{n2, h2, p2};

              Fighter* attacker = &a;
              Fighter* defender = &b;
              while (true) {
                  int damage = attacker->power();
                  defender->takeDamage(damage);
                  std::cout << attacker->name() << " hits " << defender->name() << " for " << damage
                            << " (" << defender->name() << ": " << defender->health() << ")\n";
                  if (!defender->alive()) {
                      std::cout << defender->name() << " is defeated!\n";
                      std::cout << attacker->name() << " wins!\n";
                      break;
                  }
                  std::swap(attacker, defender);
              }
              return 0;
          }
      - title: Warriors and mages
        prompt: |
          Now fighters come in **classes**. Input lines become
          `TYPE NAME HEALTH POWER`, where `TYPE` is `warrior` or `mage`:

          - A **warrior** has armour: damage it *receives* is reduced by 2 (but always at least 1).
          - A **mage** casts a fireball on every **third** attack it makes (its 3rd, 6th, …): that attack deals **triple** its power.

          Make `Fighter` a base class with **virtual** functions — for
          example `virtual int attackDamage()` and `virtual int reduce(int damage) const` —
          overridden by `Warrior` and `Mage`. The battle loop must work with
          `Fighter` pointers/references only. Print the damage actually dealt.

          For input `warrior Conan 30 5` / `mage Merlin 20 4`:

          ```text
          Conan hits Merlin for 5 (Merlin: 15)
          Merlin hits Conan for 2 (Conan: 28)
          Conan hits Merlin for 5 (Merlin: 10)
          Merlin hits Conan for 2 (Conan: 26)
          Conan hits Merlin for 5 (Merlin: 5)
          Merlin hits Conan for 10 (Conan: 16)
          Conan hits Merlin for 5 (Merlin: 0)
          Merlin is defeated!
          Conan wins!
          ```

          (Merlin's third attack is a fireball: 3 × 4 = 12, minus 2 for
          Conan's armour = 10.)
        tests:
          - in: |
              warrior Conan 30 5
              mage Merlin 20 4
            out: |
              Conan hits Merlin for 5 (Merlin: 15)
              Merlin hits Conan for 2 (Conan: 28)
              Conan hits Merlin for 5 (Merlin: 10)
              Merlin hits Conan for 2 (Conan: 26)
              Conan hits Merlin for 5 (Merlin: 5)
              Merlin hits Conan for 10 (Conan: 16)
              Conan hits Merlin for 5 (Merlin: 0)
              Merlin is defeated!
              Conan wins!
          - in: |
              mage Zed 12 3
              mage Ivy 12 4
            out: |
              Zed hits Ivy for 3 (Ivy: 9)
              Ivy hits Zed for 4 (Zed: 8)
              Zed hits Ivy for 3 (Ivy: 6)
              Ivy hits Zed for 4 (Zed: 4)
              Zed hits Ivy for 9 (Ivy: 0)
              Ivy is defeated!
              Zed wins!
          - in: |
              warrior Tank 10 1
              warrior Wall 10 2
            out: |
              Tank hits Wall for 1 (Wall: 9)
              Wall hits Tank for 1 (Tank: 9)
              Tank hits Wall for 1 (Wall: 8)
              Wall hits Tank for 1 (Tank: 8)
              Tank hits Wall for 1 (Wall: 7)
              Wall hits Tank for 1 (Tank: 7)
              Tank hits Wall for 1 (Wall: 6)
              Wall hits Tank for 1 (Tank: 6)
              Tank hits Wall for 1 (Wall: 5)
              Wall hits Tank for 1 (Tank: 5)
              Tank hits Wall for 1 (Wall: 4)
              Wall hits Tank for 1 (Tank: 4)
              Tank hits Wall for 1 (Wall: 3)
              Wall hits Tank for 1 (Tank: 3)
              Tank hits Wall for 1 (Wall: 2)
              Wall hits Tank for 1 (Tank: 2)
              Tank hits Wall for 1 (Wall: 1)
              Wall hits Tank for 1 (Tank: 1)
              Tank hits Wall for 1 (Wall: 0)
              Wall is defeated!
              Tank wins!
        hints:
          - "`attackDamage()` isn't `const` for a mage — it counts its attacks."
          - "A hit: `int dealt = defender->reduce(attacker->attackDamage()); defender->takeDamage(dealt);`"
          - "Create the fighters from the input with a helper that returns a `Fighter*` from `new Warrior{...}` or `new Mage{...}` — and `delete` them at the end (with a virtual destructor in `Fighter`!)."
        solution: |
          #include <iostream>
          #include <string>
          #include <utility>

          class Fighter {
          public:
              Fighter(const std::string& name, int health, int power)
                  : name_{name}, health_{health}, power_{power} {}
              virtual ~Fighter() = default;

              const std::string& name() const { return name_; }
              int health() const { return health_; }
              bool alive() const { return health_ > 0; }

              virtual int attackDamage() { return power_; }
              virtual int reduce(int damage) const { return damage; }

              void takeDamage(int amount) {
                  health_ -= amount;
                  if (health_ < 0) {
                      health_ = 0;
                  }
              }

          protected:
              int power() const { return power_; }

          private:
              std::string name_;
              int health_;
              int power_;
          };

          class Warrior : public Fighter {
          public:
              using Fighter::Fighter;

              int reduce(int damage) const override {
                  return damage - 2 < 1 ? 1 : damage - 2;
              }
          };

          class Mage : public Fighter {
          public:
              using Fighter::Fighter;

              int attackDamage() override {
                  ++attacks_;
                  return attacks_ % 3 == 0 ? 3 * power() : power();
              }

          private:
              int attacks_{0};
          };

          Fighter* makeFighter(const std::string& type, const std::string& name, int health, int power) {
              if (type == "warrior") {
                  return new Warrior{name, health, power};
              }
              return new Mage{name, health, power};
          }

          Fighter* readFighter() {
              std::string type{};
              std::string name{};
              int health{};
              int power{};
              std::cin >> type >> name >> health >> power;
              return makeFighter(type, name, health, power);
          }

          int main() {
              Fighter* a = readFighter();
              Fighter* b = readFighter();

              Fighter* attacker = a;
              Fighter* defender = b;
              while (true) {
                  int dealt = defender->reduce(attacker->attackDamage());
                  defender->takeDamage(dealt);
                  std::cout << attacker->name() << " hits " << defender->name() << " for " << dealt
                            << " (" << defender->name() << ": " << defender->health() << ")\n";
                  if (!defender->alive()) {
                      std::cout << defender->name() << " is defeated!\n";
                      std::cout << attacker->name() << " wins!\n";
                      break;
                  }
                  std::swap(attacker, defender);
              }

              delete a;
              delete b;
              return 0;
          }
      - title: The healer
        prompt: |
          Add a third class, **healer**: on its turn, if its health is
          **below half** of its *starting* health (integer division — health
          < start / 2), it heals itself by its power instead of attacking,
          never above its starting health. It prints:

          ```text
          Faye heals for 6 (Faye: 14)
          ```

          (showing the amount actually healed). Otherwise it attacks normally.
          Add a `virtual bool takeTurn(Fighter& opponent)` (or similar) so the
          battle loop stays the same for every class; it must still print the
          defeat and the winner.

          For input `healer Faye 20 6` / `warrior Brute 40 9`:

          ```text
          Faye hits Brute for 4 (Brute: 36)
          Brute hits Faye for 9 (Faye: 11)
          Faye hits Brute for 4 (Brute: 32)
          Brute hits Faye for 9 (Faye: 2)
          Faye heals for 6 (Faye: 8)
          Brute hits Faye for 9 (Faye: 0)
          Faye is defeated!
          Brute wins!
          ```
        tests:
          - in: |
              healer Faye 20 6
              warrior Brute 40 9
            out: |
              Faye hits Brute for 4 (Brute: 36)
              Brute hits Faye for 9 (Faye: 11)
              Faye hits Brute for 4 (Brute: 32)
              Brute hits Faye for 9 (Faye: 2)
              Faye heals for 6 (Faye: 8)
              Brute hits Faye for 9 (Faye: 0)
              Faye is defeated!
              Brute wins!
          - in: |
              healer Hana 30 4
              mage Mo 30 5
            out: |
              Hana hits Mo for 4 (Mo: 26)
              Mo hits Hana for 5 (Hana: 25)
              Hana hits Mo for 4 (Mo: 22)
              Mo hits Hana for 5 (Hana: 20)
              Hana hits Mo for 4 (Mo: 18)
              Mo hits Hana for 15 (Hana: 5)
              Hana heals for 4 (Hana: 9)
              Mo hits Hana for 5 (Hana: 4)
              Hana heals for 4 (Hana: 8)
              Mo hits Hana for 5 (Hana: 3)
              Hana heals for 4 (Hana: 7)
              Mo hits Hana for 15 (Hana: 0)
              Hana is defeated!
              Mo wins!
          - in: |
              warrior Axe 20 6
              mage Orb 15 2
            out: |
              Axe hits Orb for 6 (Orb: 9)
              Orb hits Axe for 1 (Axe: 19)
              Axe hits Orb for 6 (Orb: 3)
              Orb hits Axe for 1 (Axe: 18)
              Axe hits Orb for 6 (Orb: 0)
              Orb is defeated!
              Axe wins!
        hints:
          - "Give the base class a `virtual void takeTurn(Fighter& opponent)` that does the normal attack and prints the hit; `Healer` overrides it to heal when low."
          - "Store the starting health in the base (or in `Healer`) so the healer knows what \"half\" and \"full\" mean."
          - "Healing: `int healed = std::min(power, start - health);` — add a protected `heal(int)` to the base."
        solution: |
          #include <algorithm>
          #include <iostream>
          #include <string>
          #include <utility>

          class Fighter {
          public:
              Fighter(const std::string& name, int health, int power)
                  : name_{name}, health_{health}, start_{health}, power_{power} {}
              virtual ~Fighter() = default;

              const std::string& name() const { return name_; }
              int health() const { return health_; }
              bool alive() const { return health_ > 0; }

              virtual int attackDamage() { return power_; }
              virtual int reduce(int damage) const { return damage; }

              void takeDamage(int amount) {
                  health_ -= amount;
                  if (health_ < 0) {
                      health_ = 0;
                  }
              }

              virtual void takeTurn(Fighter& opponent) {
                  int dealt = opponent.reduce(attackDamage());
                  opponent.takeDamage(dealt);
                  std::cout << name() << " hits " << opponent.name() << " for " << dealt
                            << " (" << opponent.name() << ": " << opponent.health() << ")\n";
              }

          protected:
              int power() const { return power_; }
              int start() const { return start_; }

              int heal(int amount) {
                  int healed = std::min(amount, start_ - health_);
                  health_ += healed;
                  return healed;
              }

          private:
              std::string name_;
              int health_;
              int start_;
              int power_;
          };

          class Warrior : public Fighter {
          public:
              using Fighter::Fighter;

              int reduce(int damage) const override {
                  return damage - 2 < 1 ? 1 : damage - 2;
              }
          };

          class Mage : public Fighter {
          public:
              using Fighter::Fighter;

              int attackDamage() override {
                  ++attacks_;
                  return attacks_ % 3 == 0 ? 3 * power() : power();
              }

          private:
              int attacks_{0};
          };

          class Healer : public Fighter {
          public:
              using Fighter::Fighter;

              void takeTurn(Fighter& opponent) override {
                  if (health() < start() / 2) {
                      int healed = heal(power());
                      std::cout << name() << " heals for " << healed << " (" << name() << ": " << health() << ")\n";
                      return;
                  }
                  Fighter::takeTurn(opponent);
              }
          };

          Fighter* readFighter() {
              std::string type{};
              std::string name{};
              int health{};
              int power{};
              std::cin >> type >> name >> health >> power;
              if (type == "warrior") {
                  return new Warrior{name, health, power};
              }
              if (type == "healer") {
                  return new Healer{name, health, power};
              }
              return new Mage{name, health, power};
          }

          int main() {
              Fighter* a = readFighter();
              Fighter* b = readFighter();

              Fighter* attacker = a;
              Fighter* defender = b;
              while (true) {
                  attacker->takeTurn(*defender);
                  if (!defender->alive()) {
                      std::cout << defender->name() << " is defeated!\n";
                      std::cout << attacker->name() << " wins!\n";
                      break;
                  }
                  std::swap(attacker, defender);
              }

              delete a;
              delete b;
              return 0;
          }
        explain: |
          `Healer::takeTurn` decides whether to heal, and otherwise calls the
          base version with `Fighter::takeTurn(opponent)` — reusing the normal
          attack instead of copying it. `using Fighter::Fighter;` *inherits* the
          base constructors, so the derived classes don't have to repeat them.
          And the battle loop never changed after milestone 2: new fighter
          types plug into it. That's what polymorphism buys you.

  - type: challenge
    id: c12-ch-payroll
    title: Payroll
    difficulty: 2
    tags: [polymorphism, abstract classes]
    prompt: |
      Write an abstract `class Employee` with a name and a pure virtual
      `double pay() const`, and three kinds of employee:

      - `Salaried(name, yearlySalary)` — pays `yearlySalary / 12` per month.
      - `Hourly(name, rate, hours)` — pays `rate × hours`, but hours over 160 are paid at **1.5×** the rate.
      - `Commissioned(name, base, sales)` — pays `base + 10%` of sales.

      And `double totalPayroll(const std::vector<const Employee*>& staff)`.
    starter: |
      #include <string>
      #include <vector>

      class Employee {
      public:
          explicit Employee(const std::string& name) : name_{name} {}
          virtual ~Employee() = default;
          const std::string& name() const { return name_; }
          virtual double pay() const { return 0.0; }   // TODO: make this pure virtual
      private:
          std::string name_;
      };

      class Salaried : public Employee {
      public:
          Salaried(const std::string& name, double yearly) : Employee{name}, yearly_{yearly} {}
      private:
          double yearly_;
      };

      class Hourly : public Employee {
      public:
          Hourly(const std::string& name, double rate, double hours)
              : Employee{name}, rate_{rate}, hours_{hours} {}
      private:
          double rate_;
          double hours_;
      };

      class Commissioned : public Employee {
      public:
          Commissioned(const std::string& name, double base, double sales)
              : Employee{name}, base_{base}, sales_{sales} {}
      private:
          double base_;
          double sales_;
      };

      double totalPayroll(const std::vector<const Employee*>& staff) {
          return 0.0;
      }
    harness: |
      Salaried s{"Ada", 36000};
      Hourly h{"Al", 20, 100};
      Hourly o{"Grace", 20, 170};
      Commissioned c{"Linus", 1000, 5000};
      CHECK(s.pay(), 3000.0);
      CHECK(h.pay(), 2000.0);
      CHECK(o.pay(), 3500.0);
      CHECK(c.pay(), 1500.0);
      const Employee& e = o;
      CHECK(e.pay(), 3500.0);
      CHECK(totalPayroll({&s, &h, &o, &c}), 10000.0);
      CHECK(totalPayroll({}), 0.0);
    hints:
      - "Overtime: the first 160 hours at `rate`, the rest at `rate * 1.5`."
      - "Each class adds `double pay() const override { ... }`."
    solution: |
      #include <string>
      #include <vector>

      class Employee {
      public:
          explicit Employee(const std::string& name) : name_{name} {}
          virtual ~Employee() = default;
          const std::string& name() const { return name_; }
          virtual double pay() const = 0;
      private:
          std::string name_;
      };

      class Salaried : public Employee {
      public:
          Salaried(const std::string& name, double yearly) : Employee{name}, yearly_{yearly} {}
          double pay() const override { return yearly_ / 12; }
      private:
          double yearly_;
      };

      class Hourly : public Employee {
      public:
          Hourly(const std::string& name, double rate, double hours)
              : Employee{name}, rate_{rate}, hours_{hours} {}
          double pay() const override {
              constexpr double normal{160};
              if (hours_ <= normal) {
                  return rate_ * hours_;
              }
              return rate_ * normal + rate_ * 1.5 * (hours_ - normal);
          }
      private:
          double rate_;
          double hours_;
      };

      class Commissioned : public Employee {
      public:
          Commissioned(const std::string& name, double base, double sales)
              : Employee{name}, base_{base}, sales_{sales} {}
          double pay() const override { return base_ + 0.10 * sales_; }
      private:
          double base_;
          double sales_;
      };

      double totalPayroll(const std::vector<const Employee*>& staff) {
          double total{0.0};
          for (const Employee* e : staff) {
              total += e->pay();
          }
          return total;
      }

  - type: challenge
    id: c12-ch-expr
    title: Expression trees
    difficulty: 3
    tags: [polymorphism, recursion, trees]
    prompt: |
      Represent arithmetic expressions as a tree of objects. Write an abstract
      `class Expr` with `virtual double eval() const = 0;` and
      `virtual std::string str() const = 0;`, and three node types:

      - `Num(double v)` — `str()` prints the value with `std::ostringstream` (so `2` prints `2`, `2.5` prints `2.5`).
      - `Add(Expr* left, Expr* right)` and `Mul(Expr* left, Expr* right)` — they **own** their children and `delete` them in their destructors. `str()` wraps in parentheses: `(2 + (3 * 4))`.

      The checker builds trees with `new` and deletes the root.
    starter: |
      #include <sstream>
      #include <string>

      class Expr {
      public:
          virtual ~Expr() = default;
          // TODO: eval() and str()
      };

      // TODO: Num, Add and Mul
    starter_broken: true
    harness: |
      Expr* e = new Add(new Num(2), new Mul(new Num(3), new Num(4)));
      CHECK(e->eval(), 14.0);
      CHECK(e->str(), "(2 + (3 * 4))");
      delete e;
      Expr* f = new Mul(new Add(new Num(1.5), new Num(0.5)), new Num(10));
      CHECK(f->eval(), 20.0);
      CHECK(f->str(), "((1.5 + 0.5) * 10)");
      delete f;
      Expr* n = new Num(7);
      CHECK(n->str(), "7");
      delete n;
    hints:
      - "`Add::eval()` is `left_->eval() + right_->eval()` — each node trusts its children to evaluate themselves. Recursion through virtual calls!"
      - "`~Add() override { delete left_; delete right_; }` — and because `Expr` has a virtual destructor, deleting the root deletes the whole tree."
      - "The binary nodes own raw pointers, so they must not be copied: add `Add(const Add&) = delete;` and `Add& operator=(const Add&) = delete;`."
    solution: |
      #include <sstream>
      #include <string>

      class Expr {
      public:
          virtual ~Expr() = default;
          virtual double eval() const = 0;
          virtual std::string str() const = 0;
      };

      class Num : public Expr {
      public:
          explicit Num(double v) : v_{v} {}
          double eval() const override { return v_; }
          std::string str() const override {
              std::ostringstream out{};
              out << v_;
              return out.str();
          }
      private:
          double v_;
      };

      class Binary : public Expr {
      public:
          Binary(Expr* left, Expr* right) : left_{left}, right_{right} {}
          ~Binary() override {
              delete left_;
              delete right_;
          }
          Binary(const Binary&) = delete;
          Binary& operator=(const Binary&) = delete;

      protected:
          Expr* left_;
          Expr* right_;
      };

      class Add : public Binary {
      public:
          using Binary::Binary;
          double eval() const override { return left_->eval() + right_->eval(); }
          std::string str() const override { return "(" + left_->str() + " + " + right_->str() + ")"; }
      };

      class Mul : public Binary {
      public:
          using Binary::Binary;
          double eval() const override { return left_->eval() * right_->eval(); }
          std::string str() const override { return "(" + left_->str() + " * " + right_->str() + ")"; }
      };
    explain: |
      This is how compilers and calculators represent formulas — and your
      first **tree**. Evaluation is recursion where each call dispatches on
      the node's real type. Ownership is explicit: each binary node owns its
      two children, so deleting the root frees everything exactly once.
      Chapter 15's `std::unique_ptr` would make that ownership automatic.

  - type: challenge
    id: c12-ch-accounts
    title: Account types
    difficulty: 2
    tags: [inheritance, virtual]
    prompt: |
      Write a base `class Account` with a balance, `deposit(double)`,
      `double balance() const` and `virtual bool withdraw(double amount)`
      (refuses if amount > balance), plus a virtual `void monthEnd()` that
      does nothing. Then:

      - `Savings(initial, ratePercent)` — `monthEnd` adds interest: balance × rate / 100.
      - `Checking(initial, overdraft)` — `withdraw` allows the balance to go down to `-overdraft`; `monthEnd` charges a fee of 5 if the balance is negative.
    starter: |
      class Account {
      public:
          explicit Account(double initial) : balance_{initial} {}
          virtual ~Account() = default;

          void deposit(double amount) { balance_ += amount; }
          double balance() const { return balance_; }

          virtual bool withdraw(double amount) {
              return false;
          }

          virtual void monthEnd() {}

      protected:
          double balance_;
      };

      class Savings : public Account {
      public:
          Savings(double initial, double rate) : Account{initial}, rate_{rate} {}
      private:
          double rate_;
      };

      class Checking : public Account {
      public:
          Checking(double initial, double overdraft) : Account{initial}, overdraft_{overdraft} {}
      private:
          double overdraft_;
      };
    harness: |
      Savings s{1000, 2};
      CHECK(s.withdraw(1500), false);
      CHECK(s.withdraw(200), true);
      s.monthEnd();
      CHECK(s.balance(), 816.0);
      Checking c{100, 50};
      CHECK(c.withdraw(140), true);
      CHECK(c.balance(), -40.0);
      CHECK(c.withdraw(20), false);
      c.monthEnd();
      CHECK(c.balance(), -45.0);
      Account& a = c;
      a.deposit(100);
      a.monthEnd();
      CHECK(a.balance(), 55.0);
      Account& b = s;
      b.monthEnd();
      CHECK(b.balance(), 832.32);
    hints:
      - "Base `withdraw`: if `amount > balance_` return false; else subtract and return true."
      - "`Checking::withdraw` checks `balance_ - amount < -overdraft_` instead."
    solution: |
      class Account {
      public:
          explicit Account(double initial) : balance_{initial} {}
          virtual ~Account() = default;

          void deposit(double amount) { balance_ += amount; }
          double balance() const { return balance_; }

          virtual bool withdraw(double amount) {
              if (amount > balance_) {
                  return false;
              }
              balance_ -= amount;
              return true;
          }

          virtual void monthEnd() {}

      protected:
          double balance_;
      };

      class Savings : public Account {
      public:
          Savings(double initial, double rate) : Account{initial}, rate_{rate} {}
          void monthEnd() override { balance_ += balance_ * rate_ / 100; }
      private:
          double rate_;
      };

      class Checking : public Account {
      public:
          Checking(double initial, double overdraft) : Account{initial}, overdraft_{overdraft} {}

          bool withdraw(double amount) override {
              if (balance_ - amount < -overdraft_) {
                  return false;
              }
              balance_ -= amount;
              return true;
          }

          void monthEnd() override {
              if (balance_ < 0) {
                  balance_ -= 5;
              }
          }

      private:
          double overdraft_;
      };

  - type: review
    id: c12-review
    title: "Chapter 12 review"
    body: |
      ## Cheat sheet

      ```cpp static
      class Shape {                                  // abstract base / interface
      public:
          virtual ~Shape() = default;                // ALWAYS for polymorphic bases
          virtual double area() const = 0;           // pure virtual
          virtual std::string name() const { return "shape"; }   // virtual with default
          void describe() const;                     // non-virtual, uses the virtuals
      };

      class Circle : public Shape {
      public:
          explicit Circle(double r) : r_{r} {}
          double area() const override { return 3.14159 * r_ * r_; }
      private:
          double r_;
      };

      class Special : public Circle {
      public:
          using Circle::Circle;                      // inherit constructors
          std::string name() const override { return "special " + Circle::name(); }
      };

      void print(const Shape& s);                    // by reference: no slicing
      std::vector<const Shape*> shapes;              // pointers: no slicing
      ```

      ## Key ideas

      - Public inheritance models **is-a**; the derived object contains a base part, built first and destroyed last.
      - A call through a base reference/pointer uses the **static** type — unless the function is `virtual`, when the **real object** decides.
      - Always write `override`; it turns signature mistakes into errors.
      - Pure virtual `= 0` makes a class abstract: an interface to program against.
      - Polymorphic objects go by reference or pointer — copying by value slices.
      - Polymorphic bases need a virtual destructor.
      - Prefer composition (has-a); use inheritance for polymorphism, honouring Liskov substitution.
    questions:
      - type: output
        prompt: "Interleaving: classes, vectors, loops and virtual calls."
        code: |
          #include <iostream>
          #include <vector>

          class Op {
          public:
              virtual ~Op() = default;
              virtual int apply(int x) const = 0;
          };

          class AddN : public Op {
          public:
              explicit AddN(int n) : n_{n} {}
              int apply(int x) const override { return x + n_; }
          private:
              int n_;
          };

          class Twice : public Op {
          public:
              int apply(int x) const override { return 2 * x; }
          };

          int main() {
              AddN add3{3};
              Twice twice{};
              std::vector<const Op*> pipeline{&add3, &twice, &add3};
              int v{1};
              for (const Op* op : pipeline) {
                  v = op->apply(v);
              }
              std::cout << v << '\n';
              return 0;
          }
        answer: |
          11
        why: "1 → 4 → 8 → 11."
      - type: mcq
        prompt: "`Square` inherits from `Rectangle`, and `Rectangle::setWidth` changes only the width. Which principle does a `Square` that also changes its height break?"
        options:
          - Encapsulation
          - The Liskov substitution principle
          - RAII
          - DRY
        answer: 1
        why: "Code that works with any Rectangle (expecting width and height to be independent) breaks when given a Square."
      - type: tf
        prompt: "Calling a non-virtual function through a base pointer runs the derived class's version."
        answer: false
        why: "Non-virtual calls are resolved from the static type — the base version runs."

