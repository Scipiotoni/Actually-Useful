      - type: code
        prompt: |
          Write an abstract `class Discount` with `virtual double apply(double price) const = 0;`,
          and `Percent(double p)` (takes p% off), `Fixed(double amount)` (takes
          `amount` off, never below 0). Then
          `double finalPrice(double price, const std::vector<const Discount*>& ds)`
          applying each discount in order.
        starter: |
          #include <vector>

          class Discount {
          public:
              virtual ~Discount() = default;
              virtual double apply(double price) const { return price; }   // TODO: pure virtual
          };

          class Percent : public Discount {
          public:
              explicit Percent(double p) : p_{p} {}
          private:
              double p_;
          };

          class Fixed : public Discount {
          public:
              explicit Fixed(double amount) : amount_{amount} {}
          private:
              double amount_;
          };

          double finalPrice(double price, const std::vector<const Discount*>& ds) {
              return 0.0;
          }
        harness: |
          Percent tenOff{10};
          Fixed fiveOff{5};
          Fixed big{1000};
          CHECK(tenOff.apply(200), 180.0);
          CHECK(fiveOff.apply(3), 0.0);
          CHECK(finalPrice(100, {&tenOff, &fiveOff}), 85.0);
          CHECK(finalPrice(100, {&fiveOff, &tenOff}), 85.5);
          CHECK(finalPrice(50, {&big}), 0.0);
          CHECK(finalPrice(42, {}), 42.0);
        solution: |
          #include <vector>

          class Discount {
          public:
              virtual ~Discount() = default;
              virtual double apply(double price) const = 0;
          };

          class Percent : public Discount {
          public:
              explicit Percent(double p) : p_{p} {}
              double apply(double price) const override { return price * (100 - p_) / 100; }
          private:
              double p_;
          };

          class Fixed : public Discount {
          public:
              explicit Fixed(double amount) : amount_{amount} {}
              double apply(double price) const override {
                  double result = price - amount_;
                  return result < 0 ? 0 : result;
              }
          private:
              double amount_;
          };

          double finalPrice(double price, const std::vector<const Discount*>& ds) {
              for (const Discount* d : ds) {
                  price = d->apply(price);
              }
              return price;
          }
      - type: code
        prompt: |
          `class Counter` has `virtual void tick()` adding 1 to a protected
          `count_`, and `int count() const`. Write `class StepCounter`
          (constructor takes a step; each `tick` adds the step) and
          `class LimitedCounter` (constructor takes a limit; `tick` does
          nothing once `count_` has reached the limit).
        starter: |
          class Counter {
          public:
              virtual ~Counter() = default;
              virtual void tick() { ++count_; }
              int count() const { return count_; }
          protected:
              int count_{0};
          };

          class StepCounter : public Counter {
          public:
              explicit StepCounter(int step) : step_{step} {}
          private:
              int step_;
          };

          class LimitedCounter : public Counter {
          public:
              explicit LimitedCounter(int limit) : limit_{limit} {}
          private:
              int limit_;
          };
        harness: |
          StepCounter s{5};
          LimitedCounter l{2};
          Counter plain{};
          Counter* all[3]{&s, &l, &plain};
          for (int i{0}; i < 4; ++i) {
              for (Counter* c : all) {
                  c->tick();
              }
          }
          CHECK(s.count(), 20);
          CHECK(l.count(), 2);
          CHECK(plain.count(), 4);
        solution: |
          class Counter {
          public:
              virtual ~Counter() = default;
              virtual void tick() { ++count_; }
              int count() const { return count_; }
          protected:
              int count_{0};
          };

          class StepCounter : public Counter {
          public:
              explicit StepCounter(int step) : step_{step} {}
              void tick() override { count_ += step_; }
          private:
              int step_;
          };

          class LimitedCounter : public Counter {
          public:
              explicit LimitedCounter(int limit) : limit_{limit} {}
              void tick() override {
                  if (count_ < limit_) {
                      ++count_;
                  }
              }
          private:
              int limit_;
          };
