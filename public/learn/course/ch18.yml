      - type: output
        code: |
          #include <iostream>
          #include <vector>

          int main() {
              std::vector<int> v{1, 4, 6, 9, 13, 20};
              int lo{0};
              int hi{static_cast<int>(v.size()) - 1};
              int looks{0};
              int target{13};
              while (lo <= hi) {
                  int mid{lo + (hi - lo) / 2};
                  ++looks;
                  if (v[static_cast<std::size_t>(mid)] == target) {
                      break;
                  }
                  if (v[static_cast<std::size_t>(mid)] < target) {
                      lo = mid + 1;
                  } else {
