      - type: output
        code: |
          #include <iostream>
          #include <vector>

          int main() {
              std::vector<int> v{2, 7, 1, 8, 2, 8};
              int window{0};
              int best{0};
              for (std::size_t i{0}; i < v.size(); ++i) {
                  window += v[i];
                  if (i >= 2) {
                      window -= v[i - 2];
                  }
                  if (window > best) {
                      best = window;
