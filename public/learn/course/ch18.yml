  - type: lesson
    id: c18-recursion
    title: Recursion and backtracking
    minutes: 26
    objectives:
      - Solve problems by reducing them to smaller copies of themselves
      - Generate all subsets and permutations
      - Use backtracking — choose, explore, un-choose — and prune dead ends
    body: |
      Chapter 6 introduced recursion. Its real power shows when a problem
      **branches**: to explore every possibility, make one choice, solve the
      rest recursively, then **undo** the choice and try the next. This is
      **backtracking**, and it solves puzzles, games and search problems of
      every kind.

      ## All subsets

      For each item there are two choices: take it or leave it.

      ```cpp
      #include <iostream>
      #include <vector>

      void subsets(const std::vector<int>& items, std::size_t index, std::vector<int>& chosen) {
          if (index == items.size()) {             // every item decided: print one subset
              std::cout << '{';
              for (std::size_t i{0}; i < chosen.size(); ++i) {
                  std::cout << (i > 0 ? "," : "") << chosen[i];
              }
              std::cout << "} ";
              return;
          }
          chosen.push_back(items[index]);          // choose: take it
          subsets(items, index + 1, chosen);       // explore
          chosen.pop_back();                       // un-choose
          subsets(items, index + 1, chosen);       // explore without it
      }

      int main() {
          std::vector<int> chosen{};
          subsets({1, 2, 3}, 0, chosen);
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      {1,2,3} {1,2} {1,3} {1} {2,3} {2} {3} {}
      ```

      The calls form a **tree** of decisions, 2 branches per item: n items
      give 2ⁿ subsets. Exponential — fine for 20 items (a million subsets),
      hopeless for 60.

      ```text
                          {}
                take 1 /      \ leave 1
                    {1}        {}
                   /   \      /   \
               {1,2}  {1}  {2}    {}      … and so on for 3
      ```

      ## All permutations

      Put each remaining letter in the current position, recurse for the
      next position, then swap it back:

      ```cpp
      #include <iostream>
      #include <string>
      #include <utility>

      void permutations(std::string& s, std::size_t pos) {
          if (pos == s.size()) {
              std::cout << s << ' ';
              return;
          }
          for (std::size_t i{pos}; i < s.size(); ++i) {
              std::swap(s[pos], s[i]);     // choose which letter goes at pos
              permutations(s, pos + 1);    // explore
              std::swap(s[pos], s[i]);     // un-choose
          }
      }

      int main() {
          std::string word{"abc"};
          permutations(word, 0);
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      abc acb bac bca cba cab
      ```

      n letters give n! permutations (10 letters: 3,628,800).

      ## Pruning

      Backtracking gets fast when you **stop exploring branches that can't
      work**. Looking for subsets that add up to 10? If the current sum is
      already over 10 (and all numbers are positive), there's no point going
      deeper — return immediately. Good pruning turns impossible searches
      into instant ones; it's how Sudoku solvers and chess engines work.

      > [!remember]
      > The backtracking template: **if done, record the answer. Otherwise,
      > for each choice: make it, recurse, undo it.**

      {{check perm-count}}

      {{task binary-strings}}

      {{task subset-sum}}
    checks:
      - id: perm-count
        type: output
        code: |
          #include <iostream>

          int calls{0};

          void explore(int depth, int branches) {
              ++calls;
              if (depth == 0) {
                  return;
              }
              for (int i{0}; i < branches; ++i) {
                  explore(depth - 1, branches);
              }
          }

          int main() {
              explore(3, 2);
              std::cout << calls << '\n';
              return 0;
          }
        answer: |
          15
        why: "A tree of depth 3 with 2 branches: 1 + 2 + 4 + 8 = 15 calls."
    tasks:
      - id: binary-strings
        title: All binary strings
        prompt: |
          Write `std::vector<std::string> binaryStrings(int n)` returning every
          string of `n` characters `'0'`/`'1'`, in increasing order
          (`"00"`, `"01"`, `"10"`, `"11"` for n = 2). For n = 0, return one
          empty string. Use recursion with a helper function.
        starter: |
          #include <string>
          #include <vector>

          std::vector<std::string> binaryStrings(int n) {
              return {};
          }
        harness: |
          CHECK(binaryStrings(2), (std::vector<std::string>{"00", "01", "10", "11"}));
          CHECK(binaryStrings(1), (std::vector<std::string>{"0", "1"}));
          CHECK(binaryStrings(0), (std::vector<std::string>{""}));
          CHECK(binaryStrings(3).size(), 8);
          CHECK(binaryStrings(3)[5], "101");
          CHECK(binaryStrings(10).size(), 1024);
        hints:
          - "Helper: `void build(int n, std::string& current, std::vector<std::string>& out)`. If `current.size() == n`, push it and return."
          - "Otherwise: push_back '0', recurse, pop_back; then the same with '1'. Try '0' first to get increasing order."
        solution: |
          #include <string>
          #include <vector>

          void build(std::size_t n, std::string& current, std::vector<std::string>& out) {
              if (current.size() == n) {
                  out.push_back(current);
                  return;
              }
              for (char c : {'0', '1'}) {
                  current.push_back(c);
                  build(n, current, out);
                  current.pop_back();
              }
          }

          std::vector<std::string> binaryStrings(int n) {
              std::vector<std::string> out{};
              std::string current{};
              build(static_cast<std::size_t>(n), current, out);
              return out;
          }
      - id: subset-sum
        title: Counting subsets with a given sum
        prompt: |
          Write `int countSubsets(const std::vector<int>& v, int target)`: how
          many subsets (choices of positions) of the **positive** numbers `v`
          add up to `target`? The empty subset has sum 0. Use backtracking
          and prune branches whose sum already exceeds `target`.
        starter: |
          #include <vector>

          int countSubsets(const std::vector<int>& v, int target) {
              return 0;
          }
        harness: |
          CHECK(countSubsets({1, 2, 3}, 3), 2);
          CHECK(countSubsets({2, 4, 6, 10}, 16), 2);
          CHECK(countSubsets({5, 5, 5}, 10), 3);
          CHECK(countSubsets({1, 2}, 0), 1);
          CHECK(countSubsets({7}, 3), 0);
          std::vector<int> many(24, 1);
          CHECK(countSubsets(many, 2), 276);
        hints:
          - "Helper `count(v, index, sum, target)`: if `sum > target` return 0 (prune); if `index == v.size()` return `sum == target ? 1 : 0`."
          - "Otherwise return `count(v, index + 1, sum + v[index], target) + count(v, index + 1, sum, target)`."
        solution: |
          #include <vector>

          int count(const std::vector<int>& v, std::size_t index, int sum, int target) {
              if (sum > target) {
                  return 0;
              }
              if (index == v.size()) {
                  return sum == target ? 1 : 0;
              }
              return count(v, index + 1, sum + v[index], target) + count(v, index + 1, sum, target);
          }

          int countSubsets(const std::vector<int>& v, int target) {
              return count(v, 0, 0, target);
          }
        explain: |
          The last check has 24 ones: 2²⁴ ≈ 16.7 million subsets in total, but
          pruning cuts every branch as soon as the sum passes 2, so only a
          tiny fraction is explored. (There are C(24, 2) = 276 ways to pick two
          of the ones.)
    cards:
      - front: What is **backtracking**?
        back: "Exploring all possibilities recursively: make a choice, recurse, undo the choice, try the next. Template: if done → record; else for each choice → choose, explore, un-choose."
      - front: How many subsets and permutations do n items have?
        back: 2ⁿ subsets and n! permutations — so exhaustive search only works for small n.
      - front: What is **pruning**?
        back: Abandoning a branch of the search as soon as it can't lead to a valid answer.

  - type: lesson
    id: c18-patterns
    title: "Classic patterns: hashing, two pointers, windows, prefix sums"
    minutes: 28
    objectives:
      - Use a hash map to remember what you've seen
      - Use two pointers on sorted data
      - Maintain a sliding window instead of recomputing
      - Answer range-sum queries in O(1) with prefix sums
    body: |
      Most programming problems are variations on a handful of **patterns**.
      Recognising the pattern is often 90% of the solution. Here are four of
      the most useful — each turns an O(n²) brute force into O(n).

      ## 1. Hashing: remember what you've seen

      *Find two positions whose values add up to `target`.* Brute force tries
      every pair: O(n²). Instead, walk once and ask: *have I already seen the
      number that would complete this one?*

      ```cpp
      #include <iostream>
      #include <unordered_map>
      #include <utility>
      #include <vector>

      std::pair<int, int> twoSum(const std::vector<int>& v, int target) {
          std::unordered_map<int, int> seenAt{};          // value -> index
          for (int i{0}; i < static_cast<int>(v.size()); ++i) {
              int need{target - v[i]};
              auto it = seenAt.find(need);
              if (it != seenAt.end()) {
                  return {it->second, i};
              }
              seenAt[v[i]] = i;
          }
          return {-1, -1};
      }

      int main() {
          auto [a, b] = twoSum({3, 9, 14, 5, 11}, 16);
          std::cout << a << ' ' << b << '\n';
          return 0;
      }
      ```

      ```output
      3 4
      ```

      Frequency maps (`++count[x]`) and "seen" sets are the same pattern.

      ## 2. Two pointers

      On **sorted** data, start one pointer at each end and move them
      towards each other:

      ```cpp
      #include <iostream>
      #include <vector>

      bool hasPairWithSum(const std::vector<int>& sorted, int target) {
          int lo{0};
          int hi{static_cast<int>(sorted.size()) - 1};
          while (lo < hi) {
              int sum{sorted[lo] + sorted[hi]};
              if (sum == target) {
                  return true;
              }
              if (sum < target) {
                  ++lo;       // need bigger: move the left pointer right
              } else {
                  --hi;       // need smaller: move the right pointer left
              }
          }
          return false;
      }

      int main() {
          std::vector<int> v{1, 3, 4, 6, 8, 11};
          std::cout << std::boolalpha << hasPairWithSum(v, 10) << ' ' << hasPairWithSum(v, 2) << '\n';
          return 0;
      }
      ```

      ```output
      true false
      ```

      Each step discards one element for good, so it's O(n). Two pointers
      also reverse arrays, check palindromes and merge sorted lists (that's
      what `merge` in merge sort does).

      ## 3. Sliding window

      *Largest sum of `k` consecutive elements.* Recomputing each window is
      O(n·k). Instead, **slide**: add the element entering the window,
      subtract the one leaving.

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int maxWindowSum(const std::vector<int>& v, std::size_t k) {
          int window{0};
          for (std::size_t i{0}; i < k; ++i) {
              window += v[i];
          }
          int best{window};
          for (std::size_t i{k}; i < v.size(); ++i) {
              window += v[i] - v[i - k];
              best = std::max(best, window);
          }
          return best;
      }

      int main() {
          std::cout << maxWindowSum({4, 2, 12, 1, 7, 8, 3}, 3) << '\n';
          return 0;
      }
      ```

      ```output
      20
      ```

      Windows can also grow and shrink: extend the right edge while the
      window is valid, shrink the left edge when it isn't. You'll use that
      below.

      ## 4. Prefix sums

      *Answer many "sum of elements from a to b" questions.* Precompute
      `prefix[i]` = sum of the first `i` elements. Then any range sum is one
      subtraction:

      ```cpp
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{3, 1, 4, 1, 5, 9, 2, 6};
          std::vector<int> prefix(v.size() + 1, 0);
          for (std::size_t i{0}; i < v.size(); ++i) {
              prefix[i + 1] = prefix[i] + v[i];
          }
          // sum of v[a] .. v[b-1] is prefix[b] - prefix[a]
          std::cout << prefix[5] - prefix[2] << ' ' << prefix[8] - prefix[0] << '\n';
          return 0;
      }
      ```

      ```output
      10 31
      ```

      O(n) preparation, then O(1) per question.

      {{check pattern-match}}

      {{task longest-unique}}

      {{task range-sums}}
    checks:
      - id: pattern-match
        type: mcq
        prompt: "\"Find the longest stretch of consecutive days where the temperature stayed within 5 degrees\" — which pattern fits best?"
        options:
          - Prefix sums
          - A sliding window that grows and shrinks
          - Binary search
          - Sorting first
        answer: 1
        why: "Consecutive stretch + a validity condition = variable-size sliding window."
    tasks:
      - id: longest-unique
        title: Longest run without repeats
        prompt: |
          Write `int longestUnique(const std::string& s)`: the length of the
          longest stretch of consecutive characters with **no repeated
          character**. `"abcabcbb"` → 3 (`"abc"`), `"pwwkew"` → 3 (`"wke"`).
          Aim for O(n) with a sliding window.
        starter: |
          #include <string>

          int longestUnique(const std::string& s) {
              return 0;
          }
        harness: |
          CHECK(longestUnique("abcabcbb"), 3);
          CHECK(longestUnique("bbbb"), 1);
          CHECK(longestUnique("pwwkew"), 3);
          CHECK(longestUnique(""), 0);
          CHECK(longestUnique("abcdef"), 6);
          CHECK(longestUnique("abba"), 2);
        hints:
          - "Window `[left, right]`. Keep `std::unordered_map<char, std::size_t> lastSeen` — where each character was last seen."
          - "For each `right`: if `s[right]` was last seen at or after `left`, move `left` to one past that position. Then record the position and update the best length `right - left + 1`."
        solution: |
          #include <algorithm>
          #include <string>
          #include <unordered_map>

          int longestUnique(const std::string& s) {
              std::unordered_map<char, std::size_t> lastSeen{};
              std::size_t left{0};
              std::size_t best{0};
              for (std::size_t right{0}; right < s.size(); ++right) {
                  auto it = lastSeen.find(s[right]);
                  if (it != lastSeen.end() && it->second >= left) {
                      left = it->second + 1;
                  }
                  lastSeen[s[right]] = right;
                  best = std::max(best, right - left + 1);
              }
              return static_cast<int>(best);
          }
      - id: range-sums
        title: Many range queries
        prompt: |
          Write `std::vector<long long> rangeSums(const std::vector<int>& v, const std::vector<std::pair<int, int>>& queries)`.
          Each query `{a, b}` asks for `v[a] + … + v[b]` (**inclusive**). The
          last check has 200,000 numbers and 200,000 queries — summing each
          range with a loop would time out. Use prefix sums.
        starter: |
          #include <utility>
          #include <vector>

          std::vector<long long> rangeSums(const std::vector<int>& v, const std::vector<std::pair<int, int>>& queries) {
              return {};
          }
        harness: |
          std::vector<int> v{3, 1, 4, 1, 5, 9, 2, 6};
          CHECK(rangeSums(v, {{0, 0}, {2, 4}, {0, 7}, {7, 7}}), (std::vector<long long>{3, 10, 31, 6}));
          std::vector<int> big(200000);
          for (std::size_t i{0}; i < big.size(); ++i) {
              big[i] = static_cast<int>(i % 10);
          }
          std::vector<std::pair<int, int>> qs(200000, {0, 199999});
          qs[5] = {10, 19};
          auto result = rangeSums(big, qs);
          CHECK(result.size(), 200000);
          CHECK(result[0], 900000);
          CHECK(result[5], 45);
        hints:
          - "Build `std::vector<long long> prefix(v.size() + 1, 0)` with `prefix[i + 1] = prefix[i] + v[i]`."
          - "Inclusive `[a, b]` is `prefix[b + 1] - prefix[a]`."
        solution: |
          #include <utility>
          #include <vector>

          std::vector<long long> rangeSums(const std::vector<int>& v, const std::vector<std::pair<int, int>>& queries) {
              std::vector<long long> prefix(v.size() + 1, 0);
              for (std::size_t i{0}; i < v.size(); ++i) {
                  prefix[i + 1] = prefix[i] + v[i];
              }
              std::vector<long long> out{};
              out.reserve(queries.size());
              for (const auto& [a, b] : queries) {
                  out.push_back(prefix[static_cast<std::size_t>(b) + 1] - prefix[static_cast<std::size_t>(a)]);
              }
              return out;
          }
    cards:
      - front: "Pattern: \"have I seen the complement before?\""
        back: Hashing — store seen values (and positions) in an unordered_set/map as you walk once. O(n).
      - front: When do **two pointers** apply?
        back: Usually on sorted data (or both ends of a sequence) — move pointers inward, discarding one element per step. O(n).
      - front: What is a **sliding window**?
        back: A range over consecutive elements updated incrementally (add entering, remove leaving; grow/shrink by a condition) instead of recomputed.
      - front: What are **prefix sums** for?
        back: "O(1) range sums after O(n) preparation: sum(a..b−1) = prefix[b] − prefix[a]."

  - type: quiz
