      - type: code
        prompt: |
          Write `int maxProfit(const std::vector<int>& prices)`: given a
          stock's price on each day, the best profit from buying on one day
          and selling on a **later** day (0 if no profit is possible). Aim for
          O(n): track the lowest price so far.
        starter: |
          #include <vector>

          int maxProfit(const std::vector<int>& prices) {
              return 0;
          }
        harness: |
          CHECK(maxProfit({7, 1, 5, 3, 6, 4}), 5);
          CHECK(maxProfit({7, 6, 4, 3, 1}), 0);
          CHECK(maxProfit({}), 0);
          CHECK(maxProfit({2, 4, 1, 3}), 2);
          CHECK(maxProfit({3, 8, 1, 9}), 8);
        solution: |
          #include <algorithm>
          #include <vector>

          int maxProfit(const std::vector<int>& prices) {
              int best{0};
              if (prices.empty()) {
                  return best;
              }
              int lowest{prices[0]};
              for (int p : prices) {
                  best = std::max(best, p - lowest);
                  lowest = std::min(lowest, p);
              }
              return best;
          }
      - type: code
        prompt: |
          Write `int shortestHops(int n, const std::vector<std::pair<int, int>>& edges, int from, int to)`:
          the fewest edges between `from` and `to` in an undirected graph with
          nodes `0 … n−1`, or -1 if unreachable.
        starter: |
          #include <queue>
          #include <utility>
          #include <vector>

          int shortestHops(int n, const std::vector<std::pair<int, int>>& edges, int from, int to) {
              return -1;
          }
        harness: |
          std::vector<std::pair<int, int>> e{{0, 1}, {1, 2}, {2, 3}, {0, 4}, {4, 3}};
          CHECK(shortestHops(6, e, 0, 3), 2);
          CHECK(shortestHops(6, e, 1, 4), 2);
          CHECK(shortestHops(6, e, 2, 2), 0);
          CHECK(shortestHops(6, e, 0, 5), -1);
        solution: |
          #include <queue>
          #include <utility>
          #include <vector>

          int shortestHops(int n, const std::vector<std::pair<int, int>>& edges, int from, int to) {
              std::vector<std::vector<int>> adj(static_cast<std::size_t>(n));
              for (const auto& [a, b] : edges) {
                  adj[static_cast<std::size_t>(a)].push_back(b);
                  adj[static_cast<std::size_t>(b)].push_back(a);
              }
              std::vector<int> dist(static_cast<std::size_t>(n), -1);
              std::queue<int> q{};
              dist[static_cast<std::size_t>(from)] = 0;
              q.push(from);
              while (!q.empty()) {
                  int u{q.front()};
                  q.pop();
                  for (int w : adj[static_cast<std::size_t>(u)]) {
                      if (dist[static_cast<std::size_t>(w)] == -1) {
                          dist[static_cast<std::size_t>(w)] = dist[static_cast<std::size_t>(u)] + 1;
                          q.push(w);
                      }
                  }
              }
              return dist[static_cast<std::size_t>(to)];
          }
