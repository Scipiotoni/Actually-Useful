      - type: spot
        prompt: "This binary search sometimes loops forever. Which line causes it?"
        code: |
          #include <vector>

          int lastAtMost(const std::vector<int>& v, int x) {
              int lo{-1};
              int hi{static_cast<int>(v.size()) - 1};
              while (lo < hi) {
                  int mid{lo + (hi - lo) / 2};
                  if (v[static_cast<std::size_t>(mid)] <= x) {
                      lo = mid;
                  } else {
                      hi = mid - 1;
                  }
              }
              return lo;
          }
        answer: 7
        why: "Since one branch does `lo = mid`, mid must round **up**: `lo + (hi - lo + 1) / 2`. With hi = lo + 1, rounding down gives mid = lo and nothing changes. (It can also read v[-1].)"
