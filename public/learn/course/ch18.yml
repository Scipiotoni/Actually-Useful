id: ch18
number: 18
part: p5
title: Problem Solving and Algorithms
blurb: Think like a programmer — a method for unfamiliar problems, Big-O, searching, sorting, backtracking, classic patterns, dynamic programming and graphs.
hours: 9
goals:
  - Attack an unfamiliar problem with a method instead of staring at a blank screen
  - Estimate the running time of code with Big-O, and choose data structures accordingly
  - Implement binary search, selection sort, insertion sort and merge sort
  - Solve problems by recursion and backtracking
  - Recognise and apply hashing, two pointers, sliding windows and prefix sums
  - Solve problems with dynamic programming, and explore graphs with BFS and DFS

items:
  - type: lesson
    id: c18-method
    title: How to solve a problem you've never seen
    minutes: 22
    objectives:
      - Apply a four-step method — understand, plan, build, look back
      - Work examples by hand before writing code
      - List edge cases before you start
    body: |
      Up to now, each exercise came right after the lesson that explained the
      tool it needed. Real problems don't come with a lesson attached. This
      chapter is about the skill that makes someone a programmer: **turning
      a problem you've never seen into code**.

      The mathematician George Pólya described a method in *How to Solve It*
      (1945) that still works perfectly for programming:

      1. **Understand the problem.** What exactly goes in and comes out? Work **two or three examples by hand**. List the **edge cases**.
      2. **Make a plan.** How did *you* solve the examples by hand? Write the steps in plain words (pseudocode). Have you seen a similar problem? Can you solve a simpler version first?
      3. **Carry out the plan.** Now write code — in small pieces, running as you go.
      4. **Look back.** Test the examples and edge cases. Could it be simpler? Faster?

      Most beginners skip straight to step 3, and get stuck there. The
      thinking happens in steps 1 and 2.

      ## A worked example: run-length encoding

      *Compress a string by replacing each run of repeated characters with
      the character and the run's length: `"aaabccdddd"` → `"a3b1c2d4"`.*

      **Understand.** By hand: `aaa` → `a3`, `b` → `b1`, `cc` → `c2`,
      `dddd` → `d4`. Edge cases: the empty string (→ `""`), one character
      (`"x"` → `"x1"`), a run of 10 or more (`"zzzzzzzzzzzz"` → `"z12"`).

      **Plan.** What did I do by hand? I looked at a character, counted how
      many times it repeats, wrote it with the count, and jumped past the run.

      ```text
      i = 0
      while i < length:
          count how many characters from i equal s[i]  -> run
          append s[i] and run
          i = i + run
      ```

      **Build.**

      ```cpp
      #include <iostream>
      #include <string>

      std::string encode(const std::string& s) {
          std::string out{};
          std::size_t i{0};
          while (i < s.size()) {
              std::size_t run{1};
              while (i + run < s.size() && s[i + run] == s[i]) {
                  ++run;
              }
              out += s[i];
              out += std::to_string(run);
              i += run;
          }
          return out;
      }

      int main() {
          std::cout << encode("aaabccdddd") << '\n';
          std::cout << encode("x") << '\n';
          std::cout << '[' << encode("") << "]\n";
          std::cout << encode("zzzzzzzzzzzz") << '\n';
          return 0;
      }
      ```

      ```output
      a3b1c2d4
      x1
      []
      z12
      ```

      **Look back.** All four cases pass. Could it be simpler? This version is
      clear. Is it efficient? Each character is looked at a constant number of
      times, so it's as fast as possible — the next lesson makes that precise.

      > [!tip] When you're stuck
      > - Solve it **by hand** on paper, slowly, and watch what you do.
      > - Solve a **smaller** or **simpler** version (a fixed size, no edge cases) first.
      > - Work **backwards** from the desired output.
      > - Ask: *what would I need to know at each step?* That's often the variable you're missing.
      > - Take a break. Seriously — the solution often arrives in the shower.

      {{task decode}}
    tasks:
      - id: decode
        title: Run-length decoding
        prompt: |
          The reverse: `decode("a3b1c2d4")` returns `"aaabccdddd"`. Counts can
          have **several digits** (`"z12"` is twelve z's). Follow the method:
          work the examples by hand, write the plan, then code.
        starter: |
          #include <string>

          std::string decode(const std::string& s) {
              return s;
          }
        harness: |
          CHECK(decode("a3b1c2d4"), "aaabccdddd");
          CHECK(decode(""), "");
          CHECK(decode("x1"), "x");
          CHECK(decode("z12"), "zzzzzzzzzzzz");
          CHECK(decode("a2b10c1"), "aabbbbbbbbbbc");
        hints:
          - "By hand: read a letter, then read *all* the digits after it to build the number, then write the letter that many times."
          - "Build the number digit by digit: `count = count * 10 + (s[i] - '0');` while `s[i]` is a digit (`std::isdigit` from `<cctype>`, cast the char to `unsigned char` first)."
          - "`out.append(count, letter)` appends `count` copies of `letter`."
        solution: |
          #include <cctype>
          #include <string>

          std::string decode(const std::string& s) {
              std::string out{};
              std::size_t i{0};
              while (i < s.size()) {
                  char letter{s[i]};
                  ++i;
                  std::size_t count{0};
                  while (i < s.size() && std::isdigit(static_cast<unsigned char>(s[i]))) {
                      count = count * 10 + static_cast<std::size_t>(s[i] - '0');
                      ++i;
                  }
                  out.append(count, letter);
              }
              return out;
          }
    cards:
      - front: What are Pólya's four steps?
        back: Understand the problem (examples by hand, edge cases) → make a plan (pseudocode) → carry out the plan → look back (test, simplify).
      - front: Name three things to try when stuck on a problem.
        back: Solve it by hand and watch yourself; solve a simpler/smaller version; work backwards from the output (also: ask what you need to know at each step; take a break).

  - type: lesson
    id: c18-complexity
    title: "Big-O: how fast is fast enough?"
    minutes: 26
    objectives:
      - Estimate the Big-O running time of loops and functions
      - Predict whether an algorithm is fast enough for a given input size
      - Know the complexity of common container operations
    body: |
      Two programs can give the same answer and differ in speed by a factor
      of a million. **Big-O notation** describes how the running time *grows*
      as the input size `n` grows — ignoring constant factors and small
      details.

      ## Counting steps

      ```cpp static
      // O(1): constant — doesn't depend on n
      int first = v[0];

      // O(n): linear — one pass
      for (int x : v) { total += x; }

      // O(n²): quadratic — a loop inside a loop, both over n
      for (std::size_t i{0}; i < v.size(); ++i)
          for (std::size_t j{0}; j < v.size(); ++j) { ... }

      // O(log n): logarithmic — the problem halves each step
      while (n > 1) { n /= 2; }

      // O(n log n): e.g. good sorting — std::sort
      std::sort(v.begin(), v.end());
      ```

      Rules of thumb: **sequential** steps add (the biggest term wins:
      O(n) + O(n²) = O(n²)); **nested** loops multiply; constants don't count
      (two passes over the data are still O(n)).

      ## Why it matters

      A computer does roughly **10⁸–10⁹ simple operations per second**. So:

      | n | log n | n | n log n | n² | 2ⁿ |
      |---|---|---|---|---|---|
      | 10 | 3 | 10 | 33 | 100 | 1,024 |
      | 1,000 | 10 | 1,000 | 10,000 | 1,000,000 | way too many |
      | 1,000,000 | 20 | 10⁶ | 2×10⁷ | 10¹² — hours | — |

      With a million items, an O(n log n) algorithm finishes in a blink and
      an O(n²) one takes hours. **No amount of clever micro-optimisation
      saves the wrong algorithm.** That's why choosing the right approach —
      and the right container — matters more than anything else for speed.

      ## Containers, revisited

      | Operation | `vector` | `set` / `map` | `unordered_set` / `unordered_map` |
      |---|---|---|---|
      | Access by index | O(1) | — | — |
      | Add at the end | O(1)* | — | — |
      | Insert/erase in the middle | O(n) | O(log n) | O(1)* |
      | Find a value | O(n) (O(log n) if sorted, binary search) | O(log n) | O(1)* |

      *\* on average ("amortised")*

      So "is `x` in this collection?" asked many times means: put the
      collection in a set, not a vector.

      {{check big-o}}

      {{task duplicates}}
    checks:
      - id: big-o
        type: mcq
        prompt: |
          What is the complexity of this function, for a vector of size n?

          ```cpp static
          int countPairs(const std::vector<int>& v) {
              int n{0};
              for (std::size_t i{0}; i < v.size(); ++i)
                  for (std::size_t j{i + 1}; j < v.size(); ++j)
                      if (v[i] + v[j] == 0) ++n;
              return n;
          }
          ```
        options:
          - O(n)
          - O(n log n)
          - "O(n²)"
          - O(2ⁿ)
        answer: 2
        why: "About n²/2 pairs are checked — constants don't count, so O(n²)."
      - id: halving
        type: output
        prompt: "How many times does the loop run for n = 1000?"
        code: |
          #include <iostream>

          int main() {
              int n{1000};
              int steps{0};
              while (n > 1) {
                  n /= 2;
                  ++steps;
              }
              std::cout << steps << '\n';
              return 0;
          }
        answer: |
          9
        why: "1000 → 500 → 250 → 125 → 62 → 31 → 15 → 7 → 3 → 1: nine halvings. That's log₂ n rounded down — O(log n)."
    tasks:
      - id: duplicates
        title: "Correct but too slow"
        prompt: |
          The starter is **correct**: it compares every pair. Run it — the last
          checks use 300,000 numbers, and O(n²) means about 45 billion
          comparisons. It will time out.

          Rewrite `hasDuplicate` to be O(n) (or O(n log n)).
        starter: |
          #include <vector>

          bool hasDuplicate(const std::vector<int>& v) {
              for (std::size_t i{0}; i < v.size(); ++i) {
                  for (std::size_t j{i + 1}; j < v.size(); ++j) {
                      if (v[i] == v[j]) {
                          return true;
                      }
                  }
              }
              return false;
          }
        harness: |
          CHECK(hasDuplicate({1, 2, 3}), false);
          CHECK(hasDuplicate({4, 1, 4}), true);
          CHECK(hasDuplicate({}), false);
          std::vector<int> big{};
          for (int i{0}; i < 300000; ++i) {
              big.push_back(i * 7 % 300007);
          }
          CHECK(hasDuplicate(big), false);
          big.push_back(49);
          CHECK(hasDuplicate(big), true);
        hints:
          - "Remember what you've seen: an `std::unordered_set<int>` answers \"seen before?\" in O(1)."
          - "`if (!seen.insert(x).second) return true;` — `insert` returns a pair whose `.second` is false when the value was already there."
        solution: |
          #include <unordered_set>
          #include <vector>

          bool hasDuplicate(const std::vector<int>& v) {
              std::unordered_set<int> seen{};
              for (int x : v) {
                  if (!seen.insert(x).second) {
                      return true;
                  }
              }
              return false;
          }
        explain: |
          Another O(n log n) solution: copy the vector, sort it, and check
          neighbours — duplicates end up next to each other. Both finish in
          milliseconds; the original would take many seconds. Same answer,
          different algorithm.
    cards:
      - front: What does Big-O describe?
        back: How an algorithm's running time (or memory) grows with the input size n, ignoring constant factors.
      - front: Order these from fastest to slowest growth — O(n²), O(1), O(n log n), O(log n), O(n), O(2ⁿ).
        back: O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ).
      - front: About how many simple operations does a computer do per second?
        back: Roughly 10⁸ to 10⁹ — so n² with n = 10⁶ (10¹² steps) is far too slow.
      - front: "Complexity of \"find\" in vector, set and unordered_set?"
        back: O(n) (O(log n) if sorted + binary search), O(log n), O(1) on average.

  - type: lesson
    id: c18-searching
    title: Binary search
    minutes: 24
    objectives:
      - Implement binary search, and explain why it's O(log n)
      - Use `std::lower_bound` and `std::upper_bound`
      - Apply "binary search on the answer"
    body: |
      Remember *Guess the Number* from Chapter 5? The best strategy was to
      guess the middle and halve the range each time — at most 7 guesses for
      1 to 100. That strategy, on a **sorted** vector, is **binary search**:

      ```cpp
      #include <iostream>
      #include <vector>

      int binarySearch(const std::vector<int>& v, int target) {
          int lo{0};
          int hi{static_cast<int>(v.size()) - 1};
          int step{0};
          while (lo <= hi) {
              int mid{lo + (hi - lo) / 2};
              ++step;
              std::cout << "step " << step << ": look at index " << mid << " (" << v[mid] << ")\n";
              if (v[mid] == target) {
                  return mid;
              }
              if (v[mid] < target) {
                  lo = mid + 1;     // target is in the right half
              } else {
                  hi = mid - 1;     // target is in the left half
              }
          }
          return -1;                // range is empty: not there
      }

      int main() {
          std::vector<int> v{2, 5, 8, 12, 16, 23, 38, 56, 72, 91};
          int index{binarySearch(v, 23)};
          std::cout << "found at " << index << '\n';
          return 0;
      }
      ```

      ```output
      step 1: look at index 4 (16)
      step 2: look at index 7 (56)
      step 3: look at index 5 (23)
      found at 5
      ```

      Each step halves the range, so a million sorted items need at most
      **20** steps (2²⁰ ≈ 10⁶), where a linear search might need a million.
      That's O(log n).

      - The range `[lo, hi]` always contains the target if it's present — that's the loop's **invariant**.
      - `lo + (hi - lo) / 2` instead of `(lo + hi) / 2` avoids overflow when indices are huge.
      - Binary search is famously easy to get *almost* right. Off-by-one errors (`<` vs `<=`, `mid` vs `mid + 1`) cause infinite loops or missed elements — test with the target first, last, missing, and with an empty vector.

      ## The standard versions

      `<algorithm>` has them ready-made, working on iterators:

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{10, 20, 20, 20, 30, 40};
          std::cout << std::boolalpha << std::binary_search(v.begin(), v.end(), 30) << '\n';
          auto first = std::lower_bound(v.begin(), v.end(), 20);   // first element >= 20
          auto after = std::upper_bound(v.begin(), v.end(), 20);   // first element > 20
          std::cout << first - v.begin() << ' ' << after - v.begin() << ' ' << after - first << '\n';
          auto spot = std::lower_bound(v.begin(), v.end(), 25);
          std::cout << spot - v.begin() << '\n';                    // where 25 would be inserted
          return 0;
      }
      ```

      ```output
      true
      1 4 3
      4
      ```

      `upper_bound - lower_bound` counts the copies of a value in O(log n).

      ## Binary search on the answer

      Binary search works on anything **monotonic** — any yes/no question
      that switches from "no" to "yes" once. *What's the largest `r` with
      `r * r <= n`?* The answer to "is `r * r <= n`?" is yes, yes, yes… then no
      forever — so binary search for the switching point, without any array
      at all. This trick solves a surprising number of problems.

      {{check bs-steps}}

      {{task lower-bound}}

      {{task isqrt}}
    checks:
      - id: bs-steps
        type: mcq
        prompt: "At most how many steps does binary search need for a sorted vector of 1,000,000 elements?"
        options:
          - "About 20"
          - "About 1,000"
          - "About 500,000"
          - "1,000,000"
        answer: 0
        why: "2²⁰ = 1,048,576, so 20 halvings reduce a million to one."
      - id: bs-sorted
        type: tf
        prompt: "Binary search works on any vector, sorted or not."
        answer: false
        why: "It relies on order to discard half the range. On unsorted data it gives wrong answers."
    tasks:
      - id: lower-bound
        title: Your own lower_bound
        prompt: |
          Write `int firstAtLeast(const std::vector<int>& v, int x)` for a sorted
          `v`: the index of the first element `>= x`, or `v.size()` if there's
          none. It must be O(log n) — use a binary search over `[lo, hi)` (see
          the hints if the boundaries get confusing).
        starter: |
          #include <vector>

          int firstAtLeast(const std::vector<int>& v, int x) {
              return 0;
          }
        harness: |
          std::vector<int> v{10, 20, 20, 20, 30, 40};
          CHECK(firstAtLeast(v, 20), 1);
          CHECK(firstAtLeast(v, 25), 4);
          CHECK(firstAtLeast(v, 5), 0);
          CHECK(firstAtLeast(v, 40), 5);
          CHECK(firstAtLeast(v, 99), 6);
          CHECK(firstAtLeast({}, 1), 0);
        hints:
          - "Keep a half-open range: `lo = 0`, `hi = size`. The answer is always in `[lo, hi]`. Loop while `lo < hi`."
          - "`mid = lo + (hi - lo) / 2`. If `v[mid] < x`, the answer is after mid: `lo = mid + 1`. Otherwise mid might be the answer: `hi = mid`. Return `lo`."
        solution: |
          #include <vector>

          int firstAtLeast(const std::vector<int>& v, int x) {
              int lo{0};
              int hi{static_cast<int>(v.size())};
              while (lo < hi) {
                  int mid{lo + (hi - lo) / 2};
                  if (v[static_cast<std::size_t>(mid)] < x) {
                      lo = mid + 1;
                  } else {
                      hi = mid;
                  }
              }
              return lo;
          }
      - id: isqrt
        title: Binary search on the answer
        prompt: |
          Write `long long isqrt(long long n)` for `0 <= n <= 10^18`: the
          largest `r` with `r * r <= n`. Don't use floating point (it's
          inexact for huge numbers). Search the answer between 0 and
          1,000,000,000 (whose square is exactly 10^18).
        starter: |
          long long isqrt(long long n) {
              return 0;
          }
        harness: |
          CHECK(isqrt(0), 0);
          CHECK(isqrt(1), 1);
          CHECK(isqrt(15), 3);
          CHECK(isqrt(16), 4);
          CHECK(isqrt(999999999999LL), 999999);
          CHECK(isqrt(1000000000000000000LL), 1000000000);
          CHECK(isqrt(999999999999999999LL), 999999999);
        hints:
          - "`lo = 0`, `hi = 1000000000`. The question \"is `mid * mid <= n`?\" is yes up to the answer and no after it."
          - "Loop while `lo < hi` with `mid = lo + (hi - lo + 1) / 2` (rounding up); if `mid * mid <= n` then `lo = mid`, else `hi = mid - 1`. Return `lo`."
        solution: |
          long long isqrt(long long n) {
              long long lo{0};
              long long hi{1000000000};
              while (lo < hi) {
                  long long mid{lo + (hi - lo + 1) / 2};
                  if (mid * mid <= n) {
                      lo = mid;
                  } else {
                      hi = mid - 1;
                  }
              }
              return lo;
          }
        explain: |
          Why `+ 1` in `mid`? With `lo = mid` in the "yes" branch, rounding down
          could leave `mid == lo` forever when `hi = lo + 1` — an infinite loop.
          Rounding up guarantees progress. This is the classic binary-search
          pitfall: whenever one branch assigns `lo = mid`, round `mid` up.
    cards:
      - front: How does binary search work, and what does it require?
        back: On sorted data, compare with the middle element and discard the half that can't contain the target. O(log n).
      - front: "`std::lower_bound` vs `std::upper_bound`?"
        back: lower_bound → first element >= value; upper_bound → first element > value. Their difference counts copies of value.
      - front: What is "binary search on the answer"?
        back: Binary searching a range of possible answers using a yes/no test that is monotonic (switches once), e.g. largest r with r·r ≤ n.
      - front: Why write `lo + (hi - lo) / 2`?
        back: It avoids the overflow `lo + hi` can cause with huge indices.

  - type: lesson
    id: c18-sorting
    title: Sorting algorithms
    minutes: 28
    objectives:
      - Explain and implement selection sort and insertion sort
      - Explain merge sort's divide-and-conquer strategy and why it's O(n log n)
      - Know what a stable sort is, and which sort to use in practice
    body: |
      You'll use `std::sort` for real work. But sorting algorithms are the
      classic training ground for algorithmic thinking — loops, invariants,
      recursion and complexity all in one — and interviewers love them.

      ## Selection sort — O(n²)

      Find the smallest element, swap it to the front; repeat for the rest.

      ```cpp
      #include <iostream>
      #include <utility>
      #include <vector>

      void print(const std::vector<int>& v) {
          for (int x : v) {
              std::cout << x << ' ';
          }
          std::cout << '\n';
      }

      void selectionSort(std::vector<int>& v) {
          for (std::size_t i{0}; i + 1 < v.size(); ++i) {
              std::size_t smallest{i};
              for (std::size_t j{i + 1}; j < v.size(); ++j) {
                  if (v[j] < v[smallest]) {
                      smallest = j;
                  }
              }
              std::swap(v[i], v[smallest]);
              print(v);
          }
      }

      int main() {
          std::vector<int> v{5, 2, 9, 1, 6};
          selectionSort(v);
          return 0;
      }
      ```

      ```output
      1 2 9 5 6
      1 2 9 5 6
      1 2 5 9 6
      1 2 5 6 9
      ```

      **Invariant:** after pass `i`, the first `i + 1` elements are the
      smallest ones, in order. The inner loop scans the rest each time:
      n + (n−1) + … + 1 ≈ n²/2 comparisons. O(n²).

      ## Insertion sort — O(n²), but good on nearly-sorted data

      How you sort playing cards in your hand: take the next card and slide
      it left past every bigger card until it's in place.

      ```text
      [5] 2 9 1 6     start: the first card alone is "sorted"
      [2 5] 9 1 6     2 slides left past 5
      [2 5 9] 1 6     9 stays
      [1 2 5 9] 6     1 slides all the way to the front
      [1 2 5 6 9]     6 slides past 9
      ```

      On an already-sorted input each card stays put — O(n). That makes
      insertion sort excellent for small or nearly-sorted data (real
      `std::sort` implementations use it for small pieces). You'll write it
      below.

      ## Merge sort — O(n log n)

      **Divide and conquer:** split the vector in half, sort each half
      (recursively!), then **merge** the two sorted halves by repeatedly
      taking the smaller front element.

      ```cpp
      #include <iostream>
      #include <vector>

      std::vector<int> merge(const std::vector<int>& a, const std::vector<int>& b) {
          std::vector<int> out{};
          std::size_t i{0};
          std::size_t j{0};
          while (i < a.size() && j < b.size()) {
              if (b[j] < a[i]) {
                  out.push_back(b[j++]);
              } else {
                  out.push_back(a[i++]);   // on ties take from a: keeps the sort stable
              }
          }
          while (i < a.size()) {
              out.push_back(a[i++]);
          }
          while (j < b.size()) {
              out.push_back(b[j++]);
          }
          return out;
      }

      std::vector<int> mergeSort(std::vector<int> v) {
          if (v.size() <= 1) {
              return v;                                     // base case: already sorted
          }
          auto middle = v.begin() + static_cast<std::ptrdiff_t>(v.size() / 2);
          std::vector<int> left(v.begin(), middle);
          std::vector<int> right(middle, v.end());
          return merge(mergeSort(left), mergeSort(right));
      }

      int main() {
          for (int x : mergeSort({38, 27, 43, 3, 9, 82, 10})) {
              std::cout << x << ' ';
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      3 9 10 27 38 43 82
      ```

      Why O(n log n)? Halving gives **log n levels** of recursion, and on each
      level all the merges together touch all **n** elements.

      ```text
      [38 27 43 3 9 82 10]
      [38 27 43] [3 9 82 10]              split …
      [38] [27 43] [3 9] [82 10]
      [38] [27] [43] [3] [9] [82] [10]    … until single elements
      [38] [27 43] [3 9] [10 82]          merge …
      [27 38 43] [3 9 10 82]
      [3 9 10 27 38 43 82]                … back up
      ```

      ## In practice

      - Use **`std::sort`** — O(n log n), heavily optimised (introsort: quicksort + heapsort + insertion sort).
      - A sort is **stable** if equal elements keep their original order. `std::sort` isn't; **`std::stable_sort`** is (it's a merge sort). Stability matters when sorting by one key after another — e.g. by name, then stably by grade, gives students grouped by grade and alphabetical within each grade.

      {{check selection-trace}}

      {{task insertion}}
    checks:
      - id: selection-trace
        type: output
        prompt: "How many swaps actually change something (swap two *different* positions)?"
        code: |
          #include <iostream>
          #include <utility>
          #include <vector>

          int main() {
              std::vector<int> v{3, 1, 2, 4};
              int swaps{0};
              for (std::size_t i{0}; i + 1 < v.size(); ++i) {
                  std::size_t smallest{i};
                  for (std::size_t j{i + 1}; j < v.size(); ++j) {
                      if (v[j] < v[smallest]) {
                          smallest = j;
                      }
                  }
                  if (smallest != i) {
                      std::swap(v[i], v[smallest]);
                      ++swaps;
                  }
              }
              std::cout << swaps << '\n';
              return 0;
          }
        answer: |
          2
        why: "Pass 0: swap 3 and 1 → 1 3 2 4. Pass 1: swap 3 and 2 → 1 2 3 4. Pass 2: 3 is in place."
      - id: stable
        type: mcq
        prompt: "What does it mean for a sort to be **stable**?"
        options:
          - It never crashes
          - Equal elements keep their original relative order
          - It always takes the same time
          - It sorts in place without extra memory
        answer: 1
        why: "Stable sorts preserve the order of equal keys — useful for multi-key sorting."
    tasks:
      - id: insertion
        title: Insertion sort
        prompt: |
          Write `void insertionSort(std::vector<int>& v)` that sorts in place
          using insertion sort: for each element from the second on, slide it
          left while the element before it is bigger.
        starter: |
          #include <vector>

          void insertionSort(std::vector<int>& v) {
          }
        harness: |
          std::vector<int> a{5, 2, 9, 1, 6};
          insertionSort(a);
          CHECK(a, (std::vector<int>{1, 2, 5, 6, 9}));
          std::vector<int> b{};
          insertionSort(b);
          CHECK(b, std::vector<int>{});
          std::vector<int> c{3, 3, -1, 0, 3};
          insertionSort(c);
          CHECK(c, (std::vector<int>{-1, 0, 3, 3, 3}));
          std::vector<int> d{4, 3, 2, 1};
          insertionSort(d);
          CHECK(d, (std::vector<int>{1, 2, 3, 4}));
        hints:
          - "Outer loop `i` from 1 to size−1. Save `int card = v[i];` and let `j = i`."
          - "While `j > 0 && v[j - 1] > card`: shift `v[j] = v[j - 1]` and `--j`. Then `v[j] = card`. (Use `std::size_t` for i and j — the `j > 0` check keeps it from going below zero.)"
        solution: |
          #include <vector>

          void insertionSort(std::vector<int>& v) {
              for (std::size_t i{1}; i < v.size(); ++i) {
                  int card{v[i]};
                  std::size_t j{i};
                  while (j > 0 && v[j - 1] > card) {
                      v[j] = v[j - 1];
                      --j;
                  }
                  v[j] = card;
              }
          }
    cards:
      - front: How does selection sort work, and its complexity?
        back: Repeatedly find the smallest remaining element and swap it into place. O(n²) always.
      - front: How does insertion sort work, and when is it good?
        back: Take each element and slide it left into place among the sorted ones. O(n²) worst, O(n) on nearly-sorted data — great for small inputs.
      - front: How does merge sort work, and why O(n log n)?
        back: Split in half, sort each half recursively, merge the sorted halves. log n levels × n work per level.
      - front: "`std::sort` vs `std::stable_sort`?"
        back: Both O(n log n); stable_sort keeps equal elements in their original order, sort doesn't guarantee it.

