  - type: review
    id: c1-review
    title: "Chapter 1 review"
    body: |
      ## Cheat sheet

      | You want to | Write |
      |---|---|
      | Print text | `std::cout << "text";` |
      | Print several things | `std::cout << "a" << 5 << "b";` |
      | Print a calculation | `std::cout << 6 * 7;` (no quotes) |
      | End a line | `'\n'` (preferred) or `std::endl` (also flushes) |
      | Print `"` / `\` / a tab | `\"` / `\\` / `\t` |
      | Comment to end of line | `// ...` |
      | Comment a block | `/* ... */` |

      ## Key ideas

      - `std::cout << a << b` prints `a` then `b`, with **nothing** in between — spaces go inside the quotes.
      - Without quotes, `2 + 3` is **calculated**; with quotes, `"2 + 3"` is printed as text.
      - A backslash inside text starts an **escape sequence**.
      - Comments are for people. Good comments explain **why**.
      - Lay code out for readers: one statement per line, indent inside `{ }`, spaces around operators.
      - **Compile errors** stop the build; **run-time errors** crash while running; **logic errors** give wrong answers and are found only by testing.
      - Read errors as `file:line:column: error: message`. Fix the **first** one first, and check the line before it.
      - `std::` means "from the standard library"; `using namespace std;` is a shortcut with a cost.
    questions:
      - type: output
        code: |
          #include <iostream>

          int main() {
              std::cout << 1 + 1 << "1 + 1" << '\n';
              // std::cout << "hidden\n";
              std::cout << "end\n";
              return 0;
          }
        answer: |
          21 + 1
          end
        why: "`1 + 1` prints `2`, immediately followed by the text `1 + 1`. The commented line is ignored."
      - type: mcq
        prompt: Which of these is the first thing in every C++ program you have written so far?
        options:
          - "`int main() {`"
          - "`#include <iostream>`"
          - "`std::cout`"
          - "`return 0;`"
        answer: 1
        why: The `#include` comes first, so that the names it provides (like `std::cout`) are known before they're used.
      - type: spot
        prompt: This compiles but has a logic error — it should print the number of seconds in 2 minutes. Which line is wrong?
        code: |
          #include <iostream>

          int main() {
              std::cout << "2 minutes = ";
              std::cout << 2 * 100 << " seconds\n";
              return 0;
          }
        answer: 5
        why: A minute has 60 seconds, so it should be `2 * 60`. The compiler can't know that — only testing catches it.

  - type: exam
    id: c1-exam
    title: "Chapter 1 exam"
    minutes: 20
    questions:
      - type: output
        code: |
          #include <iostream>

          int main() {
              std::cout << "Sum: " << 12 + 30 << "\n";
              std::cout << "Text: " << "12 + 30" << "\n";
              return 0;
          }
        answer: |
          Sum: 42
          Text: 12 + 30
        why: The first is calculated; the second is text in quotes, printed as written.
      - type: output
        code: |
          #include <iostream>

          int main() {
              std::cout << "a";
              std::cout << "b" << '\n';
              std::cout << "c" << std::endl;
              return 0;
          }
        answer: |
          ab
          c
        why: "`a` has no newline, so `b` follows on the same line, then `'\\n'`. `c` is ended by `std::endl`."
      - type: mcq
        prompt: "How do you print `Path: C:\\temp`?"
        options:
          - "`std::cout << \"Path: C:\\temp\";`"
          - "`std::cout << \"Path: C:\\\\temp\";`"
          - "`std::cout << \"Path: C:/temp\";`"
          - "`std::cout << 'Path: C:\\temp';`"
        answer: 1
        why: "A backslash must be written `\\\\`. (`\\t` would be a tab!)"
      - type: mcq
        prompt: Which is a **compile** error?
        options:
          - A program that prints 10 when it should print 12
          - A program that crashes halfway through
          - A missing semicolon at the end of a statement
          - A program that runs slowly
        answer: 2
        why: A missing semicolon breaks C++'s rules, so the compiler refuses to build the program.
      - type: mcq
        prompt: "In the message `main.cpp:7:15: error: expected ';' before '}' token`, which line should you look at first?"
        options:
          - Line 15
          - Line 7, and the line just before it
          - Line 1
          - The last line of the file
        answer: 1
        why: The error is reported at line 7, column 15. A missing `;` is usually at the end of the statement right where (or just before where) the compiler noticed.
      - type: tf
        prompt: "`/* ... */` comments can span several lines."
        answer: true
        why: Everything between `/*` and `*/` is a comment, however many lines it covers.
      - type: spot
        prompt: Which line won't compile?
        code: |
          #include <iostream>

          int main() {
              std::cout << "Name:\tAda\n";
              std::cout << "Quote: \"Hi\"\n";
              std::cout << "Said "Bye"\n";
              return 0;
          }
        answer: 6
        why: "The quotes around `Bye` are not escaped, so the text ends early. It should be `\\\"Bye\\\"`."
      - type: output
        code: |
          #include <iostream>

          int main() {
              std::cout << "Start\n";
              /* std::cout << "Middle\n"; */
              std::cout << "End\n"; // std::cout << "Extra\n";
              return 0;
          }
        answer: |
          Start
          End
        why: Both the block comment and the end-of-line comment are ignored.
      - type: mcq
        prompt: What does `using namespace std;` do?
        options:
          - It includes the standard library
          - It lets you use standard names like `cout` without writing `std::`
          - It makes the program run faster
          - It is required in every program
        answer: 1
        why: It only saves typing `std::`. You still need `#include <iostream>` for `cout` to exist at all.
      - type: fill
        prompt: Complete the line so the output is `Result = 56` (calculated from 7 and 8).
        code: |
          #include <iostream>

          int main() {
              std::cout << "Result = " << 7 ___ 8 << '\n';
              return 0;
          }
        blanks:
          - ['*']
        output: |
          Result = 56
        why: "`*` is multiplication in C++."
      - type: code
        prompt: |
          Write a program that prints exactly:

          ```text
          Item	Price
          "Pen"	2
          Total: 6
          ```

          Between the columns is a **tab** (`\t`). The `2` must be printed as a
          number, and the total must be **calculated** as `3 * 2`.
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: ""
            out: "Item\tPrice\n\"Pen\"\t2\nTotal: 6\n"
        solution: |
          #include <iostream>

          int main() {
              std::cout << "Item\tPrice\n";
              std::cout << "\"Pen\"\t" << 2 << '\n';
              std::cout << "Total: " << 3 * 2 << '\n';
              return 0;
          }
