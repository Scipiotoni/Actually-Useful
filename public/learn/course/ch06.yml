  - type: challenge
    id: c6-ch-dates
    title: Day of the year
    difficulty: 3
    tags: [functions, design]
    prompt: |
      Write three functions:

      - `bool isLeap(int year)`
      - `int daysInMonth(int month, int year)` — 28/29 for February, 30 for April, June, September, November, 31 otherwise.
      - `int dayOfYear(int day, int month, int year)` — 1 for 1 January, 365 (or 366) for 31 December.

      Build each on the one before.
    starter: |
      bool isLeap(int year) {
          return false;
      }

      int daysInMonth(int month, int year) {
          return 0;
      }

      int dayOfYear(int day, int month, int year) {
          return 0;
      }
    harness: |
      CHECK(isLeap(2024), true);
      CHECK(isLeap(1900), false);
      CHECK(daysInMonth(2, 2024), 29);
      CHECK(daysInMonth(2, 2023), 28);
      CHECK(daysInMonth(4, 2023), 30);
      CHECK(daysInMonth(12, 2023), 31);
      CHECK(dayOfYear(1, 1, 2023), 1);
      CHECK(dayOfYear(1, 3, 2023), 60);
      CHECK(dayOfYear(1, 3, 2024), 61);
      CHECK(dayOfYear(31, 12, 2023), 365);
      CHECK(dayOfYear(31, 12, 2000), 366);
    hints:
      - "`daysInMonth`: a `switch` on the month, calling `isLeap` for February."
      - "`dayOfYear`: add up `daysInMonth` for every month before `month`, then add `day`."
    solution: |
      bool isLeap(int year) {
          return (year % 4 == 0 && year % 100 != 0) || year % 400 == 0;
      }

      int daysInMonth(int month, int year) {
          switch (month) {
          case 2:
              return isLeap(year) ? 29 : 28;
          case 4:
          case 6:
          case 9:
          case 11:
              return 30;
          default:
              return 31;
          }
      }

      int dayOfYear(int day, int month, int year) {
          int total{day};
          for (int m{1}; m < month; ++m) {
              total += daysInMonth(m, year);
          }
          return total;
      }
    explain: |
      Each function is tiny and testable on its own, and each one makes the
      next one easy. That's decomposition working as intended.

  - type: review
    id: c6-review
    title: "Chapter 6 review"
    body: |
      ## Cheat sheet

      ```cpp static
      int square(int x);                          // declaration (prototype)

      int square(int x) {                         // definition
          return x * x;
      }

      void greet(const std::string& name);       // read-only, no copy
      void addBonus(int& score);                 // changes the caller's variable
      void line(int length = 20, char c = '-');  // default arguments
      double add(double a, double b);            // overload of add(int, int)

      long long factorial(int n) {               // recursion
          if (n <= 1) { return 1; }              // base case
          return n * factorial(n - 1);           // smaller problem
      }
      ```

      ## Key ideas

      - A call jumps into the function; `return` jumps back with a value.
      - Parameters are local variables. By value = a copy; `&` = the caller's own variable; `const &` = no copy, read-only.
      - Every path of a non-void function must `return`.
      - Declare (or define) a function before calling it.
      - Overloads differ in their parameters, not their return type.
      - Recursion needs a base case and a step towards it; too deep ⇒ stack overflow.
      - Good functions do one job, have honest names, and keep computation separate from I/O.
    questions:
      - type: output
        prompt: "Interleaving: loops, strings and functions."
        code: |
          #include <iostream>
          #include <string>

          std::string repeat(const std::string& s, int times) {
              std::string out{};
              for (int i{0}; i < times; ++i) {
                  out += s;
              }
              return out;
          }

          int main() {
              std::string r = repeat("ab", 3);
              std::cout << r << ' ' << r.length() << '\n';
              return 0;
          }
        answer: |
          ababab 6
        why: "The loop appends \"ab\" three times."
      - type: output
        code: |
          #include <iostream>

          int f(int n) {
              if (n <= 0) {
                  return 0;
              }
              return (n % 2 == 0 ? n : 0) + f(n - 1);
          }

          int main() {
              std::cout << f(6) << '\n';
              return 0;
          }
        answer: |
          12
        why: "It sums the even numbers up to 6: 6 + 4 + 2 = 12."
      - type: mcq
        prompt: Which is the best signature for a function that computes the average of two `int`s?
        options:
          - "`void average(int a, int b)`"
          - "`int average(int& a, int& b)`"
          - "`double average(int a, int b)`"
          - "`double average()` using global variables"
        answer: 2
        why: Inputs by value (they're small and only read), and a `double` result returned.

  - type: exam
    id: c6-exam
    title: "Chapter 6 exam"
    minutes: 35
    pick: 14
    questions:
      - type: output
        code: |
