              return b == 0 ? a : gcd(b, a % b);
          }

          int main() {
              std::cout << gcd(84, 36) << '\n';
              return 0;
          }
        answer: |
          12
        why: "gcd(84, 36) → gcd(36, 12) → gcd(12, 0) = 12."
      - type: code
        prompt: |
          Write `int countDivisors(int n)` returning how many positive
          divisors `n` (≥ 1) has. `countDivisors(12)` is 6 (1, 2, 3, 4, 6, 12).
        starter: |
          int countDivisors(int n) {
              return 0;
          }
        harness: |
          CHECK(countDivisors(1), 1);
          CHECK(countDivisors(12), 6);
          CHECK(countDivisors(13), 2);
          CHECK(countDivisors(36), 9);
          CHECK(countDivisors(100), 9);
        solution: |
          int countDivisors(int n) {
              int count{0};
              for (int d{1}; d <= n; ++d) {
                  if (n % d == 0) {
                      ++count;
                  }
              }
              return count;
          }
      - type: code
        prompt: |
          Write `double average(int a, int b, int c)` returning the exact
          average, and `bool allPositive(int a, int b, int c)`.
        starter: |
          double average(int a, int b, int c) {
              return 0;
          }

          bool allPositive(int a, int b, int c) {
              return false;
          }
        harness: |
          CHECK(average(1, 2, 4), 7.0 / 3);
          CHECK(average(2, 2, 2), 2.0);
          CHECK(average(-1, 0, 2), 1.0 / 3);
          CHECK(allPositive(1, 2, 3), true);
          CHECK(allPositive(1, 0, 3), false);
          CHECK(allPositive(-1, 2, 3), false);
        solution: |
          double average(int a, int b, int c) {
              return static_cast<double>(a + b + c) / 3;
          }

          bool allPositive(int a, int b, int c) {
              return a > 0 && b > 0 && c > 0;
          }

  - type: exam
    id: c6-part-exam
    title: "Part I exam: First Steps"
