      - type: code
        prompt: |
          Read whole numbers until the input ends and print the **second
          largest distinct** value. If there isn't one (fewer than two distinct
          values), print `none`. For input `4 9 2 9 7`, print `7`.
        starter: |
          #include <iostream>

          int main() {

              return 0;
          }
        tests:
          - in: "4 9 2 9 7"
            out: "7"
          - in: "5 5 5"
            out: none
          - in: "1 2"
            out: "1"
          - in: ""
            out: none
          - in: "-3 -8 -1"
            out: "-3"
        solution: |
          #include <iostream>

          int main() {
              int x{};
              bool haveFirst{false};
              bool haveSecond{false};
              int first{0};
              int second{0};
              while (std::cin >> x) {
                  if (!haveFirst || x > first) {
                      if (haveFirst) {
                          second = first;
                          haveSecond = true;
                      }
                      first = x;
                      haveFirst = true;
                  } else if (x < first && (!haveSecond || x > second)) {
                      second = x;
                      haveSecond = true;
                  }
              }
              if (haveSecond) {
                  std::cout << second << '\n';
              } else {
                  std::cout << "none\n";
              }
              return 0;
          }
      - type: code
        prompt: |
          Write `int sumOfSquaresOfDigits(int n)` for n ≥ 0 and
          `bool isHappy(int n)`: a number is **happy** if repeatedly replacing
          it with the sum of the squares of its digits eventually reaches 1
          (19 → 82 → 68 → 100 → 1). Unhappy numbers end up in a loop that
          always passes through 4.
        starter: |
          int sumOfSquaresOfDigits(int n) {
              return 0;
          }

          bool isHappy(int n) {
              return false;
          }
        harness: |
          CHECK(sumOfSquaresOfDigits(19), 82);
          CHECK(sumOfSquaresOfDigits(0), 0);
          CHECK(isHappy(19), true);
          CHECK(isHappy(1), true);
          CHECK(isHappy(7), true);
          CHECK(isHappy(4), false);
          CHECK(isHappy(2), false);
          CHECK(isHappy(100), true);
        solution: |
          int sumOfSquaresOfDigits(int n) {
              int sum{0};
              while (n > 0) {
                  int d = n % 10;
                  sum += d * d;
                  n /= 10;
              }
              return sum;
          }

          bool isHappy(int n) {
              while (n != 1 && n != 4) {
                  n = sumOfSquaresOfDigits(n);
              }
              return n == 1;
          }
