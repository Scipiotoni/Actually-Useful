              std::cout << n;
          }

          int main() {
              pattern(3);
              std::cout << '\n';
              return 0;
          }
        answer: |
          321123
        why: "Each call prints n before and after the recursive call: 3, 2, 1, (base), 1, 2, 3."
      - type: mcq
        prompt: What's the best parameter type for a function that counts words in a (possibly huge) `std::string` without changing it?
        options:
          - "`std::string text`"
          - "`std::string& text`"
          - "`const std::string& text`"
          - "`int text`"
        answer: 2
        why: No copy, and a promise not to modify.
      - type: tf
        prompt: Two overloads can differ only in their return type.
        answer: false
