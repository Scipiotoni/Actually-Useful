      - type: output
        code: |
          #include <iostream>

          int area(int w, int h = 1) {
              return w * h;
          }

          int main() {
              std::cout << area(5) << ' ' << area(5, 2) << '\n';
              return 0;
          }
        answer: |
          5 10
        why: "In `area(5)`, h takes its default value 1."
      - type: mcq
        prompt: "`int f(int n) { return n * f(n - 1); }` — what's wrong?"
        options:
