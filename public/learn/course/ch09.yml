              Alan 70.33
          - in: |
              Grace 100 100 100
            out: |
              Grace 100.00
          - in: ""
            out: ""
        hints:
          - "Read with `while (std::cin >> name >> a >> b >> c)` and `push_back` a `Student{name, {a, b, c}}`."
          - "Make `average()` a const member function."
        solution: |
          #include <iomanip>
          #include <iostream>
          #include <string>
          #include <vector>

          struct Student {
              std::string name{};
              std::vector<int> scores{};

              double average() const {
                  if (scores.empty()) {
                      return 0.0;
                  }
                  int sum{0};
                  for (int s : scores) {
                      sum += s;
                  }
                  return static_cast<double>(sum) / static_cast<double>(scores.size());
              }
          };

          int main() {
              std::vector<Student> students{};
              std::string name{};
              int a{};
              int b{};
              int c{};
              while (std::cin >> name >> a >> b >> c) {
                  students.push_back(Student{name, {a, b, c}});
              }

              std::cout << std::fixed << std::setprecision(2);
              for (const auto& s : students) {
                  std::cout << s.name << ' ' << s.average() << '\n';
              }
