          }
      - title: Letter grades
        prompt: |
          Add `enum class Grade { A, B, C, D, F };` with a function
          `Grade gradeFor(double average)` (A ≥ 90, B ≥ 80, C ≥ 70, D ≥ 60,
          else F) and a function turning a `Grade` into a `char`. Print the
          grade after each average:

          ```text
          Ada 91.00 A
          Alan 70.33 C
          ```
        tests:
          - in: |
              Ada 90 95 88
              Alan 60 75 76
            out: |
              Ada 91.00 A
              Alan 70.33 C
          - in: |
              Low 10 20 30
              Border 80 80 80
              Almost 89 90 89
            out: |
              Low 20.00 F
              Border 80.00 B
              Almost 89.33 B
        hints:
          - "`char letter(Grade g)` with a `switch` returning `'A'`… `'F'`."
        solution: |
          #include <iomanip>
          #include <iostream>
          #include <string>
          #include <vector>

          enum class Grade { A, B, C, D, F };

          Grade gradeFor(double average) {
              if (average >= 90) {
                  return Grade::A;
              }
              if (average >= 80) {
                  return Grade::B;
              }
              if (average >= 70) {
                  return Grade::C;
              }
              if (average >= 60) {
                  return Grade::D;
              }
              return Grade::F;
          }

          char letter(Grade g) {
              switch (g) {
              case Grade::A: return 'A';
              case Grade::B: return 'B';
              case Grade::C: return 'C';
              case Grade::D: return 'D';
              case Grade::F: return 'F';
              }
              return '?';
          }

          struct Student {
              std::string name{};
              std::vector<int> scores{};

              double average() const {
                  if (scores.empty()) {
                      return 0.0;
                  }
                  int sum{0};
                  for (int s : scores) {
                      sum += s;
                  }
                  return static_cast<double>(sum) / static_cast<double>(scores.size());
              }
          };

          int main() {
              std::vector<Student> students{};
              std::string name{};
              int a{};
              int b{};
              int c{};
              while (std::cin >> name >> a >> b >> c) {
                  students.push_back(Student{name, {a, b, c}});
              }

              std::cout << std::fixed << std::setprecision(2);
              for (const auto& s : students) {
                  double avg = s.average();
                  std::cout << s.name << ' ' << avg << ' ' << letter(gradeFor(avg)) << '\n';
              }
              return 0;
          }
      - title: Class summary
        prompt: |
          After the list, print a blank line and a summary: the number of
          students, the class average (the average of the students' averages,
          2 decimals), the top student (first on a tie), and how many got each
          grade:

          ```text
          Ada 91.00 A
          Alan 70.33 C

          Students: 2
          Class average: 80.67
          Top: Ada
          A:1 B:0 C:1 D:0 F:0
          ```

          With no students, print only `No students`.
        tests:
          - in: |
              Ada 90 95 88
              Alan 60 75 76
            out: |
              Ada 91.00 A
              Alan 70.33 C

              Students: 2
              Class average: 80.67
              Top: Ada
              A:1 B:0 C:1 D:0 F:0
          - in: ""
            out: No students
          - in: |
              Low 10 20 30
              Border 80 80 80
              Almost 89 90 89
            out: |
              Low 20.00 F
              Border 80.00 B
              Almost 89.33 B

              Students: 3
              Class average: 63.11
              Top: Almost
              A:0 B:2 C:0 D:0 F:1
        hints:
          - "Count grades in `std::vector<int> counts(5, 0);`, indexing with `static_cast<int>(grade)`."
          - "Handle the empty case right after reading, before printing anything."
        solution: |
          #include <iomanip>
          #include <iostream>
          #include <string>
          #include <vector>

          enum class Grade { A, B, C, D, F };

          Grade gradeFor(double average) {
              if (average >= 90) {
                  return Grade::A;
              }
              if (average >= 80) {
                  return Grade::B;
              }
              if (average >= 70) {
                  return Grade::C;
              }
              if (average >= 60) {
                  return Grade::D;
              }
              return Grade::F;
          }

          char letter(Grade g) {
              switch (g) {
              case Grade::A: return 'A';
              case Grade::B: return 'B';
              case Grade::C: return 'C';
              case Grade::D: return 'D';
              case Grade::F: return 'F';
              }
              return '?';
          }

          struct Student {
              std::string name{};
              std::vector<int> scores{};

              double average() const {
                  if (scores.empty()) {
                      return 0.0;
                  }
                  int sum{0};
                  for (int s : scores) {
                      sum += s;
                  }
                  return static_cast<double>(sum) / static_cast<double>(scores.size());
              }
          };

          int main() {
              std::vector<Student> students{};
              std::string name{};
              int a{};
              int b{};
              int c{};
              while (std::cin >> name >> a >> b >> c) {
                  students.push_back(Student{name, {a, b, c}});
              }
              if (students.empty()) {
                  std::cout << "No students\n";
                  return 0;
              }

              std::cout << std::fixed << std::setprecision(2);
              std::vector<int> counts(5, 0);
              double total{0.0};
              std::size_t top{0};
              for (std::size_t i{0}; i < students.size(); ++i) {
                  double avg = students[i].average();
                  Grade g = gradeFor(avg);
                  std::cout << students[i].name << ' ' << avg << ' ' << letter(g) << '\n';
                  ++counts[static_cast<int>(g)];
                  total += avg;
                  if (avg > students[top].average()) {
                      top = i;
                  }
              }

              std::cout << '\n';
              std::cout << "Students: " << students.size() << '\n';
              std::cout << "Class average: " << total / static_cast<double>(students.size()) << '\n';
              std::cout << "Top: " << students[top].name << '\n';
              std::cout << "A:" << counts[0] << " B:" << counts[1] << " C:" << counts[2]
                        << " D:" << counts[3] << " F:" << counts[4] << '\n';
              return 0;
          }
        explain: |
          Look at how the types carry the design: `Student` knows how to
          compute its own average; `Grade` makes the five outcomes explicit and
          doubles as an index into the counts. When the types are right, the
          rest of the code gets simpler.

  - type: challenge
    id: c9-ch-fraction
    title: Fractions
    difficulty: 2
    tags: [structs, gcd]
    prompt: |
      With `struct Fraction { int num{0}; int den{1}; };`, write:

      - `Fraction simplify(Fraction f)` — lowest terms, with a positive denominator: `{6, -8}` → `{-3, 4}`, `{0, 5}` → `{0, 1}`.
      - `Fraction add(Fraction a, Fraction b)` and `Fraction multiply(Fraction a, Fraction b)` — both returning simplified results.

      Denominators are never 0.
    starter: |
      #include <cstdlib>

      struct Fraction {
          int num{0};
          int den{1};
      };

      Fraction simplify(Fraction f) {
          return f;
      }

      Fraction add(Fraction a, Fraction b) {
          return a;
      }

      Fraction multiply(Fraction a, Fraction b) {
          return a;
      }
    harness: |
      Fraction s = simplify({6, -8});
      CHECK(s.num, -3);
      CHECK(s.den, 4);
      Fraction z = simplify({0, 5});
      CHECK(z.num, 0);
      CHECK(z.den, 1);
      Fraction h = add({1, 2}, {1, 3});
      CHECK(h.num, 5);
      CHECK(h.den, 6);
      Fraction w = add({1, 4}, {3, 4});
      CHECK(w.num, 1);
      CHECK(w.den, 1);
      Fraction m = multiply({2, 3}, {9, 4});
      CHECK(m.num, 3);
      CHECK(m.den, 2);
      Fraction n = multiply({-1, 2}, {1, -2});
      CHECK(n.num, 1);
      CHECK(n.den, 4);
    hints:
      - "Divide both parts by the GCD of their absolute values (Chapter 5's Euclid), then if the denominator is negative, flip both signs."
      - "a/b + c/d = (a·d + c·b) / (b·d); a/b × c/d = (a·c) / (b·d). Then simplify."
    solution: |
      #include <cstdlib>

      struct Fraction {
          int num{0};
          int den{1};
      };

      int gcd(int a, int b) {
          while (b != 0) {
              int r = a % b;
              a = b;
              b = r;
          }
          return a;
      }

      Fraction simplify(Fraction f) {
          int g = gcd(std::abs(f.num), std::abs(f.den));
          if (g == 0) {
              return {0, 1};
          }
          f.num /= g;
          f.den /= g;
          if (f.den < 0) {
              f.num = -f.num;
              f.den = -f.den;
          }
          return f;
      }

      Fraction add(Fraction a, Fraction b) {
          return simplify({a.num * b.den + b.num * a.den, a.den * b.den});
      }

      Fraction multiply(Fraction a, Fraction b) {
          return simplify({a.num * b.num, a.den * b.den});
      }
    explain: |
      Keeping every fraction in one **canonical form** (lowest terms, positive
      denominator) means two equal fractions always have equal members — a
      preview of the *invariants* that classes enforce in Chapter 11.

  - type: challenge
    id: c9-ch-time
    title: Clock time
    difficulty: 2
    tags: [structs, remainder]
    prompt: |
      With `struct Time { int h{0}; int m{0}; int s{0}; };` (a time of day,
      24-hour clock), write:

      - `int toSeconds(Time t)` — seconds since midnight.
      - `Time fromSeconds(int total)` — the time of day for any number of seconds, **wrapping around** midnight (so 86400 is 00:00:00, and −1 is 23:59:59).
      - `Time addSeconds(Time t, int seconds)`.
    starter: |
      struct Time {
          int h{0};
          int m{0};
          int s{0};
      };

      int toSeconds(Time t) {
          return 0;
      }

      Time fromSeconds(int total) {
          return {};
      }

      Time addSeconds(Time t, int seconds) {
          return t;
      }
    harness: |
      CHECK(toSeconds({1, 2, 3}), 3723);
      Time a = fromSeconds(3723);
      CHECK(a.h, 1);
      CHECK(a.m, 2);
      CHECK(a.s, 3);
      Time b = fromSeconds(86400);
      CHECK(b.h, 0);
      CHECK(b.m, 0);
      Time c = fromSeconds(-1);
      CHECK(c.h, 23);
      CHECK(c.m, 59);
      CHECK(c.s, 59);
      Time d = addSeconds({23, 59, 30}, 45);
      CHECK(d.h, 0);
      CHECK(d.m, 0);
      CHECK(d.s, 15);
    hints:
      - "Wrap into one day first with a never-negative modulo: `((total % 86400) + 86400) % 86400`."
      - "`addSeconds` is just `fromSeconds(toSeconds(t) + seconds)`."
    solution: |
      struct Time {
          int h{0};
          int m{0};
          int s{0};
      };

      int toSeconds(Time t) {
          return t.h * 3600 + t.m * 60 + t.s;
      }

      Time fromSeconds(int total) {
          constexpr int day{86400};
          int t = ((total % day) + day) % day;
          return {t / 3600, t % 3600 / 60, t % 60};
      }

      Time addSeconds(Time t, int seconds) {
          return fromSeconds(toSeconds(t) + seconds);
      }

  - type: challenge
    id: c9-ch-rect
    title: Overlapping rectangles
    difficulty: 2
    tags: [structs, geometry]
    prompt: |
      An axis-aligned rectangle is `struct Rect { int x1{}; int y1{}; int x2{}; int y2{}; };`
      with `(x1, y1)` the bottom-left and `(x2, y2)` the top-right corner.
      Write `int overlapArea(Rect a, Rect b)` returning the area of their
      intersection (0 if they don't overlap or only touch).
    starter: |
      #include <algorithm>

      struct Rect {
          int x1{};
          int y1{};
          int x2{};
          int y2{};
      };

      int overlapArea(Rect a, Rect b) {
          return 0;
      }
    harness: |
      CHECK(overlapArea({0, 0, 4, 4}, {2, 2, 6, 6}), 4);
      CHECK(overlapArea({0, 0, 4, 4}, {4, 0, 8, 4}), 0);
      CHECK(overlapArea({0, 0, 10, 10}, {2, 3, 5, 4}), 3);
      CHECK(overlapArea({0, 0, 1, 1}, {5, 5, 6, 6}), 0);
      CHECK(overlapArea({-3, -3, 3, 3}, {-1, -5, 1, 5}), 12);
    hints:
      - "The overlap's left edge is the larger of the two left edges: `std::max(a.x1, b.x1)`; its right edge the smaller of the right edges."
      - "Width = right − left, height likewise; if either is ≤ 0, there's no overlap."
    solution: |
      #include <algorithm>

      struct Rect {
          int x1{};
          int y1{};
          int x2{};
          int y2{};
      };

      int overlapArea(Rect a, Rect b) {
          int width = std::min(a.x2, b.x2) - std::max(a.x1, b.x1);
          int height = std::min(a.y2, b.y2) - std::max(a.y1, b.y1);
          if (width <= 0 || height <= 0) {
              return 0;
          }
          return width * height;
      }

  - type: challenge
    id: c9-ch-league
    title: League table
    difficulty: 3
    tags: [structs, vectors, sorting]
    prompt: |
      Each input line is a match: `HomeTeam homeGoals AwayTeam awayGoals`. A
      win is worth 3 points, a draw 1, a loss 0. Print the league table,
      sorted by **points** (most first), then by **goal difference** (goals
      for minus goals against), then by **name** alphabetically. Each line:
      name, points, goal difference.

      For the input

      ```text
      Lions 2 Tigers 1
      Bears 0 Lions 0
      Tigers 3 Bears 3
      ```

      print

      ```text
      Lions 4 1
      Bears 2 0
      Tigers 1 -1
      ```

      (No `std::sort` yet — you'll write a simple sort yourself. Chapter 14
      shows the library way.)
    starter: |
      #include <iostream>
      #include <string>
      #include <vector>

      struct Team {
          std::string name{};
          int points{0};
          int goalsFor{0};
          int goalsAgainst{0};
      };

      int main() {

          return 0;
      }
    tests:
      - in: |
          Lions 2 Tigers 1
          Bears 0 Lions 0
          Tigers 3 Bears 3
        out: |
          Lions 4 1
          Bears 2 0
          Tigers 1 -1
      - in: |
          B 1 A 1
        out: |
          A 1 0
          B 1 0
      - in: |
          Red 5 Blue 0
          Green 1 Red 0
          Blue 2 Green 0
        out: |
          Red 3 4
          Green 3 -1
          Blue 3 -3
      - in: ""
        out: ""
    hints:
      - "Write `Team& find(std::vector<Team>& teams, const std::string& name)` that returns the team with that name, adding a new one if it isn't there yet (return `teams.back()` after `push_back`)."
      - "Write `bool before(const Team& a, const Team& b)` that says whether `a` should be listed before `b` — compare points, then goal difference, then names."
      - "Selection sort: for each position `i`, find the team among `i..end` that comes first according to `before`, and `std::swap` it into position `i`."
    solution: |
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      struct Team {
          std::string name{};
          int points{0};
          int goalsFor{0};
          int goalsAgainst{0};

          int difference() const {
              return goalsFor - goalsAgainst;
          }
      };

      Team& find(std::vector<Team>& teams, const std::string& name) {
          for (auto& t : teams) {
              if (t.name == name) {
                  return t;
              }
          }
          teams.push_back(Team{name});
          return teams.back();
      }

      void record(Team& t, int scored, int conceded) {
          t.goalsFor += scored;
          t.goalsAgainst += conceded;
          if (scored > conceded) {
              t.points += 3;
          } else if (scored == conceded) {
              t.points += 1;
          }
      }

      bool before(const Team& a, const Team& b) {
          if (a.points != b.points) {
              return a.points > b.points;
          }
          if (a.difference() != b.difference()) {
              return a.difference() > b.difference();
          }
          return a.name < b.name;
      }

      int main() {
          std::vector<Team> teams{};
          std::string home{};
          std::string away{};
          int hg{};
          int ag{};
          while (std::cin >> home >> hg >> away >> ag) {
              record(find(teams, home), hg, ag);
              record(find(teams, away), ag, hg);
          }

          for (std::size_t i{0}; i < teams.size(); ++i) {
              std::size_t best{i};
              for (std::size_t j{i + 1}; j < teams.size(); ++j) {
                  if (before(teams[j], teams[best])) {
                      best = j;
                  }
              }
              std::swap(teams[i], teams[best]);
          }

          for (const auto& t : teams) {
              std::cout << t.name << ' ' << t.points << ' ' << t.difference() << '\n';
          }
          return 0;
      }
    explain: |
      Careful with `find`: it returns a **reference** into the vector, and
      `push_back` can move the vector's elements in memory, making older
      references invalid. Here each reference is used immediately, before the
      next `find` — safe. (Chapter 10 explains why this matters.)

  - type: review
    id: c9-review
    title: "Chapter 9 review"
    body: |
      ## Cheat sheet

      ```cpp static
      struct Point {
          double x{0.0};                       // members with defaults
          double y{0.0};
          double length() const { ... }        // member function, doesn't modify
          void move(double dx, double dy) { }  // member function, modifies
      };                                       // <- semicolon!

      Point p{1.0, 2.0};    p.x = 5.0;    p.length();
      std::vector<Point> path{{0, 0}, {3, 4}};

      enum class Light { red, amber, green };
      Light l{Light::red};  static_cast<int>(l);

      std::pair<std::string, int> best{"Ada", 97};   best.first;  best.second;
      auto [name, score] = best;                     // structured binding
      ```

      ## Key ideas

      - A struct groups related data into a new type; initialise members in declaration order.
      - Structs copy member by member. Pass them by `const &` to read, `&` to change.
      - A vector of structs is a table: search and aggregate by comparing members.
      - Mark non-modifying member functions `const`.
      - `enum class` gives a fixed, checked set of named values; it doesn't convert to `int` by itself.
