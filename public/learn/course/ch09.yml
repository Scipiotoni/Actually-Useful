  - type: project
    id: c9-project
    title: "Project: Grade Book"
    body: |
      A teacher's grade book. Each line of input is a student: a name followed
      by **three** scores out of 100, like `Ada 90 95 88`. You'll model the
      data with a struct and an enum, and build up a class report.
    milestones:
      - title: Read and average
        prompt: |
          Define a `Student` struct (name and three scores, or a vector of
          scores) and read every line of input into a `std::vector<Student>`.
          Then print each student's name and average with 2 decimals:

          ```text
          Ada 91.00
          Alan 70.33
          ```

          for the input `Ada 90 95 88` / `Alan 60 75 76`.
        starter: |
          #include <iomanip>
          #include <iostream>
          #include <string>
          #include <vector>

          struct Student {
              std::string name{};
              std::vector<int> scores{};

              double average() const {
