id: ch09
number: 9
part: p2
title: Structs, Enums and Your Own Types
blurb: Stop juggling loose variables — bundle data that belongs together, and name the choices your program makes.
hours: 5
goals:
  - Define a `struct`, create values of it and access their members
  - Pass structs to functions, return them, and keep them in vectors
  - Add member functions to a struct
  - Use `enum class` for a fixed set of named choices
  - Use `std::pair` and structured bindings, and know when a struct is clearer
  - Model a real problem as a set of types

items:
  - type: lesson
    id: c9-struct
    title: "Structs: grouping related data"
    minutes: 20
    objectives:
      - Define a struct with members and default values
      - Create struct values with brace initialisation
      - Read and change members with `.`
    body: |
      A point on a map has an x and a y. A student has a name, an age and a
      list of scores. You *could* keep them in separate variables — `x1, y1,
      x2, y2`… `name1, age1`… — but that falls apart fast. What you want is a
      **new type** that bundles related values together. That's a **struct**:

      ```cpp
      #include <iostream>
      #include <string>

      struct Student {
          std::string name{};
          int age{0};
          double average{0.0};
      };

      int main() {
          Student ada{"Ada", 17, 9.4};
          Student alan{};           // every member gets its default

          alan.name = "Alan";
          alan.age = ada.age + 1;

          std::cout << ada.name << " is " << ada.age << '\n';
          std::cout << alan.name << " is " << alan.age << ", average " << alan.average << '\n';
          return 0;
      }
      ```

      ```output
      Ada is 17
      Alan is 18, average 0
      ```

      - `struct Student { ... };` defines a new type called `Student`. Note the `;` after the closing brace — it's required.
      - Inside are its **members** (also called *fields*), each with a type, a name and — always, as with any variable — a default value.
      - `Student ada{"Ada", 17, 9.4};` creates a `Student`, giving the members values **in the order they're declared**.
      - `ada.name` reads or writes a member with the **dot** operator.

      A struct type is used like any other type: variables, parameters, return
      values, vectors of them.

      ## Copying

      Assigning one struct to another copies **every** member. The two are
      then independent:

      ```cpp
      #include <iostream>

      struct Point {
          double x{};
          double y{};
      };

      int main() {
          Point a{1.0, 2.0};
          Point b = a;      // copy
          b.x = 10.0;
          std::cout << a.x << ' ' << b.x << '\n';
          return 0;
      }
      ```

      ```output
      1 10
      ```

      > [!note] Printing a struct
      > `std::cout << a;` doesn't compile — C++ can't guess how you'd like a
      > `Point` to look. Print its members, or write a function (or, in Chapter
      > 11, an `operator<<`) that does it.

      {{check struct-output}}

      {{task make-point}}
    checks:
      - id: struct-output
        type: output
        code: |
          #include <iostream>
          #include <string>

          struct Book {
              std::string title{};
              int pages{0};
              bool read{false};
          };

          int main() {
              Book b{"Dune", 412};
              Book c = b;
              c.pages += 100;
              std::cout << b.pages << ' ' << c.pages << ' ' << b.read << '\n';
              return 0;
          }
        answer: |
          412 512 0
        why: "`read` wasn't given a value, so it takes its default, false (0). `c` is a copy, so changing it doesn't affect `b`."
      - id: semicolon
        type: spot
        prompt: Which line stops this from compiling?
        code: |
          #include <iostream>

          struct Size {
              int width{};
              int height{};
          }

          int main() {
              Size s{3, 4};
              std::cout << s.width * s.height << '\n';
              return 0;
          }
        answer: 6
        why: "A struct definition must end with `};` — the semicolon after the brace is missing."
    tasks:
      - id: make-point
        title: Midpoint
        prompt: |
          The starter defines `struct Point { double x{}; double y{}; };`.
          Write `Point midpoint(Point a, Point b)` returning the point halfway
          between `a` and `b`.
        starter: |
          struct Point {
              double x{};
              double y{};
          };

          Point midpoint(Point a, Point b) {
              return {};
          }
        harness: |
          Point m = midpoint({0.0, 0.0}, {4.0, 2.0});
          CHECK(m.x, 2.0);
          CHECK(m.y, 1.0);
          Point n = midpoint({-1.0, 5.0}, {1.0, -5.0});
          CHECK(n.x, 0.0);
          CHECK(n.y, 0.0);
        hints:
          - "`return {(a.x + b.x) / 2, (a.y + b.y) / 2};` — braces build the Point to return."
        solution: |
          struct Point {
              double x{};
              double y{};
          };

          Point midpoint(Point a, Point b) {
              return {(a.x + b.x) / 2, (a.y + b.y) / 2};
          }
    cards:
      - front: What is a **struct**?
        back: A user-defined type that groups related values (its **members**) under one name.
      - front: How do you access a member `age` of a struct variable `s`?
        back: "`s.age` — the dot operator."
      - front: What does `Point b = a;` do when `Point` is a struct?
        back: Copies every member. `a` and `b` are then independent.
      - front: What must follow the closing brace of a struct definition?
        back: A semicolon — `};`

  - type: lesson
    id: c9-struct-fn
    title: Structs with functions and vectors
    minutes: 20
    objectives:
      - Pass structs by `const &`, and change them through `&`
      - Return a struct from a function
      - Keep many struct values in a vector and search them
    body: |
      Structs really shine together with functions and vectors — a vector of
      structs is a table, each element a row.

      ```cpp
      #include <iomanip>
      #include <iostream>
      #include <string>
      #include <vector>

      struct Product {
          std::string name{};
          double price{0.0};
          int stock{0};
      };

      double stockValue(const Product& p) {
          return p.price * p.stock;
      }

      void restock(Product& p, int amount) {
          p.stock += amount;
      }

      int main() {
          std::vector<Product> shop{
              {"Pen", 1.20, 50},
              {"Notebook", 3.50, 20},
              {"Backpack", 24.99, 3}
          };
          restock(shop[2], 5);

          double total{0.0};
          for (const auto& p : shop) {
              std::cout << std::left << std::setw(10) << p.name << p.stock << '\n';
              total += stockValue(p);
          }
          std::cout << std::fixed << std::setprecision(2) << "Total value: " << total << '\n';
          return 0;
      }
      ```

      ```output
      Pen       50
      Notebook  20
      Backpack  8
      Total value: 329.92
      ```

      Same rules as before: `const Product&` to read without copying,
      `Product&` to change the caller's value.

      ## Finding in a table

      Searching a vector of structs is the linear search you know — you just
      compare a member:

      ```cpp
      #include <iostream>
      #include <string>
      #include <vector>

      struct Contact {
          std::string name{};
          std::string phone{};
      };

      int indexOf(const std::vector<Contact>& book, const std::string& name) {
          for (std::size_t i{0}; i < book.size(); ++i) {
              if (book[i].name == name) {
                  return static_cast<int>(i);
              }
          }
          return -1;
      }

      int main() {
          std::vector<Contact> book{{"Ada", "555-0101"}, {"Grace", "555-0199"}};
          int i = indexOf(book, "Grace");
          if (i != -1) {
              std::cout << book[i].phone << '\n';
          }
          return 0;
      }
      ```

      ```output
      555-0199
      ```

      {{check vec-struct}}

      {{task oldest}}
    checks:
      - id: vec-struct
        type: output
        code: |
          #include <iostream>
          #include <vector>

          struct Item {
              int weight{};
              int value{};
          };

          int main() {
              std::vector<Item> bag{{2, 10}, {5, 7}, {1, 4}};
              int w{0};
              int v{0};
              for (const auto& it : bag) {
                  if (it.value > 5) {
                      w += it.weight;
                      v += it.value;
                  }
              }
              std::cout << w << ' ' << v << '\n';
              return 0;
          }
        answer: |
          7 17
        why: "Only the first two items have value > 5: weights 2 + 5, values 10 + 7."
    tasks:
      - id: oldest
        title: The oldest person
        prompt: |
          Given `struct Person { std::string name{}; int age{0}; };`, write
          `std::string oldest(const std::vector<Person>& people)` returning the
          name of the oldest person (the first on a tie), or `""` if the vector
          is empty.
        starter: |
          #include <string>
          #include <vector>

          struct Person {
              std::string name{};
              int age{0};
          };

          std::string oldest(const std::vector<Person>& people) {
              return "";
          }
        harness: |
          CHECK(oldest({{"Ada", 36}, {"Alan", 41}, {"Grace", 85}, {"Linus", 54}}), "Grace");
          CHECK(oldest({{"Tie1", 30}, {"Tie2", 30}}), "Tie1");
          CHECK(oldest({}), "");
        hints:
          - The max pattern, comparing `.age` and remembering the index (or the person).
        solution: |
          #include <string>
          #include <vector>

          struct Person {
              std::string name{};
              int age{0};
          };

          std::string oldest(const std::vector<Person>& people) {
              if (people.empty()) {
                  return "";
              }
              std::size_t best{0};
              for (std::size_t i{1}; i < people.size(); ++i) {
                  if (people[i].age > people[best].age) {
                      best = i;
                  }
              }
              return people[best].name;
          }
    cards:
      - front: How do you pass a struct to a function that only reads it?
        back: "By const reference: `void show(const Student& s)`."
      - front: How do you create a vector of structs with values?
        back: "With nested braces: `std::vector<Point> pts{{0, 0}, {3, 4}};`"

  - type: lesson
    id: c9-members
    title: Member functions
    minutes: 16
    objectives:
      - Add functions to a struct that work on its members
      - Mark member functions that don't change the object as `const`
    body: |
      Functions like `stockValue(p)` belong so closely to their struct that
      C++ lets you put them **inside** it. They're called **member
      functions** — you've used plenty already: `s.size()`, `v.push_back(x)`.

      ```cpp
      #include <iostream>

      struct Rectangle {
          double width{0.0};
          double height{0.0};

          double area() const {
              return width * height;
          }

          double perimeter() const {
              return 2 * (width + height);
          }

          void scale(double factor) {
              width *= factor;
              height *= factor;
          }
      };

      int main() {
          Rectangle r{3.0, 2.0};
          std::cout << r.area() << ' ' << r.perimeter() << '\n';
          r.scale(2.0);
          std::cout << r.area() << '\n';
          return 0;
      }
      ```

      ```output
      6 10
      24
      ```

      Inside a member function, the members (`width`, `height`) are used
      directly — they're the members of **the object the function was called
      on**. `r.area()` computes with `r`'s width and height.

      ## `const` member functions

      The `const` after `area()` promises that the function **doesn't change**
      the object. That matters because a `const` object — or one received as a
      `const &` parameter — may only call `const` member functions:

      ```cpp static
      void report(const Rectangle& r) {
          std::cout << r.area();   // fine: area() is const
          r.scale(2.0);            // error: scale() changes r, and r is const
      }
      ```

      > [!pro]
      > Mark every member function that doesn't modify the object as `const`.
      > It documents intent, and it lets your type work with `const &`
      > parameters.

      Chapter 11 turns structs with member functions into full **classes**,
      which can also protect their data from outside meddling.

      {{check member-output}}

      {{task temp}}
    checks:
      - id: member-output
        type: output
        code: |
          #include <iostream>

          struct Counter {
              int value{0};

              void add(int n) {
                  value += n;
              }

              bool isBig() const {
                  return value > 10;
              }
          };

          int main() {
              Counter a{};
              Counter b{8};
              a.add(4);
              b.add(4);
              std::cout << a.value << a.isBig() << ' ' << b.value << b.isBig() << '\n';
              return 0;
          }
        answer: |
          40 121
        why: "Each object has its own `value`: a goes 0 → 4 (not big), b goes 8 → 12 (big)."
      - id: const-mf
        type: mcq
        prompt: "What does `const` mean in `double area() const`?"
        options:
          - The function returns a constant
          - The function doesn't change the object it's called on
          - The function can't be called twice
          - "`area` can only be used with constants"
        answer: 1
        why: A `const` member function promises not to modify the object — so it can be called on const objects.
    tasks:
      - id: temp
        title: Temperature record
        prompt: |
          Complete `struct TempLog` with a `std::vector<double> readings{}`:

          - `void add(double t)` — records a reading.
          - `double highest() const` — the highest reading (0.0 if none).
          - `double average() const` — the average (0.0 if none).
        starter: |
          #include <vector>

          struct TempLog {
              std::vector<double> readings{};

              void add(double t) {
              }

              double highest() const {
                  return 0.0;
              }

              double average() const {
                  return 0.0;
              }
          };
        harness: |
          TempLog log{};
          CHECK(log.highest(), 0.0);
          CHECK(log.average(), 0.0);
          log.add(12.5);
          log.add(20.0);
          log.add(15.5);
          CHECK(log.readings.size(), 3);
          CHECK(log.highest(), 20.0);
          CHECK(log.average(), 16.0);
          const TempLog& view = log;
          CHECK(view.highest(), 20.0);
        hints:
          - "`add` is `readings.push_back(t);`"
          - "In `highest`, start with `readings[0]` — after checking `readings.empty()`."
        solution: |
          #include <vector>

          struct TempLog {
              std::vector<double> readings{};

              void add(double t) {
                  readings.push_back(t);
              }

              double highest() const {
                  if (readings.empty()) {
                      return 0.0;
                  }
                  double best = readings[0];
                  for (double r : readings) {
                      if (r > best) {
                          best = r;
                      }
                  }
                  return best;
              }

              double average() const {
                  if (readings.empty()) {
                      return 0.0;
                  }
                  double sum{0.0};
                  for (double r : readings) {
                      sum += r;
                  }
                  return sum / static_cast<double>(readings.size());
              }
          };
    cards:
      - front: What is a **member function**?
        back: A function defined inside a struct/class that works on the object it's called on, e.g. `r.area()`.
      - front: Why mark a member function `const`?
        back: It promises not to change the object, and it's required for calling the function on const objects or through `const &`.

  - type: quiz
    id: c9-quiz1
    title: "Quiz: structs"
    questions:
      - type: output
        code: |
          #include <iostream>

          struct P {
              int a{1};
              int b{2};
          };

          int main() {
              P x{};
              P y{5};
              P z{7, 8};
              std::cout << x.a << x.b << y.a << y.b << z.a << z.b << '\n';
              return 0;
          }
        answer: |
          125278
        why: "Missing initialisers use the defaults: x is {1, 2}, y is {5, 2}, z is {7, 8}."
      - type: output
        code: |
          #include <iostream>

          struct Box {
              int n{0};
          };

          void grow(Box b) {
              b.n += 10;
          }

          void growRef(Box& b) {
              b.n += 1;
          }

          int main() {
              Box box{};
              grow(box);
              growRef(box);
              std::cout << box.n << '\n';
              return 0;
          }
        answer: |
          1
        why: "`grow` changes a copy; only `growRef` changes the caller's box."
      - type: mcq
        prompt: "`void print(const Shape& s)` calls `s.area()`. What must be true of `area`?"
        options:
          - It must be `static`
          - It must be a `const` member function
          - It must return `void`
          - Nothing special
        answer: 1
        why: "Through a `const &`, only `const` member functions can be called."
      - type: tf
        prompt: "`std::cout << point;` works for any struct `point`."
        answer: false
        why: "C++ doesn't know how to print your type unless you tell it (with a function, or `operator<<` in Chapter 11)."

  - type: lesson
    id: c9-enum
    title: "Named choices: enum class"
    minutes: 18
    objectives:
      - Define an `enum class` for a fixed set of values
      - Use enumerations in variables, comparisons and `switch`
      - Convert an enumeration to text and to its underlying number
    body: |
      A traffic light is red, amber or green. A card's suit is one of four. A
      game is running, paused or over. You *could* encode these as numbers (0
      = red, 1 = amber…) or strings (`"red"`), but numbers are meaningless to
      a reader and strings can be misspelled with no error.

      An **enumeration** creates a type whose values are a fixed list of
      names:

      ```cpp
      #include <iostream>

      enum class Light {
          red,
          amber,
          green
      };

      Light next(Light l) {
          switch (l) {
          case Light::red:
              return Light::green;
          case Light::green:
              return Light::amber;
          case Light::amber:
              return Light::red;
          }
          return Light::red;
      }

      const char* name(Light l) {
          switch (l) {
          case Light::red:
              return "red";
          case Light::amber:
              return "amber";
          case Light::green:
              return "green";
          }
          return "?";
      }

      int main() {
          Light l{Light::red};
          for (int i{0}; i < 4; ++i) {
              std::cout << name(l) << ' ';
              l = next(l);
          }
          std::cout << '\n';
          return 0;
      }
      ```

      ```output
      red green amber red
      ```

      - The values are written `Light::red`, `Light::amber`… — each enum class is its own scope.
      - Only the listed values exist: a typo like `Light::rde` is a compile error.
      - They work beautifully with `switch`. Compilers even warn if a `switch` forgets one of the values — so when you add a new value later, the compiler shows every place that must handle it.
      - To print one, write a function that turns it into text (`const char*` is plain C-style text — enough for fixed names).

      ## Underneath, numbers

      Each value is stored as an integer: `red` is 0, `amber` 1, `green` 2,
      unless you choose otherwise. `enum class` never converts to `int`
      implicitly — you have to ask:

      ```cpp
      #include <iostream>

      enum class Priority {
          low = 1,
          normal = 5,
          urgent = 10
      };

      int main() {
          Priority p{Priority::urgent};
          std::cout << static_cast<int>(p) << '\n';
          std::cout << (p == Priority::urgent) << '\n';
          return 0;
      }
      ```

      ```output
      10
      1
      ```

      > [!note] `enum` versus `enum class`
      > Older code uses plain `enum Light { red, amber, green };`. Its values
      > (`red`) leak into the surrounding scope and silently convert to `int`,
      > which causes clashes and bugs. Use `enum class` in new code.

      {{check enum-output}}

      {{task season}}
    checks:
      - id: enum-output
        type: output
        code: |
          #include <iostream>

          enum class Dir {
              north,
              east,
              south,
              west
          };

          int main() {
              Dir d{Dir::east};
              int turns = static_cast<int>(d) + 2;
              Dir opposite = static_cast<Dir>(turns % 4);
              std::cout << static_cast<int>(opposite) << ' ' << (opposite == Dir::west) << '\n';
              return 0;
          }
        answer: |
          3 1
        why: "east is 1; 1 + 2 = 3, which is west."
      - id: why-enum
        type: mcq
        prompt: Why is `enum class Suit { hearts, diamonds, clubs, spades };` better than storing the suit as a string?
        options:
          - Enums take less typing
          - Only the four valid values exist, so typos are compile errors and `switch` can check every case
          - Strings can't be compared
          - Enums can be printed with `std::cout` directly
        answer: 1
        why: "The compiler knows the complete set of values. A string like \"harts\" would compile fine and be a bug."
    tasks:
      - id: season
        title: Seasons
        prompt: |
          The starter defines `enum class Season { winter, spring, summer, autumn };`.
          Write `Season seasonOf(int month)` for months 1–12 (Dec–Feb winter,
          Mar–May spring, Jun–Aug summer, Sep–Nov autumn).
        starter: |
          enum class Season {
              winter,
              spring,
              summer,
              autumn
          };

          Season seasonOf(int month) {
              return Season::winter;
          }
        harness: |
          CHECK(static_cast<int>(seasonOf(1)), static_cast<int>(Season::winter));
          CHECK(static_cast<int>(seasonOf(12)), static_cast<int>(Season::winter));
          CHECK(static_cast<int>(seasonOf(3)), static_cast<int>(Season::spring));
          CHECK(static_cast<int>(seasonOf(7)), static_cast<int>(Season::summer));
          CHECK(static_cast<int>(seasonOf(8)), static_cast<int>(Season::summer));
          CHECK(static_cast<int>(seasonOf(10)), static_cast<int>(Season::autumn));
        hints:
          - "An `if` chain on ranges: `if (month >= 3 && month <= 5) return Season::spring;` …"
        solution: |
          enum class Season {
              winter,
              spring,
              summer,
              autumn
          };

          Season seasonOf(int month) {
              if (month >= 3 && month <= 5) {
                  return Season::spring;
              }
              if (month >= 6 && month <= 8) {
                  return Season::summer;
              }
              if (month >= 9 && month <= 11) {
                  return Season::autumn;
              }
              return Season::winter;
          }
    cards:
      - front: What does `enum class Color { red, green };` define?
        back: A new type `Color` whose only values are `Color::red` and `Color::green`.
      - front: How do you get the number behind an `enum class` value?
        back: "`static_cast<int>(value)` — it doesn't convert implicitly."
      - front: Why prefer `enum class` over plain `enum`?
        back: Its names don't leak into the surrounding scope, and it doesn't silently convert to `int`.

  - type: lesson
    id: c9-pair
    title: Pairs, tuples and structured bindings
    minutes: 16
    objectives:
      - Store two values together with `std::pair`
      - Unpack a pair or struct with structured bindings
      - Choose between a pair and a named struct
    body: |
      Sometimes you need to bundle just two values quickly — say, to return
      both the minimum and the maximum from a function. The standard library
      has **`std::pair`** (in `<utility>`):

      ```cpp
      #include <iostream>
      #include <utility>
      #include <vector>

      std::pair<int, int> minMax(const std::vector<int>& v) {
          int lo = v[0];
          int hi = v[0];
          for (int x : v) {
              if (x < lo) {
                  lo = x;
              }
              if (x > hi) {
                  hi = x;
              }
          }
          return {lo, hi};
      }

      int main() {
          std::pair<int, int> r = minMax({4, -2, 9, 3});
          std::cout << r.first << ' ' << r.second << '\n';
          return 0;
      }
      ```

      ```output
      -2 9
      ```

      A pair's members are called `first` and `second`; the two can have
      different types (`std::pair<std::string, int>`).

      ## Structured bindings

      Instead of `.first` and `.second`, you can **unpack** a pair — or any
      simple struct — into named variables in one go:

      ```cpp
      #include <iostream>
      #include <string>
      #include <utility>

      struct Score {
          std::string player{};
          int points{0};
      };

      int main() {
          std::pair<std::string, int> best{"Ada", 97};
          auto [name, points] = best;
          std::cout << name << ": " << points << '\n';

          Score s{"Alan", 88};
          auto [who, pts] = s;
          std::cout << who << ": " << pts << '\n';
          return 0;
      }
      ```

      ```output
      Ada: 97
      Alan: 88
      ```

      `auto [a, b] = x;` creates variables `a` and `b` from the members of `x`,
      in order. It becomes really handy with maps in Chapter 13.

      ## Pair or struct?

      `std::tuple` generalises pairs to any number of values. But `first`,
      `second` and `std::get<2>(t)` say nothing about *meaning*. If the values
      go together beyond one quick return, give them a **struct** with good
      member names — `range.low` beats `range.first`.

      {{check binding}}
    checks:
      - id: binding
        type: output
        code: |
          #include <iostream>
          #include <utility>

          std::pair<int, int> divide(int a, int b) {
              return {a / b, a % b};
          }

          int main() {
              auto [q, r] = divide(17, 5);
              std::cout << q << ' ' << r << '\n';
              return 0;
          }
        answer: |
          3 2
        why: "The function returns both the quotient and the remainder; the structured binding unpacks them."
      - id: pair-or-struct
        type: mcq
        prompt: "A function returns a person's height and weight together. The most readable return type?"
        options:
          - "`std::pair<double, double>`"
          - "`struct Measurements { double heightCm{}; double weightKg{}; };`"
          - "`double` — return only one"
          - "`std::string` with both joined"
        answer: 1
        why: "Named members say what each value means. `first`/`second` would force every reader to remember which is which."
    cards:
      - front: What are the members of a `std::pair` called?
        back: "`first` and `second`."
      - front: What does `auto [a, b] = p;` do?
        back: A **structured binding** — it creates `a` and `b` from the members of `p` (a pair or simple struct), in order.
      - front: When is a struct better than a pair?
        back: Whenever the values have meaning beyond a quick return — named members make code self-explanatory.

  - type: quiz
