          that sum is **100 or more**.
        starter: |
          #include <string>
          #include <vector>

          struct Item {
              std::string name{};
              double price{0.0};
              int qty{0};
          };

          double orderTotal(const std::vector<Item>& items) {
              return 0.0;
          }
        harness: |
          CHECK(orderTotal({{"pen", 2.0, 5}, {"book", 20.0, 2}}), 50.0);
          CHECK(orderTotal({{"chair", 60.0, 2}}), 108.0);
          CHECK(orderTotal({}), 0.0);
          CHECK(orderTotal({{"a", 50.0, 1}, {"b", 25.0, 2}}), 90.0);
        solution: |
          #include <string>
          #include <vector>

          struct Item {
              std::string name{};
              double price{0.0};
              int qty{0};
          };

          double orderTotal(const std::vector<Item>& items) {
              double sum{0.0};
              for (const auto& it : items) {
                  sum += it.price * it.qty;
              }
              if (sum >= 100.0) {
                  sum *= 0.9;
              }
              return sum;
          }
      - type: code
        prompt: |
          With `enum class Move { rock, paper, scissors };` write
          `int judge(Move a, Move b)` returning `1` if `a` beats `b`, `-1` if
          `b` beats `a`, and `0` for a draw.
        starter: |
          enum class Move { rock, paper, scissors };

          int judge(Move a, Move b) {
              return 0;
          }
        harness: |
          CHECK(judge(Move::rock, Move::scissors), 1);
          CHECK(judge(Move::scissors, Move::rock), -1);
          CHECK(judge(Move::paper, Move::rock), 1);
          CHECK(judge(Move::paper, Move::scissors), -1);
          CHECK(judge(Move::paper, Move::paper), 0);
        solution: |
          enum class Move { rock, paper, scissors };

          bool beats(Move a, Move b) {
              return (a == Move::rock && b == Move::scissors) ||
                     (a == Move::paper && b == Move::rock) ||
                     (a == Move::scissors && b == Move::paper);
          }

          int judge(Move a, Move b) {
              if (a == b) {
                  return 0;
              }
              return beats(a, b) ? 1 : -1;
          }
