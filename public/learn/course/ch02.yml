  - type: review
    id: c2-review
    title: "Chapter 2 review"
    body: |
      ## Cheat sheet

      ```cpp static
      int count{0};                 // whole number
      double price{9.99};           // decimal number
      char grade{'A'};              // one character, single quotes
      bool done{false};             // true or false
      std::string name{"Ada"};      // text, needs #include <string>
      long long big{8'000'000'000}; // very big whole number

      count = count + 1;            // change a value
      constexpr double pi{3.14159}; // a constant known when compiling
      const int limit{10};          // a constant

      std::cin >> count;            // read a value
      std::cin >> name >> price;    // read several
      ```

      ## Key ideas

      - A variable has a **type**, a **name** and a **value**. `=` means "store into".
      - **Always initialise.** `int x{};` is zero; an uninitialised `int x;` holds garbage (undefined behaviour).
      - Brace initialisation `{}` refuses **narrowing** — e.g. `int n{2.5}` is an error.
      - `std::cout` prints doubles with up to 6 significant digits and drops trailing zeros.
      - A `char` is a small number (its code): `'A' + 1` is `'B'`, `'7' - '0'` is `7`.
      - `bool` prints as `1`/`0` unless you use `std::boolalpha`.
      - Strings join with `+` — but not two literals. `.length()` counts characters.
      - Name your constants: no **magic numbers**.
      - `std::cin >> x` reads one value of `x`'s type; for strings, one word.
