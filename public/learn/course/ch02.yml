              std::string w{};
              std::cin >> n >> w;
              std::string out = w + w;
              std::cout << out << ' ' << out.length() * n << '\n';
              return 0;
          }
        stdin: "4 hi"
        answer: |
          hihi 16
        why: "`out` is `hihi` (length 4), times `n` (4) gives 16."
