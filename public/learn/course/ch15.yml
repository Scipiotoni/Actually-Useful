      - `explicit Account(double initial)` throws `std::invalid_argument` for a negative initial balance.
      - `void deposit(double)` throws `std::invalid_argument` for amounts ≤ 0.
      - `void withdraw(double)` throws `std::invalid_argument` for amounts ≤ 0, and `std::runtime_error` if the balance is too low.
      - `double balance() const`.

      A failed operation must leave the balance unchanged.
    starter: |
      #include <stdexcept>

      class Account {
      public:
          explicit Account(double initial) : balance_{initial} {}

          void deposit(double amount) {
          }

          void withdraw(double amount) {
          }

          double balance() const { return balance_; }

      private:
          double balance_{0.0};
      };
    harness: |
      CHECK_THROWS(Account{-1});
      Account a{100};
      a.deposit(50);
      CHECK(a.balance(), 150.0);
      CHECK_THROWS(a.deposit(0));
      CHECK_THROWS(a.withdraw(-5));
      CHECK_THROWS(a.withdraw(500));
      CHECK(a.balance(), 150.0);
      a.withdraw(150);
      CHECK(a.balance(), 0.0);
      bool wasRuntime{false};
      try { a.withdraw(1); } catch (const std::runtime_error&) { wasRuntime = true; } catch (...) {}
      CHECK(wasRuntime, true);
    hints:
      - "Check first, throw, and only change `balance_` when every check has passed."
      - "In the constructor, validate in the body: `if (initial < 0) throw std::invalid_argument{\"negative\"};`"
    solution: |
      #include <stdexcept>

      class Account {
      public:
          explicit Account(double initial) : balance_{initial} {
              if (initial < 0) {
                  throw std::invalid_argument{"negative initial balance"};
              }
          }

          void deposit(double amount) {
              if (amount <= 0) {
                  throw std::invalid_argument{"deposit must be positive"};
              }
              balance_ += amount;
          }

          void withdraw(double amount) {
              if (amount <= 0) {
                  throw std::invalid_argument{"withdrawal must be positive"};
              }
              if (amount > balance_) {
                  throw std::runtime_error{"insufficient funds"};
              }
              balance_ -= amount;
          }

          double balance() const { return balance_; }

      private:
          double balance_{0.0};
      };
    explain: |
      A constructor that throws means **no object is created** — so an
      invalid `Account` can never exist. That's the strongest way to guarantee
      an invariant.

  - type: review
    id: c15-review
    title: "Chapter 15 review"
    body: |
      ## Cheat sheet

      ```cpp static
      #include <memory>
      auto p = std::make_unique<T>(args);        // sole owner, auto delete
      auto q = std::move(p);                      // transfer; p is null
      std::vector<std::unique_ptr<Base>> things;  // owning polymorphic container
      auto s = std::make_shared<T>(args);        // shared ownership, s.use_count()
      std::weak_ptr<T> w = s;  if (auto locked = w.lock()) { }

      v.push_back(std::move(bigString));          // move instead of copy
      explicit Person(std::string n) : name_{std::move(n)} {}

      // Rule of five (only when directly managing a raw resource):
      ~T();  T(const T&);  T& operator=(const T&);  T(T&&) noexcept;  T& operator=(T&&) noexcept;

      #include <stdexcept>
      throw std::invalid_argument{"message"};
      try { ... } catch (const std::out_of_range& e) { e.what(); } catch (const std::exception& e) { }

      #include <optional>
      std::optional<int> f();   return std::nullopt;   if (opt) *opt;   opt.value_or(0);
      ```

      ## Key ideas

      - Smart pointers are RAII for heap objects. Default to `unique_ptr`; `shared_ptr` only for real shared ownership; `weak_ptr` to break cycles.
      - Moving transfers resources; the source stays valid but unspecified. Temporaries and returned locals move automatically.
      - Rule of zero for almost every class; rule of five only for classes that manage a raw resource themselves.
      - Exceptions report errors a function can't handle; RAII keeps unwinding safe. Catch by const reference, specific types first.
      - `std::optional` makes "maybe no value" explicit in the type.
    questions:
      - type: output
        prompt: "Interleaving: polymorphism, unique_ptr and algorithms."
        code: |
          #include <algorithm>
          #include <iostream>
          #include <memory>
          #include <vector>

          struct Task {
              virtual ~Task() = default;
              virtual int cost() const = 0;
          };

          struct Small : Task {
              int cost() const override { return 1; }
          };

          struct Big : Task {
              int cost() const override { return 10; }
          };

          int main() {
              std::vector<std::unique_ptr<Task>> tasks{};
              tasks.push_back(std::make_unique<Big>());
              tasks.push_back(std::make_unique<Small>());
              tasks.push_back(std::make_unique<Big>());
              auto big = std::count_if(tasks.begin(), tasks.end(),
                                       [](const std::unique_ptr<Task>& t) { return t->cost() > 5; });
              std::cout << big << ' ' << tasks[1]->cost() << '\n';
              return 0;
          }
        answer: |
          2 1
        why: "Two Big tasks; the second element is Small."
