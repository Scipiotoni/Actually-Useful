          CHECK(list->value, 4);
          CHECK(list->next->next->value, 6);
          CHECK(list->next->next->next == nullptr, true);
          CHECK(sum(list.get()), 15);
          CHECK(fromVector({}) == nullptr, true);
          CHECK(sum(nullptr), 0);
        solution: |
          #include <memory>
          #include <vector>

          struct Node {
              int value;
              std::unique_ptr<Node> next;
          };

          std::unique_ptr<Node> fromVector(const std::vector<int>& v) {
              std::unique_ptr<Node> head{};
              for (auto it = v.rbegin(); it != v.rend(); ++it) {
                  head = std::make_unique<Node>(Node{*it, std::move(head)});
              }
              return head;
          }

          int sum(const Node* head) {
              int total{0};
              for (const Node* n = head; n != nullptr; n = n->next.get()) {
                  total += n->value;
              }
              return total;
          }
