        type: output
        code: |
          #include <iostream>
          #include <optional>

          std::optional<int> half(int x) {
              if (x % 2 != 0) {
                  return std::nullopt;
              }
              return x / 2;
          }

          int main() {
              int total{0};
              for (int x : {8, 3, 10}) {
                  total += half(x).value_or(100);
              }
              std::cout << total << '\n';
              return 0;
          }
        answer: |
          109
        why: "4 + 100 (3 is odd) + 5 = 109."
    tasks:
      - id: parse-int
        title: Parse without exceptions
        prompt: |
          Write `std::optional<int> parseInt(const std::string& s)` returning
          the number if `s` is an optional `-` followed by one or more digits
          (and nothing else), and `std::nullopt` otherwise. Values fit in an
          `int`.
        starter: |
          #include <cctype>
          #include <optional>
          #include <string>

          std::optional<int> parseInt(const std::string& s) {
              return std::nullopt;
          }
        harness: |
          CHECK(parseInt("42").value_or(-999), 42);
          CHECK(parseInt("-17").value_or(-999), -17);
          CHECK(parseInt("0").value_or(-999), 0);
          CHECK(parseInt("").has_value(), false);
          CHECK(parseInt("-").has_value(), false);
          CHECK(parseInt("12a").has_value(), false);
          CHECK(parseInt(" 5").has_value(), false);
        hints:
          - "Skip a leading `-` (remembering it), make sure at least one character is left, and that every remaining character is a digit."
          - "Build the value with `value = value * 10 + (c - '0')`."
        solution: |
          #include <cctype>
          #include <optional>
          #include <string>

          std::optional<int> parseInt(const std::string& s) {
              std::size_t i{0};
              bool negative{false};
              if (i < s.size() && s[i] == '-') {
                  negative = true;
                  ++i;
              }
              if (i == s.size()) {
                  return std::nullopt;
              }
              int value{0};
              for (; i < s.size(); ++i) {
                  if (!std::isdigit(static_cast<unsigned char>(s[i]))) {
                      return std::nullopt;
                  }
                  value = value * 10 + (s[i] - '0');
              }
              return negative ? -value : value;
          }
    cards:
      - front: What is `std::optional<T>`?
        back: A value that is either a `T` or empty (`std::nullopt`) — a type-safe "maybe".
      - front: How do you read an optional safely?
        back: "`if (opt) { use *opt; }`, or `opt.value_or(fallback)`. `*opt` on an empty optional is undefined behaviour."
      - front: What is `std::string_view`?
        back: A cheap non-owning view of characters owned elsewhere — good for read-only text parameters; must not outlive the text.

