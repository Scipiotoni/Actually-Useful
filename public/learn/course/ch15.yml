          CHECK(averageOrThrow({4, 4, 7}), 5.0);
          CHECK_THROWS(averageOrThrow({}));
        solution: |
          #include <optional>
          #include <stdexcept>
          #include <vector>

          std::optional<double> average(const std::vector<int>& v) {
              if (v.empty()) {
                  return std::nullopt;
              }
              double sum{0.0};
              for (int x : v) {
                  sum += x;
              }
              return sum / static_cast<double>(v.size());
          }

          double averageOrThrow(const std::vector<int>& v) {
              auto a = average(v);
              if (!a) {
                  throw std::invalid_argument{"empty"};
              }
              return *a;
          }
