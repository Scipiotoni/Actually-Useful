  - type: challenge
    id: c15-ch-bst
    title: A binary search tree
    difficulty: 3
    tags: [unique_ptr, recursion, trees]
    prompt: |
      A **binary search tree** stores values in nodes; each node's left
      subtree holds smaller values and its right subtree larger ones. Write
      `class IntSet` backed by such a tree, with nodes owned through
      `std::unique_ptr` (no `new` or `delete` anywhere):

      - `bool insert(int v)` — adds `v`; returns `false` if it was already there.
      - `bool contains(int v) const`
      - `int size() const`
      - `std::vector<int> sorted() const` — all values in ascending order (an *in-order* traversal: left subtree, node, right subtree).
    starter: |
      #include <memory>
      #include <vector>

      class IntSet {
      public:
          bool insert(int v) {
              return false;
          }

          bool contains(int v) const {
              return false;
          }

          int size() const {
              return 0;
          }

          std::vector<int> sorted() const {
              return {};
          }

      private:
          struct Node {
              int value;
              std::unique_ptr<Node> left;
              std::unique_ptr<Node> right;
          };
          std::unique_ptr<Node> root_{};
          int size_{0};
      };
    harness: |
      IntSet s{};
      CHECK(s.insert(5), true);
      CHECK(s.insert(2), true);
      CHECK(s.insert(8), true);
      CHECK(s.insert(5), false);
      CHECK(s.insert(1), true);
      CHECK(s.insert(9), true);
      CHECK(s.size(), 5);
      CHECK(s.contains(8), true);
      CHECK(s.contains(7), false);
      CHECK(s.sorted(), (std::vector<int>{1, 2, 5, 8, 9}));
      IntSet empty{};
      CHECK(empty.sorted(), (std::vector<int>{}));
      CHECK(empty.contains(0), false);
    hints:
      - "Insert without recursion: walk a `std::unique_ptr<Node>* slot = &root_;` down — `slot = v < (*slot)->value ? &(*slot)->left : &(*slot)->right;` — until `*slot` is empty, then `*slot = std::make_unique<Node>(Node{v, nullptr, nullptr});`."
      - "`contains` walks with a plain `const Node* n = root_.get();`."
      - "`sorted` is easiest as a recursive private helper `void collect(const Node* n, std::vector<int>& out) const`."
    solution: |
      #include <memory>
      #include <vector>

      class IntSet {
      public:
          bool insert(int v) {
              std::unique_ptr<Node>* slot = &root_;
              while (*slot) {
                  if (v == (*slot)->value) {
                      return false;
                  }
                  slot = v < (*slot)->value ? &(*slot)->left : &(*slot)->right;
              }
              *slot = std::make_unique<Node>(Node{v, nullptr, nullptr});
              ++size_;
              return true;
          }

          bool contains(int v) const {
              const Node* n = root_.get();
              while (n != nullptr) {
                  if (v == n->value) {
                      return true;
                  }
                  n = v < n->value ? n->left.get() : n->right.get();
              }
              return false;
          }

          int size() const {
              return size_;
          }

          std::vector<int> sorted() const {
              std::vector<int> out{};
              collect(root_.get(), out);
              return out;
          }

      private:
          struct Node {
              int value;
              std::unique_ptr<Node> left;
              std::unique_ptr<Node> right;
          };

          static void collect(const Node* n, std::vector<int>& out) {
              if (n == nullptr) {
                  return;
              }
              collect(n->left.get(), out);
              out.push_back(n->value);
              collect(n->right.get(), out);
          }

          std::unique_ptr<Node> root_{};
          int size_{0};
      };
    explain: |
      Each node owns its children, so destroying the root destroys the whole
      tree — no destructor needed (rule of zero!). Searching takes about
      log₂(n) steps when the tree is balanced; `std::set` is a (self-balancing)
      tree just like this one.

  - type: challenge
    id: c15-ch-buffer
    title: Rule of five
    difficulty: 3
    tags: [rule of five, move semantics]
    prompt: |
      Complete `class IntArray`, which owns a heap array through a raw
      pointer, by implementing all five special member functions correctly:
      copies must be **deep** and independent; moves must steal the array
      and leave the source with size 0 and no array. (Yes — in real code
      you'd use `std::vector`. This is to understand what it does for you.)
    starter: |
      #include <algorithm>
      #include <utility>

      class IntArray {
      public:
          explicit IntArray(int size) : size_{size}, data_{new int[size]{}} {}

          // TODO: destructor, copy constructor, copy assignment,
          //       move constructor, move assignment

          int& operator[](int i) { return data_[i]; }
          int size() const { return size_; }
          bool hasData() const { return data_ != nullptr; }

      private:
          int size_;
          int* data_;
      };
    harness: |
      IntArray a{3};
      a[0] = 1; a[1] = 2; a[2] = 3;
      IntArray b{a};
      b[0] = 100;
      CHECK(a[0], 1);
      CHECK(b[0], 100);
      CHECK(b.size(), 3);
      IntArray c{1};
      c = a;
      c[1] = 50;
      CHECK(a[1], 2);
      CHECK(c.size(), 3);
      c = c;
      CHECK(c[1], 50);
      IntArray d{std::move(a)};
      CHECK(d[2], 3);
      CHECK(a.size(), 0);
      CHECK(a.hasData(), false);
      IntArray e{2};
      e = std::move(d);
      CHECK(e.size(), 3);
      CHECK(e[0], 1);
      CHECK(d.hasData(), true);
    hints:
      - "Copy constructor: allocate `new int[other.size_]` and `std::copy` the elements."
      - "Copy assignment with copy-and-swap: `IntArray tmp{other}; swap(tmp); return *this;` (write a `swap` member)."
      - "Move constructor: `size_{std::exchange(other.size_, 0)}, data_{std::exchange(other.data_, nullptr)}`. Move assignment: swap with `other` — the checker expects the moved-from object to receive your old array."
    solution: |
      #include <algorithm>
      #include <utility>

      class IntArray {
      public:
          explicit IntArray(int size) : size_{size}, data_{new int[size]{}} {}

          ~IntArray() { delete[] data_; }

          IntArray(const IntArray& other) : size_{other.size_}, data_{new int[other.size_]} {
              std::copy(other.data_, other.data_ + size_, data_);
          }

          IntArray& operator=(const IntArray& other) {
              IntArray copy{other};
              swap(copy);
              return *this;
          }

          IntArray(IntArray&& other) noexcept
              : size_{std::exchange(other.size_, 0)}, data_{std::exchange(other.data_, nullptr)} {}

          IntArray& operator=(IntArray&& other) noexcept {
              swap(other);
              return *this;
          }

          void swap(IntArray& other) noexcept {
              std::swap(size_, other.size_);
              std::swap(data_, other.data_);
          }

          int& operator[](int i) { return data_[i]; }
          int size() const { return size_; }
          bool hasData() const { return data_ != nullptr; }

      private:
          int size_;
          int* data_;
      };

  - type: challenge
    id: c15-ch-config
    title: Config file reader
    difficulty: 2
    tags: [exceptions, optional, parsing]
    prompt: |
      Read lines of a configuration file. Blank lines and lines starting with
      `#` are ignored. Every other line must look like `key=value` (key and
      value trimmed of spaces; the key non-empty). The last lines of input are
      queries of the form `? key`.

      - For a malformed line, print `Line N: bad syntax` (N counts every line from 1) and continue.
      - For a query, print `key = value`, or `key is not set`.

      Implement parsing as a function that returns `std::optional<std::pair<std::string, std::string>>`.
    starter: |
      #include <iostream>
      #include <map>
      #include <optional>
      #include <string>
      #include <utility>

      int main() {

          return 0;
      }
    tests:
      - in: |
          # settings
          name = Ada
          level=3

          oops
          =nokey
          ? name
          ? level
          ? colour
        out: |
          Line 5: bad syntax
          Line 6: bad syntax
          name = Ada
          level = 3
          colour is not set
      - in: |
          a = 1
          a = 2
          ? a
        out: |
          a = 2
      - in: ""
        out: ""
    hints:
      - "Write `std::string trim(const std::string&)` (Chapter 8) and `std::optional<std::pair<std::string, std::string>> parseLine(const std::string&)`."
      - "In `main`, count lines; check for a leading `?` first, then comments/blank lines, then `parseLine`."
    solution: |
      #include <iostream>
      #include <map>
      #include <optional>
      #include <string>
      #include <utility>

      std::string trim(const std::string& s) {
          std::size_t first = s.find_first_not_of(" \t");
          if (first == std::string::npos) {
              return "";
          }
          std::size_t last = s.find_last_not_of(" \t");
          return s.substr(first, last - first + 1);
      }

      std::optional<std::pair<std::string, std::string>> parseLine(const std::string& line) {
          std::size_t eq = line.find('=');
          if (eq == std::string::npos) {
              return std::nullopt;
          }
          std::string key = trim(line.substr(0, eq));
          if (key.empty()) {
              return std::nullopt;
          }
          return std::make_pair(key, trim(line.substr(eq + 1)));
      }

      int main() {
          std::map<std::string, std::string> settings{};
          std::string line{};
          int number{0};
          while (std::getline(std::cin, line)) {
              ++number;
              std::string t = trim(line);
              if (!t.empty() && t[0] == '?') {
                  std::string key = trim(t.substr(1));
                  auto it = settings.find(key);
                  if (it != settings.end()) {
                      std::cout << key << " = " << it->second << '\n';
                  } else {
                      std::cout << key << " is not set\n";
                  }
                  continue;
              }
              if (t.empty() || t[0] == '#') {
                  continue;
              }
              auto entry = parseLine(t);
              if (!entry) {
                  std::cout << "Line " << number << ": bad syntax\n";
                  continue;
              }
              settings[entry->first] = entry->second;
          }
          return 0;
      }

