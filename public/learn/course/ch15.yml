  - type: lesson
    id: c15-optional
    title: "Maybe a value: std::optional"
    minutes: 16
    objectives:
      - Return "a value or nothing" with `std::optional`
      - Check and read an optional safely
      - Know when `std::variant` and `std::string_view` are useful
    body: |
      A function that searches may find nothing. So far you've signalled that
      with `-1`, `nullptr`, `npos` or an end iterator — each a special value
      the caller must remember to check. **`std::optional<T>`** (C++17,
      `<optional>`) says it in the type: *either a `T`, or nothing*.

      ```cpp
      #include <iostream>
      #include <optional>
      #include <string>
      #include <vector>

      std::optional<int> findIndex(const std::vector<std::string>& v, const std::string& target) {
          for (std::size_t i{0}; i < v.size(); ++i) {
              if (v[i] == target) {
                  return static_cast<int>(i);
              }
          }
          return std::nullopt;   // nothing
      }

      int main() {
          std::vector<std::string> fruits{"apple", "pear", "plum"};
          auto where = findIndex(fruits, "pear");
          if (where) {
              std::cout << "pear at " << *where << '\n';
          }
          auto missing = findIndex(fruits, "kiwi");
          std::cout << missing.has_value() << ' ' << missing.value_or(-1) << '\n';
          return 0;
      }
      ```

      ```output
      pear at 1
      0 -1
      ```

      - Return a `T` to give a value; return `std::nullopt` (or `{}`) for nothing.
      - An optional converts to `bool`: `if (opt)` checks for a value.
      - `*opt` reads the value (undefined behaviour if empty — check first!); `opt.value()` throws if empty; `opt.value_or(fallback)` gives a default.

      An optional of a small type costs just a little extra memory — no heap
      allocation — and it's impossible to forget that "nothing" is possible,
      because the type says so.

      > [!deep] Two more modern types
      > - **`std::variant<A, B, C>`** (`<variant>`) holds exactly one of several types — a type-safe union. For example `std::variant<int, std::string>` is "a number or a name". Read it with `std::get_if` or `std::visit`.
      > - **`std::string_view`** (`<string_view>`) is a cheap, non-owning *view* of characters owned by someone else — a string literal or a `std::string`. It's the modern choice for read-only text parameters (instead of `const std::string&`) when callers might pass literals. Like a reference, it must not outlive the text it views.

      {{check optional-output}}

      {{task parse-int}}
