id: ch15
number: 15
part: p4
title: Resources, Moves and Errors
blurb: Modern C++'s answers to the hardest problems — who owns what, how to avoid needless copies, and what to do when things go wrong.
hours: 6.5
goals:
  - Own heap objects with `std::unique_ptr`, and share them with `std::shared_ptr` when truly needed
  - Explain the difference between copying and moving, and use `std::move`
  - Apply the rule of zero, and the rule of three/five when a class manages a resource
  - Report and handle errors with exceptions, safely thanks to RAII
  - Express "maybe a value" with `std::optional`

items:
  - type: lesson
    id: c15-unique
    title: "std::unique_ptr: automatic ownership"
    minutes: 24
    objectives:
      - Create heap objects with `std::make_unique`
      - Explain why a `unique_ptr` can be moved but not copied
      - Store polymorphic objects safely in a vector of `unique_ptr`
    body: |
      In Chapter 10, heap objects came with three ways to fail: leaks,
      dangling pointers and double deletes. In Chapter 11 you learned RAII:
      let an object's destructor release its resource. Put the two together
      and you get a **smart pointer** — an object that owns a heap object and
      deletes it automatically.

      **`std::unique_ptr`** (from `<memory>`) is the one you'll use 95% of the
      time. It's the **only owner** of its object:

      ```cpp
      #include <iostream>
      #include <memory>
      #include <string>

      struct Monster {
          explicit Monster(const std::string& n) : name{n} { std::cout << name << " spawns\n"; }
          ~Monster() { std::cout << name << " vanishes\n"; }
          std::string name;
      };

      int main() {
          auto boss = std::make_unique<Monster>("Dragon");
          std::cout << "Fighting " << boss->name << '\n';
          {
              auto minion = std::make_unique<Monster>("Goblin");
          }   // minion's destructor deletes the Goblin here
          std::cout << "Boss battle over\n";
          return 0;
      }   // and the Dragon here — no delete anywhere
      ```

      ```output
      Dragon spawns
      Fighting Dragon
      Goblin spawns
      Goblin vanishes
      Boss battle over
      Dragon vanishes
      ```

      - `std::make_unique<Monster>("Dragon")` creates a `Monster` on the heap (passing the arguments to its constructor) and returns a `std::unique_ptr<Monster>` owning it.
      - Use it like a pointer: `boss->name`, `*boss`. `boss.get()` gives a plain pointer for code that only *uses* the object.
      - When the `unique_ptr` is destroyed, it deletes its object. Exactly once, always, even with early returns or exceptions.

      ## One owner: move, don't copy

      Copying a `unique_ptr` would create two owners — so it's forbidden.
      Ownership can be **transferred** with `std::move`:

      ```cpp
      #include <iostream>
      #include <memory>
      #include <utility>

      int main() {
          auto a = std::make_unique<int>(42);
          // auto b = a;              // error: can't copy a unique_ptr
          auto b = std::move(a);       // b owns it now; a is empty (nullptr)
          std::cout << (a == nullptr) << ' ' << *b << '\n';
          return 0;
      }
      ```

      ```output
      1 42
      ```

      ## Polymorphism without the pain

      Chapter 12 used vectors of raw pointers to objects owned elsewhere. With
      `unique_ptr`, the vector can **own** its polymorphic objects, and
      cleanup is automatic:

      ```cpp
      #include <iostream>
      #include <memory>
      #include <vector>

      class Shape {
      public:
          virtual ~Shape() = default;
          virtual double area() const = 0;
      };

      class Square : public Shape {
      public:
          explicit Square(double s) : s_{s} {}
          double area() const override { return s_ * s_; }
      private:
          double s_;
      };

      class Circle : public Shape {
      public:
          explicit Circle(double r) : r_{r} {}
          double area() const override { return 3.14159 * r_ * r_; }
      private:
          double r_;
      };

      int main() {
          std::vector<std::unique_ptr<Shape>> shapes{};
          shapes.push_back(std::make_unique<Square>(2));
          shapes.push_back(std::make_unique<Circle>(1));
          double total{0};
          for (const auto& s : shapes) {
              total += s->area();
          }
          std::cout << total << '\n';
          return 0;
      }
      ```

      ```output
      7.14159
      ```

      ## Passing smart pointers around

      | You want the function to… | Parameter |
      |---|---|
      | just use the object | `const Shape&` (or `const Shape*` if it may be null) |
      | take ownership | `std::unique_ptr<Shape>` by value (the caller writes `std::move(p)`) |

      Don't pass `const std::unique_ptr<T>&` just to use the object — it
      needlessly ties the function to one kind of ownership.

      > [!remember]
      > In modern C++, `new` and `delete` almost never appear. Use
      > `std::make_unique` for single objects and containers for many.

      {{check unique-output}}

      {{task factory}}
    checks:
      - id: unique-output
        type: output
        code: |
          #include <iostream>
          #include <memory>
          #include <utility>
          #include <vector>

          int main() {
              std::vector<std::unique_ptr<int>> v{};
              v.push_back(std::make_unique<int>(1));
              auto p = std::make_unique<int>(2);
              v.push_back(std::move(p));
              *v[0] += 10;
              std::cout << *v[0] << ' ' << *v[1] << ' ' << (p == nullptr) << '\n';
              return 0;
          }
        answer: |
          11 2 1
        why: "Moving `p` into the vector transfers ownership and leaves `p` null."
      - id: copy-unique
        type: mcq
        prompt: "Why doesn't `auto b = a;` compile when `a` is a `std::unique_ptr`?"
        options:
          - "unique_ptr can't be stored in variables"
          - "A unique_ptr is the only owner; a copy would make two owners (and a double delete)"
          - "You must write `new` first"
          - It does compile
        answer: 1
        why: "Copying is deleted. Transfer ownership with `std::move(a)` instead."
    tasks:
      - id: factory
        title: A shape factory
        prompt: |
          Using the starter's `Shape`, `Square` and `Circle`, write
          `std::unique_ptr<Shape> makeShape(const std::string& kind, double size)`
          returning a `Square` for `"square"`, a `Circle` for `"circle"`, and
          `nullptr` for anything else.
        starter: |
          #include <memory>
          #include <string>

          class Shape {
          public:
              virtual ~Shape() = default;
              virtual double area() const = 0;
          };

          class Square : public Shape {
          public:
              explicit Square(double s) : s_{s} {}
              double area() const override { return s_ * s_; }
          private:
              double s_;
          };

          class Circle : public Shape {
          public:
              explicit Circle(double r) : r_{r} {}
              double area() const override { return 3.0 * r_ * r_; }
          private:
              double r_;
          };

          std::unique_ptr<Shape> makeShape(const std::string& kind, double size) {
              return nullptr;
          }
        harness: |
          auto a = makeShape("square", 3);
          auto b = makeShape("circle", 2);
          auto c = makeShape("hexagon", 1);
          CHECK(a != nullptr, true);
          CHECK(a->area(), 9.0);
          CHECK(b->area(), 12.0);
          CHECK(c == nullptr, true);
        hints:
          - "`if (kind == \"square\") return std::make_unique<Square>(size);` — a `unique_ptr<Square>` converts to `unique_ptr<Shape>` automatically."
        solution: |
          #include <memory>
          #include <string>

          class Shape {
          public:
              virtual ~Shape() = default;
              virtual double area() const = 0;
          };

          class Square : public Shape {
          public:
              explicit Square(double s) : s_{s} {}
              double area() const override { return s_ * s_; }
          private:
              double s_;
          };

          class Circle : public Shape {
          public:
              explicit Circle(double r) : r_{r} {}
              double area() const override { return 3.0 * r_ * r_; }
          private:
              double r_;
          };

          std::unique_ptr<Shape> makeShape(const std::string& kind, double size) {
              if (kind == "square") {
                  return std::make_unique<Square>(size);
              }
              if (kind == "circle") {
                  return std::make_unique<Circle>(size);
              }
              return nullptr;
          }
    cards:
      - front: What is `std::unique_ptr`?
        back: A smart pointer that is the sole owner of a heap object and deletes it automatically when destroyed.
      - front: How do you create an object owned by a unique_ptr?
        back: "`auto p = std::make_unique<T>(constructor args);`"
      - front: How do you transfer ownership of a unique_ptr?
        back: "`auto q = std::move(p);` — p becomes nullptr. Copying is not allowed."
      - front: How should a function that only *uses* an object take it?
        back: By reference (`const T&`) or raw pointer if it may be null — not by `unique_ptr`.

  - type: lesson
    id: c15-shared
    title: std::shared_ptr and weak_ptr
    minutes: 16
    objectives:
      - Share ownership of an object with `std::shared_ptr`
      - Explain reference counting and the cycle problem
      - Break cycles with `std::weak_ptr`
    body: |
      Sometimes an object genuinely has **several owners**, and should live as
      long as **any** of them needs it — a texture used by many sprites, a
      document open in several windows. That's **`std::shared_ptr`**:

      ```cpp
      #include <iostream>
      #include <memory>
      #include <string>

      int main() {
          auto logo = std::make_shared<std::string>("logo.png");
          std::cout << logo.use_count() << '\n';
          {
              auto copy = logo;          // copying is allowed: a second owner
              std::cout << logo.use_count() << '\n';
          }
          std::cout << logo.use_count() << ' ' << *logo << '\n';
          return 0;
      }
      ```

      ```output
      1
      2
      1 logo.png
      ```

      Each `shared_ptr` to the object increases a **reference count**; each one
      destroyed decreases it; when it reaches zero, the object is deleted.

      ## The cost, and the cycle trap

      Reference counting isn't free, and "who owns this?" becomes "everyone,
      sort of" — harder to reason about. Worse: if A owns B with a
      `shared_ptr` and B owns A with a `shared_ptr`, neither count ever reaches
      zero — a **leak**.

      **`std::weak_ptr`** is a non-owning observer of a shared object. It
      doesn't increase the count; to use the object you `lock()` it, which
      gives a `shared_ptr` (empty if the object is already gone):

      ```cpp
      #include <iostream>
      #include <memory>

      int main() {
          std::weak_ptr<int> watcher{};
          {
              auto owner = std::make_shared<int>(7);
              watcher = owner;
              if (auto p = watcher.lock()) {
                  std::cout << "alive: " << *p << '\n';
              }
          }
          std::cout << "expired: " << watcher.expired() << '\n';
          return 0;
      }
      ```

      ```output
      alive: 7
      expired: 1
      ```

      Use `weak_ptr` for back-references (a child pointing to its parent) and
      caches, to break cycles.

      > [!pro] Default to `unique_ptr`
      > Start with `std::unique_ptr`. Reach for `shared_ptr` only when
      > ownership is truly shared — it's easy to turn a `unique_ptr` into a
      > `shared_ptr` later, but not the other way round.

      {{check shared-count}}
    checks:
      - id: shared-count
        type: output
        code: |
          #include <iostream>
          #include <memory>
          #include <vector>

          int main() {
              auto p = std::make_shared<int>(5);
              std::vector<std::shared_ptr<int>> owners{p, p, p};
              std::cout << p.use_count() << ' ';
              owners.pop_back();
              *owners[0] += 1;
              std::cout << p.use_count() << ' ' << *p << '\n';
              return 0;
          }
        answer: |
          4 3 6
        why: "p plus three copies in the vector: 4 owners; after pop_back, 3. All share one int, now 6."
      - id: which-ptr
        type: mcq
        prompt: "A `Tree` node owns its children, and each child needs to refer back to its parent. What should the child's pointer to the parent be?"
        options:
          - "`std::shared_ptr<Node>` — to keep the parent alive"
          - "`std::unique_ptr<Node>`"
          - "A non-owning pointer: `Node*` or `std::weak_ptr<Node>` — the parent already owns the child"
          - "`std::vector<Node>`"
        answer: 2
        why: "An owning back-pointer would create a cycle. The parent owns; the child just observes."
    cards:
      - front: What does `std::shared_ptr` do?
        back: Shares ownership of a heap object by reference counting; the object is deleted when the last shared_ptr to it goes away.
      - front: What problem does `std::weak_ptr` solve?
        back: Reference cycles (A owns B, B owns A → leak). A weak_ptr observes without owning; `lock()` gives temporary access.
      - front: "unique_ptr or shared_ptr by default?"
        back: "`std::unique_ptr`. Use shared_ptr only for truly shared ownership."

  - type: lesson
    id: c15-move
    title: Copying versus moving
    minutes: 24
    objectives:
      - Explain why copying can be expensive and moving cheap
      - Use `std::move` to transfer a resource, and know what's left behind
      - Recognise when C++ moves automatically
    body: |
      Copying a `std::string` of a million characters copies a million
      characters. Often you don't need a copy at all — you're **done** with
      the original and just want to hand its contents over. That's a
      **move**: the new object takes over the old one's resources (for a
      string, just its internal pointer), leaving the old one empty but valid.

      ```cpp
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      int main() {
          std::string big(1'000'000, 'x');
          std::vector<std::string> store{};

          store.push_back(big);              // copy: big is unchanged
          store.push_back(std::move(big));   // move: big's buffer is handed over

          std::cout << store[0].size() << ' ' << store[1].size() << ' ' << big.size() << '\n';
          return 0;
      }
      ```

      ```output
      1000000 1000000 0
      ```

      `std::move(big)` doesn't move anything by itself — it's a **cast** that
      says "I'm done with `big`, you may steal its contents". `push_back` then
      picks its *moving* version. After a move, the object is in a **valid but
      unspecified** state: you may assign it a new value or destroy it, but
      don't rely on what it contains (here, the standard string happens to be
      empty).

      ## Temporaries move automatically

      A value that has no name — the result of a function call, `a + b`, a
      literal — is a **temporary** (an *rvalue*). Nobody can use it
      afterwards, so C++ moves from it automatically, no `std::move` needed:

      ```cpp static
      std::vector<std::string> names{};
      names.push_back(std::string{"Ada"} + " Lovelace");   // temporary: moved
      std::string s = makeReport();                         // result moved (or built in place)
      ```

      Returning a local variable from a function also moves it (or, better,
      builds it directly in the caller's variable — *return value
      optimisation*). So **never** write `return std::move(local);` — it can
      only make things worse.

      ## Moves in your own code

      Take a parameter **by value** and move it into place when a function
      will keep its own copy anyway — callers passing temporaries pay nothing:

      ```cpp
      #include <iostream>
      #include <string>
      #include <utility>

      class Person {
      public:
          explicit Person(std::string name) : name_{std::move(name)} {}
          const std::string& name() const { return name_; }
      private:
          std::string name_;
      };

      int main() {
          std::string n{"Grace Hopper"};
          Person a{n};                    // n copied into the parameter, then moved into the member
          Person b{"Katherine Johnson"};  // built straight into the parameter, then moved
          std::cout << a.name() << ", " << b.name() << ", " << n << '\n';
          return 0;
      }
      ```

      ```output
      Grace Hopper, Katherine Johnson, Grace Hopper
      ```

      {{check moved-from}}

      {{check when-move}}
    checks:
      - id: moved-from
        type: output
        code: |
          #include <iostream>
          #include <string>
          #include <utility>
          #include <vector>

          int main() {
              std::vector<int> a{1, 2, 3};
              std::vector<int> b = std::move(a);
              a = {9};
              std::cout << b.size() << ' ' << a.size() << ' ' << a[0] << '\n';
              return 0;
          }
        answer: |
          3 1 9
        why: "b took a's elements. A moved-from object can safely be given a new value."
      - id: when-move
        type: mcq
        prompt: "When should you write `std::move(x)`?"
        options:
          - On every return statement
          - When you're finished with `x` and want its contents transferred instead of copied
          - To make `x` constant
          - To delete `x`
        answer: 1
        why: "It's a promise that you won't rely on x's contents afterwards. Don't use it on returned locals."
    cards:
      - front: What is a **move**?
        back: Transferring an object's resources (e.g. a string's buffer) to another object instead of copying them. The source is left valid but unspecified.
      - front: What does `std::move(x)` actually do?
        back: It's a cast marking `x` as "may be moved from" — the move itself happens in the constructor/assignment that receives it.
      - front: Should you write `return std::move(local);`?
        back: No — returning a local already moves it (or elides the copy entirely); `std::move` can prevent that optimisation.

  - type: quiz
    id: c15-quiz1
    title: "Quiz: smart pointers and moves"
    questions:
      - type: output
        code: |
          #include <iostream>
          #include <memory>

          struct T {
              T() { std::cout << 'c'; }
              ~T() { std::cout << 'd'; }
          };

          int main() {
              auto a = std::make_unique<T>();
              auto b = std::make_unique<T>();
              a = std::move(b);
              std::cout << '|';
              return 0;
          }
        answer: |
          ccd|d
        why: "Two objects are created. When `a` takes over `b`'s object, `a`'s old object is deleted (d). The remaining one is deleted at the end of main."
      - type: mcq
        prompt: "Which creates a `std::unique_ptr<Player>` correctly?"
        options:
          - "`std::unique_ptr<Player> p = Player{};`"
          - "`auto p = std::make_unique<Player>(\"Ada\");`"
          - "`auto p = new Player{\"Ada\"};`"
          - "`std::unique_ptr<Player> p = std::make_shared<Player>();`"
        answer: 1
        why: "`std::make_unique<T>(args)` is the standard way."
      - type: tf
        prompt: "After `auto q = std::move(p);` for a `unique_ptr p`, `p` is `nullptr`."
        answer: true
        why: "Ownership moved to q, leaving p empty."
      - type: output
        code: |
          #include <iostream>
          #include <memory>

          int main() {
              auto s = std::make_shared<int>(1);
              auto t = s;
              *t = 2;
              std::weak_ptr<int> w = s;
              std::cout << *s << ' ' << s.use_count() << '\n';
              return 0;
          }
        answer: |
          2 2
        why: "s and t share one int; a weak_ptr doesn't count as an owner."

  - type: lesson
    id: c15-rules
    title: The rules of zero, three and five
    minutes: 24
    objectives:
      - Name the special member functions the compiler can generate
      - Follow the rule of zero by building classes from self-managing members
      - Implement the rule of five for a class that owns a raw resource
    body: |
      A class has up to five **special member functions** that deal with
      copying, moving and destroying — and the compiler writes them for you
      if you don't:

      | Function | Signature | Runs when |
      |---|---|---|
      | destructor | `~T()` | the object dies |
      | copy constructor | `T(const T&)` | `T b = a;` |
      | copy assignment | `T& operator=(const T&)` | `b = a;` |
      | move constructor | `T(T&&)` | `T b = std::move(a);` |
      | move assignment | `T& operator=(T&&)` | `b = std::move(a);` |

      (`T&&` is an **rvalue reference** — a reference that binds to temporaries
      and moved-from values.) The generated versions simply copy, move or
      destroy each member in turn.

      ## The rule of zero

      If every member manages itself — `std::string`, `std::vector`,
      `std::unique_ptr`, numbers — the generated versions are exactly right.
      **Write none of the five.** This is the **rule of zero**, and it covers
      almost every class you'll write:

      ```cpp static
      class Playlist {
          std::string name_;
          std::vector<Song> songs_;
          std::unique_ptr<Artwork> cover_;   // makes Playlist move-only — correctly
      };                                     // no destructor, no copy/move code needed
      ```

      ## The rule of three / five

      Only a class that **directly** manages a raw resource (a pointer from
      `new`, a file handle from a C library…) needs custom versions — and then
      it needs **all** of them: if you write a destructor to free the
      resource, the generated copy would share it and double-free it
      (Chapter 11's `IntBuffer`). That's the **rule of three** (destructor,
      copy constructor, copy assignment), or **five** adding the two moves.

      ```cpp
      #include <algorithm>
      #include <iostream>
      #include <utility>

      class Buffer {
      public:
          explicit Buffer(int size) : size_{size}, data_{new int[size]{}} {}
          ~Buffer() { delete[] data_; }

          Buffer(const Buffer& other) : size_{other.size_}, data_{new int[other.size_]} {
              std::copy(other.data_, other.data_ + size_, data_);      // deep copy
          }
          Buffer& operator=(const Buffer& other) {
              Buffer copy{other};          // copy first (safe even if other is *this)...
              swap(copy);                  // ...then swap in; the old data dies with copy
              return *this;
          }

          Buffer(Buffer&& other) noexcept
              : size_{std::exchange(other.size_, 0)}, data_{std::exchange(other.data_, nullptr)} {}
          Buffer& operator=(Buffer&& other) noexcept {
              swap(other);                 // other now holds our old data and frees it
              return *this;
          }

          void swap(Buffer& other) noexcept {
              std::swap(size_, other.size_);
              std::swap(data_, other.data_);
          }

          int& operator[](int i) { return data_[i]; }
          int size() const { return size_; }

      private:
          int size_;
          int* data_;
      };

      int main() {
          Buffer a{3};
          a[0] = 7;
          Buffer b = a;                 // deep copy
          b[0] = 99;
          Buffer c = std::move(a);      // steal a's array
          std::cout << b[0] << ' ' << c[0] << ' ' << a.size() << '\n';
          return 0;
      }
      ```

      ```output
      99 7 0
      ```

      Things to notice:

      - The copy constructor allocates **new** memory and copies the elements — a *deep* copy.
      - Copy assignment uses the **copy-and-swap** idiom: correct even for `a = a`, and if the copy throws, `*this` is untouched.
      - The moves just **steal** the pointer (`std::exchange` sets the source's member and returns the old value), leaving the source empty. They're marked `noexcept` — they can't fail — which lets `std::vector` use them when it grows.

      > [!remember]
      > Rule of zero first. If you ever need the rule of five, ask whether a
      > `std::vector` or `std::unique_ptr` member would do the job instead.

      {{check rules}}
    checks:
      - id: rules
        type: mcq
        prompt: "Your class's members are a `std::string`, a `std::vector<int>` and an `int`. Which special member functions should you write?"
        options:
          - All five
          - Just the destructor
          - None — the rule of zero
          - Only the copy constructor
        answer: 2
        why: "Every member manages itself; the generated functions are correct."
      - id: deep
        type: mcq
        prompt: "A class holds `int* data_` from `new int[n]` and has a destructor that deletes it, but no copy constructor. What happens when an object is copied?"
        options:
          - The array is copied
          - Both objects point to the same array, which is deleted twice
          - It doesn't compile
          - The copy gets a null pointer
        answer: 1
        why: "The generated copy constructor copies the pointer (a shallow copy) — hence the rule of three."
    cards:
      - front: Name the five special member functions.
        back: Destructor, copy constructor, copy assignment, move constructor, move assignment.
      - front: What is the **rule of zero**?
        back: If all members manage their own resources, write none of the special member functions — the generated ones are correct.
      - front: What is the **rule of three/five**?
        back: A class that directly manages a resource needs a destructor and correct copy operations (and move operations) — all together.
      - front: What is a **deep copy**?
        back: Copying the resource a pointer refers to (new memory, copied contents), not just the pointer.

  - type: lesson
    id: c15-exceptions
    title: Exceptions
    minutes: 26
    objectives:
      - Throw an exception when something can't be done
      - Catch exceptions with `try` / `catch` by const reference
      - Explain stack unwinding, and why RAII makes exceptions safe
      - Choose between exceptions and other ways of reporting errors
    body: |
      Some errors can't be handled where they're detected. A function asked
      to open a file that doesn't exist, or to build a `Date` for 31 February,
      can't sensibly continue — and can't know what the caller wants done
      about it. It needs to **report** the problem to someone who does know.

      C++'s mechanism for that is the **exception**:

      ```cpp
      #include <iostream>
      #include <stdexcept>
      #include <string>

      double divide(double a, double b) {
          if (b == 0) {
              throw std::invalid_argument{"division by zero"};
          }
          return a / b;
      }

      int main() {
          try {
              std::cout << divide(10, 4) << '\n';
              std::cout << divide(1, 0) << '\n';
              std::cout << "never printed\n";
          } catch (const std::invalid_argument& e) {
              std::cout << "Error: " << e.what() << '\n';
          }
          std::cout << "program continues\n";
          return 0;
      }
      ```

      ```output
      2.5
      Error: division by zero
      program continues
      ```

      - `throw` creates an exception object and **immediately** leaves the function — and every function above it — until a matching `catch` is found.
      - `try { ... }` marks code whose exceptions you want to handle; `catch (const Type& e)` handles exceptions of that type (or derived from it). Always catch by **const reference**.
      - `e.what()` returns the message.
      - If nothing catches an exception, the program terminates (you've seen `terminate called after throwing…` when using `.at()` out of range).

      ## Standard exception types

      `<stdexcept>` has a hierarchy, all derived from `std::exception`:

      | Type | For |
      |---|---|
      | `std::invalid_argument` | a bad argument (e.g. `std::stoi("abc")`) |
      | `std::out_of_range` | an index or value outside the allowed range (`.at()`) |
      | `std::runtime_error` | errors only detectable while running (a missing file) |
      | `std::logic_error` | bugs — a broken precondition |

      Catching `const std::exception&` catches all of them. Order matters:
      put specific `catch` blocks before general ones.

      ## Stack unwinding: why RAII matters

      As an exception flies up through functions, every local object in
      between is **destroyed properly** — destructors run. This is **stack
      unwinding**, and it's why RAII is so important: a `std::vector`,
      `std::unique_ptr` or file object releases its resource even when an
      exception passes through. Raw `new`/`delete` would leak:

      ```cpp
      #include <iostream>
      #include <memory>
      #include <stdexcept>

      struct Resource {
          Resource() { std::cout << "acquire\n"; }
          ~Resource() { std::cout << "release\n"; }
      };

      void risky() {
          auto r = std::make_unique<Resource>();
          throw std::runtime_error{"something failed"};
      }   // r's destructor still runs during unwinding

      int main() {
          try {
              risky();
          } catch (const std::exception& e) {
              std::cout << "caught: " << e.what() << '\n';
          }
          return 0;
      }
      ```

      ```output
      acquire
      release
      caught: something failed
      ```

      ## When to use exceptions

      - Use them for **exceptional** situations a function can't handle locally: a constructor that can't build a valid object (it has no return value!), a failed resource, a violated precondition.
      - Don't use them for ordinary control flow — "not found" in a search is normal; return `std::optional` or an end iterator instead.
      - A function that promises never to throw can be marked **`noexcept`** (like the moves in the previous lesson).

