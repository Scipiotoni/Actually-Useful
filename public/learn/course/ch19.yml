              } else if (command == "transfer") {
                  expectArgs(words, 4, "transfer FROM TO AMOUNT");
                  bank.transfer(words[1], words[2], amountArg(words[3], false));
              } else if (command == "history") {
                  expectArgs(words, 2, "history NAME");
                  bank.history(words[1]);
              } else if (command == "undo") {
                  expectArgs(words, 1, "undo");
                  bank.undo();
              } else if (command == "report") {
                  expectArgs(words, 1, "report");
