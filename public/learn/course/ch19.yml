          class Bank {
          public:
              void open(const std::string& name, long long cents) {
                  if (accounts_.count(name) > 0) {
                      throw BankError{name + " already exists"};
                  }
                  accounts_[name] = Account{cents, {"open +" + formatMoney(cents)}};
                  std::cout << "Opened " << name << " with " << formatMoney(cents) << '\n';
              }

              void balance(const std::string& name) {
                  const Account& account = get(name);     // look up first: it may throw
                  std::cout << name << ": " << formatMoney(account.balance) << '\n';
              }

              void list() const {
                  if (accounts_.empty()) {
                      std::cout << "No accounts\n";
                      return;
                  }
                  for (const auto& [name, account] : accounts_) {
                      std::cout << name << ' ' << formatMoney(account.balance) << '\n';
                  }
              }

              void deposit(const std::string& name, long long cents) {
                  Account& account = get(name);
                  account.balance += cents;
                  account.history.push_back("deposit +" + formatMoney(cents));
                  undo_.push_back({"deposit", "", name, cents});
                  std::cout << "Deposited " << formatMoney(cents) << " to " << name
                            << " (balance " << formatMoney(account.balance) << ")\n";
              }

              void withdraw(const std::string& name, long long cents) {
                  Account& account = get(name);
                  if (account.balance < cents) {
                      throw BankError{"insufficient funds in " + name};
                  }
                  account.balance -= cents;
                  account.history.push_back("withdraw -" + formatMoney(cents));
                  undo_.push_back({"withdraw", name, "", cents});
                  std::cout << "Withdrew " << formatMoney(cents) << " from " << name
                            << " (balance " << formatMoney(account.balance) << ")\n";
              }

              void transfer(const std::string& from, const std::string& to, long long cents) {
                  Account& source = get(from);
                  Account& target = get(to);
                  if (from == to) {
                      throw BankError{"cannot transfer to the same account"};
                  }
                  if (source.balance < cents) {
                      throw BankError{"insufficient funds in " + from};
                  }
                  source.balance -= cents;
                  target.balance += cents;
                  source.history.push_back("transfer to " + to + " -" + formatMoney(cents));
                  target.history.push_back("transfer from " + from + " +" + formatMoney(cents));
                  undo_.push_back({"transfer", from, to, cents});
                  std::cout << "Transferred " << formatMoney(cents) << " from " << from << " to " << to << '\n';
              }

              void history(const std::string& name) {
                  for (const auto& entry : get(name).history) {
                      std::cout << entry << '\n';
                  }
              }

              void undo() {
                  if (undo_.empty()) {
                      throw BankError{"nothing to undo"};
                  }
                  Transaction t{undo_.back()};
                  undo_.pop_back();
                  if (t.kind == "deposit") {
                      Account& account = get(t.to);
                      account.balance -= t.cents;
                      account.history.pop_back();
                      std::cout << "Undid deposit of " << formatMoney(t.cents) << " to " << t.to << '\n';
                  } else if (t.kind == "withdraw") {
                      Account& account = get(t.from);
                      account.balance += t.cents;
                      account.history.pop_back();
                      std::cout << "Undid withdraw of " << formatMoney(t.cents) << " from " << t.from << '\n';
                  } else {
                      Account& source = get(t.from);
                      Account& target = get(t.to);
                      source.balance += t.cents;
                      target.balance -= t.cents;
                      source.history.pop_back();
                      target.history.pop_back();
                      std::cout << "Undid transfer of " << formatMoney(t.cents) << " from " << t.from << " to " << t.to << '\n';
                  }
              }

              void report() const {
                  if (accounts_.empty()) {
                      std::cout << "No accounts\n";
                      return;
                  }
                  std::vector<std::pair<std::string, long long>> rows{};
                  long long total{0};
                  for (const auto& [name, account] : accounts_) {
                      rows.push_back({name, account.balance});
                      total += account.balance;
                  }
                  // The map is already sorted by name, so a stable sort by balance keeps ties alphabetical.
                  std::stable_sort(rows.begin(), rows.end(), [](const auto& a, const auto& b) { return a.second > b.second; });
                  for (std::size_t i{0}; i < rows.size(); ++i) {
                      std::cout << i + 1 << ". " << rows[i].first << ' ' << formatMoney(rows[i].second) << '\n';
                  }
                  std::cout << "Total: " << formatMoney(total) << '\n';
              }

              void interest(int percent) {
                  for (auto& [name, account] : accounts_) {
                      long long paid{(account.balance * percent + 50) / 100};
                      account.balance += paid;
                      account.history.push_back("interest +" + formatMoney(paid));
                  }
                  undo_.clear();
                  std::cout << "Paid " << percent << "% interest to " << plural(accounts_.size(), "account") << '\n';
              }

              void save(const std::string& fileName) const {
                  std::ofstream out{fileName};
                  if (!out) {
                      throw BankError{"cannot write " + fileName};
                  }
                  for (const auto& [name, account] : accounts_) {
                      out << name << ' ' << account.balance << '\n';
                  }
                  std::cout << "Saved " << plural(accounts_.size(), "account") << " to " << fileName << '\n';
              }

              void load(const std::string& fileName) {
                  std::ifstream in{fileName};
                  if (!in) {
                      throw BankError{"cannot open " + fileName};
                  }
                  std::map<std::string, Account> loaded{};
                  std::string name{};
                  long long cents{};
                  while (in >> name >> cents) {
                      loaded[name] = Account{cents, {"open +" + formatMoney(cents)}};
                  }
                  accounts_ = std::move(loaded);
                  undo_.clear();
                  std::cout << "Loaded " << plural(accounts_.size(), "account") << " from " << fileName << '\n';
              }

          private:
              Account& get(const std::string& name) {
                  auto it = accounts_.find(name);
                  if (it == accounts_.end()) {
                      throw BankError{"no account " + name};
                  }
                  return it->second;
              }

              std::map<std::string, Account> accounts_{};
              std::vector<Transaction> undo_{};
          };

          std::vector<std::string> splitWords(const std::string& line) {
              std::istringstream in{line};
              std::vector<std::string> words{};
              std::string word{};
              while (in >> word) {
                  words.push_back(word);
              }
              return words;
          }

          void expectArgs(const std::vector<std::string>& words, std::size_t count, const std::string& usage) {
              if (words.size() != count) {
                  throw BankError{"usage: " + usage};
              }
          }

          long long amountArg(const std::string& text, bool allowZero) {
              std::optional<long long> cents{parseMoney(text)};
              if (!cents || (!allowZero && *cents == 0)) {
                  throw BankError{"invalid amount " + text};
              }
              return *cents;
          }

          int percentArg(const std::string& text) {
              bool digits{!text.empty() && text.size() <= 3};
              for (char c : text) {
                  digits = digits && c >= '0' && c <= '9';
              }
              if (!digits || std::stoi(text) < 1 || std::stoi(text) > 100) {
                  throw BankError{"invalid percent " + text};
              }
              return std::stoi(text);
          }

          void execute(Bank& bank, const std::vector<std::string>& words) {
              const std::string& command{words[0]};
              if (command == "open") {
                  expectArgs(words, 3, "open NAME AMOUNT");
                  bank.open(words[1], amountArg(words[2], true));
              } else if (command == "balance") {
                  expectArgs(words, 2, "balance NAME");
                  bank.balance(words[1]);
              } else if (command == "list") {
                  expectArgs(words, 1, "list");
                  bank.list();
              } else if (command == "deposit") {
                  expectArgs(words, 3, "deposit NAME AMOUNT");
                  bank.deposit(words[1], amountArg(words[2], false));
              } else if (command == "withdraw") {
                  expectArgs(words, 3, "withdraw NAME AMOUNT");
                  bank.withdraw(words[1], amountArg(words[2], false));
              } else if (command == "transfer") {
                  expectArgs(words, 4, "transfer FROM TO AMOUNT");
                  bank.transfer(words[1], words[2], amountArg(words[3], false));
              } else if (command == "history") {
                  expectArgs(words, 2, "history NAME");
                  bank.history(words[1]);
              } else if (command == "undo") {
                  expectArgs(words, 1, "undo");
                  bank.undo();
              } else if (command == "report") {
                  expectArgs(words, 1, "report");
                  bank.report();
              } else if (command == "interest") {
                  expectArgs(words, 2, "interest PERCENT");
                  bank.interest(percentArg(words[1]));
              } else if (command == "save") {
                  expectArgs(words, 2, "save FILE");
                  bank.save(words[1]);
              } else if (command == "load") {
                  expectArgs(words, 2, "load FILE");
                  bank.load(words[1]);
              } else {
                  throw BankError{"unknown command " + command};
              }
          }

          int main() {
              Bank bank{};
              std::string line{};
              while (std::getline(std::cin, line)) {
                  std::vector<std::string> words{splitWords(line)};
                  if (words.empty()) {
                      continue;
                  }
                  try {
                      execute(bank, words);
                  } catch (const BankError& e) {
                      std::cout << "Error: " << e.what() << '\n';
                  }
              }
              return 0;
          }
        explain: |
          Congratulations — that's a real, robust, 300-line program: parsing,
          validation, an exception-based error strategy, an undo stack,
          sorting with a custom order, exact money arithmetic and persistence.
          Read your final version once more from top to bottom as if reviewing
          a colleague's code. What would you name differently? What would you
          add next — `close`, monthly statements, several currencies?

  - type: challenge
    id: c19-ch-calc
    title: A calculator that understands brackets
    difficulty: 3
    tags: [recursion, parsing, classes, exceptions]
    prompt: |
      Write `double evaluate(const std::string& expr)` for expressions with
      numbers (possibly decimal), `+ - * /`, parentheses, unary minus and
      spaces — respecting precedence (`*` and `/` before `+` and `-`) and
      left-to-right order (`8 - 3 - 2` is 3). Throw `std::invalid_argument`
      for malformed input.

      This is a **recursive descent parser**, the technique real compilers
      use. The grammar says it all — each rule becomes one function:

      ```text
      expression = term   { ("+" | "-") term }
      term       = factor { ("*" | "/") factor }
      factor     = number | "(" expression ")" | "-" factor
      ```
    starter: |
      #include <stdexcept>
      #include <string>

      double evaluate(const std::string& expr) {
          return 0.0;
      }
    harness: |
      CHECK(evaluate("1 + 2 * 3"), 7.0);
      CHECK(evaluate("(1 + 2) * 3"), 9.0);
      CHECK(evaluate("10 / 4"), 2.5);
      CHECK(evaluate("8 - 3 - 2"), 3.0);
      CHECK(evaluate("-(2 + 3) * 2"), -10.0);
      CHECK(evaluate("2 * -3"), -6.0);
      CHECK(evaluate("2 * (3 + (4 - 1)) / 3"), 4.0);
      CHECK(evaluate("  42 "), 42.0);
      CHECK(evaluate("1.5 + 1.25"), 2.75);
      CHECK_THROWS(evaluate("1 +"));
      CHECK_THROWS(evaluate("(1 + 2"));
      CHECK_THROWS(evaluate("1 2"));
      CHECK_THROWS(evaluate(""));
    hints:
      - "Make a small class holding the text and a position `pos_`. Helpers: `skipSpaces()`, and `bool accept(char c)` which skips spaces and consumes `c` if it's next."
      - "`expression()`: `double v = term(); while (true) { if (accept('+')) v += term(); else if (accept('-')) v -= term(); else return v; }` — `term()` is the same with `*` and `/`."
      - "`factor()`: if `accept('-')` return `-factor()`; if `accept('(')`, parse an expression then require `)`; otherwise read the digits and dots and convert with `std::stod` (throw if there were none). After the top-level expression, anything left over is an error."
    solution: |
      #include <cctype>
      #include <stdexcept>
      #include <string>

      class Parser {
      public:
          explicit Parser(const std::string& text) : text_{text} {}

          double parse() {
              double value{expression()};
              skipSpaces();
              if (pos_ != text_.size()) {
                  throw std::invalid_argument{"unexpected '" + std::string(1, text_[pos_]) + "'"};
              }
              return value;
          }

      private:
          double expression() {
              double value{term()};
              while (true) {
                  if (accept('+')) {
                      value += term();
                  } else if (accept('-')) {
                      value -= term();
                  } else {
                      return value;
                  }
              }
          }

          double term() {
              double value{factor()};
              while (true) {
                  if (accept('*')) {
                      value *= factor();
                  } else if (accept('/')) {
                      value /= factor();
                  } else {
                      return value;
                  }
              }
          }

          double factor() {
              if (accept('-')) {
                  return -factor();
              }
              if (accept('(')) {
                  double value{expression()};
                  if (!accept(')')) {
                      throw std::invalid_argument{"missing ')'"};
                  }
                  return value;
              }
              return number();
          }

          double number() {
              skipSpaces();
              std::size_t start{pos_};
              while (pos_ < text_.size() &&
                     (std::isdigit(static_cast<unsigned char>(text_[pos_])) || text_[pos_] == '.')) {
                  ++pos_;
              }
              if (start == pos_) {
                  throw std::invalid_argument{"expected a number"};
              }
              return std::stod(text_.substr(start, pos_ - start));
          }

          bool accept(char c) {
              skipSpaces();
              if (pos_ < text_.size() && text_[pos_] == c) {
                  ++pos_;
                  return true;
              }
              return false;
          }

          void skipSpaces() {
              while (pos_ < text_.size() && text_[pos_] == ' ') {
                  ++pos_;
              }
          }

          std::string text_;
          std::size_t pos_{0};
      };

      double evaluate(const std::string& expr) {
          Parser parser{expr};
          return parser.parse();
      }
    explain: |
      Precedence isn't coded anywhere explicitly — it falls out of the
      structure: an `expression` is made of `term`s, so multiplications are
      grouped before additions are even considered. Add a rule
      `power = factor { "^" factor }` between term and factor, and you've
      added exponentiation. Compilers for C++ itself are built on this idea.

  - type: challenge
    id: c19-ch-lru
    title: An LRU cache
    difficulty: 3
    tags: [classes, list, unordered_map, iterators]
    prompt: |
      A cache keeps recently used data close at hand. When it's full, it
      evicts the **least recently used** item. Write `class LRUCache`:

      - `explicit LRUCache(std::size_t capacity)` (capacity ≥ 1)
      - `std::optional<int> get(int key)` — the value, or `std::nullopt`; a successful get makes the key the most recently used
      - `void put(int key, int value)` — insert or update; the key becomes the most recently used; if a new key doesn't fit, first evict the least recently used
      - `std::size_t size() const`

      Both operations must be **O(1)** — the last checks do 300,000
      operations on a cache of 20,000 items.
    starter: |
      #include <list>
      #include <optional>
      #include <unordered_map>
      #include <utility>

      class LRUCache {
      public:
          explicit LRUCache(std::size_t capacity) : capacity_{capacity} {}

          std::optional<int> get(int key) {
              return std::nullopt;
          }

          void put(int key, int value) {
          }

          std::size_t size() const { return 0; }

      private:
          std::size_t capacity_;
      };
    harness: |
      LRUCache c{2};
      c.put(1, 10);
      c.put(2, 20);
      CHECK(c.get(1).value_or(-1), 10);
      c.put(3, 30);
      CHECK(c.get(2).has_value(), false);
      CHECK(c.get(3).value_or(-1), 30);
      c.put(1, 11);
      c.put(4, 40);
      CHECK(c.get(3).has_value(), false);
      CHECK(c.get(1).value_or(-1), 11);
      CHECK(c.get(4).value_or(-1), 40);
      CHECK(c.size(), 2);
      LRUCache big{20000};
      for (int i{0}; i < 300000; ++i) {
          big.put(i % 30000, i);
          big.get((i * 7) % 30000);
      }
      CHECK(big.size(), 20000);
      CHECK(big.get(29999).value_or(-1), 299999);
    hints:
      - "Keep the items in a `std::list<std::pair<int, int>>` ordered from most to least recently used — moving an element within a list is O(1)."
      - "To find a key's list element in O(1), keep `std::unordered_map<int, std::list<std::pair<int, int>>::iterator>`. List iterators stay valid when other elements are added, removed or moved."
      - "`items_.splice(items_.begin(), items_, it)` moves the element at `it` to the front without copying. To evict: the back of the list is the least recently used — erase its key from the map, then `pop_back()`."
    solution: |
      #include <list>
      #include <optional>
      #include <unordered_map>
      #include <utility>

      class LRUCache {
      public:
          explicit LRUCache(std::size_t capacity) : capacity_{capacity} {}

          std::optional<int> get(int key) {
              auto found = where_.find(key);
              if (found == where_.end()) {
                  return std::nullopt;
              }
              items_.splice(items_.begin(), items_, found->second);
              return found->second->second;
          }

          void put(int key, int value) {
              auto found = where_.find(key);
              if (found != where_.end()) {
                  found->second->second = value;
                  items_.splice(items_.begin(), items_, found->second);
                  return;
              }
              if (items_.size() == capacity_) {
                  where_.erase(items_.back().first);
                  items_.pop_back();
              }
              items_.push_front({key, value});
              where_[key] = items_.begin();
          }

          std::size_t size() const { return items_.size(); }

      private:
          std::size_t capacity_;
          std::list<std::pair<int, int>> items_{};   // front = most recently used
          std::unordered_map<int, std::list<std::pair<int, int>>::iterator> where_{};
      };
    explain: |
      Combining two containers so each covers the other's weakness — the
      list gives O(1) reordering, the hash map gives O(1) lookup — is a
      classic design move. Caches like this sit inside browsers, databases
      and operating systems.

  - type: challenge
    id: c19-ch-wordle
    title: Wordle, scored and solved
    difficulty: 2
    tags: [strings, arrays, functions]
    prompt: |
      In Wordle you guess a five-letter word and each letter is marked
      `G` (green: right letter, right place), `Y` (yellow: in the word, but
      elsewhere) or `.` (not in the word). Repeated letters are subtle: a
      guess letter is yellow only while the secret still has **unmatched**
      copies of it (greens are matched first).

      1. `std::string score(const std::string& secret, const std::string& guess)`
      2. `std::vector<std::string> candidates(const std::vector<std::string>& words, const std::string& guess, const std::string& pattern)` — the words (in order) that could still be the secret: those `w` with `score(w, guess) == pattern`. That's the heart of a Wordle solver!

      All words are lowercase.
    starter: |
      #include <string>
      #include <vector>

      std::string score(const std::string& secret, const std::string& guess) {
          return ".....";
      }

      std::vector<std::string> candidates(const std::vector<std::string>& words, const std::string& guess,
                                          const std::string& pattern) {
          return words;
      }
    harness: |
      CHECK(score("crane", "crane"), "GGGGG");
      CHECK(score("crane", "nacre"), "YYYYG");
      CHECK(score("hello", "world"), ".Y.G.");
      CHECK(score("hello", "lllll"), "..GG.");
      CHECK(score("apple", "paper"), "YYGY.");
      CHECK(score("speed", "erase"), "Y..YY");
      CHECK(score("level", "eerie"), "YG...");
      std::vector<std::string> words{"crane", "slate", "trace", "crate", "react", "caret", "cater", "grace", "track", "brace"};
      CHECK(candidates(words, "crate", "GYYYY"), (std::vector<std::string>{"caret", "cater"}));
      CHECK(candidates(words, "slate", "..G.G"), (std::vector<std::string>{"crane", "grace", "brace"}));
      CHECK(candidates(words, "crate", "GGGGG"), (std::vector<std::string>{"crate"}));
    hints:
      - "Two passes. First mark greens, and count the secret's *unmatched* letters in `std::array<int, 26>` (index `letter - 'a'`)."
      - "Second pass: for each non-green guess letter, if its unmatched count is above 0, mark it `Y` and decrease the count."
    solution: |
      #include <array>
      #include <string>
      #include <vector>

      std::string score(const std::string& secret, const std::string& guess) {
          std::string result(guess.size(), '.');
          std::array<int, 26> unmatched{};
          for (std::size_t i{0}; i < guess.size(); ++i) {
              if (guess[i] == secret[i]) {
                  result[i] = 'G';
              } else {
                  ++unmatched[static_cast<std::size_t>(secret[i] - 'a')];
              }
          }
          for (std::size_t i{0}; i < guess.size(); ++i) {
              auto letter = static_cast<std::size_t>(guess[i] - 'a');
              if (result[i] != 'G' && unmatched[letter] > 0) {
                  result[i] = 'Y';
                  --unmatched[letter];
              }
          }
          return result;
      }

      std::vector<std::string> candidates(const std::vector<std::string>& words, const std::string& guess,
                                          const std::string& pattern) {
          std::vector<std::string> out{};
          for (const auto& w : words) {
              if (score(w, guess) == pattern) {
                  out.push_back(w);
              }
          }
          return out;
      }
    explain: |
      With a list of all five-letter words, a solver repeatedly narrows the
      candidates. The clever part — which guess narrows them the most on
      average — is a fun project to try on your own computer.

  - type: challenge
    id: c19-ch-sudoku
    title: Sudoku solver
    difficulty: 3
    tags: [backtracking, grids]
    prompt: |
      A Sudoku board is 9 strings of 9 characters: digits `1`–`9`, or `.`
      for an empty cell. Every row, column and 3 × 3 box must contain each
      digit at most once.

      - `bool isValid(const std::vector<std::string>& board)` — no rule is broken by the digits already there
      - `bool solveSudoku(std::vector<std::string>& board)` — fill every empty cell and return `true`, or return `false` (board unchanged or partly changed — it doesn't matter) if there's no solution, including when the board is invalid to start with
    starter: |
      #include <string>
      #include <vector>

      bool isValid(const std::vector<std::string>& board) {
          return true;
      }

      bool solveSudoku(std::vector<std::string>& board) {
          return false;
      }
    harness: |
      std::vector<std::string> puzzle{
          "53..7....", "6..195...", ".98....6.", "8...6...3", "4..8.3..1",
          "7...2...6", ".6....28.", "...419..5", "....8..79"};
      CHECK(isValid(puzzle), true);
      std::vector<std::string> board{puzzle};
      CHECK(solveSudoku(board), true);
      CHECK(board[0], "534678912");
      CHECK(board[4], "426853791");
      CHECK(board[8], "345286179");
      CHECK(isValid(board), true);
      std::vector<std::string> bad{puzzle};
      bad[0][2] = '5';
      CHECK(isValid(bad), false);
      CHECK(solveSudoku(bad), false);
      std::vector<std::string> stuck(9, std::string(9, '.'));
      stuck[0] = "12345678.";
      stuck[1][8] = '9';
      CHECK(isValid(stuck), true);
      CHECK(solveSudoku(stuck), false);
    hints:
      - "Helper `bool canPlace(board, r, c, digit)`: check row `r`, column `c`, and the box starting at `(3 * (r / 3), 3 * (c / 3))`."
      - "`isValid`: for each filled cell, temporarily clear it (on a copy) and ask whether its digit could be placed there."
      - "Backtracking: find the first `.`; try `'1'`…`'9'` where `canPlace`; recurse; if that fails, reset to `.` and try the next. If no digit works, return false. If there's no empty cell, you're done."
    solution: |
      #include <string>
      #include <vector>

      bool canPlace(const std::vector<std::string>& b, std::size_t r, std::size_t c, char d) {
          for (std::size_t i{0}; i < 9; ++i) {
              std::size_t boxRow{3 * (r / 3) + i / 3};
              std::size_t boxCol{3 * (c / 3) + i % 3};
              if (b[r][i] == d || b[i][c] == d || b[boxRow][boxCol] == d) {
                  return false;
              }
          }
          return true;
      }

      bool isValid(const std::vector<std::string>& board) {
          std::vector<std::string> copy{board};
          for (std::size_t r{0}; r < 9; ++r) {
              for (std::size_t c{0}; c < 9; ++c) {
                  char d{copy[r][c]};
                  if (d == '.') {
                      continue;
                  }
                  copy[r][c] = '.';
                  bool ok{canPlace(copy, r, c, d)};
                  copy[r][c] = d;
                  if (!ok) {
                      return false;
                  }
              }
          }
          return true;
      }

      bool fill(std::vector<std::string>& b) {
          for (std::size_t r{0}; r < 9; ++r) {
              for (std::size_t c{0}; c < 9; ++c) {
                  if (b[r][c] != '.') {
                      continue;
                  }
                  for (char d{'1'}; d <= '9'; ++d) {
                      if (canPlace(b, r, c, d)) {
                          b[r][c] = d;
                          if (fill(b)) {
                              return true;
                          }
                          b[r][c] = '.';
                      }
                  }
                  return false;
              }
          }
          return true;
      }

      bool solveSudoku(std::vector<std::string>& board) {
          return isValid(board) && fill(board);
      }
    explain: |
      Plain backtracking solves typical puzzles in milliseconds. A classic
      speed-up: instead of the *first* empty cell, fill the one with the
      *fewest* possible digits — the search tree shrinks dramatically.

  - type: review
    id: c19-review
    title: "The whole course on one page"
    body: |
      Before the final exam, one page to review everything. For each line,
      ask yourself: *could I explain this to a friend, with an example?*

      ## Part I — First Steps

      - A program is instructions; the compiler turns C++ into machine code. Errors: compile-time (syntax/types), link-time, run-time, logic.
      - `int`, `double`, `char`, `bool`, `std::string`; initialise with `{}`; `const`/`constexpr`.
      - Integer division truncates; `%` is remainder; watch overflow and narrowing.
      - `if`/`else`, `switch`, `&&` `||` `!`; loops `while`, `for`, `do`-`while`, `break`/`continue`.
      - Functions: parameters by value (copy) or by reference (`&`, can modify) or `const&` (read-only, no copy); return values; overloading; recursion needs a base case.

      ## Part II — Working with Data

      - `std::vector` (size, push_back, range-for, `.at()` checks bounds), `std::array`, C arrays.
      - `std::string`: `size`, `substr`, `find`, `+`, `std::getline`, `<cctype>`.
      - `struct` groups data; `enum class` names choices.
      - References are aliases; pointers hold addresses (`&x`, `*p`, `nullptr`); the stack vs the heap; `new`/`delete` and why to avoid them.

      ## Part III — Object-Oriented C++

      - Classes: private data + public interface; constructors establish invariants; `const` member functions; destructors and RAII; operator overloading.
      - Inheritance models "is a"; `virtual` + `override` give polymorphism through references and pointers; abstract classes as interfaces; virtual destructors; prefer composition.

      ## Part IV — The Standard Library and Modern C++

      - Containers: `vector`, `map`/`set` (sorted, O(log n)), `unordered_map`/`unordered_set` (O(1) average), `deque`, `list`, `stack`, `queue`, `priority_queue`; iterators.
      - Algorithms: `sort`, `find_if`, `count_if`, `accumulate`, `transform`, … with lambdas (`[captures](params) { body }`).
      - Ownership: `unique_ptr` (sole owner), `shared_ptr` (shared); move semantics; rules of zero/three/five; exceptions + RAII; `std::optional`.
      - Templates: generic functions and classes; `if constexpr`, `static_assert`, concepts.

      ## Part V — Becoming Fluent

      - Headers/sources, include guards, namespaces, the build process; streams and files; debugging method; tests and edge cases; readable style.
      - Problem solving: understand → plan → build → look back. Big-O. Binary search, sorting, backtracking, hashing, two pointers, sliding windows, prefix sums, DP, BFS/DFS.
