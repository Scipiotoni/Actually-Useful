items:
  - type: lesson
    id: c19-design
    title: Designing a program from scratch
    minutes: 25
    objectives:
      - Go from a specification to a design — data, operations and errors
      - Build incrementally from a walking skeleton
      - Represent money safely, and handle errors in a command loop
    body: |
      Every exercise so far gave you a function signature or a starter. The
      capstone gives you only a **specification** — what the program must do —
      and you make every design decision. That's what real programming is.
      This lesson shows how professionals approach it.

      ## 1. Understand the specification

      Read it twice. Then write down a **transcript**: an example session,
      input and expected output, including the error cases. If you can't
      write the transcript, you don't understand the problem yet — and every
      question you have now is a bug you avoid later.

      ## 2. Find the data and the operations

      Nouns in the specification tend to become **types**; verbs become
      **functions** or **member functions**. For a bank: *accounts* have a
      *name*, a *balance* and a *history*; you can *open*, *deposit*,
      *withdraw*, *transfer*, *undo*. Ask for each piece of data: which
      container? (Look up by name → `std::map`. Undo the most recent first →
      a stack, e.g. a `std::vector` used with `push_back`/`back`/`pop_back`.)

      ## 3. Choose representations carefully

      Some choices are traps. The classic one: **never store money in a
      `double`**.

      ```cpp
      #include <iomanip>
      #include <iostream>

      int main() {
          double a{0.1 + 0.2};
          std::cout << std::boolalpha << (a == 0.3) << '\n';
          std::cout << std::setprecision(17) << a << '\n';
          long long cents{10 + 20};
          std::cout << (cents == 30) << '\n';
          return 0;
      }
      ```

      ```output
      false
      0.30000000000000004
      true
      ```

      Binary floating point can't represent 0.1 exactly, so errors creep in.
      Banks count **integer cents**: `12.50` is stored as `1250`, and only
      formatted with a decimal point when printed.

      ## 4. Plan for errors

      Programs that read commands must survive bad input. A clean design:
      every function **throws** an exception with a clear message when
      something is wrong, and the command loop catches it, prints it, and
      carries on with the next line.

      ```cpp
      #include <iostream>
      #include <sstream>
      #include <stdexcept>
      #include <string>

      int main() {
          int total{0};
          std::string line{};
          while (std::getline(std::cin, line)) {
              std::istringstream words{line};
              std::string command{};
              words >> command;
              try {
                  if (command == "add" || command == "sub") {
                      int amount{};
                      if (!(words >> amount)) {
                          throw std::runtime_error{"usage: " + command + " NUMBER"};
                      }
                      total += command == "add" ? amount : -amount;
                  } else if (command == "show") {
                      std::cout << "total = " << total << '\n';
                  } else {
                      throw std::runtime_error{"unknown command " + command};
                  }
              } catch (const std::runtime_error& e) {
                  std::cout << "Error: " << e.what() << '\n';
              }
          }
          return 0;
      }
      ```

      ```stdin
      add 5
      add 10
      sub 3
      show
      add
      jump 3
      show
      ```

      ```output
      total = 12
      Error: usage: add NUMBER
      Error: unknown command jump
      total = 12
      ```

      The error-handling code lives in **one place**; every other function
      just throws. Adding a new command never means adding new error
      plumbing.

      ## 5. Build incrementally

      Don't write 300 lines and then press Run. Start with a **walking
      skeleton** — the command loop that reads lines and reports "unknown
      command" for everything. It runs from minute one. Then add **one
      command at a time**, running the examples after each. When something
      breaks, you know it was the last few lines you wrote.

      When the code works, **look back**: are names clear? Is anything
      repeated that should be a function? Then move to the next feature. The
      capstone's milestones follow exactly this rhythm.

      {{check money}}

      {{check steps}}
    checks:
      - id: money
        type: mcq
        prompt: "Why do financial programs store amounts as integer cents rather than `double`?"
        options:
          - Integers use less memory
          - "`double` can't represent most decimal fractions exactly, so rounding errors accumulate"
          - "`double` can't hold large numbers"
          - It's required by C++
        answer: 1
        why: "0.1 + 0.2 != 0.3 in binary floating point. Integer cents are exact."
      - id: steps
        type: order
        prompt: "Order the steps of building a program from a specification."
        lines:
          - "Write an example transcript, including errors"
          - "Identify the data (types, containers) and the operations"
          - "Build a walking skeleton that runs"
          - "Add one feature at a time, testing each"
          - "Look back: tidy names, remove duplication"
        why: "Understand → design → skeleton → increments → refactor."
    cards:
      - front: How should programs store money?
        back: As integer cents (e.g. `long long`), formatting with a decimal point only for display. Never `double`.
      - front: What is a **walking skeleton**?
        back: The thinnest end-to-end version of a program that runs (e.g. the command loop handling nothing yet), which you then grow one feature at a time.
      - front: A good error-handling structure for a command-driven program?
        back: Functions throw exceptions with clear messages; the command loop has one try/catch that prints the error and continues with the next command.

  - type: project
    id: c19-project
    title: "Capstone: Mini Bank"
    body: |
      Build a small **banking system** driven by text commands — one command
      per line on standard input, until the input ends. It uses nearly
      everything in the course: classes, maps and vectors, strings and
      parsing, exceptions, `std::optional`, sorting with lambdas, integer
      arithmetic done right, and files.

      A session at the end of the project looks like this:

      ```text
      > open alice 100              Opened alice with 100.00
      > open bob 20.5               Opened bob with 20.50
      > transfer alice bob 30       Transferred 30.00 from alice to bob
      > withdraw bob 100            Error: insufficient funds in bob
      > undo                        Undid transfer of 30.00 from alice to bob
      > report                      1. alice 100.00
                                    2. bob 20.50
                                    Total: 120.50
      ```

      (The `>` and the columns are only for this illustration: the real
      program reads plain lines and prints plain lines.)

      **Rules that hold in every milestone:**

      - Blank lines are ignored.
      - Any problem prints one line starting with `Error: ` and the program continues with the next command.
      - A wrong number of words prints `Error: usage: ...` with the command's form, e.g. `Error: usage: open NAME AMOUNT`.
      - An unrecognised command prints `Error: unknown command WORD`.
      - **Amounts** are written as digits, optionally followed by a dot and one or two digits: `7`, `7.5`, `7.50`. Anything else (`-5`, `abc`, `3.456`, `.5`) prints `Error: invalid amount TEXT`. Money is always printed with two decimals.
      - Store money as **integer cents** (`long long`).

      **Suggested design** (you may choose your own): a `BankError`
      exception class derived from `std::runtime_error`; `parseMoney`
      (text → `std::optional<long long>` cents) and `formatMoney` (cents →
      text); a `Bank` class holding a `std::map<std::string, Account>`; and an
      `execute(bank, words)` function that runs one command, called from a
      `main` loop with a single `try`/`catch`.

      Each milestone's tests run your whole program, so earlier features must
      keep working as you add new ones.
    milestones:
      - title: Accounts
        prompt: |
          Support three commands:

          | Command | Output |
          |---|---|
          | `open NAME AMOUNT` | `Opened NAME with AMOUNT` |
          | `balance NAME` | `NAME: AMOUNT` |
          | `list` | one line `NAME AMOUNT` per account, **sorted by name**; `No accounts` if there are none |

          Opening with `0` is allowed. Errors: `Error: NAME already exists`,
          `Error: no account NAME`, plus the general rules (usage, unknown
          command, invalid amount).

          Example — for this input:

          ```text
          open alice 100
          open bob 25.5
          balance bob
          open alice 10
          balance carol
          list
          ```

          the output is:

          ```text
          Opened alice with 100.00
          Opened bob with 25.50
          bob: 25.50
          Error: alice already exists
          Error: no account carol
          alice 100.00
          bob 25.50
          ```
        starter: |
          #include <iostream>
          #include <sstream>
          #include <string>
          #include <vector>

          // Suggested design (see the project description):
          //   class BankError : public std::runtime_error  -- thrown for every error
          //   parseMoney / formatMoney                     -- text <-> integer cents
          //   class Bank                                   -- the accounts and their operations
          //   execute(bank, words)                         -- runs one command

          std::vector<std::string> splitWords(const std::string& line) {
              std::istringstream in{line};
              std::vector<std::string> words{};
              std::string word{};
              while (in >> word) {
                  words.push_back(word);
              }
              return words;
          }

          int main() {
              std::string line{};
              while (std::getline(std::cin, line)) {
                  std::vector<std::string> words{splitWords(line)};
                  if (words.empty()) {
                      continue;
                  }
                  // TODO: run the command in words[0]
              }
              return 0;
          }
        tests:
          - in: |
              open alice 100
              open bob 25.5
              balance alice
              balance bob
              open alice 10
              balance carol
              list
            out: |
              Opened alice with 100.00
              Opened bob with 25.50
              alice: 100.00
              bob: 25.50
              Error: alice already exists
              Error: no account carol
              alice 100.00
              bob 25.50
          - in: |
              list
              open zoe 0
              open adam 12.05

              open eve 3.456
              open eve abc
              open eve
              fly away
              list
            out: |
              No accounts
              Opened zoe with 0.00
              Opened adam with 12.05
              Error: invalid amount 3.456
              Error: invalid amount abc
              Error: usage: open NAME AMOUNT
              Error: unknown command fly
              adam 12.05
              zoe 0.00
            hidden: true
        hints:
          - "Start with the skeleton: split each line into words; if `words[0]` is none of your commands, print the unknown-command error. Get that working first."
          - "`parseMoney`: split at the `.` with `find` and `substr`. Check the whole part is 1+ digits and the fraction 1–2 digits (pad `\"5\"` to `\"50\"`). Then `std::stoll(whole) * 100 + std::stoll(fraction)`."
          - "`formatMoney(1205)`: `1205 / 100` = 12 and `1205 % 100` = 5, padded to `\"05\"` → `\"12.05\"`."
          - "Errors: `class BankError : public std::runtime_error { public: using std::runtime_error::runtime_error; };` Throw it anywhere; catch it once in `main` and print `\"Error: \" << e.what()`."
          - "Careful in `balance`: look the account up *before* printing anything — otherwise `std::cout << name << \": \" << find(name)...` prints the name before the lookup throws."
        solution: |
          #include <iostream>
          #include <map>
          #include <optional>
          #include <sstream>
          #include <stdexcept>
          #include <string>
          #include <vector>

          class BankError : public std::runtime_error {
          public:
              using std::runtime_error::runtime_error;
          };

          // "12", "12.5" or "12.50" -> 1250 cents. Anything else -> nullopt.
          std::optional<long long> parseMoney(const std::string& text) {
              std::size_t dot{text.find('.')};
              std::string whole{text.substr(0, dot)};
              std::string cents{dot == std::string::npos ? "" : text.substr(dot + 1)};
              if (whole.empty() || whole.size() > 12 || cents.size() > 2 ||
                  (dot != std::string::npos && cents.empty())) {
                  return std::nullopt;
              }
              for (char c : whole + cents) {
                  if (c < '0' || c > '9') {
                      return std::nullopt;
                  }
              }
              while (cents.size() < 2) {
                  cents += '0';
              }
              return std::stoll(whole) * 100 + std::stoll(cents);
          }

          std::string formatMoney(long long cents) {
              std::string rest{std::to_string(cents % 100)};
              if (rest.size() < 2) {
                  rest = "0" + rest;
              }
              return std::to_string(cents / 100) + "." + rest;
          }

          struct Account {
              long long balance{0};
          };

          class Bank {
          public:
              void open(const std::string& name, long long cents) {
                  if (accounts_.count(name) > 0) {
                      throw BankError{name + " already exists"};
                  }
                  accounts_[name] = Account{cents};
                  std::cout << "Opened " << name << " with " << formatMoney(cents) << '\n';
              }

              void balance(const std::string& name) {
                  const Account& account = get(name);     // look up first: it may throw
                  std::cout << name << ": " << formatMoney(account.balance) << '\n';
              }

              void list() const {
                  if (accounts_.empty()) {
                      std::cout << "No accounts\n";
                      return;
                  }
                  for (const auto& [name, account] : accounts_) {
                      std::cout << name << ' ' << formatMoney(account.balance) << '\n';
                  }
              }

          private:
              Account& get(const std::string& name) {
                  auto it = accounts_.find(name);
                  if (it == accounts_.end()) {
                      throw BankError{"no account " + name};
                  }
                  return it->second;
              }

              std::map<std::string, Account> accounts_{};
          };

          std::vector<std::string> splitWords(const std::string& line) {
              std::istringstream in{line};
              std::vector<std::string> words{};
              std::string word{};
              while (in >> word) {
                  words.push_back(word);
              }
              return words;
          }

          void expectArgs(const std::vector<std::string>& words, std::size_t count, const std::string& usage) {
              if (words.size() != count) {
                  throw BankError{"usage: " + usage};
              }
          }

          long long amountArg(const std::string& text, bool allowZero) {
              std::optional<long long> cents{parseMoney(text)};
              if (!cents || (!allowZero && *cents == 0)) {
                  throw BankError{"invalid amount " + text};
              }
              return *cents;
          }

          void execute(Bank& bank, const std::vector<std::string>& words) {
              const std::string& command{words[0]};
              if (command == "open") {
                  expectArgs(words, 3, "open NAME AMOUNT");
                  bank.open(words[1], amountArg(words[2], true));
              } else if (command == "balance") {
                  expectArgs(words, 2, "balance NAME");
                  bank.balance(words[1]);
              } else if (command == "list") {
                  expectArgs(words, 1, "list");
                  bank.list();
              } else {
                  throw BankError{"unknown command " + command};
              }
          }

          int main() {
              Bank bank{};
              std::string line{};
              while (std::getline(std::cin, line)) {
                  std::vector<std::string> words{splitWords(line)};
                  if (words.empty()) {
                      continue;
                  }
                  try {
                      execute(bank, words);
                  } catch (const BankError& e) {
                      std::cout << "Error: " << e.what() << '\n';
                  }
              }
              return 0;
          }
        explain: |
          A `std::map` gives the sorted `list` for free. Notice the tiny bug the
          last hint warns about: in `std::cout << a << f()`, `a` is printed
          before `f()` runs (C++17 guarantees left-to-right), so if `f` throws,
          half a line has already been printed. Do the work that can fail
          first, then print.
      - title: Moving money
        prompt: |
          Add three commands. Amounts must be **greater than zero** (`0` is an
          invalid amount).

          | Command | Output |
          |---|---|
          | `deposit NAME AMOUNT` | `Deposited AMOUNT to NAME (balance NEW)` |
          | `withdraw NAME AMOUNT` | `Withdrew AMOUNT from NAME (balance NEW)` |
          | `transfer FROM TO AMOUNT` | `Transferred AMOUNT from FROM to TO` |

          New errors: `Error: insufficient funds in NAME` (a balance can never
          go below zero) and `Error: cannot transfer to the same account`.

          Check in this order: the amount is valid → the account(s) exist →
          (transfer) not the same account → enough funds.
        tests:
          - in: |
              open alice 100
              open bob 20
              deposit alice 50
              withdraw alice 20.25
              withdraw bob 25
              transfer alice bob 30
              transfer bob bob 5
              transfer alice carol 5
              deposit alice 0
              list
            out: |
              Opened alice with 100.00
              Opened bob with 20.00
              Deposited 50.00 to alice (balance 150.00)
              Withdrew 20.25 from alice (balance 129.75)
              Error: insufficient funds in bob
              Transferred 30.00 from alice to bob
              Error: cannot transfer to the same account
              Error: no account carol
              Error: invalid amount 0
              alice 99.75
              bob 50.00
          - in: |
              open ann 10
              withdraw ann 10
              balance ann
              deposit ann 0.99
              transfer ann ann 1
              withdraw ann -5
            out: |
              Opened ann with 10.00
              Withdrew 10.00 from ann (balance 0.00)
              ann: 0.00
              Deposited 0.99 to ann (balance 0.99)
              Error: cannot transfer to the same account
              Error: invalid amount -5
            hidden: true
        hints:
          - "Give `Bank` a private helper `Account& get(const std::string& name)` that throws `no account NAME` — every command can use it."
          - "For `transfer`, get both accounts (so a missing one is reported) before checking `from == to`."
        solution: |
          #include <iostream>
          #include <map>
          #include <optional>
          #include <sstream>
          #include <stdexcept>
          #include <string>
          #include <vector>

          class BankError : public std::runtime_error {
          public:
              using std::runtime_error::runtime_error;
          };

          // "12", "12.5" or "12.50" -> 1250 cents. Anything else -> nullopt.
          std::optional<long long> parseMoney(const std::string& text) {
              std::size_t dot{text.find('.')};
              std::string whole{text.substr(0, dot)};
              std::string cents{dot == std::string::npos ? "" : text.substr(dot + 1)};
              if (whole.empty() || whole.size() > 12 || cents.size() > 2 ||
                  (dot != std::string::npos && cents.empty())) {
                  return std::nullopt;
              }
              for (char c : whole + cents) {
                  if (c < '0' || c > '9') {
                      return std::nullopt;
                  }
              }
              while (cents.size() < 2) {
                  cents += '0';
              }
              return std::stoll(whole) * 100 + std::stoll(cents);
          }

          std::string formatMoney(long long cents) {
              std::string rest{std::to_string(cents % 100)};
              if (rest.size() < 2) {
                  rest = "0" + rest;
              }
              return std::to_string(cents / 100) + "." + rest;
          }

          struct Account {
              long long balance{0};
          };

          class Bank {
          public:
              void open(const std::string& name, long long cents) {
                  if (accounts_.count(name) > 0) {
                      throw BankError{name + " already exists"};
                  }
                  accounts_[name] = Account{cents};
                  std::cout << "Opened " << name << " with " << formatMoney(cents) << '\n';
              }

              void balance(const std::string& name) {
                  const Account& account = get(name);     // look up first: it may throw
                  std::cout << name << ": " << formatMoney(account.balance) << '\n';
              }

              void list() const {
                  if (accounts_.empty()) {
                      std::cout << "No accounts\n";
                      return;
                  }
                  for (const auto& [name, account] : accounts_) {
                      std::cout << name << ' ' << formatMoney(account.balance) << '\n';
                  }
              }

              void deposit(const std::string& name, long long cents) {
                  Account& account = get(name);
                  account.balance += cents;
                  std::cout << "Deposited " << formatMoney(cents) << " to " << name
                            << " (balance " << formatMoney(account.balance) << ")\n";
              }

              void withdraw(const std::string& name, long long cents) {
                  Account& account = get(name);
                  if (account.balance < cents) {
                      throw BankError{"insufficient funds in " + name};
                  }
                  account.balance -= cents;
                  std::cout << "Withdrew " << formatMoney(cents) << " from " << name
                            << " (balance " << formatMoney(account.balance) << ")\n";
              }

              void transfer(const std::string& from, const std::string& to, long long cents) {
                  Account& source = get(from);
                  Account& target = get(to);
                  if (from == to) {
                      throw BankError{"cannot transfer to the same account"};
                  }
                  if (source.balance < cents) {
                      throw BankError{"insufficient funds in " + from};
                  }
                  source.balance -= cents;
                  target.balance += cents;
                  std::cout << "Transferred " << formatMoney(cents) << " from " << from << " to " << to << '\n';
              }

          private:
              Account& get(const std::string& name) {
                  auto it = accounts_.find(name);
                  if (it == accounts_.end()) {
                      throw BankError{"no account " + name};
                  }
                  return it->second;
              }

              std::map<std::string, Account> accounts_{};
          };

          std::vector<std::string> splitWords(const std::string& line) {
              std::istringstream in{line};
              std::vector<std::string> words{};
              std::string word{};
              while (in >> word) {
                  words.push_back(word);
              }
              return words;
          }

          void expectArgs(const std::vector<std::string>& words, std::size_t count, const std::string& usage) {
              if (words.size() != count) {
                  throw BankError{"usage: " + usage};
              }
          }

          long long amountArg(const std::string& text, bool allowZero) {
              std::optional<long long> cents{parseMoney(text)};
              if (!cents || (!allowZero && *cents == 0)) {
                  throw BankError{"invalid amount " + text};
              }
              return *cents;
          }

          void execute(Bank& bank, const std::vector<std::string>& words) {
              const std::string& command{words[0]};
              if (command == "open") {
                  expectArgs(words, 3, "open NAME AMOUNT");
                  bank.open(words[1], amountArg(words[2], true));
              } else if (command == "balance") {
                  expectArgs(words, 2, "balance NAME");
                  bank.balance(words[1]);
              } else if (command == "list") {
                  expectArgs(words, 1, "list");
                  bank.list();
              } else if (command == "deposit") {
                  expectArgs(words, 3, "deposit NAME AMOUNT");
                  bank.deposit(words[1], amountArg(words[2], false));
              } else if (command == "withdraw") {
                  expectArgs(words, 3, "withdraw NAME AMOUNT");
                  bank.withdraw(words[1], amountArg(words[2], false));
              } else if (command == "transfer") {
                  expectArgs(words, 4, "transfer FROM TO AMOUNT");
                  bank.transfer(words[1], words[2], amountArg(words[3], false));
              } else {
                  throw BankError{"unknown command " + command};
              }
          }

          int main() {
              Bank bank{};
              std::string line{};
              while (std::getline(std::cin, line)) {
                  std::vector<std::string> words{splitWords(line)};
                  if (words.empty()) {
                      continue;
                  }
                  try {
                      execute(bank, words);
                  } catch (const BankError& e) {
                      std::cout << "Error: " << e.what() << '\n';
                  }
              }
              return 0;
          }
      - title: History and undo
        prompt: |
          Every account keeps a **history**, and the bank can **undo** the most
          recent money movement.

          `history NAME` prints the account's entries, oldest first, one per
          line:

          | Event | Entry |
          |---|---|
          | open | `open +AMOUNT` |
          | deposit | `deposit +AMOUNT` |
          | withdraw | `withdraw -AMOUNT` |
          | transfer | `transfer to OTHER -AMOUNT` in the sender's history, `transfer from OTHER +AMOUNT` in the receiver's |

          `undo` reverses the most recent deposit, withdraw or transfer that
          hasn't been undone yet, **removing its history entries**, and prints
          `Undid deposit of AMOUNT to NAME`, `Undid withdraw of AMOUNT from NAME`
          or `Undid transfer of AMOUNT from FROM to TO`. Repeated `undo`s go
          further back. Opening an account can't be undone. With nothing left:
          `Error: nothing to undo`.
        tests:
          - in: |
              open alice 100
              open bob 20
              deposit alice 50
              transfer alice bob 30
              withdraw bob 10
              history alice
              history bob
              undo
              undo
              history bob
              list
              undo
              undo
            out: |
              Opened alice with 100.00
              Opened bob with 20.00
              Deposited 50.00 to alice (balance 150.00)
              Transferred 30.00 from alice to bob
              Withdrew 10.00 from bob (balance 40.00)
              open +100.00
              deposit +50.00
              transfer to bob -30.00
              open +20.00
              transfer from alice +30.00
              withdraw -10.00
              Undid withdraw of 10.00 from bob
              Undid transfer of 30.00 from alice to bob
              open +20.00
              alice 150.00
              bob 20.00
              Undid deposit of 50.00 to alice
              Error: nothing to undo
