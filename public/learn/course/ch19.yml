          }

          long long amountArg(const std::string& text, bool allowZero) {
              std::optional<long long> cents{parseMoney(text)};
              if (!cents || (!allowZero && *cents == 0)) {
                  throw BankError{"invalid amount " + text};
              }
              return *cents;
          }

          int percentArg(const std::string& text) {
              bool digits{!text.empty() && text.size() <= 3};
              for (char c : text) {
                  digits = digits && c >= '0' && c <= '9';
              }
              if (!digits || std::stoi(text) < 1 || std::stoi(text) > 100) {
                  throw BankError{"invalid percent " + text};
              }
              return std::stoi(text);
          }

          void execute(Bank& bank, const std::vector<std::string>& words) {
              const std::string& command{words[0]};
              if (command == "open") {
                  expectArgs(words, 3, "open NAME AMOUNT");
                  bank.open(words[1], amountArg(words[2], true));
              } else if (command == "balance") {
