        harness: |
          Library lib{};
          lib.addBook("Dune", 2);
          CHECK(lib.available("Dune"), 2);
          CHECK(lib.borrow("Dune"), true);
          CHECK(lib.borrow("Dune"), true);
          CHECK(lib.borrow("Dune"), false);
          CHECK(lib.available("Dune"), 0);
          lib.giveBack("Dune");
          CHECK(lib.available("Dune"), 1);
          CHECK(lib.borrow("Emma"), false);
          CHECK(lib.available("Emma"), 0);
          CHECK_THROWS(lib.addBook("Emma", 0));
          CHECK_THROWS(lib.giveBack("Emma"));
          lib.giveBack("Dune");
          CHECK_THROWS(lib.giveBack("Dune"));
          lib.addBook("Dune", 1);
          CHECK(lib.available("Dune"), 3);
        solution: |
          #include <map>
          #include <stdexcept>
          #include <string>

          class Library {
          public:
              void addBook(const std::string& title, int copies) {
                  if (copies <= 0) {
                      throw std::invalid_argument{"copies must be positive"};
                  }
                  shelf_[title] += copies;
              }

              bool borrow(const std::string& title) {
                  auto it = shelf_.find(title);
                  if (it == shelf_.end() || it->second == 0) {
                      return false;
                  }
                  --it->second;
                  ++borrowed_[title];
                  return true;
              }

              void giveBack(const std::string& title) {
                  auto it = borrowed_.find(title);
                  if (it == borrowed_.end() || it->second == 0) {
                      throw std::logic_error{"no borrowed copy of " + title};
                  }
                  --it->second;
                  ++shelf_[title];
              }

              int available(const std::string& title) const {
                  auto it = shelf_.find(title);
                  return it == shelf_.end() ? 0 : it->second;
              }

          private:
              std::map<std::string, int> shelf_{};
              std::map<std::string, int> borrowed_{};
          };
      - type: code
        prompt: |
          Write `int longestConsecutive(const std::vector<int>& v)`: the length
          of the longest run of **consecutive integers** that all appear in `v`,
          in any order — `{100, 4, 200, 1, 3, 2}` gives 4 (1, 2, 3, 4). Aim for
          O(n) with a hash set: only start counting at numbers that begin a run.
        starter: |
          #include <vector>

          int longestConsecutive(const std::vector<int>& v) {
              return 0;
          }
        harness: |
          CHECK(longestConsecutive({100, 4, 200, 1, 3, 2}), 4);
          CHECK(longestConsecutive({}), 0);
          CHECK(longestConsecutive({1, 2, 0, 1}), 3);
          CHECK(longestConsecutive({0, -1}), 2);
          CHECK(longestConsecutive({10, 30, 20}), 1);
          CHECK(longestConsecutive({9, 1, -3, 2, 4, 8, 3, -1, 6, -2, -4, 7, 5}), 9);
        solution: |
          #include <algorithm>
          #include <unordered_set>
          #include <vector>

          int longestConsecutive(const std::vector<int>& v) {
              std::unordered_set<int> present(v.begin(), v.end());
              int best{0};
              for (int x : present) {
                  if (present.count(x - 1) > 0) {
                      continue;
                  }
                  int length{1};
                  while (present.count(x + length) > 0) {
                      ++length;
                  }
                  best = std::max(best, length);
              }
              return best;
          }

  - type: build
    id: cpp-build-program
    title: "Final project: a console program of your own"
    minutes: 150
    body: |
      Write a complete C++ program about **anything you like** — from an
      empty file, with no steps to follow. A game, a calculator, a tracker,
      a quiz, a simulation: it's yours.

      The only rule: it must use the ingredients below. Plan it first
      (what data, what functions, what it prints), then build it a piece at
      a time, running it as you go.
    ideas:
      - A text adventure with a few rooms and an inventory
      - A grade book that stores students and prints averages
      - A budget tracker that reads expenses and prints a report
      - A number-guessing game with a limited number of tries
      - A times-table quiz that keeps score
    requirements:
      - text: "At least one function you wrote, besides `main`"
        code: "\\b(?!main\\b|if\\b|for\\b|while\\b|switch\\b|catch\\b|return\\b)[A-Za-z_]\\w*\\s*\\([^;{}()]*\\)\\s*(const\\s*)?\\{[\\s\\S]*\\bint\\s+main\\s*\\("
        hint: "Write a function above `main`, like `int total(const std::vector<int>& v) { … }`, and call it."
      - text: "A container: `std::vector`, `std::map`, `std::array`…"
        code: "\\b(std::)?(vector|map|unordered_map|set|array|deque|list)\\s*<"
      - text: "A `struct` or `class` of your own"
        code: "\\b(struct|class)\\s+[A-Za-z_]\\w*\\s*(:[^{;]*)?\\{"
      - text: "A loop (`for` or `while`)"
        code: "\\b(for|while)\\s*\\("
      - text: "A decision (`if` or `switch`)"
        code: "\\b(if|switch)\\s*\\("
      - text: "It prints something"
        output: "\\S"
        hint: "Print your results with `std::cout`."
    starter: |
      #include <iostream>

      int main() {
          // Your program
          return 0;
      }
    example: |
      #include <iostream>
      #include <string>
      #include <vector>

      struct Expense {
          std::string what;
          double amount;
      };

      double total(const std::vector<Expense>& expenses) {
          double sum = 0;
          for (const Expense& e : expenses) {
              sum += e.amount;
          }
          return sum;
      }

      int main() {
          std::vector<Expense> expenses = {{"Rent", 650}, {"Food", 220.5}, {"Bus pass", 40}};
          double budget = 1000;
          for (const Expense& e : expenses) {
              std::cout << e.what << ": " << e.amount << "\n";
          }
          double spent = total(expenses);
          std::cout << "Total: " << spent << "\n";
          if (spent > budget) {
              std::cout << "Over budget!\n";
          } else {
              std::cout << "Left: " << budget - spent << "\n";
          }
          return 0;
      }

  - type: build
    id: cpp-build-system
    title: "Final project: a modern C++ system"
    minutes: 180
    body: |
      Build something bigger, designed like real software: a library
      system, a bank, a zoo, a playlist manager, an RPG battle — anything
      with a few kinds of objects working together.

      Use classes to model it, the standard library to do the heavy
      lifting, and exceptions for things that go wrong. Just use the
      ingredients below — the design is yours.
    ideas:
      - A library system with books, members and loans
      - A turn-based battle between characters of different classes
      - A zoo with animals that make different sounds (inheritance!)
      - An online shop with a cart, products and discounts
      - A school timetable that detects clashes
    requirements:
      - text: "A `class` with private data and public member functions"
        code: "\\bclass\\s+\\w+[^;{]*\\{[\\s\\S]*\\b(private|public)\\s*:"
      - text: "Inheritance or a `virtual` function"
        code: "\\b(class|struct)\\s+\\w+\\s*:\\s*(public|protected|private)\\s+\\w+|\\bvirtual\\b"
      - text: "A standard algorithm or a lambda (`std::sort`, `std::find_if`, `[&](…) { … }`…)"
        code: "std::(sort|stable_sort|find|find_if|count_if|accumulate|transform|for_each|any_of|all_of|max_element|min_element|remove_if)\\b|\\[[^\\]\\n]*\\]\\s*\\([^)]*\\)\\s*(->\\s*[\\w:<>]+\\s*)?\\{"
      - text: "Passes objects by `const` reference"
        code: "\\bconst\\s+[\\w:<>,\\s]+&\\s*\\w+"
      - text: "Handles errors with exceptions: `throw` and `try`/`catch`"
        code: "\\bthrow\\b[\\s\\S]*\\btry\\s*\\{|\\btry\\s*\\{[\\s\\S]*\\bthrow\\b"
      - text: "It prints something"
        output: "\\S"
    starter: |
      #include <iostream>

      int main() {
          // Your system
          return 0;
      }
    example: |
      #include <algorithm>
      #include <iostream>
      #include <memory>
      #include <stdexcept>
      #include <string>
      #include <vector>

      class Animal {
      public:
          explicit Animal(std::string name) : name_(std::move(name)) {}
          virtual ~Animal() = default;
          const std::string& name() const { return name_; }
          virtual std::string sound() const = 0;

      private:
          std::string name_;
      };

      class Lion : public Animal {
      public:
          using Animal::Animal;
          std::string sound() const override { return "Roar"; }
      };

      class Parrot : public Animal {
      public:
          using Animal::Animal;
          std::string sound() const override { return "Hello!"; }
      };

      class Zoo {
      public:
          void add(std::unique_ptr<Animal> animal) { animals_.push_back(std::move(animal)); }

          const Animal& find(const std::string& name) const {
              auto it = std::find_if(animals_.begin(), animals_.end(),
                                     [&](const std::unique_ptr<Animal>& a) { return a->name() == name; });
              if (it == animals_.end()) {
                  throw std::out_of_range("No animal called " + name);
              }
              return **it;
          }

          void tour() const {
              for (const auto& a : animals_) {
                  std::cout << a->name() << " says " << a->sound() << "\n";
              }
          }

      private:
          std::vector<std::unique_ptr<Animal>> animals_;
      };

      int main() {
          Zoo zoo;
          zoo.add(std::make_unique<Lion>("Leo"));
          zoo.add(std::make_unique<Parrot>("Polly"));
          zoo.tour();
          try {
              std::cout << zoo.find("Polly").sound() << "\n";
              zoo.find("Nemo");
          } catch (const std::out_of_range& e) {
              std::cout << "Oops: " << e.what() << "\n";
          }
          return 0;
      }

  - type: lesson
    id: c19-next
    title: Where to go from here
    minutes: 15
    objectives:
      - Plan your next steps in C++
      - Know the best resources for continued learning
      - Build the habits that turn knowledge into mastery
    body: |
      If you've worked through this course, stop for a moment and look back:
      you started not knowing what a program was. Now you can design classes,
      manage resources safely, use the standard library fluently, write
      generic code, reason about complexity and build a 300-line program
      from a specification. That's real.

      **Mastery comes from what you do next.** Knowledge fades without use;
      skill grows with deliberate practice. Here is a map.

      ## 1. Keep your skills alive

      - Keep doing your **Review** here — a few minutes a day keeps everything you've learned.
      - Solve a small problem most days: **Exercism** (C++ track, with human mentoring), **LeetCode** or **Codewars** for algorithmic practice, **Advent of Code** every December, **Project Euler** for maths lovers, **Codeforces** if you like competition.

      ## 2. Build things

      Projects teach what exercises can't: design, debugging at scale,
      finishing. Pick something you *want* to exist:

      - **A game** with **raylib** or **SFML** — Snake, Tetris, Breakout, a platformer.
      - **A command-line tool** you'd actually use: a to-do manager, a file renamer, a budget tracker.
      - **An emulator** — CHIP-8 is the classic first one: a whole computer in a few hundred lines.
      - **A ray tracer** — *Ray Tracing in One Weekend* (free online) walks you through it; you'll render real 3D images.
      - **A language** — extend the calculator challenge into a tiny scripting language (*Crafting Interpreters*, free online).

      ## 3. Read

      - **cppreference.com** — the reference for every standard library feature. Get used to reading it.
      - **learncpp.com** — a thorough free tutorial; great for filling any gaps.
      - Bjarne Stroustrup, *A Tour of C++* — modern C++ in 250 pages, by its creator. *Programming: Principles and Practice Using C++* goes deeper.
      - Scott Meyers, *Effective Modern C++* — 42 specific ways to write better modern C++.
      - The **C++ Core Guidelines** — the reference for good style and safety.
      - Talks from **CppCon** on YouTube — especially the "Back to Basics" track.

      ## 4. What this course didn't cover

      C++ is huge. Topics to explore next, roughly in order of usefulness:

      - **Ranges** (`std::ranges::sort(v)`, views like `std::views::filter`) — the modern way to use algorithms.
      - **Concurrency**: `std::thread`, `std::mutex`, `std::atomic`, `std::async` — using all your CPU's cores.
      - **`std::variant`, `std::span`, `std::string_view`, `std::format`/`std::print`** — modern vocabulary types and formatting.
      - **Build tools**: CMake in depth, package managers (vcpkg, Conan), unit test frameworks (GoogleTest, Catch2).
      - **Performance**: profiling, caches and memory layout, move semantics in depth.
      - **Modules** and **coroutines** (C++20) — newer language features you'll meet in modern code.

      ## 5. The habits of people who get really good

      - **Code a little every day** rather than a lot once a week.
      - **Read other people's code** — open-source projects on GitHub — and ask why it's written that way.
      - **Explain things**: write notes, help someone else learn, answer questions. Teaching is the best test of understanding.
      - **Get feedback**: code reviews, mentors (Exercism), communities.
      - **Stay curious about the machine**: compile tiny functions on Compiler Explorer (godbolt.org) and look at what the compiler makes of them.

      > [!tip]
      > Your progress, notes and code here are saved. Use the **Playground**
      > whenever you want to try something, and the **Glossary** when a term
      > slips your mind. Come back to any chapter's exam in a few months: if
      > you can still pass it, you've truly learned it.

      Thank you for learning with this course — and welcome to C++.
    cards:
      - front: Name three ways to keep practising C++ after the course.
        back: Daily small problems (Exercism, LeetCode, Advent of Code), building projects you care about, and daily spaced review.
      - front: What is cppreference.com?
        back: The standard reference for the C++ language and standard library.
