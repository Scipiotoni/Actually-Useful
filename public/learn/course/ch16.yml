  - type: challenge
    id: c16-ch-ring
    title: A ring buffer template
    difficulty: 3
    tags: [class templates, non-type parameters]
    prompt: |
      A **ring buffer** keeps the last `N` values pushed: once full, each new
      value overwrites the oldest. Write `template <typename T, int N> class RingBuffer`:

      - `void push(const T& v)`
      - `int size() const` — how many values it holds (at most N)
      - `T at(int i) const` — the i-th oldest value held (0 = oldest)
      - `std::vector<T> items() const` — all held values, oldest first

      Use a fixed `std::array<T, N>` (or C array) for storage — no vectors
      inside the class.
    starter: |
      #include <array>
      #include <vector>

      template <typename T, int N>
      class RingBuffer {
      public:
          void push(const T& v) {
          }

          int size() const { return 0; }

          T at(int i) const { return T{}; }

          std::vector<T> items() const { return {}; }

      private:
          std::array<T, N> data_{};
          int start_{0};
          int count_{0};
      };
    harness: |
      RingBuffer<int, 3> r{};
      CHECK(r.size(), 0);
      r.push(1);
      r.push(2);
      CHECK(r.items(), (std::vector<int>{1, 2}));
      r.push(3);
      r.push(4);
      CHECK(r.size(), 3);
      CHECK(r.items(), (std::vector<int>{2, 3, 4}));
      CHECK(r.at(0), 2);
      r.push(5);
      r.push(6);
      r.push(7);
      CHECK(r.items(), (std::vector<int>{5, 6, 7}));
      RingBuffer<std::string, 2> s{};
      s.push("a");
      s.push("b");
      s.push("c");
      CHECK(s.items(), (std::vector<std::string>{"b", "c"}));
    hints:
      - "Keep `start_` (index of the oldest) and `count_`. The i-th oldest is at `(start_ + i) % N`."
      - "`push`: if not full, write at `(start_ + count_) % N` and increase `count_`; if full, overwrite at `start_` and move `start_` forward."
    solution: |
      #include <array>
      #include <vector>

      template <typename T, int N>
      class RingBuffer {
      public:
          void push(const T& v) {
              if (count_ < N) {
                  data_[static_cast<std::size_t>((start_ + count_) % N)] = v;
                  ++count_;
              } else {
                  data_[static_cast<std::size_t>(start_)] = v;
                  start_ = (start_ + 1) % N;
              }
          }

          int size() const { return count_; }

          T at(int i) const { return data_[static_cast<std::size_t>((start_ + i) % N)]; }

          std::vector<T> items() const {
              std::vector<T> out{};
              for (int i{0}; i < count_; ++i) {
                  out.push_back(at(i));
              }
              return out;
          }

      private:
          std::array<T, N> data_{};
          int start_{0};
          int count_{0};
      };
    explain: |
      Ring buffers are everywhere in systems code — audio, logging, network
      queues — precisely because their memory is fixed: no allocation ever
      happens after construction. The capacity being a template parameter
      means it's known at compile time and costs nothing to store.

  - type: challenge
    id: c16-ch-generic-algos
    title: Your own algorithms
    difficulty: 2
    tags: [function templates, iterators]
    prompt: |
      Write two iterator-based function templates, in the style of the
      standard library:

      - `It findFirst(It first, It last, Pred pred)` — iterator to the first element satisfying `pred`, or `last`.
      - `bool isSorted(It first, It last)` — whether the range is in non-decreasing order (use only `<`).
    starter: |
      template <typename It, typename Pred>
      It findFirst(It first, It last, Pred pred) {
          return last;
      }

      template <typename It>
      bool isSorted(It first, It last) {
          return false;
      }
    harness: |
      std::vector<int> v{3, 8, 1, 9};
      auto it = findFirst(v.begin(), v.end(), [](int x) { return x > 5; });
      CHECK(*it, 8);
      CHECK(findFirst(v.begin(), v.end(), [](int x) { return x > 100; }) == v.end(), true);
      CHECK(isSorted(v.begin(), v.end()), false);
      std::vector<std::string> w{"a", "b", "b", "c"};
      CHECK(isSorted(w.begin(), w.end()), true);
      int arr[3]{1, 2, 3};
      CHECK(isSorted(arr, arr + 3), true);
      CHECK(isSorted(arr, arr), true);
    hints:
      - "`isSorted`: walk with two iterators, `prev` and `it`; if `*it < *prev` anywhere, it's not sorted."
    solution: |
      template <typename It, typename Pred>
      It findFirst(It first, It last, Pred pred) {
          for (; first != last; ++first) {
              if (pred(*first)) {
                  return first;
              }
          }
          return last;
      }

      template <typename It>
      bool isSorted(It first, It last) {
          if (first == last) {
              return true;
          }
          It prev = first;
          for (++first; first != last; ++first) {
              if (*first < *prev) {
                  return false;
              }
              prev = first;
          }
          return true;
      }

  - type: challenge
    id: c16-ch-matrix
    title: Compile-time matrix sizes
    difficulty: 3
    tags: [templates, non-type parameters]
    prompt: |
      Write `template <typename T, int R, int C> struct Matrix` holding
      `std::array<std::array<T, C>, R> m{}` (public), and a function template
      `operator*` that multiplies an R×K matrix by a K×C one giving R×C —
      where mismatched sizes are a **compile error** automatically, because
      the shared `K` must match. Also write `transpose`, returning C×R.
    starter: |
      #include <array>

      template <typename T, int R, int C>
      struct Matrix {
          std::array<std::array<T, C>, R> m{};
      };

      // TODO: operator* and transpose
    starter_broken: true
    harness: |
      Matrix<int, 2, 3> a{};
      a.m = {{{1, 2, 3}, {4, 5, 6}}};
      Matrix<int, 3, 2> b{};
      b.m = {{{7, 8}, {9, 10}, {11, 12}}};
      Matrix<int, 2, 2> p = a * b;
      CHECK(p.m[0][0], 58);
      CHECK(p.m[0][1], 64);
      CHECK(p.m[1][0], 139);
      CHECK(p.m[1][1], 154);
      Matrix<int, 3, 2> t = transpose(a);
      CHECK(t.m[2][0], 3);
      CHECK(t.m[0][1], 4);
      Matrix<double, 1, 1> one{};
      one.m[0][0] = 2.5;
      CHECK((one * one).m[0][0], 6.25);
    hints:
      - "`template <typename T, int R, int K, int C> Matrix<T, R, C> operator*(const Matrix<T, R, K>& a, const Matrix<T, K, C>& b)`."
      - "`template <typename T, int R, int C> Matrix<T, C, R> transpose(const Matrix<T, R, C>& a)`."
    solution: |
      #include <array>

      template <typename T, int R, int C>
      struct Matrix {
          std::array<std::array<T, C>, R> m{};
      };

      template <typename T, int R, int K, int C>
      Matrix<T, R, C> operator*(const Matrix<T, R, K>& a, const Matrix<T, K, C>& b) {
          Matrix<T, R, C> out{};
          for (int r{0}; r < R; ++r) {
              for (int c{0}; c < C; ++c) {
                  T sum{};
                  for (int k{0}; k < K; ++k) {
                      sum += a.m[static_cast<std::size_t>(r)][static_cast<std::size_t>(k)] *
                             b.m[static_cast<std::size_t>(k)][static_cast<std::size_t>(c)];
                  }
                  out.m[static_cast<std::size_t>(r)][static_cast<std::size_t>(c)] = sum;
              }
          }
          return out;
      }

      template <typename T, int R, int C>
      Matrix<T, C, R> transpose(const Matrix<T, R, C>& a) {
          Matrix<T, C, R> out{};
          for (int r{0}; r < R; ++r) {
              for (int c{0}; c < C; ++c) {
                  out.m[static_cast<std::size_t>(c)][static_cast<std::size_t>(r)] =
                      a.m[static_cast<std::size_t>(r)][static_cast<std::size_t>(c)];
              }
          }
          return out;
      }
    explain: |
      Compare with Chapter 11's `Matrix`, where a size mismatch was only a
      comment ("assume a.cols() == b.rows()"). Here, multiplying a 2×3 by a
      2×3 matrix simply doesn't compile — the type system catches the bug
      before the program ever runs.

  - type: review
    id: c16-review
    title: "Chapter 16 review"
    body: |
      ## Cheat sheet

      ```cpp static
      template <typename T>
      T larger(const T& a, const T& b) { return a < b ? b : a; }
      larger(3, 7);  larger<double>(3, 4.5);

      template <typename T>
      class Stack { std::vector<T> items_; ... };
      Stack<std::string> s;   std::vector v{1, 2, 3};   // CTAD

      template <typename It, typename Pred>
      int countWhere(It first, It last, Pred pred);

      auto twice = [](const auto& x) { return x + x; };   // generic lambda

      template <typename T, int N> class Fixed { T data_[N]; };
      static_assert(N > 0, "message");
      if constexpr (std::is_integral_v<T>) { } else { }

      template <std::integral T> T gcd(T a, T b);         // C++20 concept
      template <typename T> concept Printable = requires(std::ostream& o, const T& v) { o << v; };
      ```

      ## Key ideas

      - Templates are recipes; the compiler instantiates them per type.
      - A type works with a template if it supports everything the body uses.
      - Different template arguments give different types.
      - Templates are defined in headers.
      - Generic algorithms take iterators and callables as template parameters.
      - Compile-time tools: non-type parameters, `static_assert`, `if constexpr`, type traits.
      - Concepts state requirements and give clear errors.
    questions:
      - type: output
        prompt: "Interleaving: templates, vectors and lambdas."
        code: |
          #include <iostream>
          #include <string>
          #include <vector>

          template <typename T, typename F>
          T reduce(const std::vector<T>& v, T start, F f) {
              for (const auto& x : v) {
                  start = f(start, x);
              }
              return start;
          }

          int main() {
              std::vector<int> n{1, 2, 3, 4};
              std::vector<std::string> w{"a", "b", "c"};
              std::cout << reduce(n, 0, [](int a, int b) { return a + b * b; }) << ' '
                        << reduce(w, std::string{">"}, [](const std::string& a, const std::string& b) { return b + a; })
                        << '\n';
              return 0;
          }
        answer: |
          30 cba>
        why: "Sum of squares: 1 + 4 + 9 + 16 = 30. Prepending each string to the accumulated one reverses them."
      - type: mcq
        prompt: "What happens with `Stack<int> a; Stack<double> b; a = b;`?"
        options:
          - "The doubles are converted to ints"
          - "Compile error — they're different types"
          - "Undefined behaviour"
          - "b becomes empty"
        answer: 1
        why: "Different template arguments produce unrelated types (unless the class provides a conversion)."
      - type: tf
        prompt: "You can put a class template's member function bodies in a `.cpp` file like ordinary classes, and use the template from other files."
        answer: false
        why: "Template definitions must be visible where they're used — normally in headers."

