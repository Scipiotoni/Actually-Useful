        prompt: |
          Write a function template `bool allEqual(const std::vector<T>& v)`
          returning `true` if every element equals the first (and for an empty
          vector), and `std::size_t countDistinct(std::vector<T> v)` returning
          how many different values there are (hint: sort, then count changes).
        starter: |
          #include <algorithm>
          #include <vector>

          template <typename T>
          bool allEqual(const std::vector<T>& v) {
              return false;
          }

          template <typename T>
          std::size_t countDistinct(std::vector<T> v) {
              return 0;
          }
        harness: |
          CHECK(allEqual(std::vector<int>{3, 3, 3}), true);
          CHECK(allEqual(std::vector<int>{3, 4}), false);
          CHECK(allEqual(std::vector<std::string>{}), true);
          CHECK(countDistinct(std::vector<int>{3, 1, 3, 2, 1}), 3);
          CHECK(countDistinct(std::vector<std::string>{"a", "b", "a"}), 2);
          CHECK(countDistinct(std::vector<double>{}), 0);
        solution: |
          #include <algorithm>
          #include <vector>

          template <typename T>
          bool allEqual(const std::vector<T>& v) {
              for (const auto& x : v) {
                  if (!(x == v.front())) {
                      return false;
                  }
              }
              return true;
          }

          template <typename T>
          std::size_t countDistinct(std::vector<T> v) {
              std::sort(v.begin(), v.end());
              return static_cast<std::size_t>(std::unique(v.begin(), v.end()) - v.begin());
          }
