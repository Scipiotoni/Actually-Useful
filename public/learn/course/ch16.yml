id: ch16
number: 16
part: p4
title: Templates and Generic Programming
blurb: Write code once that works for any type — the machinery behind std::vector, std::sort and the whole standard library.
hours: 5
goals:
  - Write function templates, and explain how the compiler deduces their types
  - Write class templates such as a generic container
  - Write generic algorithms over iterators and any callable
  - Use non-type template parameters, `static_assert` and `if constexpr`
  - Constrain templates with C++20 concepts

items:
  - type: lesson
    id: c16-fn-templates
    title: Function templates
    minutes: 22
    objectives:
      - Write a function template with a type parameter
      - Explain template argument deduction, and specify types explicitly
      - Read the error when a type doesn't support what the template needs
    body: |
      Here's a function to find the larger of two `int`s:

      ```cpp static
      int larger(int a, int b) { return a > b ? a : b; }
      ```

      Now you need it for `double`s. And `std::string`s. And `char`s. The body
      is identical every time — only the type changes. Overloading means
      copying the same code again and again. Instead, write a **template**: a
      recipe the compiler uses to generate the function for whatever type you
      need.

      ```cpp
      #include <iostream>
      #include <string>

      template <typename T>
      T larger(T a, T b) {
          return a > b ? a : b;
      }

      int main() {
          std::cout << larger(3, 7) << '\n';
          std::cout << larger(2.5, 1.5) << '\n';
          std::cout << larger(std::string{"pear"}, std::string{"apple"}) << '\n';
          std::cout << larger<double>(3, 4.5) << '\n';
          return 0;
      }
      ```

      ```output
      7
      2.5
      pear
      4.5
      ```

      - `template <typename T>` introduces a **type parameter** named `T` (any name works; `T` is traditional). Inside, `T` stands for "some type".
      - At each call, the compiler **deduces** `T` from the arguments: `larger(3, 7)` makes `T` = `int`, and the compiler generates (*instantiates*) an `int` version.
      - When deduction is ambiguous — `larger(3, 4.5)` has an `int` and a `double` — say which type you want: `larger<double>(3, 4.5)`.

      This is **generic programming**: the same algorithm for any suitable
      type. It's how `std::max`, `std::swap` and `std::sort` work.

      ## What types are "suitable"?

      A template works with any type that supports **what its body uses**.
      `larger` uses `>` — so it works for numbers, strings, characters… but not
      for a type without `>`:

      ```cpp error
      #include <iostream>

      struct Point {
          int x;
          int y;
      };

      template <typename T>
      T larger(T a, T b) {
          return a > b ? a : b;
      }

      int main() {
          Point p = larger(Point{1, 2}, Point{3, 4});
          std::cout << p.x << '\n';
          return 0;
      }
      ```

      The error appears **inside** the template ("no match for operator>"),
      which is why template errors are famous for being long. Read them from
      the line that mentions *your* code ("required from here"). Lesson 16.4
      shows how C++20 concepts make these errors much clearer.

      ## Several type parameters

      ```cpp
      #include <iostream>
      #include <string>

      template <typename K, typename V>
      void printEntry(const K& key, const V& value) {
          std::cout << key << " => " << value << '\n';
      }

      int main() {
          printEntry("pi", 3.14159);
          printEntry(42, std::string{"answer"});
          return 0;
      }
      ```

      ```output
      pi => 3.14159
      42 => answer
      ```

      Note `const K&`: in a template you don't know how big the type is, so
      taking parameters by const reference is the safe default.

      {{check deduce}}

      {{task clamp}}
    checks:
      - id: deduce
        type: output
        code: |
          #include <iostream>
          #include <string>

          template <typename T>
          T twice(const T& x) {
              return x + x;
          }

          int main() {
              std::cout << twice(21) << ' ' << twice(1.25) << ' ' << twice(std::string{"ab"}) << '\n';
              return 0;
          }
        answer: |
          42 2.5 abab
        why: "T is deduced as int, double and std::string — and `+` means addition or concatenation accordingly."
      - id: ambiguous
        type: mcq
        prompt: "`template <typename T> T larger(T a, T b);` — why doesn't `larger(3, 4.5)` compile?"
        options:
          - Templates can't take numbers
          - "T would have to be both `int` and `double`; deduction fails. Write `larger<double>(3, 4.5)`."
          - "`4.5` is too big"
          - It does compile, returning 4
        answer: 1
        why: "Each argument deduces T independently, and they disagree."
    tasks:
      - id: clamp
        title: A generic clamp
        prompt: |
          Write a function template `T clampTo(const T& value, const T& low, const T& high)`
          that returns `low` if `value < low`, `high` if `high < value`, and
          `value` otherwise. Use only `<` so it works for as many types as
          possible.
        starter: |
          template <typename T>
          T clampTo(const T& value, const T& low, const T& high) {
              return value;
          }
        harness: |
          CHECK(clampTo(15, 0, 10), 10);
          CHECK(clampTo(-3, 0, 10), 0);
          CHECK(clampTo(0.5, 0.0, 1.0), 0.5);
          CHECK(clampTo(std::string{"zebra"}, std::string{"apple"}, std::string{"mango"}), "mango");
          CHECK(clampTo('m', 'a', 'z'), 'm');
        hints:
          - "`if (value < low) return low; if (high < value) return high; return value;`"
        solution: |
          template <typename T>
          T clampTo(const T& value, const T& low, const T& high) {
              if (value < low) {
                  return low;
              }
              if (high < value) {
                  return high;
              }
              return value;
          }
    cards:
      - front: What is a **function template**?
        back: A recipe for a family of functions, parameterised by type (`template <typename T>`), from which the compiler generates the version each call needs.
      - front: What is **template argument deduction**?
        back: The compiler working out the template parameters from the call's arguments, e.g. `larger(3, 7)` → T = int.
      - front: What must a type support to be used with a template?
        back: Every operation the template's body uses on it (e.g. `>` or `+`). Otherwise the instantiation fails to compile.

  - type: lesson
    id: c16-class-templates
    title: Class templates
    minutes: 22
    objectives:
      - Write a class template with a type parameter
      - Use class templates with explicit and deduced arguments
      - Explain why `std::vector<int>` and `std::vector<std::string>` are different types
    body: |
      Classes can be templates too. You've used many: `std::vector<T>`,
      `std::map<K, V>`, `std::unique_ptr<T>`. Here's a small container of your
      own:

      ```cpp
      #include <iostream>
      #include <stdexcept>
      #include <string>
      #include <vector>

      template <typename T>
      class Stack {
      public:
          void push(const T& value) { items_.push_back(value); }

          T pop() {
              if (items_.empty()) {
                  throw std::out_of_range{"pop on empty stack"};
              }
              T top = items_.back();
              items_.pop_back();
              return top;
          }

          bool empty() const { return items_.empty(); }
          std::size_t size() const { return items_.size(); }

      private:
          std::vector<T> items_{};
      };

      int main() {
          Stack<int> numbers{};
          numbers.push(1);
          numbers.push(2);
          std::cout << numbers.pop() << numbers.pop() << '\n';

          Stack<std::string> words{};
          words.push("generic");
          words.push("is");
          std::cout << words.pop() << ' ' << words.size() << '\n';
          return 0;
      }
      ```

      ```output
      21
      is 1
      ```

      - `template <typename T> class Stack` — inside the class, `T` is the element type.
      - `Stack<int>` and `Stack<std::string>` are **two different classes**, each generated from the template. A function taking a `Stack<int>&` won't accept a `Stack<std::string>`.
      - Member functions defined inside the class body are templates automatically. (Defined outside, they need the `template <typename T>` header again, and `Stack<T>::pop` — you'll see that in library code.)

      ## Class template argument deduction

      Since C++17 the compiler can often deduce a class template's arguments
      from the constructor, as with functions:

      ```cpp
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      int main() {
          std::vector v{1, 2, 3};                   // std::vector<int>
          std::pair p{std::string{"Ada"}, 36};      // std::pair<std::string, int>
          std::cout << v.size() << ' ' << p.first << ' ' << p.second << '\n';
          return 0;
      }
      ```

      ```output
      3 Ada 36
      ```

      Handy — but when the type isn't obvious from the values, write it out.

      ## Templates live in headers

      The compiler must see a template's **full definition** wherever it's
      used, to generate code for new types. That's why templates are written
      entirely in header files (Chapter 17), unlike ordinary functions whose
      bodies go in `.cpp` files.

      {{check class-template}}

      {{task pair}}
    checks:
      - id: class-template
        type: output
        code: |
          #include <iostream>

          template <typename T>
          class Box {
          public:
              explicit Box(const T& v) : value_{v} {}
              T get() const { return value_; }
              template <typename F>
              Box<T> map(F f) const { return Box<T>{f(value_)}; }
          private:
              T value_;
          };

          int main() {
              Box<int> b{5};
              auto c = b.map([](int x) { return x * 3; }).map([](int x) { return x + 1; });
              std::cout << b.get() << ' ' << c.get() << '\n';
              return 0;
          }
        answer: |
          5 16
        why: "`map` returns a new Box: 5 × 3 = 15, + 1 = 16. The original is unchanged."
      - id: types-differ
        type: tf
        prompt: "`Stack<int>` and `Stack<double>` are the same type."
        answer: false
        why: "Each set of template arguments generates a separate class."
    tasks:
      - id: pair
        title: A generic pair of values
        prompt: |
          Write a class template `MinMax<T>` that tracks the smallest and
          largest values it has seen:

          - `void add(const T& v)`
          - `bool empty() const`
          - `const T& min() const` and `const T& max() const` (only called when not empty)
        starter: |
          template <typename T>
          class MinMax {
          public:
              void add(const T& v) {
              }

              bool empty() const { return true; }
              const T& min() const { return min_; }
              const T& max() const { return max_; }

          private:
              T min_{};
              T max_{};
              bool any_{false};
          };
        harness: |
          MinMax<int> m{};
          CHECK(m.empty(), true);
          m.add(5);
          m.add(-2);
          m.add(9);
          CHECK(m.empty(), false);
          CHECK(m.min(), -2);
          CHECK(m.max(), 9);
          MinMax<std::string> w{};
          w.add("pear");
          w.add("apple");
          w.add("zucchini");
          CHECK(w.min(), "apple");
          CHECK(w.max(), "zucchini");
        hints:
          - "On the first `add`, set both `min_` and `max_` to `v`; afterwards compare with `<`."
        solution: |
          template <typename T>
          class MinMax {
          public:
              void add(const T& v) {
                  if (!any_) {
                      min_ = v;
                      max_ = v;
                      any_ = true;
                      return;
                  }
                  if (v < min_) {
                      min_ = v;
                  }
                  if (max_ < v) {
                      max_ = v;
                  }
              }

              bool empty() const { return !any_; }
              const T& min() const { return min_; }
              const T& max() const { return max_; }

          private:
              T min_{};
              T max_{};
              bool any_{false};
          };
    cards:
      - front: What is a **class template**?
        back: A recipe for a family of classes parameterised by types, like `template <typename T> class Stack`; `Stack<int>` is one class generated from it.
      - front: What is **class template argument deduction** (CTAD)?
        back: "C++17 feature: the compiler deduces a class template's arguments from the constructor, e.g. `std::vector v{1, 2, 3};`."
      - front: Why are templates written in header files?
        back: The compiler needs the full definition wherever the template is used, to generate code for each new type.

  - type: quiz
    id: c16-quiz1
    title: "Quiz: templates"
    questions:
      - type: output
        code: |
          #include <iostream>

          template <typename T>
          void show(const T& x) {
              std::cout << '[' << x << ']';
          }

          int main() {
              show(1);
              show('a');
              show("hi");
              show(2.5);
              std::cout << '\n';
              return 0;
          }
        answer: |
          [1][a][hi][2.5]
        why: "One template, four instantiations."
      - type: mcq
        prompt: "`template <typename T> T sum(const std::vector<T>& v)` is called with a `std::vector<double>`. What is T?"
        options:
          - "`std::vector<double>`"
          - "`double`"
          - "`int`"
          - It can't be deduced
        answer: 1
        why: "The parameter pattern `std::vector<T>` matches `std::vector<double>`, so T = double."
      - type: tf
        prompt: "A template function can be used with any type at all."
        answer: false
        why: "Only with types that support every operation the template's body uses."
      - type: output
        code: |
          #include <iostream>

          template <typename T>
          T accumulateAll(const T* first, const T* last, T start) {
              for (const T* p = first; p != last; ++p) {
                  start = start + *p;
              }
              return start;
          }

          int main() {
              int a[3]{1, 2, 3};
              double b[2]{0.5, 0.25};
              std::cout << accumulateAll(a, a + 3, 10) << ' ' << accumulateAll(b, b + 2, 0.0) << '\n';
              return 0;
          }
        answer: |
          16 0.75
        why: "10 + 1 + 2 + 3 = 16 and 0.0 + 0.5 + 0.25 = 0.75."

  - type: lesson
    id: c16-generic
    title: Writing generic algorithms
    minutes: 24
    objectives:
      - Write algorithms over any iterator range
      - Accept any callable as a template parameter
      - Use generic lambdas and `auto` parameters
      - Use non-type template parameters, `static_assert` and `if constexpr`
    body: |
      The standard algorithms are templates over **iterators**: they don't
      care whether the range is a vector, a list or an array, only that they
      can move through it with `++`, compare with `!=` and read with `*`.
      You can write your own in the same style:

      ```cpp
      #include <iostream>
      #include <list>
      #include <string>
      #include <vector>

      template <typename It, typename Pred>
      int countWhere(It first, It last, Pred pred) {
          int n{0};
          for (It it = first; it != last; ++it) {
              if (pred(*it)) {
                  ++n;
              }
          }
          return n;
      }

      int main() {
          std::vector<int> v{3, 8, 12, 5};
          std::list<std::string> words{"cat", "horse", "ox"};
          std::cout << countWhere(v.begin(), v.end(), [](int x) { return x > 4; }) << ' '
                    << countWhere(words.begin(), words.end(), [](const std::string& w) { return w.size() < 4; })
                    << '\n';
          return 0;
      }
      ```

      ```output
      3 2
      ```

      Taking the callable as a template parameter (`Pred pred`) instead of a
      `std::function` lets the compiler inline the call — it's how `std::sort`
      can be faster with a lambda than C's `qsort` with a function pointer.

      ## Generic lambdas

      A lambda with an `auto` parameter is a template in disguise — it works
      for any type:

      ```cpp
      #include <iostream>
      #include <string>

      int main() {
          auto describe = [](const auto& x) { return x + x; };
          std::cout << describe(4) << ' ' << describe(std::string{"ha"}) << '\n';
          return 0;
      }
      ```

      ```output
      8 haha
      ```

      (C++20 allows `auto` parameters on ordinary functions too — an
      *abbreviated function template*.)

      ## Values as template parameters

      A template parameter can also be a **compile-time value**, like the size
      in `std::array<int, 5>`:

      ```cpp
      #include <iostream>

      template <typename T, int N>
      class FixedStack {
      public:
          static_assert(N > 0, "FixedStack needs room for at least one element");

          bool push(const T& v) {
              if (count_ == N) {
                  return false;
              }
              data_[count_++] = v;
              return true;
          }
          int size() const { return count_; }
          static constexpr int capacity() { return N; }

      private:
          T data_[N]{};
          int count_{0};
      };

      int main() {
          FixedStack<char, 2> s{};
          std::cout << s.push('a') << s.push('b') << s.push('c') << ' ' << s.size() << '/'
                    << FixedStack<char, 2>::capacity() << '\n';
          return 0;
      }
      ```

      ```output
      110 2/2
      ```

      **`static_assert(condition, message)`** checks a condition **at compile
      time** — `FixedStack<int, 0>` would fail to compile with that message.

      ## `if constexpr`

      Inside a template, `if constexpr` chooses code **at compile time**, based
      on the type. The branch not taken isn't even compiled for that type:

      ```cpp
      #include <iostream>
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string describe(const T& value) {
          if constexpr (std::is_integral_v<T>) {
              return "integer " + std::to_string(value);
          } else if constexpr (std::is_floating_point_v<T>) {
              return "decimal " + std::to_string(value);
          } else {
              return "something else";
          }
      }

      int main() {
          std::cout << describe(42) << " / " << describe(1.5) << " / " << describe("text") << '\n';
          return 0;
      }
      ```

      ```output
      integer 42 / decimal 1.500000 / something else
      ```

      `std::is_integral_v<T>` and friends come from `<type_traits>` — questions
      you can ask about types at compile time.

      {{check generic-output}}

      {{task transform-all}}
    checks:
      - id: generic-output
        type: output
        code: |
          #include <iostream>
          #include <vector>

          template <typename It, typename F>
          void applyAll(It first, It last, F f) {
              for (; first != last; ++first) {
                  *first = f(*first);
              }
          }

          int main() {
              std::vector<int> v{1, 2, 3};
              int calls{0};
              applyAll(v.begin(), v.end(), [&calls](int x) { ++calls; return x * x; });
              std::cout << v[0] << v[1] << v[2] << ' ' << calls << '\n';
              return 0;
          }
        answer: |
          149 3
        why: "Each element is replaced by its square; the lambda (capturing `calls` by reference) runs three times."
      - id: static-assert
        type: mcq
        prompt: "When does `static_assert(sizeof(T) <= 8, \"too big\");` report a problem?"
        options:
          - When the program runs
          - When the template is instantiated with a type larger than 8 bytes — at compile time
          - Never
          - Only in debug builds
        answer: 1
        why: "static_assert is checked by the compiler."
    tasks:
      - id: transform-all
        title: A generic map function
        prompt: |
          Write a function template `mapped(const std::vector<T>& v, F f)` that
          returns a new `std::vector` of the results of `f` applied to each
          element. The result's element type is **whatever `f` returns** — not
          necessarily `T` — so the starter's `std::vector<T>` is wrong and the
          checks won't even compile until you fix it. The hints show the tool
          you need.
        starter: |
          #include <vector>

          template <typename T, typename F>
          auto mapped(const std::vector<T>& v, F f) {
              std::vector<T> out{};
              return out;
          }
        starter_broken: true
        harness: |
          std::vector<int> nums{1, 2, 3};
          CHECK(mapped(nums, [](int x) { return x * 10; }), (std::vector<int>{10, 20, 30}));
          CHECK(mapped(nums, [](int x) { return x / 2.0; }), (std::vector<double>{0.5, 1.0, 1.5}));
          CHECK(mapped(nums, [](int x) { return std::string(static_cast<std::size_t>(x), '*'); }),
                (std::vector<std::string>{"*", "**", "***"}));
          CHECK(mapped(std::vector<int>{}, [](int x) { return x; }).size(), 0);
        hints:
          - "The result type is `std::vector<decltype(f(v[0]))>` — `decltype` gives the type of an expression without running it."
          - "Declare `std::vector<decltype(f(v[0]))> out{};`, loop with `out.push_back(f(x));`, return `out`. (`auto` as the return type deduces the rest.)"
        solution: |
          #include <vector>

          template <typename T, typename F>
          auto mapped(const std::vector<T>& v, F f) {
              std::vector<decltype(f(v[0]))> out{};
              for (const auto& x : v) {
                  out.push_back(f(x));
              }
              return out;
          }
        explain: |
          `decltype(expression)` is the type the expression *would* have — it's
          never evaluated, so using `v[0]` is safe even for an empty vector.
          With `auto` as the return type, the compiler deduces it from `return out;`.
    cards:
      - front: How do standard algorithms work on any container?
        back: They're templates over iterator types — they only need `++`, `!=` and `*` on the iterators.
      - front: What is a **generic lambda**?
        back: "A lambda with `auto` parameters: `[](const auto& x) { ... }` — effectively a template."
      - front: What does `static_assert(cond, msg)` do?
        back: Checks `cond` at compile time and stops compilation with `msg` if it's false.
      - front: What does `if constexpr` do?
        back: Chooses a branch at compile time based on a constant condition (often a type trait); the other branch isn't compiled.

  - type: lesson
    id: c16-concepts
    title: Concepts (C++20)
    minutes: 18
    objectives:
      - Constrain a template with a standard concept
      - Write a simple concept of your own with `requires`
      - Explain how concepts improve error messages
    body: |
      A template's requirements ("T must support `<`") have always been
      **implicit** — written nowhere but the body. Break them and you get a
      page of errors from deep inside the template. **C++20 concepts** make
      requirements part of the template's declaration.

      > [!note]
      > This lesson uses C++20. The compiler in this course supports it; on
      > your own computer you may need to add `-std=c++20`.

      ## Using standard concepts

      `<concepts>` provides ready-made ones: `std::integral`,
      `std::floating_point`, `std::totally_ordered`, `std::same_as`, …

      ```cpp cpp20
      #include <concepts>
      #include <iostream>

      template <std::integral T>
      T gcd(T a, T b) {
          while (b != 0) {
              T r = a % b;
              a = b;
              b = r;
          }
          return a;
      }

      int main() {
          std::cout << gcd(84, 36) << ' ' << gcd(10LL, 4LL) << '\n';
          return 0;
      }
      ```

      ```output
      12 2
      ```

      `template <std::integral T>` means "T must be an integer type". Calling
      `gcd(2.5, 1.5)` now fails at the **call**, with a short message saying
      the constraint `std::integral<double>` isn't satisfied — instead of an
      error about `%` inside the body.

      ## Writing a concept

      A concept is a named, compile-time `bool` about types. A `requires`
      expression lists operations that must compile:

      ```cpp cpp20
      #include <iostream>
      #include <string>

      template <typename T>
      concept Printable = requires(std::ostream& out, const T& value) {
          out << value;
      };

      template <Printable T>
      void printTwice(const T& value) {
          std::cout << value << ' ' << value << '\n';
      }

      struct Secret {};

      int main() {
          printTwice(7);
          printTwice(std::string{"echo"});
          std::cout << Printable<int> << Printable<Secret> << '\n';
          return 0;
      }
      ```

      ```output
      7 7
      echo echo
      10
      ```

      `Printable<Secret>` is `false` — calling `printTwice(Secret{})` wouldn't
      compile, with an error that names the unmet concept.

      ## `requires` clauses and `auto`

      Constraints can also be written as a `requires` clause, and combined:

      ```cpp static
      template <typename T>
          requires std::integral<T> || std::floating_point<T>
      T half(T x) { return x / 2; }

      void log(const std::totally_ordered auto& x);   // abbreviated form
      ```

      Concepts don't change what code *can* do — they document intent and
      turn baffling errors into clear ones. They're one of the biggest
      quality-of-life improvements in modern C++.

      {{check concept}}
