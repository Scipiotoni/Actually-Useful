      - type: code
        prompt: |
          Write `class Playlist`:

          - `constructor(name)` sets `name` and an empty `songs` array
          - `add(title, seconds)` adds `{ title, seconds }` and returns `this` (so calls can be chained)
          - getter `duration` — total seconds
          - `longest()` — the title of the longest song, or `null` if empty
        starter: |
          class Playlist {
          }
        solution: |
          class Playlist {
            constructor(name) {
              this.name = name;
              this.songs = [];
            }

            add(title, seconds) {
              this.songs.push({ title, seconds });
              return this;
            }

            get duration() {
              return this.songs.reduce((sum, s) => sum + s.seconds, 0);
            }

            longest() {
              if (this.songs.length === 0) {
                return null;
              }
              let best = this.songs[0];
              for (const s of this.songs) {
                if (s.seconds > best.seconds) {
                  best = s;
                }
              }
              return best.title;
            }
          }
        harness: |
          const p = new Playlist('Road trip');
          check(p.longest(), null);
          check(p.duration, 0);
          p.add('Intro', 60).add('Epic', 420).add('Outro', 90);
          check(p.songs.length, 3);
          check(p.duration, 570);
          check(p.longest(), 'Epic');
          check(p.name, 'Road trip');
