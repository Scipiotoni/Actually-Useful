        why: "`=>`."
      - type: code
        prompt: |
          Write `clamp(value, min = 0, max = 100)`: returns `min` if value is
          below it, `max` if above it, otherwise the value. Also write
          `percent(part, whole)`: `part / whole * 100`, rounded to a whole
          number and **clamped** to 0–100 using `clamp`.
        starter: |
          function clamp(value, min, max) {
          }

          function percent(part, whole) {
          }
        solution: |
          function clamp(value, min = 0, max = 100) {
            if (value < min) {
              return min;
            }
            if (value > max) {
              return max;
            }
            return value;
          }

          function percent(part, whole) {
            return clamp(Math.round(part / whole * 100));
          }
        harness: |
          check(clamp(50), 50);
          check(clamp(-5), 0);
          check(clamp(150), 100);
          check(clamp(5, 10, 20), 10);
          check(percent(1, 3), 33);
          check(percent(5, 4), 100);
          check(percent(0, 9), 0);
