  - type: challenge
    id: js7-ch-words
    title: Word statistics
    difficulty: 2
    tags: [strings, arrays]
    prompt: |
      For a sentence (words separated by single spaces, maybe with spaces
      at the ends):

      - `wordCount(text)` — how many words (`0` for an empty or blank text)
      - `longestWord(text)` — the longest word (the first one if there's a tie), or `''` for a blank text
      - `acronym(text)` — the first letter of each word, in capitals: `'as soon as possible'` → `'ASAP'`
    starter: |
      function wordCount(text) {
      }

      function longestWord(text) {
      }

      function acronym(text) {
      }
    solution: |
      function words(text) {
        const trimmed = text.trim();
        return trimmed === '' ? [] : trimmed.split(' ');
      }

      function wordCount(text) {
        return words(text).length;
      }

      function longestWord(text) {
        let best = '';
        for (const w of words(text)) {
          if (w.length > best.length) {
            best = w;
          }
        }
        return best;
      }

      function acronym(text) {
        return words(text).map((w) => w[0].toUpperCase()).join('');
      }
    harness: |
      check(wordCount('the cat sat'), 3);
      check(wordCount('  hello  '), 1);
      check(wordCount('   '), 0);
      check(wordCount(''), 0);
      check(longestWord('a bee sees everything'), 'everything');
      check(longestWord('one two six'), 'one');
      check(longestWord(''), '');
      check(acronym('as soon as possible'), 'ASAP');
      check(acronym(' portable network graphics '), 'PNG');
    hints:
      - "A helper `words(text)` that trims and splits (returning `[]` for a blank text) makes all three easy."
      - "`''.split(' ')` is `['']` — one empty word — which is why the blank case needs care."

  - type: challenge
    id: js7-ch-mask
    title: Hide the card number
    difficulty: 2
    tags: [strings]
    prompt: |
      `maskCard(number)` takes a card number that may contain spaces, and
      returns it without spaces, with every digit **except the last four**
      replaced by `*`:

      `maskCard('4539 1488 0343 6467')` → `'************6467'`

      Numbers of 4 digits or fewer are returned unchanged (without spaces).
    starter: |
      function maskCard(number) {
      }
    solution: |
      function maskCard(number) {
        const digits = number.replaceAll(' ', '');
        if (digits.length <= 4) {
          return digits;
        }
        return '*'.repeat(digits.length - 4) + digits.slice(-4);
      }
    harness: |
      check(maskCard('4539 1488 0343 6467'), '************6467');
      check(maskCard('12345'), '*2345');
      check(maskCard('1234'), '1234');
      check(maskCard('12'), '12');
    hints:
      - "Remove spaces first with `replaceAll(' ', '')`."
      - "`'*'.repeat(length - 4) + digits.slice(-4)`"

  - type: review
    id: js7-review
    title: "Chapter 7 review"
    body: |
      ## Cheat sheet

      ```js static
      s.includes('x')  s.startsWith('x')  s.endsWith('x')
      s.indexOf('x')   s.lastIndexOf('x')          // -1 if missing
      s.slice(0, 3)    s.slice(-2)    s.at(-1)
      s.trim()  s.toUpperCase()  s.toLowerCase()
      s.replace('a', 'b')  s.replaceAll('a', 'b')
      s.padStart(2, '0')  s.padEnd(10, '.')  s.repeat(3)
      s.split(' ')  words.join(' ')
      s.split('').reverse().join('')
      s.charCodeAt(0)  String.fromCharCode(97)
      names.sort((a, b) => a.localeCompare(b))
      ```

      ## Key ideas

      - Strings never change; methods return new strings.
      - Searching is case-sensitive — lower-case both sides to ignore case.
      - indexOf + slice cut text at a marker.
      - Clean user input with trim and case changes before comparing.
    questions:
      - type: output
        prompt: What does this print?
        code: |
          const tag = '  #JavaScript ';
          console.log(tag.trim().slice(1).toLowerCase());
        answer: |
          javascript
        why: "Trim, drop the #, lower case."
      - type: mcq
        prompt: "What is `'a,b,,c'.split(',').length`?"
        options:
          - "3"
          - "4"
          - "5"
          - "2"
        answer: 1
        why: "['a', 'b', '', 'c'] — the empty piece counts."

