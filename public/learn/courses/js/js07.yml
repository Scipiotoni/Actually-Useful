      - type: code
        prompt: |
          `titleCase(text)` capitalises the first letter of every word and
          lower-cases the rest: `'hELLO wORLD'` → `'Hello World'`. Words
          are separated by single spaces.
        starter: |
          function titleCase(text) {
          }
        solution: |
          function titleCase(text) {
            return text
              .split(' ')
              .map((w) => (w === '' ? '' : w[0].toUpperCase() + w.slice(1).toLowerCase()))
              .join(' ');
          }
        harness: |
          check(titleCase('hELLO wORLD'), 'Hello World');
          check(titleCase('a tale of two cities'), 'A Tale Of Two Cities');
          check(titleCase('x'), 'X');
