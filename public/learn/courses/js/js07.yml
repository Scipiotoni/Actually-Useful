  - type: lesson
    id: js7-chars
    title: Character by character
    minutes: 20
    objectives:
      - Reverse and compare strings
      - Test for palindromes
      - Use character codes
      - Sort strings properly
    body: |
      Many text problems mean looking at one character at a time.

      ## Reversing

      Strings have no `reverse`, but arrays do: split into characters,
      reverse, join back.

      ```js
      const word = 'stressed';
      console.log(word.split('').reverse().join(''));
      console.log([...'hello'].reverse().join(''));
      ```
      ```output
      desserts
      olleh
      ```

      ## Comparing without caring about case or spaces

      ```js
      function clean(text) {
        return text.toLowerCase().replaceAll(' ', '');
      }

      console.log(clean('Race Car') === clean('racecar'));
      ```
      ```output
      true
      ```

      ## Character codes

      Every character has a number (its **code**). Letters are in order, so
      you can do arithmetic with them:

      ```js
      console.log('a'.charCodeAt(0));
      console.log('b'.charCodeAt(0));
      console.log(String.fromCharCode(97 + 25));
      ```
      ```output
      97
      98
      z
      ```

      ## Sorting words

      Default sorting puts capitals first (`'Zoe'` before `'adam'`).
      `localeCompare` sorts the way people expect — and handles accents:

      ```js
      const names = ['Zoe', 'adam', 'Émile', 'bea'];
      console.log([...names].sort());
      console.log([...names].sort((a, b) => a.localeCompare(b)));
      ```
      ```output
      ['Zoe', 'adam', 'bea', 'Émile']
      ['adam', 'bea', 'Émile', 'Zoe']
      ```

      {{check rev}}

      {{task palindrome}}
    checks:
      - id: rev
        type: output
        prompt: What does this print?
        code: |
          const s = 'abc';
          console.log(s.split(''));
          console.log(s.split('').reverse().join('-'));
        answer: |
          ['a', 'b', 'c']
          c-b-a
        why: "split('') makes an array of characters."
    tasks:
      - id: palindrome
        title: Palindromes and secret codes
        prompt: |
          - `reverse(text)` — the text backwards
          - `isPalindrome(text)` — `true` if the text reads the same backwards, **ignoring case and spaces**: `'Never odd or even'` is one
          - `shift(text, n)` — a Caesar cipher: every lowercase letter a–z moves `n` places along the alphabet, wrapping from z back to a; other characters stay. `shift('abz', 1)` is `'bca'`.
        starter: |
          function reverse(text) {
          }

          function isPalindrome(text) {
          }

          function shift(text, n) {
          }
        solution: |
          function reverse(text) {
            return text.split('').reverse().join('');
          }

          function isPalindrome(text) {
            const cleaned = text.toLowerCase().replaceAll(' ', '');
            return cleaned === reverse(cleaned);
          }

          function shift(text, n) {
            let result = '';
            for (const ch of text) {
              if (ch >= 'a' && ch <= 'z') {
                const index = (ch.charCodeAt(0) - 97 + n) % 26;
                result += String.fromCharCode(97 + index);
              } else {
                result += ch;
              }
            }
            return result;
          }
        harness: |
          check(reverse('hello'), 'olleh');
          check(reverse(''), '');
          check(isPalindrome('Never odd or even'), true);
          check(isPalindrome('racecar'), true);
          check(isPalindrome('hello'), false);
          check(shift('abz', 1), 'bca');
          check(shift('hello, world!', 3), 'khoor, zruog!');
          check(shift('xyz', 26), 'xyz');
        hints:
          - "`isPalindrome` can reuse `reverse` on a cleaned copy."
          - "For a letter: its position is `ch.charCodeAt(0) - 97` (0 for a). Add n, wrap with `% 26`, and turn back with `String.fromCharCode(97 + position)`."
    cards:
      - front: How do you reverse a string?
        back: "`s.split('').reverse().join('')`"
      - front: How do you sort names the way people expect?
        back: "`names.sort((a, b) => a.localeCompare(b))`"
      - front: "What does `'a'.charCodeAt(0)` give?"
        back: 97 — letters have consecutive codes.

