id: js07
number: 7
part: js-p2
title: Working with Text
blurb: Search, slice, clean up and reformat strings — the everyday work of handling names, messages, files and user input.
hours: 2.5
goals:
  - Search text with `includes`, `startsWith`, `endsWith` and `indexOf`
  - Cut text with `slice` and split it into pieces
  - Clean and reformat text with `trim`, `replace`, `padStart` and friends
  - Process text character by character
  - Remember that strings never change — methods return new ones

items:
  - type: lesson
    id: js7-search
    title: Searching and slicing
    minutes: 25
    objectives:
      - Test whether text contains, starts or ends with something
      - Find the position of a piece of text
      - Cut out part of a string with `slice`
    body: |
      ## Searching

      ```js
      const email = 'ada.lovelace@example.com';
      console.log(email.includes('@'));
      console.log(email.startsWith('ada'));
      console.log(email.endsWith('.org'));
      console.log(email.indexOf('@'));
      console.log(email.indexOf('!'));
      console.log(email.lastIndexOf('.'));
      ```
      ```output
      true
      true
      false
      12
      -1
      20
      ```

      All of these are **case-sensitive**: `'Hello'.includes('hello')` is
      `false`. To ignore case, compare lower-case versions:
      `text.toLowerCase().includes(word.toLowerCase())`.

      ## slice

      `slice(start, end)` returns the characters from `start` up to (not
      including) `end`. Leave out `end` to go to the end; negative numbers
      count from the end:

      ```js
      const text = 'JavaScript';
      console.log(text.slice(0, 4));
      console.log(text.slice(4));
      console.log(text.slice(-6));
      console.log(text.at(-1));

      const email = 'ada.lovelace@example.com';
      const at = email.indexOf('@');
      console.log(email.slice(0, at));
      console.log(email.slice(at + 1));
      ```
      ```output
      Java
      Script
      Script
      t
      ada.lovelace
      example.com
      ```

      Finding a position with `indexOf` and cutting with `slice` is a
      pattern you'll use constantly.

      ## Strings never change

      Strings are **immutable**: no method changes a string; they all
      **return a new one**. `name.toUpperCase()` on its own does nothing
      useful — store or use the result: `name = name.toUpperCase()`.

      {{check slice}}

      {{task search}}
    checks:
      - id: slice
        type: output
        prompt: What does this print?
        code: |
          const s = 'sunflower';
          console.log(s.slice(0, 3));
          console.log(s.slice(3));
          console.log(s.slice(-5, -2));
        answer: |
          sun
          flower
          low
        why: "-5 is 'l' (5 from the end), up to -2 ('e', not included)."
    tasks:
      - id: search
        title: File names and questions
        prompt: |
          - `extension(fileName)` — the part after the **last** dot, in lower case: `'Photo.JPG'` → `'jpg'`. Without a dot, return `''`.
          - `baseName(fileName)` — the part before the last dot: `'report.final.pdf'` → `'report.final'`. Without a dot, the whole name.
          - `isQuestion(text)` — `true` if the text, ignoring spaces at the end, ends with `?`
        starter: |
          function extension(fileName) {
          }

          function baseName(fileName) {
          }

          function isQuestion(text) {
          }
        solution: |
          function extension(fileName) {
            const dot = fileName.lastIndexOf('.');
            if (dot === -1) {
              return '';
            }
            return fileName.slice(dot + 1).toLowerCase();
          }

          function baseName(fileName) {
            const dot = fileName.lastIndexOf('.');
            return dot === -1 ? fileName : fileName.slice(0, dot);
          }

          function isQuestion(text) {
            return text.trimEnd().endsWith('?');
          }
        harness: |
          check(extension('Photo.JPG'), 'jpg');
          check(extension('archive.tar.gz'), 'gz');
          check(extension('README'), '');
          check(baseName('report.final.pdf'), 'report.final');
          check(baseName('notes.txt'), 'notes');
          check(baseName('Makefile'), 'Makefile');
          check(isQuestion('Are you coming?'), true);
          check(isQuestion('Yes?  '), true);
          check(isQuestion('I am.'), false);
        hints:
          - "`lastIndexOf('.')` finds the last dot; `-1` means there isn't one."
          - "`fileName.slice(dot + 1)` is after the dot; `fileName.slice(0, dot)` before it."
          - "`text.trimEnd()` removes spaces at the end (`trim()` removes them at both ends)."
    cards:
      - front: How do you get the part of a string before the `@`?
        back: "`s.slice(0, s.indexOf('@'))`"
      - front: "What does `s.slice(-3)` give?"
        back: The last three characters.
      - front: Why does `name.toUpperCase();` on its own do nothing?
        back: Strings are immutable — the method returns a new string, which must be stored or used.

  - type: lesson
    id: js7-change
    title: Cleaning and reformatting
    minutes: 25
    objectives:
      - Remove extra spaces with `trim`
      - Replace text with `replace` and `replaceAll`
      - Pad and repeat strings
      - Capitalise words and build slugs
    body: |
      User input is messy: extra spaces, odd capitals. These methods tidy
      it up:

      ```js
      const raw = '   Hello World   ';
      console.log(`[${raw.trim()}]`);
      console.log('a-b-c'.replace('-', '+'));
      console.log('a-b-c'.replaceAll('-', '+'));
      console.log('7'.padStart(3, '0'));
      console.log('Total'.padEnd(10, '.') + '12 €');
      console.log('ab'.repeat(3));
      ```
      ```output
      [Hello World]
      a+b-c
      a+b+c
      007
      Total.....12 €
      ababab
      ```

      | Method | Does |
      |---|---|
      | `trim()` · `trimStart()` · `trimEnd()` | remove spaces (and tabs, new lines) at the ends |
      | `replace(a, b)` | replace the **first** `a` with `b` |
      | `replaceAll(a, b)` | replace **every** `a` |
      | `padStart(n, c)` · `padEnd(n, c)` | add `c` until the string is `n` long |
      | `repeat(n)` | the string `n` times |
      | `split(sep)` / `join(sep)` | to an array and back |

      ## Common recipes

      ```js
      function capitalize(word) {
        return word[0].toUpperCase() + word.slice(1).toLowerCase();
      }

      function twoDigits(n) {
        return String(n).padStart(2, '0');
      }

      console.log(capitalize('mADRID'));
      console.log(`${twoDigits(9)}:${twoDigits(5)}`);
      console.log('the quick brown fox'.split(' ').map(capitalize).join(' '));
      ```
      ```output
      Madrid
      09:05
      The Quick Brown Fox
      ```

      > [!note]
      > `replace` and `split` also accept **regular expressions** — a small
      > language for patterns. For example `text.replace(/\s+/g, ' ')`
      > turns any run of spaces into one. They're worth learning later;
      > you won't need them in this course.

      {{check replace}}

      {{task tidy}}
    checks:
      - id: replace
        type: output
        prompt: What does this print?
        code: |
          const s = 'one two two';
          console.log(s.replace('two', '2'));
          console.log(s.replaceAll('two', '2'));
          console.log(s);
        answer: |
          one 2 two
          one 2 2
          one two two
        why: "replace changes only the first; the original never changes."
    tasks:
      - id: tidy
        title: Tidy text
        prompt: |
          - `capitalize(word)` — first letter upper case, the rest lower case: `'hELLO'` → `'Hello'`. An empty string stays empty.
          - `slug(title)` — for web addresses: trimmed, lower case, spaces replaced with `-`: `'  My First Post '` → `'my-first-post'`
          - `clock(hours, minutes)` — `'09:05'` style, both parts two digits
        starter: |
          function capitalize(word) {
          }

          function slug(title) {
          }

          function clock(hours, minutes) {
          }
        solution: |
          function capitalize(word) {
            if (word === '') {
              return '';
            }
            return word[0].toUpperCase() + word.slice(1).toLowerCase();
          }

          function slug(title) {
            return title.trim().toLowerCase().replaceAll(' ', '-');
          }

          function clock(hours, minutes) {
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
          }
        harness: |
          check(capitalize('hELLO'), 'Hello');
          check(capitalize('a'), 'A');
          check(capitalize(''), '');
          check(slug('  My First Post '), 'my-first-post');
          check(slug('Hello World Again'), 'hello-world-again');
          check(clock(9, 5), '09:05');
          check(clock(23, 59), '23:59');
          check(clock(0, 0), '00:00');
        hints:
          - "`word[0].toUpperCase() + word.slice(1).toLowerCase()` — check for `''` first."
          - "Chain: `title.trim().toLowerCase().replaceAll(' ', '-')`."
          - "`padStart` works on strings: `String(hours).padStart(2, '0')`."
    cards:
      - front: "`replace` vs `replaceAll`?"
        back: replace changes only the first match; replaceAll every match.
      - front: How do you turn 7 into `'007'`?
        back: "`String(7).padStart(3, '0')`"
      - front: How do you capitalise a word?
        back: "`w[0].toUpperCase() + w.slice(1).toLowerCase()`"

