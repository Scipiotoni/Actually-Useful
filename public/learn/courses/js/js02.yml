id: js02
number: 2
part: js-p1
title: Values and Variables
blurb: Store values in variables, calculate with numbers, build text with strings, and understand JavaScript's types.
hours: 3
goals:
  - Declare variables with `const` and `let`, and name them well
  - Calculate with numbers, operators and `Math`
  - Build strings with `+` and template literals
  - Check and convert types with `typeof`, `Number()` and `String()`

items:
  - type: video
    id: js2-video-variables
    title: "Watch: variables are labelled boxes"
    body: |
      **What you just saw**

      - `let score = 0;` makes a box called `score` holding `0`.
      - `score = score + 10;` reads the box, adds 10, and puts the result back — the old value is gone.
      - `const` makes a box that can never be given a new value; trying stops the program with a `TypeError`.
      - Use `const` by default, and `let` for values that change.
    video:
      steps:
        - scene: Variables
          sub: Names for values
        - type: "let score = 0;\n"
          say: "`let` makes a **variable**: a box with a name, holding a value."
          mark: "let score = 0;"
        - run: true
          line: 1
          vars:
            score: "0"
          say: "Run it: a box called `score` appears, holding `0`."
        - type: "score = score + 10;\n"
          say: "This line **reads** the box, adds 10, and **puts the result back**."
          mark:
            text: "score + 10"
            color: pink
        - line: 2
          vars:
            score: "10"
          say: "Now `score` is **10**. The old 0 is gone."
        - type: "const name = \"Ada\";\n"
          say: "`const` makes a box too — but one that can **never** change."
          mark:
            text: "const"
            color: green
        - line: 3
          vars:
            name: "\"Ada\""
          say: "A second box: `name`, holding the text \"Ada\"."
        - type: "console.log(name + \" has \" + score);\n"
          say: "`console.log` prints. `+` joins text and values together."
          mark: "name + \" has \" + score"
        - line: 4
          print: "Ada has 10"
          say: "The boxes' values go into the sentence: **Ada has 10**."
        - scene: Constant means constant
          sub: const can't be changed
        - type: "name = \"Bob\";\n"
          say: "What if we try to change `name`?"
          mark:
            text: "name = \"Bob\";"
            color: pink
        - line: 5
          print: "✖ TypeError: Assignment to constant variable."
          say: "JavaScript **stops** with an error. A `const` keeps its first value forever."
        - line: 0
          say: "Use `const` by default, and `let` only for values that change — like a score."

  - type: lesson
    id: js2-variables
    title: Variables
    minutes: 20
    objectives:
      - Store a value in a variable and use it
      - Choose between `const` and `let`
      - Name variables following the rules and conventions
    body: |
      A **variable** is a name for a value, so you can use it — and change
      it — later:

      ```js
      const name = 'Ada';
      let score = 10;

      console.log(name);
      console.log(score);

      score = score + 5;
      console.log(score);
      ```
      ```output
      Ada
      10
      15
      ```

      - `const` declares a variable that will **not** be reassigned.
      - `let` declares one that **can** be reassigned later with `=`.
      - `=` means "store this value" — it isn't "equals" in the maths sense. `score = score + 5` means "take score, add 5, store the result back in score".

      **Prefer `const`.** Use `let` only when the value really changes.
      Trying to change a `const` is an error:

      ```js error
      const year = 2026;
      year = 2027;
      ```

      (You'll see `var` in old code — it's the old way to declare variables,
      with some confusing rules. Use `const` and `let`.)

      ## Naming

      - Letters, digits, `_` and `$` — but not starting with a digit. No spaces or hyphens.
      - Case-sensitive: `score` and `Score` are different variables.
      - Some words are reserved: `let`, `const`, `if`, `function`, `class`…
      - The convention is **camelCase**: `firstName`, `totalPrice`, `isLoggedIn`.
      - Choose names that say what the value **means**: `price` beats `p`, `x` or `thing`.

      {{check reassign}}

      {{check names}}

      {{task vars}}
    checks:
      - id: reassign
        type: output
        prompt: What does this print?
        code: |
          let lives = 3;
          lives = lives - 1;
          lives = lives - 1;
          console.log(lives);
        answer: |
          1
        why: "3 − 1 − 1."
      - id: names
        type: mcq
        prompt: Which is a valid variable name?
        options:
          - "`2ndPlace`"
          - "`first-name`"
          - "`totalPrice`"
          - "`let`"
        answer: 2
        why: "No leading digit, no hyphen, and `let` is reserved."
    tasks:
      - id: vars
        title: A player profile
        prompt: |
          - Declare a **constant** `player` with the value `'Sam'`
          - Declare a variable `points` (with `let`) starting at `0`
          - Add `50` to `points`, then add `25` more (reassign it twice)
          - Print `player`, then `points`
        starter: |
          // Declare player and points here
        solution: |
          const player = 'Sam';
          let points = 0;
          points = points + 50;
          points = points + 25;
          console.log(player);
          console.log(points);
        harness: |
          check(player, 'Sam');
          check(points, 75);
          check(printed(), 'Sam\n75');
        hints:
          - "`const player = 'Sam';` and `let points = 0;`"
          - "`points = points + 50;` adds 50 and stores the result back."
    cards:
      - front: "`const` vs `let`?"
        back: const can't be reassigned; let can. Prefer const.
      - front: "What does `x = x + 1` mean?"
        back: Take x's value, add 1, and store the result back in x.
      - front: What naming style do JavaScript variables use?
        back: "camelCase: `totalPrice`, `isOpen`."

  - type: lesson
    id: js2-numbers
    title: Numbers and maths
    minutes: 25
    objectives:
      - Use arithmetic operators, including `%` and `**`
      - Update variables with `+=`, `-=`, `++`
      - Round numbers and use `Math`
      - Know why `0.1 + 0.2` isn't exactly `0.3`
    body: |
      JavaScript has one number type for whole numbers and decimals.

      | Operator | Meaning | Example | Result |
      |---|---|---|---|
      | `+` `-` | add, subtract | `7 - 2` | `5` |
      | `*` `/` | multiply, divide | `7 / 2` | `3.5` |
      | `%` | remainder | `7 % 2` | `1` |
      | `**` | power | `2 ** 3` | `8` |

      Multiplication and division happen before addition and subtraction;
      use brackets to change the order: `(2 + 3) * 4` is `20`.

      `%` (remainder) is surprisingly useful: `n % 2` is `0` for even
      numbers and `1` for odd ones.

      ## Shortcuts

      ```js
      let count = 10;
      count += 5;   // count = count + 5
      count -= 3;   // count = count - 3
      count *= 2;   // count = count * 2
      count++;      // count = count + 1
      console.log(count);
      ```
      ```output
      25
      ```

      ## Math

      The built-in `Math` object has many helpers:

      ```js
      console.log(Math.round(4.6));
      console.log(Math.floor(4.6));
      console.log(Math.ceil(4.1));
      console.log(Math.max(3, 9, 5));
      console.log(Math.sqrt(81));
      console.log((19.987).toFixed(2));
      ```
      ```output
      5
      4
      5
      9
      9
      19.99
      ```

      `Math.random()` gives a random number from 0 up to (not including) 1;
      `Math.floor(Math.random() * 6) + 1` is a dice roll.

      ## A decimal surprise

      ```js
      console.log(0.1 + 0.2);
      ```
      ```output
      0.30000000000000004
      ```

      Computers store decimals in binary, and some (like 0.1) can't be
      stored exactly — the same way 1/3 can't be written exactly as a
      decimal. For money, round when you display (`toFixed(2)`), or count in
      cents.

      Dividing by zero gives `Infinity`, and nonsense maths gives `NaN`
      ("not a number"): `'hello' * 2` is `NaN`.

      {{check order}}

      {{check mod}}

      {{task rect}}
    checks:
      - id: order
        type: output
        prompt: What does this print?
        code: |
          console.log(2 + 3 * 4);
          console.log((2 + 3) * 4);
          console.log(10 % 3);
        answer: |
          14
          20
          1
        why: "Multiplication first; brackets change the order; 10 = 3 × 3 + 1."
      - id: mod
        type: mcq
        prompt: "`n % 2 === 0` is true when n is…"
        options:
          - odd
          - even
          - negative
          - a decimal
        answer: 1
        why: "Even numbers leave no remainder when divided by 2."
    tasks:
      - id: rect
        title: A garden plot
        prompt: |
          A garden is `width` 7.5 metres by `length` 4 metres.

          - declare `width` and `length` as constants
          - `area`: width × length
          - `perimeter`: 2 × (width + length)
          - `fenceCost`: the perimeter × 12.5 euros per metre, rounded to the **nearest whole euro** with `Math.round`
          - print the three values, one per line
        starter: |
          const width = 7.5;
          const length = 4;
        solution: |
          const width = 7.5;
          const length = 4;
          const area = width * length;
          const perimeter = 2 * (width + length);
          const fenceCost = Math.round(perimeter * 12.5);
          console.log(area);
          console.log(perimeter);
          console.log(fenceCost);
        harness: |
          check(area, 30);
          check(perimeter, 23);
          check(fenceCost, 288);
          check(printed(), '30\n23\n288');
        hints:
          - "`const perimeter = 2 * (width + length);` — the brackets matter."
          - "23 × 12.5 = 287.5, which rounds to 288."
    cards:
      - front: "What does `%` do?"
        back: "Gives the remainder of a division: `7 % 3` is 1."
      - front: "`x += 5` means…"
        back: "`x = x + 5`"
      - front: "Why is `0.1 + 0.2` not exactly `0.3`?"
        back: Decimals are stored in binary and some can't be stored exactly. Round when displaying.
      - front: What is `NaN`?
        back: '"Not a Number" — the result of maths that makes no sense, like `"hi" * 2`.'

  - type: quiz
    id: js2-quiz1
    title: "Quiz: variables and numbers"
    questions:
      - type: output
        prompt: What does this print?
        code: |
          let a = 5;
          let b = a;
          a = 10;
          console.log(b);
        answer: |
          5
        why: "b got a copy of the value 5; changing a later doesn't change b."
      - type: mcq
        prompt: "`const total = 0; total = 5;` —"
        options:
          - total is 5
          - "TypeError: Assignment to constant variable"
