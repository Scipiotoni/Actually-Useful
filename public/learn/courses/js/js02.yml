        why: "A const can't be reassigned."
      - type: fill
        prompt: Two to the power of ten.
        code: |
          console.log(2 ___ 10);
        blanks:
          - ["**"]
        output: "1024"
        why: "`**` is the power operator."
      - type: output
        prompt: What does this print?
        code: |
          let n = 7;
          n++;
          n *= 2;
          console.log(n);
        answer: |
          16
        why: "7 → 8 → 16."

  - type: lesson
    id: js2-strings
    title: Strings and template literals
    minutes: 20
    objectives:
      - Join strings with `+`
      - Insert values into text with template literals
      - Get a string's length and change its case
    body: |
      ## Joining strings

      `+` between strings **joins** them (it's called *concatenation*):

      ```js
      const first = 'Grace';
      const last = 'Hopper';
      console.log(first + ' ' + last);
      console.log('Age: ' + 85);
      ```
      ```output
      Grace Hopper
      Age: 85
      ```

      ## Template literals

      Strings in **backticks** can contain `${…}` — any value or expression
      inside is inserted. Much easier to read than lots of `+`:

      ```js
      const item = 'coffee';
      const price = 2.5;
      const cups = 3;
      console.log(`${cups} cups of ${item} cost ${cups * price} euros.`);
      ```
      ```output
      3 cups of coffee cost 7.5 euros.
      ```

      Template literals can also span several lines.

      ## A few string tools

      ```js
      const word = 'JavaScript';
      console.log(word.length);
      console.log(word.toUpperCase());
      console.log(word.toLowerCase());
      console.log(word[0]);
      console.log(word[word.length - 1]);
      ```
      ```output
      10
      JAVASCRIPT
      javascript
      J
      t
      ```

      - `.length` — the number of characters.
      - `word[0]` — the first character. Positions (called **indexes**) start at **0**, so the last one is `length - 1`.
      - `.toUpperCase()`, `.toLowerCase()` — a new string in a different case.

      Chapter 7 covers many more string tools.

      {{check tpl}}

      {{task greeting}}
    checks:
      - id: tpl
        type: output
        prompt: What does this print?
        code: |
          const n = 4;
          console.log(`${n} + ${n} = ${n + n}`);
        answer: |
          4 + 4 = 8
        why: "Each `${…}` is replaced by its value."
    tasks:
      - id: greeting
        title: A badge
        prompt: |
          Given `firstName`, `lastName` and `year`:

          - `fullName` is the first and last name with a space between
          - `badge` is a template literal: `` `ADA LOVELACE (since 1843)` `` — the full name in **upper case**, then the year in brackets
          - `initials` is the first letter of each name: `AL`
          - print `badge`
        starter: |
          const firstName = 'Ada';
          const lastName = 'Lovelace';
          const year = 1843;
        solution: |
          const firstName = 'Ada';
          const lastName = 'Lovelace';
          const year = 1843;
          const fullName = firstName + ' ' + lastName;
          const badge = `${fullName.toUpperCase()} (since ${year})`;
          const initials = firstName[0] + lastName[0];
          console.log(badge);
        harness: |
          check(fullName, 'Ada Lovelace');
          check(badge, 'ADA LOVELACE (since 1843)');
          check(initials, 'AL');
          check(printed(), 'ADA LOVELACE (since 1843)');
        hints:
          - "`const fullName = firstName + ' ' + lastName;`"
          - "`` const badge = `${fullName.toUpperCase()} (since ${year})`; `` and `firstName[0] + lastName[0]`."
    cards:
      - front: What is a template literal?
        back: "A string in backticks where `${expression}` inserts a value: `` `Hi ${name}` ``."
      - front: What is the index of the first character of a string?
        back: 0 — the last is at `length - 1`.
      - front: How do you get a string in capitals?
        back: "`text.toUpperCase()`"

  - type: lesson
    id: js2-types
    title: Types and conversion
    minutes: 20
    objectives:
      - Name JavaScript's basic types and check them with `typeof`
      - Predict what `+` does with strings and numbers
      - Convert between strings and numbers
      - Tell `undefined` from `null`
    body: |
      Every value has a **type**:

      | Type | Examples |
      |---|---|
      | number | `42`, `3.14`, `-1`, `NaN` |
      | string | `'hello'`, `"42"`, `` `hi` `` |
      | boolean | `true`, `false` |
      | undefined | `undefined` — "no value was given" |
      | null | `null` — "intentionally empty" |

      (There are also objects, arrays and functions — later chapters.)

      ```js
      console.log(typeof 42);
      console.log(typeof '42');
      console.log(typeof true);
      let nothing;
      console.log(nothing);
      console.log(typeof nothing);
      ```
      ```output
      number
      string
      boolean
      undefined
      undefined
      ```

      ## The + trap

      `'42'` is text that happens to contain digits. With a string on
      either side, `+` **joins** instead of adding. Other operators convert
      to numbers:

      ```js
      console.log('5' + 3);
      console.log('5' - 3);
      console.log('5' * '2');
      console.log(1 + 2 + '3');
      ```
      ```output
      53
      2
      10
      33
      ```

      (The last one: `1 + 2` is `3` first, then `3 + '3'` joins.)

      ## Converting on purpose

      Text from forms and user input always arrives as a **string**.
      Convert it before doing maths:

      ```js
      const input = '19.5';
      console.log(Number(input) + 1);
      console.log(parseInt('42px'));
      console.log(Number('hello'));
      console.log(String(99) + 1);
      ```
      ```output
      20.5
      42
      NaN
      991
      ```

      - `Number(x)` — the whole string must be a number, or you get `NaN`.
      - `parseInt(x)` / `parseFloat(x)` — read a number from the start of a string.
      - `String(x)` — convert anything to text.
      - `Number.isNaN(x)` checks for `NaN` (it isn't even equal to itself!).

      {{check plus}}

      {{task convert}}
    checks:
      - id: plus
        type: output
        prompt: What does this print?
        code: |
          console.log('10' + 5);
          console.log('10' - 5);
          console.log(Number('10') + 5);
        answer: |
          105
          5
          15
        why: "+ joins when there's a string; - converts; Number() converts on purpose."
    tasks:
      - id: convert
        title: Add up the order
        prompt: |
          The quantities come from a form, so they're strings. Compute:

          - `total`: the **number** of items (`apples` + `pears`) — it must be the number `12`, not the string `'75'`
          - `label`: `` `12 items` `` (use a template literal)
          - `kind`: the result of `typeof total`
        starter: |
          const apples = '7';
          const pears = '5';
        solution: |
          const apples = '7';
          const pears = '5';
          const total = Number(apples) + Number(pears);
          const label = `${total} items`;
          const kind = typeof total;
        harness: |
          check(total, 12);
          check(label, '12 items');
          check(kind, 'number');
        hints:
          - "`'7' + '5'` is `'75'` — convert each first with `Number(…)`."
    cards:
      - front: Name five basic types.
        back: number, string, boolean, undefined, null.
      - front: "What is `'5' + 3`?"
        back: "`'53'` — with a string, + joins."
      - front: How do you turn the string `'42'` into a number?
        back: "`Number('42')` (or `parseInt`, `parseFloat`)."
      - front: "`undefined` vs `null`?"
        back: undefined means no value was given; null means intentionally empty.

