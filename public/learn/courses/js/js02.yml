  - type: challenge
    id: js2-ch-temp
    title: Temperature converter
    difficulty: 1
    tags: [numbers, strings]
    prompt: |
      Convert `celsius` to Fahrenheit: F = C × 9 / 5 + 32.

      - `fahrenheit`: the converted number
      - `message`: `` `21.5°C is 70.7°F` `` — with Fahrenheit shown to **1 decimal place** (`toFixed(1)`)
      - print `message`
    starter: |
      const celsius = 21.5;
    solution: |
      const celsius = 21.5;
      const fahrenheit = celsius * 9 / 5 + 32;
      const message = `${celsius}°C is ${fahrenheit.toFixed(1)}°F`;
      console.log(message);
    harness: |
      check(fahrenheit, 70.7);
      check(message, '21.5°C is 70.7°F');
      check(printed(), '21.5°C is 70.7°F');
    hints:
      - "`const fahrenheit = celsius * 9 / 5 + 32;`"
      - "`fahrenheit.toFixed(1)` gives a string with one decimal."

  - type: challenge
    id: js2-ch-bill
    title: Split the bill
    difficulty: 2
    tags: [numbers, conversion]
    prompt: |
      Friends split a restaurant bill with a tip. The amounts arrive as
      strings from a form:

      - `total`: the bill plus the tip (`tipPercent` percent of the bill), as a number
      - `each`: the total divided by `people`, **rounded to cents** — use `Math.round(x * 100) / 100`
      - `summary`: `Each pays …… euros`, with `each` shown to exactly two decimals (`toFixed(2)`)
    starter: |
      const bill = '81.20';
      const tipPercent = '10';
      const people = '4';
    solution: |
      const bill = '81.20';
      const tipPercent = '10';
      const people = '4';
      const total = Number(bill) * (1 + Number(tipPercent) / 100);
      const each = Math.round(total / Number(people) * 100) / 100;
      const summary = `Each pays ${each.toFixed(2)} euros`;
    harness: |
      check(Math.round(total * 100) / 100, 89.32);
      check(each, 22.33);
      check(summary, 'Each pays 22.33 euros');
    hints:
      - "Convert each string with `Number(…)` first."
      - "The tip is `bill * tipPercent / 100`; the total is bill + tip."

  - type: review
    id: js2-review
    title: "Chapter 2 review"
    body: |
      ## Cheat sheet

      ```js static
      const name = 'Ada';        // can't be reassigned
      let score = 0;             // can
      score += 10; score++;

      7 % 2        // 1 (remainder)
      2 ** 3       // 8
      Math.round(4.5)  Math.floor(4.9)  Math.max(1, 5)  (3.14159).toFixed(2)

      `Hi ${name}, you have ${score} points`
      name.length   name[0]   name.toUpperCase()

      typeof 42           // 'number'
      '5' + 3             // '53'
      Number('5') + 3     // 8
      String(5)           // '5'
      ```

      ## Key ideas

      - Prefer `const`; use `let` when the value changes.
      - `=` stores; it isn't "equals".
      - With a string involved, `+` joins.
      - Form input is text: convert before maths.
      - Round decimals when you display them.
    questions:
      - type: output
        prompt: What does this print?
        code: |
          const price = 4;
          let qty = 3;
          qty += 2;
          console.log(`${qty} × ${price} = ${qty * price}`);
        answer: |
          5 × 4 = 20
        why: "qty becomes 5."
      - type: mcq
        prompt: "Which gives the number 15?"
        options:
          - "`'10' + '5'`"
          - "`Number('10') + Number('5')`"
          - "`'10' + 5`"
          - "`String(10 + 5)`"
        answer: 1
        why: "The others give strings."

  - type: exam
    id: js2-exam
    title: "Chapter 2 exam"
    minutes: 25
    pick: 10
    questions:
      - type: mcq
        prompt: Which declaration should you use for a value that never changes?
        options:
          - "`let`"
          - "`const`"
          - "`var`"
          - "`fixed`"
        answer: 1
        why: "`const`."
      - type: output
        prompt: What does this print?
        code: |
          let x = 2;
          x = x * 5;
          x -= 1;
          console.log(x);
        answer: |
          9
        why: "2 → 10 → 9."
      - type: output
        prompt: What does this print?
        code: |
          console.log(17 % 5);
          console.log(3 ** 2);
        answer: |
          2
          9
        why: "17 = 3 × 5 + 2; 3² = 9."
      - type: mcq
        prompt: Which variable name follows the JavaScript convention?
        options:
