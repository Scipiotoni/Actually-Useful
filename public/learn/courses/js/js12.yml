      - type: code
        prompt: |
          Make the colour picker work: clicking one of the `.swatch`
          buttons (use **one** listener on `#swatches`) sets the background
          colour of `#preview` to the button's `data-color`, and writes the
          colour name into `#name`.
        given:
          index.html: |
            <div id="swatches">
              <button class="swatch" data-color="tomato">Tomato</button>
              <button class="swatch" data-color="gold">Gold</button>
              <button class="swatch" data-color="teal">Teal</button>
            </div>
            <div id="preview" style="width: 100px; height: 60px"></div>
            <p id="name">none</p>
        files:
          script.js: |
        solution:
          script.js: |
            document.querySelector('#swatches').addEventListener('click', (event) => {
              const swatch = event.target.closest('.swatch');
              if (!swatch) {
                return;
              }
              document.querySelector('#preview').style.backgroundColor = swatch.dataset.color;
              document.querySelector('#name').textContent = swatch.dataset.color;
            });
        harness: |
          click('[data-color=gold]');
          check(style('#preview', 'background-color'), color('gold'));
          check(text('#name'), 'gold');
          click('[data-color=teal]');
          check(style('#preview', 'background-color'), color('teal'));
          check(text('#name'), 'teal');
