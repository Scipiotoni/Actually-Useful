id: js12
number: 12
part: js-p3
title: Events
blurb: Make pages respond — clicks, typing, forms and keys — with event listeners, the event object and event delegation.
hours: 3
goals:
  - React to clicks, input, changes and keys with `addEventListener`
  - Use the event object — `target`, `key`, `preventDefault()`
  - Handle forms without reloading the page
  - Handle many elements with one listener using event delegation

