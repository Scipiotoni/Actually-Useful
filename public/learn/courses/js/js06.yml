  - type: lesson
    id: js6-more
    title: Copying, slicing, sorting and joining
    minutes: 25
    objectives:
      - Take parts of arrays with `slice`, and change them with `splice`
      - Copy and combine arrays with the spread syntax
      - Sort numbers and strings correctly
      - Turn arrays into strings and back with `join` and `split`
      - Explain why two variables can share one array
    body: |
      ## slice and splice

      - `slice(start, end)` returns a **copy** of part of the array, from `start` up to (not including) `end`. The original is unchanged.
      - `splice(start, count, …items)` **changes** the array: removes `count` items at `start` and inserts any new ones.

      ```js
      const letters = ['a', 'b', 'c', 'd', 'e'];
      console.log(letters.slice(1, 3));
      console.log(letters.slice(-2));
      letters.splice(1, 2, 'X');
      console.log(letters);
      ```
      ```output
      ['b', 'c']
      ['d', 'e']
      ['a', 'X', 'd', 'e']
      ```

      ## Spread: copying and combining

      `...array` spreads an array's items out:

      ```js
      const weekdays = ['Mon', 'Tue'];
      const weekend = ['Sat', 'Sun'];
      const all = [...weekdays, 'Wed', ...weekend];
      const copy = [...weekdays];
      copy.push('Fri');
      console.log(all);
      console.log(weekdays, copy);
      console.log(Math.max(...[4, 9, 2]));
      ```
      ```output
      ['Mon', 'Tue', 'Wed', 'Sat', 'Sun']
      ['Mon', 'Tue'] ['Mon', 'Tue', 'Fri']
      9
      ```

      ## Two names, one array

      Assigning an array to another variable does **not** copy it — both
      names point at the **same** array:

      ```js
      const original = [1, 2, 3];
      const alias = original;
      alias.push(4);
      console.log(original);
      ```
      ```output
      [1, 2, 3, 4]
      ```

      To get an independent copy, use `[...original]` (or `slice()`).

      ## Sorting

      `sort()` sorts **in place** (changing the array) and, by default,
      compares items **as text** — so numbers sort wrongly:

      ```js
      console.log([10, 9, 100, 1].sort());
      console.log([10, 9, 100, 1].sort((a, b) => a - b));
      console.log([10, 9, 100, 1].sort((a, b) => b - a));
      console.log(['pear', 'Apple', 'fig'].sort());
      ```
      ```output
      [1, 10, 100, 9]
      [1, 9, 10, 100]
      [100, 10, 9, 1]
      ['Apple', 'fig', 'pear']
      ```

      For numbers, pass a compare function: `(a, b) => a - b` sorts
      ascending, `(a, b) => b - a` descending. To keep the original, sort a
      copy: `[...list].sort(…)`.

      ## join and split

      ```js
      console.log(['2026', '09', '25'].join('-'));
      console.log('red,green,blue'.split(','));
      console.log('one two three'.split(' ').length);
      ```
      ```output
      2026-09-25
      ['red', 'green', 'blue']
      3
      ```

      {{check sort}}

      {{task top}}
    checks:
      - id: sort
        type: output
        prompt: What does this print?
        code: |
          const a = [3, 1, 2];
          const b = a;
          b.sort();
          console.log(a);
          const c = [...a];
          c.reverse();
          console.log(a, c);
        answer: |
          [1, 2, 3]
          [1, 2, 3] [3, 2, 1]
        why: "b is the same array as a; c is a real copy."
    tasks:
      - id: top
        title: Leaderboard
        prompt: |
          - `topThree(scores)` — the three highest scores, highest first. **Don't change** the array you're given.
          - `sentence(words)` — the words joined with spaces, with a full stop at the end: `['Hi', 'there']` → `'Hi there.'`
          - `withoutIndex(list, i)` — a **new** array without the item at index `i` (the original unchanged)
        starter: |
          function topThree(scores) {
          }

          function sentence(words) {
          }

          function withoutIndex(list, i) {
          }
        solution: |
          function topThree(scores) {
            return [...scores].sort((a, b) => b - a).slice(0, 3);
          }

          function sentence(words) {
            return words.join(' ') + '.';
          }

          function withoutIndex(list, i) {
            return [...list.slice(0, i), ...list.slice(i + 1)];
          }
        harness: |
          const s = [40, 95, 12, 88, 70];
          check(topThree(s), [95, 88, 70]);
          check(s, [40, 95, 12, 88, 70]);
          check(topThree([5, 100]), [100, 5]);
          check(topThree([9, 10, 100, 1]), [100, 10, 9]);
          check(sentence(['Hi', 'there']), 'Hi there.');
          check(sentence(['Go']), 'Go.');
          const l = ['a', 'b', 'c'];
          check(withoutIndex(l, 1), ['a', 'c']);
          check(withoutIndex(l, 0), ['b', 'c']);
          check(l, ['a', 'b', 'c']);
        hints:
          - "Sort a copy: `[...scores].sort((a, b) => b - a)`, then `.slice(0, 3)`."
          - "`withoutIndex`: the part before i and the part after i — `list.slice(0, i)` and `list.slice(i + 1)` — spread into a new array. (Or `filter((_, j) => j !== i)`.)"
    cards:
      - front: "`slice` vs `splice`?"
        back: slice returns a copy of part of the array; splice changes the array by removing/inserting items.
      - front: How do you sort numbers correctly?
        back: "`nums.sort((a, b) => a - b)` — the default sort compares as text."
      - front: "`const b = a;` for an array — is b a copy?"
        back: No — both names refer to the same array. Copy with `[...a]`.
      - front: How do you turn `'a,b,c'` into an array?
        back: "`'a,b,c'.split(',')` — and `join(',')` goes back."

