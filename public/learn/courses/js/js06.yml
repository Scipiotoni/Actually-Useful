        prompt: Which gives `['A', 'B']` from `['a', 'b']`?
        options:
          - "`list.filter((s) => s.toUpperCase())`"
          - "`list.map((s) => s.toUpperCase())`"
          - "`list.reduce((s) => s.toUpperCase())`"
          - "`list.toUpperCase()`"
