id: js06
number: 6
part: js-p2
title: Arrays
blurb: Keep lists of values in arrays — add, remove, find, loop, and transform them with map, filter and reduce.
hours: 3.5
goals:
  - Create arrays, read and change items by index
  - Add and remove items with `push`, `pop`, `shift`, `unshift`
  - Search with `includes`, `indexOf`, `find`, `some` and `every`
  - Transform with `map`, `filter` and `reduce`
  - Copy, combine, slice, sort and join arrays safely

items:
  - type: lesson
    id: js6-basics
    title: Lists of values
    minutes: 25
    objectives:
      - Create an array and read items by index
      - Add and remove items at the end and the start
      - Loop over an array
    body: |
      An **array** holds an ordered list of values:

      ```js
      const fruits = ['apple', 'banana', 'cherry'];
      console.log(fruits);
      console.log(fruits.length);
      console.log(fruits[0]);
      console.log(fruits[fruits.length - 1]);
      fruits[1] = 'blueberry';
      console.log(fruits);
      ```
      ```output
      ['apple', 'banana', 'cherry']
      3
      apple
      cherry
      ['apple', 'blueberry', 'cherry']
      ```

      - Square brackets, items separated by commas. Items can be any type — even mixed, even other arrays.
      - Indexes start at **0**, like strings. The last item is at `length - 1`. Reading past the end gives `undefined`.
      - `const` stops you **replacing** the array, but you can still change what's **inside** it.

      ## Adding and removing

      ```js
      const queue = ['Ana', 'Ben'];
      queue.push('Cai');        // add to the end
      queue.unshift('Dee');     // add to the start
      console.log(queue);
      const last = queue.pop();     // remove from the end
      const first = queue.shift();  // remove from the start
      console.log(first, last, queue);
      ```
      ```output
      ['Dee', 'Ana', 'Ben', 'Cai']
      Dee Cai ['Ana', 'Ben']
      ```

      ## Looping

      ```js
      const prices = [4, 10, 2.5];
      let total = 0;
      for (const price of prices) {
        total += price;
      }
      console.log(total);

      for (let i = 0; i < prices.length; i++) {
        console.log(`${i + 1}. ${prices[i]} €`);
      }
      ```
      ```output
      16.5
      1. 4 €
      2. 10 €
      3. 2.5 €
      ```

      ## Searching

      - `list.includes(x)` — is `x` in the list? (`true`/`false`)
      - `list.indexOf(x)` — the index of the first `x`, or `-1` if it isn't there.

      {{check idx}}

      {{task basics}}
    checks:
      - id: idx
        type: output
        prompt: What does this print?
        code: |
          const n = [10, 20, 30];
          n.push(40);
          console.log(n.length);
          console.log(n[2]);
          console.log(n.indexOf(40));
          console.log(n.includes(25));
        answer: |
          4
          30
          3
          false
        why: "After push there are 4 items; 40 is at index 3."
    tasks:
      - id: basics
        title: List helpers
        prompt: |
          Write these with loops (not with ready-made methods like
          `Math.max`):

          - `sum(numbers)` — the total of all numbers (`0` for an empty array)
          - `largest(numbers)` — the biggest number (assume the array isn't empty)
          - `countOf(list, value)` — how many times `value` appears
        starter: |
          function sum(numbers) {
          }

          function largest(numbers) {
          }

          function countOf(list, value) {
          }
        solution: |
          function sum(numbers) {
            let total = 0;
            for (const n of numbers) {
              total += n;
            }
            return total;
          }

          function largest(numbers) {
            let best = numbers[0];
            for (const n of numbers) {
              if (n > best) {
                best = n;
              }
            }
            return best;
          }

          function countOf(list, value) {
            let count = 0;
            for (const item of list) {
              if (item === value) {
                count++;
              }
            }
            return count;
          }
        harness: |
          check(sum([1, 2, 3, 4]), 10);
          check(sum([]), 0);
          check(largest([3, 9, 2]), 9);
          check(largest([-5, -2, -9]), -2);
          check(largest([7]), 7);
          check(countOf(['a', 'b', 'a', 'a'], 'a'), 3);
          check(countOf([1, 2, 3], 4), 0);
        hints:
          - "`for (const n of numbers) { … }` visits each number."
          - "For `largest`, start with `numbers[0]` (not 0 — the numbers might all be negative)."
    cards:
      - front: How do you get the last item of an array?
        back: "`list[list.length - 1]` (or `list.at(-1)`)."
      - front: "`push`/`pop` vs `unshift`/`shift`?"
        back: push and pop work at the end; unshift and shift at the start.
      - front: What does `indexOf` return when the value isn't there?
        back: "-1"
      - front: Can you change the items of a `const` array?
        back: Yes — const only stops the variable being reassigned to another array.

  - type: lesson
    id: js6-transform
    title: map, filter and reduce
    minutes: 30
    objectives:
      - Make a new array from an old one with `map`
      - Keep only some items with `filter`
      - Combine all items into one value with `reduce`
      - Find items with `find`, `some` and `every`
    body: |
      Arrays have methods that take a **callback** (Chapter 5) and call it
      for each item. They replace most loops — and read like English.

      ## map: transform every item

      ```js
      const prices = [10, 25, 40];
      const withVat = prices.map((p) => p * 1.2);
      const labels = prices.map((p, i) => `#${i + 1}: ${p} €`);
      console.log(withVat);
      console.log(labels);
      ```
      ```output
      [12, 30, 48]
      ['#1: 10 €', '#2: 25 €', '#3: 40 €']
      ```

      `map` returns a **new** array of the same length; the original is
      unchanged. The callback gets each item (and its index, if you want it).

      ## filter: keep some items

      ```js
      const scores = [55, 92, 71, 38, 88];
      const passed = scores.filter((s) => s >= 60);
      console.log(passed);
      ```
      ```output
      [92, 71, 88]
      ```

      The callback returns `true` to keep an item.

      ## reduce: combine into one value

      ```js
      const cart = [4, 10, 2.5];
      const total = cart.reduce((sum, price) => sum + price, 0);
      console.log(total);
      ```
      ```output
      16.5
      ```

      `reduce(callback, start)`: the callback gets the result **so far**
      (`sum`, starting at `0`) and the next item, and returns the new result
      so far. It's the accumulator pattern in one line.

      ## Finding things

      | Method | Returns |
      |---|---|
      | `find(fn)` | the **first** item where fn is true (or `undefined`) |
      | `findIndex(fn)` | its index (or `-1`) |
      | `some(fn)` | `true` if fn is true for **at least one** item |
      | `every(fn)` | `true` if fn is true for **all** items |

      ## Chaining

      Each method returns something you can call the next one on:

      ```js
      const words = ['sun', 'moonlight', 'sky', 'starfish'];
      const result = words
        .filter((w) => w.length > 3)
        .map((w) => w.toUpperCase());
      console.log(result);
      ```
      ```output
      ['MOONLIGHT', 'STARFISH']
      ```

      {{check chain}}

      {{task transform}}
    checks:
      - id: chain
        type: output
        prompt: What does this print?
        code: |
          const n = [1, 2, 3, 4, 5, 6];
          console.log(n.filter((x) => x % 2 === 0).map((x) => x * 10));
          console.log(n.reduce((a, b) => a + b, 0));
          console.log(n.some((x) => x > 5), n.every((x) => x > 5));
        answer: |
          [20, 40, 60]
          21
          true false
        why: "Evens × 10; the sum; 6 > 5 but not all are."
    tasks:
      - id: transform
        title: Transform the data
        prompt: |
          Use `map`, `filter`, `reduce` or `find` (no loops):

          - `squares(nums)` — each number squared
          - `longWords(words, min)` — only the words with at least `min` characters
          - `product(nums)` — all numbers multiplied together (`1` for an empty array)
          - `firstNegative(nums)` — the first negative number, or `undefined`
        starter: |
          function squares(nums) {
          }

          function longWords(words, min) {
          }

          function product(nums) {
          }

          function firstNegative(nums) {
          }
        solution: |
          function squares(nums) {
            return nums.map((n) => n * n);
          }

          function longWords(words, min) {
            return words.filter((w) => w.length >= min);
          }

          function product(nums) {
            return nums.reduce((acc, n) => acc * n, 1);
          }

          function firstNegative(nums) {
            return nums.find((n) => n < 0);
          }
        harness: |
          check(squares([1, 2, 3]), [1, 4, 9]);
          check(squares([]), []);
          check(longWords(['a', 'tree', 'house', 'go'], 4), ['tree', 'house']);
          check(product([2, 3, 4]), 24);
          check(product([]), 1);
          check(firstNegative([3, -1, -5]), -1);
          check(firstNegative([1, 2]), undefined);
          const original = [1, 2, 3];
          squares(original);
          check(original, [1, 2, 3]);
        hints:
          - "`return nums.map((n) => n * n);` — don't forget the `return`."
          - "`reduce((acc, n) => acc * n, 1)` — a product starts at 1."
    cards:
      - front: What does `map` return?
        back: A new array of the same length, with each item transformed by the callback.
      - front: What does `filter` return?
        back: A new array with only the items for which the callback returned true.
      - front: "How does `reduce((acc, x) => acc + x, 0)` work?"
        back: acc starts at 0; for each item x, the callback's result becomes the new acc; the final acc is returned.
      - front: "`find` vs `filter`?"
        back: find returns the first matching item (or undefined); filter returns an array of all matches.

