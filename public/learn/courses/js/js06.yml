  - type: challenge
    id: js6-ch-unique
    title: Remove duplicates
    difficulty: 2
    tags: [arrays]
    prompt: |
      `unique(list)` returns a new array with each value only **once**,
      keeping the order in which they first appear:
      `unique([3, 1, 3, 2, 1])` is `[3, 1, 2]`.

      (Hint: build a result array and only `push` values it doesn't
      `include` yet.)
    starter: |
      function unique(list) {
      }
    solution: |
      function unique(list) {
        const result = [];
        for (const item of list) {
          if (!result.includes(item)) {
            result.push(item);
          }
        }
        return result;
      }
    harness: |
      check(unique([3, 1, 3, 2, 1]), [3, 1, 2]);
      check(unique([]), []);
      check(unique(['a', 'a', 'a']), ['a']);
      check(unique(['x', 'y']), ['x', 'y']);
      const input = [1, 1, 2];
      unique(input);
      check(input, [1, 1, 2]);
    hints:
      - "`if (!result.includes(item)) result.push(item);`"

  - type: challenge
    id: js6-ch-grades
    title: Class statistics
    difficulty: 3
    tags: [map, filter, reduce]
    prompt: |
      `stats(scores)` returns an array of four values:

      1. the **average**, rounded to 1 decimal (`Math.round(x * 10) / 10`)
      2. how many scores are **60 or more** (passed)
      3. the **highest** score
      4. the scores **sorted from lowest to highest** (without changing the input)

      For an **empty** array, return `[0, 0, 0, []]`.
    starter: |
      function stats(scores) {
      }
    solution: |
      function stats(scores) {
        if (scores.length === 0) {
          return [0, 0, 0, []];
        }
        const total = scores.reduce((sum, s) => sum + s, 0);
        const average = Math.round(total / scores.length * 10) / 10;
        const passed = scores.filter((s) => s >= 60).length;
        const highest = Math.max(...scores);
        const sorted = [...scores].sort((a, b) => a - b);
        return [average, passed, highest, sorted];
      }
    harness: |
      const s = [72, 45, 90, 61, 58];
      check(stats(s), [65.2, 3, 90, [45, 58, 61, 72, 90]]);
      check(s, [72, 45, 90, 61, 58]);
      check(stats([100]), [100, 1, 100, [100]]);
      check(stats([]), [0, 0, 0, []]);
      check(stats([1, 2]), [1.5, 0, 2, [1, 2]]);
    hints:
      - "Handle the empty case first with an early return."
      - "`reduce` for the total, `filter(...).length` for the count, `Math.max(...scores)` for the highest, `[...scores].sort((a, b) => a - b)` for the sorted copy."

  - type: review
    id: js6-review
    title: "Chapter 6 review"
    body: |
      ## Cheat sheet

      ```js static
      const a = [1, 2, 3];
      a[0]   a.length   a[a.length - 1]
      a.push(4)  a.pop()  a.unshift(0)  a.shift()
      a.includes(2)  a.indexOf(2)

      a.map((x) => x * 2)            // new array, same length
      a.filter((x) => x > 1)         // new array, fewer items
      a.reduce((sum, x) => sum + x, 0)
      a.find((x) => x > 1)   a.findIndex(…)   a.some(…)   a.every(…)

      a.slice(1, 3)                  // copy of part
      a.splice(1, 1)                 // change in place
      [...a, ...b]   [...a]          // combine, copy
      [...a].sort((x, y) => x - y)   // sort numbers on a copy
      a.join(', ')   'x,y'.split(',')
      ```

      ## Key ideas

      - Indexes start at 0.
      - `map`, `filter`, `reduce`, `find` replace most loops.
      - Assigning an array doesn't copy it.
      - `sort` changes the array and compares as text unless you pass a compare function.
    questions:
      - type: output
        prompt: What does this print?
        code: |
          const n = [4, 8, 15];
          console.log(n.map((x) => x / 2).filter((x) => x > 3));
        answer: |
          [4, 7.5]
        why: "[2, 4, 7.5], then keep those above 3."
      - type: mcq
        prompt: Which method changes the original array?
        options:
          - "`map`"
          - "`slice`"
          - "`sort`"
          - "`filter`"
        answer: 2
        why: "sort works in place."

