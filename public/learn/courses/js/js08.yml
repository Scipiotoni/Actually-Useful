      - type: code
        prompt: |
          `countBy(words)` returns an object counting words by their
          **first letter** (lower case): `['Apple', 'avocado', 'banana']` →
          `{ a: 2, b: 1 }`. Also write `mostCommonLetter(words)`, which
          returns the letter with the highest count (the first one found
          if tied).
        starter: |
          function countBy(words) {
          }

          function mostCommonLetter(words) {
          }
        solution: |
          function countBy(words) {
            const counts = {};
            for (const w of words) {
              const letter = w[0].toLowerCase();
              counts[letter] = (counts[letter] ?? 0) + 1;
            }
            return counts;
          }

          function mostCommonLetter(words) {
            let best = '';
            let bestCount = 0;
            for (const [letter, count] of Object.entries(countBy(words))) {
              if (count > bestCount) {
                best = letter;
                bestCount = count;
              }
            }
            return best;
          }
        harness: |
          check(countBy(['Apple', 'avocado', 'banana']), { a: 2, b: 1 });
          check(countBy([]), {});
          check(mostCommonLetter(['kiwi', 'lime', 'Kale']), 'k');
          check(mostCommonLetter(['x', 'y']), 'x');
