id: js08
number: 8
part: js-p2
title: Objects
blurb: Group related data under names — objects, methods, destructuring, lists of records, and JSON.
hours: 3.5
goals:
  - Create objects and read, add, change and delete properties
  - Give objects methods and use `this`
  - Loop over an object's keys, values and entries
  - Work with arrays of objects — filter, sort, find, group
  - Use destructuring, spread, and JSON

items:
  - type: lesson
    id: js8-objects
    title: Objects and properties
    minutes: 25
    objectives:
      - Create an object literal
      - Read properties with dot and bracket notation
      - Add, change and delete properties
      - Handle missing properties safely with `?.`
    body: |
      An array is a list in order. An **object** groups values under
      **names** — like a form with labelled fields:

      ```js
      const book = {
        title: 'Dune',
        author: 'Frank Herbert',
        year: 1965,
        tags: ['sci-fi', 'classic'],
      };

      console.log(book.title);
      console.log(book['year']);
      console.log(book.tags[0]);
      console.log(book);
      ```
      ```output
      Dune
      1965
      sci-fi
      {title: 'Dune', author: 'Frank Herbert', year: 1965, tags: ['sci-fi', 'classic']}
      ```

      Each `name: value` pair is a **property**. The names are called
      **keys**. Values can be anything — even arrays and other objects.

      ## Dot or brackets

      - `book.title` — when you know the key while writing the code.
      - `book[key]` — when the key is in a variable or has odd characters: `const field = 'year'; book[field]`.

      ## Changing objects

      ```js
      const user = { name: 'Kim', age: 29 };
      user.age = 30;               // change
      user.email = 'kim@mail.com'; // add
      delete user.name;            // remove
      console.log(user);
      console.log(user.phone);
      console.log('email' in user);
      ```
      ```output
      {age: 30, email: 'kim@mail.com'}
      undefined
      true
      ```

      A missing property is `undefined` — but reading a property **of**
      `undefined` is an error. Optional chaining `?.` stops safely:

      ```js
      const order = { id: 7, customer: { name: 'Lee' } };
      console.log(order.customer?.name);
      console.log(order.shipping?.city);
      console.log(order.shipping?.city ?? 'no address');
      ```
      ```output
      Lee
      undefined
      no address
      ```

      ## Shorthand

      When a variable has the same name as the key, write it once:

      ```js
      const name = 'Ada';
      const age = 36;
      const person = { name, age };   // same as { name: name, age: age }
      console.log(person);
      ```
      ```output
      {name: 'Ada', age: 36}
      ```

      {{check access}}

      {{task user}}
    checks:
      - id: access
        type: output
        prompt: What does this print?
        code: |
          const car = { make: 'Fiat', seats: 4 };
          const key = 'seats';
          car.color = 'red';
          console.log(car[key]);
          console.log(car.key);
          console.log(car.color);
        answer: |
          4
          undefined
          red
        why: "car.key looks for a property literally named 'key'."
    tasks:
      - id: user
        title: Users
        prompt: |
          - `makeUser(name, age)` — returns an object `{ name, age, adult }`, where `adult` is `true` for age 18 or over
          - `describe(user)` — returns `'Ana (34)'`
          - `city(user)` — the user's `address.city`, or `'unknown'` if there's no address (use `?.` and `??`)
        starter: |
          function makeUser(name, age) {
          }

          function describe(user) {
          }

          function city(user) {
          }
        solution: |
          function makeUser(name, age) {
            return { name, age, adult: age >= 18 };
          }

          function describe(user) {
            return `${user.name} (${user.age})`;
          }

          function city(user) {
            return user.address?.city ?? 'unknown';
          }
        harness: |
          check(makeUser('Ana', 34), { name: 'Ana', age: 34, adult: true });
          check(makeUser('Leo', 12), { name: 'Leo', age: 12, adult: false });
          check(describe({ name: 'Ana', age: 34 }), 'Ana (34)');
          check(city({ name: 'Mo', address: { city: 'Lyon' } }), 'Lyon');
          check(city({ name: 'Mo' }), 'unknown');
        hints:
          - "`return { name, age, adult: age >= 18 };`"
          - "`user.address?.city ?? 'unknown'`"
    cards:
      - front: Dot vs bracket notation?
        back: "`obj.key` when you know the key; `obj[variable]` when the key is in a variable."
      - front: What do you get for a missing property?
        back: "`undefined`."
      - front: "What does `a?.b` do?"
        back: Gives undefined instead of an error when a is null or undefined.
      - front: "What is `{ name, age }` short for?"
        back: "`{ name: name, age: age }`"

  - type: lesson
    id: js8-methods
    title: Methods, this, and looping over objects
    minutes: 25
    objectives:
      - Add methods to objects and use `this`
      - List an object's keys, values and entries
      - Loop over an object
    body: |
      ## Methods

      A function stored in an object is a **method**. Inside it, `this` is
      the object the method was called on:

      ```js
      const counter = {
        count: 0,
        increment() {
          this.count++;
          return this.count;
        },
        reset() {
          this.count = 0;
        },
      };

      counter.increment();
      counter.increment();
      console.log(counter.count);
      counter.reset();
      console.log(counter.count);
      ```
      ```output
      2
      0
      ```

      You've been using methods all along: `console.log`, `list.push`,
      `text.toUpperCase`.

      > [!warning]
      > Arrow functions don't have their own `this` — so don't use them for
      > methods that need `this`. Use the `name() { … }` shorthand.

      ## Keys, values and entries

      ```js
      const stock = { apples: 12, pears: 0, plums: 7 };
      console.log(Object.keys(stock));
      console.log(Object.values(stock));
      console.log(Object.entries(stock));

      for (const [fruit, count] of Object.entries(stock)) {
        if (count > 0) {
          console.log(`${fruit}: ${count}`);
        }
      }
      ```
      ```output
      ['apples', 'pears', 'plums']
      [12, 0, 7]
      [['apples', 12], ['pears', 0], ['plums', 7]]
      apples: 12
      plums: 7
      ```

      `Object.entries` gives `[key, value]` pairs; `const [fruit, count]`
      unpacks each pair (that's **destructuring** — more in the next lesson).

      ## Objects as lookup tables

      Objects are perfect for "look something up by name", and for
      **counting**:

      ```js
      const counts = {};
      for (const word of ['a', 'b', 'a', 'c', 'a']) {
        counts[word] = (counts[word] ?? 0) + 1;
      }
      console.log(counts);
      ```
      ```output
      {a: 3, b: 1, c: 1}
      ```

      {{check this}}

      {{task wallet}}
    checks:
      - id: this
        type: output
        prompt: What does this print?
        code: |
          const pet = {
            name: 'Rex',
            speak() {
              return `${this.name} says woof`;
            },
          };
          console.log(pet.speak());
          console.log(Object.keys(pet).length);
        answer: |
          Rex says woof
          2
        why: "this is pet; the keys are name and speak."
    tasks:
      - id: wallet
        title: A wallet and a tally
        prompt: |
          - Complete the `wallet` object's methods: `add(amount)` increases `balance`; `spend(amount)` decreases it **only if** there's enough money, and returns `true` if it spent, `false` if not
          - `total(prices)` — `prices` is an object like `{ bread: 2, milk: 1.5 }`; return the sum of all values
          - `tally(items)` — count how often each string appears in the array: `['a', 'b', 'a']` → `{ a: 2, b: 1 }`
        starter: |
          const wallet = {
            balance: 0,
            add(amount) {
            },
            spend(amount) {
            },
          };

          function total(prices) {
          }

          function tally(items) {
          }
        solution: |
          const wallet = {
            balance: 0,
            add(amount) {
              this.balance += amount;
            },
            spend(amount) {
              if (amount > this.balance) {
                return false;
              }
              this.balance -= amount;
              return true;
            },
          };

          function total(prices) {
            return Object.values(prices).reduce((sum, p) => sum + p, 0);
          }

          function tally(items) {
            const counts = {};
            for (const item of items) {
              counts[item] = (counts[item] ?? 0) + 1;
            }
            return counts;
          }
        harness: |
          wallet.add(20);
          check(wallet.balance, 20);
          check(wallet.spend(5), true);
          check(wallet.balance, 15);
          check(wallet.spend(50), false);
          check(wallet.balance, 15);
          check(total({ bread: 2, milk: 1.5 }), 3.5);
          check(total({}), 0);
          check(tally(['a', 'b', 'a']), { a: 2, b: 1 });
          check(tally([]), {});
        hints:
          - "Inside the methods, use `this.balance`."
          - "`Object.values(prices)` gives the prices as an array — then `reduce`."
          - "`counts[item] = (counts[item] ?? 0) + 1;`"
    cards:
      - front: "What is `this` inside a method?"
        back: The object the method was called on.
      - front: Why not use an arrow function for a method that uses `this`?
        back: Arrow functions don't have their own `this`.
      - front: "What does `Object.entries({a: 1})` return?"
        back: "`[['a', 1]]` — an array of [key, value] pairs."
      - front: How do you count occurrences with an object?
        back: "`counts[x] = (counts[x] ?? 0) + 1;`"

