  - type: lesson
    id: js8-records
    title: Lists of records, destructuring and JSON
    minutes: 30
    objectives:
      - Filter, sort and search arrays of objects
      - Unpack values with destructuring
      - Copy and merge objects with spread
      - Convert to and from JSON
    body: |
      Real data is usually an **array of objects** — rows of a table:

      ```js
      const products = [
        { name: 'Lamp', price: 30, stock: 4 },
        { name: 'Chair', price: 85, stock: 0 },
        { name: 'Rug', price: 60, stock: 2 },
      ];

      const available = products.filter((p) => p.stock > 0);
      console.log(available.map((p) => p.name));

      const byPrice = [...products].sort((a, b) => a.price - b.price);
      console.log(byPrice.map((p) => `${p.name} ${p.price}`));

      console.log(products.find((p) => p.name === 'Rug').price);
      ```
      ```output
      ['Lamp', 'Rug']
      ['Lamp 30', 'Rug 60', 'Chair 85']
      60
      ```

      ## Destructuring

      Unpack properties (or array items) into variables in one go:

      ```js
      const user = { name: 'Ada', age: 36, city: 'London' };
      const { name, city } = user;
      console.log(name, city);

      const [first, second] = ['gold', 'silver', 'bronze'];
      console.log(first, second);

      function greet({ name, age }) {
        return `${name} is ${age}`;
      }
      console.log(greet(user));
      ```
      ```output
      Ada London
      gold silver
      Ada is 36
      ```

      ## Spread for objects

      ```js
      const defaults = { theme: 'light', size: 14 };
      const saved = { size: 18 };
      const settings = { ...defaults, ...saved };
      console.log(settings);

      const user = { name: 'Kim', age: 29 };
      const older = { ...user, age: user.age + 1 };
      console.log(user.age, older.age);
      ```
      ```output
      {theme: 'light', size: 18}
      29 30
      ```

      Later properties win, so this merges settings over defaults — and
      makes an **updated copy** without changing the original.

      ## JSON

      **JSON** (JavaScript Object Notation) is how data travels between
      programs — to servers, into files, into storage. It's text that looks
      like JavaScript objects:

      ```js
      const data = { id: 1, tags: ['new'], done: false };
      const text = JSON.stringify(data);
      console.log(text);
      console.log(typeof text);
      const back = JSON.parse(text);
      console.log(back.tags[0]);
      ```
      ```output
      {"id":1,"tags":["new"],"done":false}
      string
      new
      ```

      In JSON, keys and strings always use **double quotes**, and there are
      no functions or `undefined`.

      {{check destructure}}

      {{task shop}}
    checks:
      - id: destructure
        type: output
        prompt: What does this print?
        code: |
          const point = { x: 3, y: 4 };
          const { x, y } = point;
          const moved = { ...point, x: 10 };
          console.log(x + y, moved.x, point.x);
        answer: |
          7 10 3
        why: "Destructuring copies values; spread makes a new object."
    tasks:
      - id: shop
        title: A small shop
        prompt: |
          Each product looks like `{ name, price, qty, category }`.

          - `inStock(products)` — the **names** of products with `qty` above 0
          - `stockValue(products)` — the total of price × qty over all products
          - `cheapest(products)` — the **name** of the cheapest product (assume at least one)
          - `restock(product, amount)` — a **new** product object with `qty` increased (the original unchanged)
        starter: |
          function inStock(products) {
          }

          function stockValue(products) {
          }

          function cheapest(products) {
          }

          function restock(product, amount) {
          }
        solution: |
          function inStock(products) {
            return products.filter((p) => p.qty > 0).map((p) => p.name);
          }

          function stockValue(products) {
            return products.reduce((sum, p) => sum + p.price * p.qty, 0);
          }

          function cheapest(products) {
            return [...products].sort((a, b) => a.price - b.price)[0].name;
          }

          function restock(product, amount) {
            return { ...product, qty: product.qty + amount };
          }
        harness: |
          const items = [
            { name: 'Pen', price: 1.5, qty: 10, category: 'office' },
            { name: 'Mug', price: 8, qty: 0, category: 'kitchen' },
            { name: 'Pad', price: 3, qty: 4, category: 'office' },
          ];
          check(inStock(items), ['Pen', 'Pad']);
          check(stockValue(items), 27);
          check(cheapest(items), 'Pen');
          check(items.map((p) => p.name), ['Pen', 'Mug', 'Pad']);
          const mug = items[1];
          check(restock(mug, 5), { name: 'Mug', price: 8, qty: 5, category: 'kitchen' });
          check(mug.qty, 0);
        hints:
          - "`filter` then `map` for the names in stock."
          - "`reduce((sum, p) => sum + p.price * p.qty, 0)`"
          - "Sort a copy by price and take `[0].name` — or loop keeping the cheapest so far. For `restock`, spread: `{ ...product, qty: … }`."
    cards:
      - front: How do you sort an array of objects by a number property?
        back: "`[...list].sort((a, b) => a.price - b.price)`"
      - front: What does `const { name } = user;` do?
        back: Creates a variable name with the value of user.name (destructuring).
      - front: How do you make an updated copy of an object?
        back: "`{ ...obj, changedKey: newValue }`"
      - front: "`JSON.stringify` vs `JSON.parse`?"
        back: stringify turns a value into JSON text; parse turns JSON text back into a value.

