  - type: challenge
    id: js8-ch-group
    title: Group by category
    difficulty: 3
    tags: [objects, arrays]
    prompt: |
      `groupBy(items, key)` groups an array of objects by the value of
      `key`, returning an object whose keys are those values and whose
      values are arrays of the matching items, in order:

      ```js static
      groupBy([{ n: 'a', t: 'x' }, { n: 'b', t: 'y' }, { n: 'c', t: 'x' }], 't')
      // { x: [{ n: 'a', t: 'x' }, { n: 'c', t: 'x' }], y: [{ n: 'b', t: 'y' }] }
      ```
    starter: |
      function groupBy(items, key) {
      }
    solution: |
      function groupBy(items, key) {
        const groups = {};
        for (const item of items) {
          const value = item[key];
          if (!groups[value]) {
            groups[value] = [];
          }
          groups[value].push(item);
        }
        return groups;
      }
    harness: |
      const list = [{ n: 'a', t: 'x' }, { n: 'b', t: 'y' }, { n: 'c', t: 'x' }];
      check(groupBy(list, 't'), { x: [{ n: 'a', t: 'x' }, { n: 'c', t: 'x' }], y: [{ n: 'b', t: 'y' }] });
      check(groupBy(list, 'n'), { a: [list[0]], b: [list[1]], c: [list[2]] });
      check(groupBy([], 't'), {});
    hints:
      - "`item[key]` reads the property named by the variable `key`."
      - "If `groups[value]` doesn't exist yet, set it to `[]`; then push."

  - type: challenge
    id: js8-ch-gradebook
    title: Gradebook
    difficulty: 3
    tags: [objects, destructuring]
    prompt: |
      Each student is `{ name, scores }` (an array of numbers).

      - `averages(students)` — an object mapping each name to their average score, rounded to 1 decimal: `{ Ana: 85.5, Ben: 70 }`
      - `best(students)` — the **name** of the student with the highest average (the first one if tied)

      Students with no scores have an average of `0`.
    starter: |
      function averages(students) {
      }

      function best(students) {
      }
    solution: |
      function average(scores) {
        if (scores.length === 0) {
          return 0;
        }
        const total = scores.reduce((sum, s) => sum + s, 0);
        return Math.round(total / scores.length * 10) / 10;
      }

      function averages(students) {
        const result = {};
        for (const { name, scores } of students) {
          result[name] = average(scores);
        }
        return result;
      }

      function best(students) {
        let bestName = students[0].name;
        let bestAverage = average(students[0].scores);
        for (const { name, scores } of students) {
          if (average(scores) > bestAverage) {
            bestName = name;
            bestAverage = average(scores);
          }
        }
        return bestName;
      }
    harness: |
      const cls = [
        { name: 'Ana', scores: [80, 91] },
        { name: 'Ben', scores: [70] },
        { name: 'Cy', scores: [] },
      ];
      check(averages(cls), { Ana: 85.5, Ben: 70, Cy: 0 });
      check(best(cls), 'Ana');
      check(best([{ name: 'X', scores: [50] }, { name: 'Y', scores: [50] }]), 'X');
      check(averages([]), {});
    hints:
      - "A helper `average(scores)` keeps both functions short."
      - "`for (const { name, scores } of students)` destructures each student."

  - type: review
    id: js8-review
    title: "Chapter 8 review"
    body: |
      ## Cheat sheet

      ```js static
      const u = { name: 'Ada', age: 36 };
      u.name   u['age']   u[key]   u.email = 'x'   delete u.age
      u.address?.city ?? 'unknown'
      const o = { name, age };                     // shorthand

      const obj = {
        count: 0,
        inc() { this.count++; },                   // method
      };

      Object.keys(u)  Object.values(u)  Object.entries(u)
      for (const [k, v] of Object.entries(u)) { … }

      const { name, age } = u;   const [a, b] = list;
      const copy = { ...u, age: 37 };
      list.filter((p) => p.stock > 0).map((p) => p.name)
      [...list].sort((a, b) => a.price - b.price)

      JSON.stringify(value)   JSON.parse(text)
      ```

      ## Key ideas

      - Objects group values under keys; arrays of objects are tables of records.
      - Assignment shares objects; spread makes shallow copies.
      - `this` in a method is the object it was called on.
      - JSON is text for sending and storing data.
    questions:
      - type: output
        prompt: What does this print?
        code: |
          const o = { a: 1 };
          const k = 'b';
          o[k] = 2;
          console.log(Object.entries(o));
        answer: |
          [['a', 1], ['b', 2]]
        why: "The key comes from the variable."
      - type: mcq
        prompt: Which gives a copy of `user` with the name changed, leaving `user` alone?
        options:
          - "`user.name = 'X'`"
          - "`const c = user; c.name = 'X';`"
          - "`const c = { ...user, name: 'X' };`"
          - "`const c = user.copy('X');`"
        answer: 2
        why: "Spread into a new object."

