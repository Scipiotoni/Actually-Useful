      check($$('h3').map((h) => h.textContent.trim()), ['Day 1: Arrival', 'Day 2: Old Tokyo', 'Day 3: Temples']);
      check($$('h3').every((h) => h.nextElementSibling && h.nextElementSibling.tagName === 'P'), true);
      check(count('h4, h5, h6'), 0);
      check($$('h1, h2, h3').map((h) => h.tagName.toLowerCase()), ['h1', 'h2', 'h3', 'h3', 'h2', 'h3']);
    hints:
