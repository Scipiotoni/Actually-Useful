        <h1>Two weeks in Japan</h1>
        <h2>Tokyo</h2>
        <h3>Day 1: Arrival</h3>
        <p>We landed in the evening and found a tiny noodle bar.</p>
        <h3>Day 2: Old Tokyo</h3>
