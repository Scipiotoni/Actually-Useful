      level for each line, following the rules (one `<h1>`, no skipped
      levels). Add one paragraph under **each** of the three `Day` headings.

      ```text
      Two weeks in Japan            ← the page's topic
        Tokyo                       ← a city
          Day 1: Arrival
          Day 2: Old Tokyo
        Kyoto                       ← a city
          Day 3: Temples
      ```
    files:
      index.html: |
    solution:
