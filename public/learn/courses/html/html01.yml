  - type: review
    id: html1-review
    title: "Chapter 1 review"
    body: |
      ## Cheat sheet

      ```html static
      <!DOCTYPE html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Shown in the browser tab</title>
        </head>
        <body>
          <h1>Main topic (one per page)</h1>
          <h2>A section</h2>
          <p>A paragraph with <strong>important</strong> words.<br>A line break.</p>
          <hr>
          <!-- a comment nobody sees -->
        </body>
      </html>
      ```

      ## Key ideas

      - HTML is content and structure; CSS is the look; JavaScript is behaviour.
      - An element = opening tag + content + closing tag. Void elements (`<br>`, `<hr>`, `<meta>`, `<img>`) have no closing tag.
      - Attributes add information: `name="value"` in the opening tag.
      - Nest properly: close in reverse order.
      - Whitespace collapses. New paragraph → new `<p>`; line break in content → `<br>`.
      - Headings are an outline: one `<h1>`, no skipped levels.
      - Browsers forgive mistakes silently — inspect and validate.
    questions:
      - type: order
        prompt: Put this page in order.
        lines:
          - "<!DOCTYPE html>"
          - "<html lang=\"en\">"
          - "<head>"
          - "<meta charset=\"utf-8\">"
          - "<title>Notes</title>"
          - "</head>"
          - "<body>"
          - "<h1>Notes</h1>"
          - "<p>Remember to water the plants.</p>"
          - "</body>"
          - "</html>"
        why: "Doctype, then html → head (charset, title) → body (content)."
      - type: mcq
        prompt: Which is written correctly?
        options:
          - "`<p>I <em>really</p> mean it</em>`"
          - "`<p>I <em>really</em> mean it</p>`"
          - "`<p>I <em>really mean it</p>`"
          - "`<em><p>I really mean it</em></p>`"
        answer: 1
        why: "Tags close in reverse order: `<em>` closes before `</p>`."
      - type: fill
        prompt: Add a line break and a dividing line.
        code: |
          <p>Line one___Line two</p>
          ___
          <p>Next part</p>
        blanks:
          - ["<br>", "<br/>", "<br />"]
          - ["<hr>", "<hr/>", "<hr />"]
        why: "`<br>` breaks a line inside content; `<hr>` separates sections."

  - type: exam
    id: html1-exam
    title: "Chapter 1 exam"
    minutes: 20
    pick: 10
    questions:
      - type: mcq
        prompt: What is HTML responsible for in a web page?
        options:
          - The colours and fonts
          - The content and its structure
          - Reacting to clicks
          - Storing passwords
        answer: 1
        why: "HTML marks up content — headings, paragraphs, links, images."
      - type: tf
        prompt: "`<meta charset=\"utf-8\">` belongs in the `<body>`."
        answer: false
        why: "It describes the page, so it belongs in the `<head>`."
      - type: mcq
        prompt: What appears in the browser's tab?
        options:
          - The first `<h1>`
          - The `<title>`
          - The file name, always
          - The first paragraph
        answer: 1
        why: "The `<title>` in the head."
      - type: spot
        prompt: Which line has a mistake?
        code: |
          <h1>Contact</h1>
          <p>Email me at <strong>hello@example.com</strong></p>
          <p>Or call <em>0123 456 789</p></em>
          <p>Thanks!</p>
        answer: 3
        why: "`</em>` must come before `</p>`."
      - type: fill
        prompt: Complete the comment.
        code: |
          ___ This part is under construction ___
        blanks:
          - ["<!--"]
          - ["-->"]
        why: "Comments start with `<!--` and end with `-->`."
      - type: mcq
        prompt: "A paragraph's code has the word `one`, then three empty lines, then the word `two`. How is it shown?"
        options:
          - On three lines
          - "\"one two\" on one line"
          - "\"onetwo\""
          - With blank lines between
        answer: 1
        why: "New lines and spaces collapse into one space."
      - type: tf
        prompt: Headings should be chosen by how big you want the text to be.
        answer: false
        why: "Headings describe the outline; size is CSS's job."
      - type: mcq
        prompt: What is `lang="en"` in `<html lang="en">`?
        options:
          - An element
          - An attribute
          - A comment
          - A void tag
        answer: 1
        why: "An attribute: `name=\"value\"` inside an opening tag."
      - type: order
        prompt: Nest these correctly.
        lines:
          - "<body>"
          - "<p>"
          - "Hello <strong>there</strong>"
          - "</p>"
          - "</body>"
        why: "The paragraph is inside the body; strong is inside the paragraph."
      - type: mcq
        prompt: What does a browser do with `<h2>Title<h2>` (missing slash)?
        options:
          - Shows an error message
          - Refuses to show the page
          - Guesses where the heading ends and carries on — the structure may be wrong
          - Fixes your file on disk
        answer: 2
        why: "Browsers are forgiving; the mistake hides but can break the structure."
      - type: code
        prompt: |
          Write a fragment with an `<h1>` saying `Library`, an `<h2>`
          saying `Opening times`, and a paragraph with the two lines
          `Mon–Fri: 9–18` and `Sat: 10–14` separated by a `<br>`.
        files:
          index.html: |
        solution:
          index.html: |
            <h1>Library</h1>
            <h2>Opening times</h2>
            <p>Mon–Fri: 9–18<br>Sat: 10–14</p>
        harness: |
          check(text('h1'), 'Library');
          check(text('h2'), 'Opening times');
          check(count('p br'), 1);
          check($('p').innerText.split('\n').map((l) => l.trim()), ['Mon–Fri: 9–18', 'Sat: 10–14']);
      - type: mcq
        prompt: Which elements are void (no closing tag)?
        options:
          - "`<p>` and `<h1>`"
          - "`<br>`, `<hr>` and `<meta>`"
          - "`<body>` and `<head>`"
          - "`<strong>` and `<em>`"
        answer: 1
        why: "They can't contain anything, so they have no closing tag."
