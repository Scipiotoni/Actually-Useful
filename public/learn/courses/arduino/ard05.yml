id: ard05
number: 5
part: ard-p2
title: Analog Inputs and Sensors
blurb: Measure voltages with analogRead, turn readings into volts and degrees, build voltage dividers for light and temperature sensors, and make steady decisions from noisy numbers.
hours: 3
goals:
  - Read a voltage with analogRead and convert it to volts
  - Use a potentiometer as a knob
  - Calculate a voltage divider and use one with a light sensor
  - Convert a TMP36 reading to degrees
  - Scale readings with map and constrain
  - Avoid flickering with hysteresis and averaging

items:
  - type: lesson
    id: ard5-analog
    title: analogRead and the potentiometer
    minutes: 18
    objectives:
      - Explain what the ADC measures and its range
      - Convert a reading from 0–1023 to volts
      - Read a potentiometer
    body: |
      Digital pins only know HIGH and LOW. The analog pins **A0–A5** can
      tell *how much* voltage there is. Inside, an **ADC** (analog-to-digital
      converter) measures 0–5 V and gives a whole number from **0 to 1023**:

      | Voltage on the pin | `analogRead` gives |
      |---|---|
      | 0 V | 0 |
      | 2.5 V | about 511 |
      | 5 V | 1023 |

      1024 steps is **10 bits** — each step is about 5 mV.

      ## From reading to volts

      ```math
      volts = reading × 5.0 ÷ 1023
      ```

      ## The potentiometer

      A **potentiometer** ("pot") is a knob: a resistor with a third leg, the
      **wiper**, that slides along it. Connect the ends to 5 V and GND and the
      wiper to A0: turning the knob moves A0 from 0 V to 5 V.

      ```cpp
      void setup() {
        Serial.begin(9600);
      }

      void loop() {
        int reading = analogRead(A0);
        float volts = reading * 5.0 / 1023;
        Serial.print(reading);
        Serial.print(" = ");
        Serial.print(volts);
        Serial.println(" V");
        delay(500);
      }
      ```

      ```stdin
      A0 0
      A0 512 @400
      A0 1023 @900
      run 1400
      ```

      ```output
      0 = 0.00 V
      512 = 2.50 V
      1023 = 5.00 V
      ```

      In the simulator you turn the knob from the input box: `A0 512 @400`
      sets A0 to 512 from 400 ms on. On the board view the pin's line shows
      the value over time.

      > [!warning]
      > Never put more than **5 V** on an Uno pin (3.3 V on 3.3 V boards like
      > the ESP32 and Raspberry Pi Pico). It can destroy the chip.

      {{check range}}

      {{check mid}}

      {{task volts}}
    checks:
      - id: range
        type: mcq
        prompt: What range of numbers does `analogRead` give on an Uno?
        options:
          - 0 to 255
          - 0 to 1023
          - 0 to 5
          - −512 to 511
        answer: 1
        why: "The Uno's ADC has 10 bits: 1024 values, 0 to 1023."
      - id: mid
        type: mcq
        prompt: A pin reads 1.0 V. About what does `analogRead` return?
        options:
          - "1"
          - "about 205"
          - "about 512"
          - "1023"
        answer: 1
        why: "1.0 V is a fifth of 5 V, and a fifth of 1023 is about 205."
    tasks:
      - id: volts
        title: Reading to volts
        prompt: |
          Write `float toVolts(int reading)` that turns an `analogRead`
          value into volts (5 V board).
        starter: |
          float toVolts(int reading) {
            return 0;
          }
        harness: |
          CHECK(toVolts(0), 0);
          CHECK(toVolts(1023), 5);
          CHECK(toVolts(1023) / 2, toVolts(1023) / 2);
          CHECK(toVolts(2046 / 5) > 1.99, true);
          CHECK(toVolts(2046 / 5) < 2.01, true);
        hints:
          - "Multiply by 5.0, divide by 1023. Use 5.0 (not 5) so the division keeps its decimals."
        solution: |
          float toVolts(int reading) {
            return reading * 5.0 / 1023;
          }
    cards:
      - front: What does analogRead measure, and what range does it give on an Uno?
        back: The voltage on an analog pin (0–5 V), as a number from 0 to 1023.
      - front: How do you turn an analogRead value into volts?
        back: "`reading * 5.0 / 1023`"
      - front: What is a potentiometer?
        back: A resistor with a sliding wiper — a knob that gives any voltage between its two ends.

  - type: lesson
    id: ard5-sensors
    title: Voltage dividers, light and temperature
    minutes: 22
    objectives:
      - Calculate the output of a voltage divider
      - Read a light-dependent resistor with a fixed resistor
      - Convert a TMP36 temperature sensor reading to °C
    body: |
      Many sensors are just resistors that change: an **LDR**
      (light-dependent resistor) has less resistance in bright light. The
      Arduino measures voltage, not resistance, so we turn resistance into
      voltage with a **voltage divider**: two resistors in series between
      5 V and GND, with the pin connected in the middle.

      ```math
      Vout = Vin × R2 ÷ (R1 + R2)
      ```

      R1 is the resistor from 5 V to the middle, R2 from the middle to GND.
      Two equal resistors give half: 5 V × 10k ÷ 20k = 2.5 V.

      ```cpp
      float divider(float vin, float r1, float r2) {
        return vin * r2 / (r1 + r2);
      }

      void setup() {
        Serial.begin(9600);
        Serial.println(divider(5, 10000, 10000));
        Serial.println(divider(5, 10000, 1000));
        Serial.println(divider(9, 2000, 1000));
      }

      void loop() {}
      ```

      ```output
      2.50
      0.45
      3.00
      ```

      ## A light sensor

      Put the LDR as R1 and a fixed 10 kΩ resistor as R2. In the dark the
      LDR is maybe 100 kΩ → the middle is near 0.45 V. In bright light it
      drops to about 1 kΩ → about 4.5 V. **Brighter = higher reading.**

      > [!tip]
      > Dividers also let a 5 V Arduino measure bigger voltages safely: a 20k
      > and 10k divider turns a 9 V battery into 3 V at the pin.

      ## The TMP36 temperature sensor

      The TMP36 has three legs: 5 V, GND and an output that gives **0.5 V
      at 0 °C**, plus **10 mV (0.01 V) per degree**:

      ```math
      °C = (volts − 0.5) × 100
      ```

      ```cpp
      void setup() {
        Serial.begin(9600);
      }

      void loop() {
        float volts = analogRead(A1) * 5.0 / 1023;
        float celsius = (volts - 0.5) * 100;
        Serial.print(celsius);
        Serial.println(" C");
        delay(1000);
      }
      ```

      ```stdin
      A1 153
      A1 164 @800
      run 1500
      ```

      ```output
      24.78 C
      30.16 C
      ```

      {{check divider}}

      {{check ldr}}

      {{task tmp}}
    checks:
      - id: divider
        type: mcq
        prompt: "5 V goes through R1 = 30 kΩ, then R2 = 10 kΩ to GND. What's the voltage in the middle?"
        options:
          - 1.25 V
          - 2.5 V
          - 3.75 V
          - 5 V
        answer: 0
        why: "5 × 10k ÷ (30k + 10k) = 5 × 0.25 = 1.25 V."
      - id: ldr
        type: tf
        prompt: With the LDR as R1 (top) and a fixed resistor as R2 (bottom), more light gives a higher reading.
        answer: true
        why: "More light → the LDR's resistance falls → R2 gets a bigger share → the middle voltage rises."
    tasks:
      - id: tmp
        title: TMP36 to Celsius
        prompt: |
          Write `float celsius(int reading)` that turns an `analogRead`
          value from a TMP36 into degrees Celsius.
        starter: |
          float celsius(int reading) {
            return 0;
          }
        harness: |
          CHECK(celsius(1023), 450);
          CHECK(celsius(0), -50);
          CHECK(celsius(153) > 24.7, true);
          CHECK(celsius(153) < 24.8, true);
        hints:
          - "First volts: reading * 5.0 / 1023."
          - "Then (volts - 0.5) * 100."
        solution: |
          float celsius(int reading) {
            float volts = reading * 5.0 / 1023;
            return (volts - 0.5) * 100;
          }
    cards:
      - front: The voltage divider formula?
        back: "Vout = Vin × R2 ÷ (R1 + R2), with R2 the resistor to GND."
      - front: How does an LDR change with light?
        back: Its resistance goes down as light goes up.
      - front: How do you get °C from a TMP36?
        back: "°C = (volts − 0.5) × 100 — 0.5 V at 0 °C and 10 mV per degree."

  - type: lesson
    id: ard5-decisions
    title: map, constrain and steady decisions
    minutes: 22
    objectives:
      - Rescale a reading with map
      - Keep a value within limits with constrain
      - Use two thresholds (hysteresis) to stop flickering
      - Smooth noisy readings with an average
    body: |
      ## map: from one range to another

      `map(value, fromLow, fromHigh, toLow, toHigh)` rescales a number. A
      knob from 0–1023 to a percentage:

      ```cpp
      void setup() {
        Serial.begin(9600);
        Serial.println(map(0, 0, 1023, 0, 100));
        Serial.println(map(512, 0, 1023, 0, 100));
        Serial.println(map(1023, 0, 1023, 0, 100));
        Serial.println(map(300, 0, 1023, 100, 0));
      }

      void loop() {}
      ```

      ```output
      0
      50
      100
      71
      ```

      The last line maps *backwards* (100 down to 0) — handy for sensors
      that read low when you want high. `map` works with whole numbers and
      drops the decimals.

      ## constrain: stay within limits

      `constrain(x, low, high)` gives `low` if x is below, `high` if above,
      else x itself. Use it when a calculation could go out of range:
      `constrain(level, 0, 255)`.

      ## Hysteresis: stop the flicker

      A night light that switches on below 300 will **flicker** at dusk:
      the reading wobbles 298, 302, 299… Use **two** thresholds instead — on
      below 300, off only above 400. Between them, keep doing what you were
      doing.

      ```cpp
      bool on = false;

      void setup() {
        pinMode(13, OUTPUT);
      }

      void loop() {
        int light = analogRead(A0);
        if (light < 300) {
          on = true;
        } else if (light > 400) {
          on = false;
        }
        digitalWrite(13, on);
        delay(50);
      }
      ```

      ```stdin
      A0 600
      A0 350 @100
      A0 280 @200
      A0 320 @300
      A0 290 @400
      A0 450 @500
      trace
      run 700
      ```

      ```output
      [200 ms] pin 13 HIGH
      [501 ms] pin 13 LOW
      ```

      At 350 it stays off (not dark enough yet); at 280 it turns on; the
      wobble to 320 and 290 changes nothing; only 450 turns it off. (It
      happens at 501 ms, not 500: the sketch only looks every 50 ms, and
      each `analogRead` itself takes about 0.1 ms.)

      ## Averaging

      Readings jump around by a few steps. Adding up several and dividing
      smooths them:

      ```cpp static
      long total = 0;
      for (int i = 0; i < 8; i++) {
        total += analogRead(A0);
      }
      int smooth = total / 8;
      ```

      {{check map}}

      {{check hyst}}

      {{task percent}}
    checks:
      - id: map
        type: output
        code: |
          void setup() {
            Serial.begin(9600);
            Serial.println(map(50, 0, 100, 0, 255));
            Serial.println(constrain(300, 0, 255));
            Serial.println(constrain(-4, 0, 255));
          }

          void loop() {}
        answer: |
          127
          255
          0
        why: "50 is halfway, and halfway to 255 is 127 (the .5 is dropped). constrain clips 300 to 255 and −4 to 0."
      - id: hyst
        type: mcq
        prompt: Why use two thresholds (on below 300, off above 400) instead of one?
        options:
          - It uses less power
          - So a reading wobbling around one value doesn't make it switch on and off again and again
          - map needs two numbers
          - analogRead is only accurate above 400
        answer: 1
        why: "That's hysteresis: between the thresholds it keeps its state, so small wobbles don't flip it."
    tasks:
      - id: percent
        title: Knob to percent
        prompt: |
          Every **500 ms**, read the knob on **A2** and print it as a
          percentage, like `Volume: 50%`.
        starter: |
          void setup() {
            Serial.begin(9600);
          }

          void loop() {

          }
        tests:
          - in: |
              A2 0
              A2 512 @300
              A2 1023 @800
              run 1200
            out: |
              Volume: 0%
              Volume: 50%
              Volume: 100%
        hints:
          - "`int percent = map(analogRead(A2), 0, 1023, 0, 100);`"
          - "Print \"Volume: \", the number, then println \"%\". End loop() with delay(500)."
        solution: |
          void setup() {
            Serial.begin(9600);
          }

          void loop() {
            int percent = map(analogRead(A2), 0, 1023, 0, 100);
            Serial.print("Volume: ");
            Serial.print(percent);
            Serial.println("%");
            delay(500);
          }
    cards:
      - front: What does `map(512, 0, 1023, 0, 100)` give?
        back: "50 — it rescales 0–1023 to 0–100 (whole numbers)."
      - front: What does `constrain(x, 0, 255)` do?
        back: Keeps x between 0 and 255 — below becomes 0, above becomes 255.
      - front: What is hysteresis?
        back: Two thresholds (e.g. on below 300, off above 400) so a value wobbling near one doesn't keep flipping the output.

  - type: quiz
    id: ard5-quiz
    title: "Quiz: analog inputs"
    questions:
      - type: mcq
        prompt: Which pins can use `analogRead` on an Uno?
        options:
          - Digital 0–13
          - A0–A5
          - Only pin 13
          - GND and 5V
        answer: 1
        why: "The analog pins A0–A5 are connected to the ADC."
      - type: output
        code: |
          void setup() {
            Serial.begin(9600);
            int r = analogRead(A0);
            Serial.println(r * 5.0 / 1023);
          }

          void loop() {}
        stdin: |
          A0 1023
        answer: |
          5.00
        why: "1023 is the top of the range: 5 V."
      - type: mcq
        prompt: "In a divider with R1 = 10 kΩ and R2 = 10 kΩ on 5 V, what's the middle voltage?"
        options:
          - 1 V
          - 2.5 V
          - 5 V
          - 10 V
        answer: 1
        why: "Equal resistors split the voltage in half: 2.5 V."
      - type: tf
        prompt: A TMP36 gives 0.5 V at 0 °C and 10 mV more per degree.
        answer: true
        why: "So °C = (volts − 0.5) × 100."
      - type: mcq
        prompt: What does `map(1023, 0, 1023, 255, 0)` give?
        options:
          - "0"
          - "255"
          - "1023"
          - "127"
        answer: 0
        why: "The output range is reversed: the top of the input maps to the end of the output, 0."

  - type: challenge
    id: ard5-ch-bar
    title: An LED bar graph
    difficulty: 2
    tags: [map, for, analogRead]
    prompt: |
      Four LEDs on pins **2, 3, 4, 5** show the level of a sensor on
      **A0**, like a volume meter. Every **50 ms**:

      - read A0 and work out `int lit = map(reading, 0, 1023, 0, 4);`
      - switch on the first `lit` LEDs (starting at pin 2) and the rest off
    starter: |
      void setup() {
        for (int pin = 2; pin <= 5; pin++) {
          pinMode(pin, OUTPUT);
        }
      }

      void loop() {

      }
    tests:
      - in: |
          A0 0
          A0 512 @100
          A0 1023 @200
          A0 300 @300
          trace
          run 400
        out: |
          [100 ms] pin 2 HIGH
          [100 ms] pin 3 HIGH
          [200 ms] pin 4 HIGH
          [200 ms] pin 5 HIGH
          [300 ms] pin 3 LOW
          [300 ms] pin 4 LOW
          [300 ms] pin 5 LOW
    hints:
      - "Loop over the pins: LED number `pin - 2` is on when it's less than `lit`."
      - "`digitalWrite(pin, pin - 2 < lit ? HIGH : LOW);` — then delay(50)."
    solution: |
      void setup() {
        for (int pin = 2; pin <= 5; pin++) {
          pinMode(pin, OUTPUT);
        }
      }

      void loop() {
        int lit = map(analogRead(A0), 0, 1023, 0, 4);
        for (int pin = 2; pin <= 5; pin++) {
          if (pin - 2 < lit) {
            digitalWrite(pin, HIGH);
          } else {
            digitalWrite(pin, LOW);
          }
        }
        delay(50);
      }

  - type: challenge
    id: ard5-ch-thermostat
    title: A thermostat
    difficulty: 3
    tags: [TMP36, hysteresis]
    prompt: |
      A TMP36 on **A1** and a heater relay on pin **8**. Once a **second**:

      - read the temperature and print it like `Temp: 18.30 C`
      - switch the heater **on below 19 °C** and **off above 21 °C**;
        in between, leave it as it is

      Readings to try: 140 is about 18.4 °C, 150 about 23.3 °C, 145 about
      20.9 °C.
    starter: |
      void setup() {
        Serial.begin(9600);
        pinMode(8, OUTPUT);
      }

      void loop() {

      }
    tests:
      - in: |
          A1 150
          A1 140 @1500
          A1 145 @2500
          A1 150 @3500
          trace
          run 4500
        out: |
          Temp: 23.31 C
          Temp: 23.31 C
          Temp: 18.43 C
          [2000 ms] pin 8 HIGH
          Temp: 20.87 C
          Temp: 23.31 C
          [4000 ms] pin 8 LOW
    hints:
      - "Keep the heater state in a `bool heating = false;` outside loop()."
      - "`if (temp < 19) heating = true; else if (temp > 21) heating = false;` then digitalWrite(8, heating)."
    solution: |
      bool heating = false;

      void setup() {
        Serial.begin(9600);
        pinMode(8, OUTPUT);
      }

      void loop() {
        float volts = analogRead(A1) * 5.0 / 1023;
        float temp = (volts - 0.5) * 100;
        Serial.print("Temp: ");
        Serial.print(temp);
        Serial.println(" C");
        if (temp < 19) {
          heating = true;
        } else if (temp > 21) {
          heating = false;
        }
        digitalWrite(8, heating);
        delay(1000);
      }

  - type: exam
    id: ard5-exam
    title: "Chapter 5 exam"
    minutes: 25
    questions:
      - type: mcq
        prompt: What does an ADC do?
        options:
          - Turns a voltage into a number
          - Turns a number into sound
          - Makes the board faster
          - Stores the sketch
        answer: 0
        why: "An analog-to-digital converter measures a voltage and gives a number (0–1023 on an Uno)."
      - type: mcq
        prompt: analogRead gives 614. About how many volts is that?
        options:
          - 1 V
          - 2 V
          - 3 V
          - 4 V
        answer: 2
        why: "614 × 5 ÷ 1023 ≈ 3.0 V."
      - type: fill
        prompt: The voltage divider formula.
        code: |
          Vout = Vin * ___ / (R1 + R2)
        blanks:
          - [R2]
        why: "The output is the share of R2, the resistor to GND."
      - type: tf
        prompt: You can safely put 9 V straight onto an Uno's A0 pin.
        answer: false
        why: "More than 5 V can destroy the chip. Use a voltage divider to bring it down."
      - type: output
        code: |
          void setup() {
            Serial.begin(9600);
            Serial.println(map(256, 0, 1023, 0, 4));
            Serial.println(map(5, 0, 10, 0, 1000));
          }

          void loop() {}
        answer: |
          1
          500
        why: "256 is a quarter of 1023, and a quarter of 4 is 1 (1.0009 rounded down). 5 is half of 10: 500."
      - type: mcq
        prompt: What is the TMP36 reading at 25 °C, in volts?
        options:
          - 0.25 V
          - 0.5 V
          - 0.75 V
          - 2.5 V
        answer: 2
        why: "0.5 V + 25 × 0.01 V = 0.75 V."
      - type: mcq
        prompt: A fan should turn on above 30 °C and off below 27 °C. What is this technique called?
        options:
          - Debouncing
          - Hysteresis
          - Multiplexing
          - Pulse width modulation
        answer: 1
        why: "Two thresholds with a gap between them is hysteresis."
      - type: code
        prompt: |
          Write `int smooth(int a, int b, int c, int d)` that returns the
          average of four readings as a whole number (decimals dropped).
        starter: |
          int smooth(int a, int b, int c, int d) {
            return 0;
          }
        harness: |
          CHECK(smooth(100, 100, 100, 100), 100);
          CHECK(smooth(100, 102, 98, 104), 101);
          CHECK(smooth(1023, 1023, 1023, 1023), 1023);
          CHECK(smooth(0, 0, 0, 3), 0);
        solution: |
          int smooth(int a, int b, int c, int d) {
            return (a + b + c + d) / 4;
          }
      - type: code
        prompt: |
          A plant's soil sensor on **A3** reads **low when the soil is
          dry**. Every **second**, print `Water me!` if the reading is below
          **400**, and `OK` otherwise.
        starter: |
          void setup() {
            Serial.begin(9600);
          }

          void loop() {

          }
        tests:
          - in: |
              A3 600
              A3 350 @1500
              run 2500
            out: |
              OK
              OK
              Water me!
        solution: |
          void setup() {
            Serial.begin(9600);
          }

          void loop() {
            if (analogRead(A3) < 400) {
              Serial.println("Water me!");
            } else {
              Serial.println("OK");
            }
            delay(1000);
          }
