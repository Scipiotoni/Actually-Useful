              [250 ms] pin 8 LOW
              [250 ms] shiftOut 00001111
              [250 ms] pin 8 HIGH
              [500 ms] pin 8 LOW
              [500 ms] shiftOut 11110000
              [500 ms] pin 8 HIGH
        hints:
          - "`show(0b11110000); delay(250); show(0b00001111); delay(250);`"
        solution: |
          const int DATA = 11;
          const int CLOCK = 12;
          const int LATCH = 8;

          void show(byte pattern) {
            digitalWrite(LATCH, LOW);
            shiftOut(DATA, CLOCK, MSBFIRST, pattern);
            digitalWrite(LATCH, HIGH);
          }

          void setup() {
            pinMode(DATA, OUTPUT);
            pinMode(CLOCK, OUTPUT);
            pinMode(LATCH, OUTPUT);
          }

          void loop() {
            show(0b11110000);
            delay(250);
            show(0b00001111);
            delay(250);
          }
    cards:
      - front: What does a 74HC595 shift register do?
        back: Turns three pins (data, clock, latch) into eight outputs; chips can be chained for more.
      - front: The steps to show a byte on a 74HC595?
        back: latch LOW, shiftOut(data, clock, MSBFIRST, value), latch HIGH.
      - front: What is a register?
        back: A byte inside the microcontroller whose bits control or report hardware — e.g. PORTB holds the levels of pins 8–13.

  - type: quiz
    id: ard7-quiz
    title: "Quiz: bits and bytes"
    questions:
      - type: mcq
        prompt: What is 10 in binary?
        options:
          - "0b1010"
          - "0b1100"
          - "0b0110"
          - "0b1001"
        answer: 0
        why: "8 + 2 = 10, so bits 3 and 1 are on: 1010."
      - type: mcq
        prompt: How many bits does one hex digit stand for?
        options:
          - "2"
          - "4"
          - "8"
          - "16"
        answer: 1
        why: "16 values need 4 bits, so a byte is exactly two hex digits."
      - type: output
        code: |
          void setup() {
            Serial.begin(9600);
            byte b = 0b0110;
            b |= 0b0001;
            Serial.println(b);
            b &= 0b0011;
            Serial.println(b);
          }

          void loop() {}
        answer: |
          7
          3
        why: "0110 | 0001 = 0111 (7). Then 0111 & 0011 = 0011 (3)."
      - type: tf
        prompt: "`x << 3` is the same as multiplying x by 8."
        answer: true
        why: "Each shift left doubles: 2 × 2 × 2 = 8."
      - type: mcq
        prompt: Why use a shift register?
        options:
          - To get more output pins from just three Arduino pins
          - To make the Arduino faster
          - To read analog sensors
          - To store the sketch
        answer: 0
        why: "One 74HC595 gives eight outputs from three pins, and chips can be chained."

  - type: challenge
    id: ard7-ch-counter
    title: A binary counter
    difficulty: 2
    tags: [shiftOut, byte]
    prompt: |
      Count in binary on eight LEDs: show 0, 1, 2, 3… on the shift register,
      one number every **100 ms**. After 255 it should go back to 0 — a
      `byte` does that by itself.

      The `show()` function is ready for you.
    starter: |
      const int DATA = 11;
      const int CLOCK = 12;
      const int LATCH = 8;

      void show(byte pattern) {
        digitalWrite(LATCH, LOW);
        shiftOut(DATA, CLOCK, MSBFIRST, pattern);
        digitalWrite(LATCH, HIGH);
      }

      void setup() {
        pinMode(DATA, OUTPUT);
        pinMode(CLOCK, OUTPUT);
        pinMode(LATCH, OUTPUT);
      }

      void loop() {

      }
    tests:
      - in: |
          trace
          run 350
        out: |
          [0 ms] shiftOut 00000000
          [0 ms] pin 8 HIGH
          [100 ms] pin 8 LOW
          [100 ms] shiftOut 00000001
          [100 ms] pin 8 HIGH
          [200 ms] pin 8 LOW
          [200 ms] shiftOut 00000010
          [200 ms] pin 8 HIGH
          [300 ms] pin 8 LOW
          [300 ms] shiftOut 00000011
          [300 ms] pin 8 HIGH
    hints:
      - "Keep `byte count = 0;` outside loop()."
      - "In loop(): show(count), count++, delay(100)."
    solution: |
      const int DATA = 11;
      const int CLOCK = 12;
      const int LATCH = 8;
      byte count = 0;

      void show(byte pattern) {
        digitalWrite(LATCH, LOW);
        shiftOut(DATA, CLOCK, MSBFIRST, pattern);
        digitalWrite(LATCH, HIGH);
      }

      void setup() {
        pinMode(DATA, OUTPUT);
        pinMode(CLOCK, OUTPUT);
        pinMode(LATCH, OUTPUT);
      }

      void loop() {
        show(count);
        count++;
        delay(100);
      }

  - type: challenge
    id: ard7-ch-flags
    title: Packing sensor flags
    difficulty: 3
    tags: [bitwise, masks]
    prompt: |
      A home alarm sends its sensors as one byte:

      | Bit | Sensor |
      |---|---|
      | 0 | door open |
      | 1 | window open |
      | 2 | motion |
      | 3 | smoke |

      Write:

      - `byte pack(bool door, bool window, bool motion, bool smoke)` —
        puts the four values in their bits; the other bits are 0
      - `bool danger(byte flags)` — true if **smoke** is set, or if
        **motion** is set together with the **door or window**
    starter: |
      byte pack(bool door, bool window, bool motion, bool smoke) {
        return 0;
      }

      bool danger(byte flags) {
        return false;
      }
    harness: |
      CHECK((int) pack(false, false, false, false), 0);
      CHECK((int) pack(true, false, false, false), 1);
      CHECK((int) pack(false, true, true, false), 6);
      CHECK((int) pack(true, true, true, true), 15);
      CHECK(danger(0b1000), true);
      CHECK(danger(0b0100), false);
      CHECK(danger(0b0101), true);
      CHECK(danger(0b0110), true);
      CHECK(danger(0b0011), false);
    hints:
      - "`if (door) flags |= (1 << 0);` and so on — or `flags = door | (window << 1) | …`."
      - "Test a bit with `(flags & (1 << 3)) != 0`."
    solution: |
      byte pack(bool door, bool window, bool motion, bool smoke) {
        byte flags = 0;
        if (door) flags |= (1 << 0);
        if (window) flags |= (1 << 1);
        if (motion) flags |= (1 << 2);
        if (smoke) flags |= (1 << 3);
        return flags;
      }

      bool danger(byte flags) {
        bool open = (flags & 0b0011) != 0;
        bool motion = (flags & (1 << 2)) != 0;
        bool smoke = (flags & (1 << 3)) != 0;
        return smoke || (motion && open);
      }

  - type: exam
    id: ard7-exam
    title: "Chapter 7 exam"
    minutes: 25
    questions:
      - type: mcq
        prompt: What is `0b11111111` in decimal?
        options:
          - "8"
          - "128"
          - "255"
          - "256"
        answer: 2
        why: "All eight bits on: 128 + 64 + … + 1 = 255."
      - type: mcq
        prompt: What is 200 in hex?
        options:
          - "0xC8"
          - "0x200"
          - "0xA0"
          - "0x8C"
        answer: 0
        why: "200 = 12 × 16 + 8, and 12 is C: 0xC8."
      - type: fill
        prompt: A mask with only bit 5 on.
        code: |
          byte mask = 1 ___ 5;
        blanks:
          - ["<<"]
        why: "1 << 5 moves the 1 five places left: 0b00100000 (32)."
      - type: output
        code: |
          void setup() {
            Serial.begin(9600);
            byte v = 0b10110000;
            Serial.println(v >> 4, BIN);
            Serial.println(v & 0x0F);
            Serial.println(bitRead(v, 7));
          }

          void loop() {}
        answer: |
          1011
          0
          1
        why: "Shifting right 4 leaves the top four bits, 1011. The low four bits are all 0. Bit 7 is 1."
      - type: tf
        prompt: "`flags ^= (1 << 2);` flips bit 2."
        answer: true
        why: "XOR with a 1 flips a bit; XOR with 0 leaves it."
      - type: mcq
        prompt: Which condition is true when **bit 0** of `status` is on?
        options:
          - "`status && 1`"
          - "`status & 1`"
          - "`status | 1`"
          - "`status == 1`"
        answer: 1
        why: "`status & 1` keeps only bit 0. `status == 1` would be false if any other bit were on too."
      - type: mcq
        prompt: Which three wires does a 74HC595 need?
        options:
          - Data, clock and latch
          - Red, green and blue
          - TX, RX and GND
          - SDA, SCL and reset
        answer: 0
        why: "Data carries the bits, clock takes each one, latch shows them all."
      - type: code
        prompt: |
          Write `byte reverseBits(byte b)` that reverses the order of the 8
          bits: `0b00000001` becomes `0b10000000`, `0b11010000` becomes
          `0b00001011`.
        starter: |
          byte reverseBits(byte b) {
            return b;
          }
        harness: |
          CHECK((int) reverseBits(0b00000001), 0b10000000);
          CHECK((int) reverseBits(0b11010000), 0b00001011);
          CHECK((int) reverseBits(0), 0);
          CHECK((int) reverseBits(255), 255);
          CHECK((int) reverseBits(0b01100001), 0b10000110);
        solution: |
          byte reverseBits(byte b) {
            byte out = 0;
            for (int n = 0; n < 8; n++) {
              if (b & (1 << n)) {
                out |= (1 << (7 - n));
              }
            }
            return out;
          }
