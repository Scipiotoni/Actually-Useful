          - "`transition`"
          - "`z-index`"
        answer: 0
        why: "Without it, the styles return to the element's normal ones after the last frame."
      - type: mcq
        prompt: "In `transform: translateX(100px) rotate(45deg)`, which applies first?"
        options:
          - translateX — reading left to right
          - rotate — transforms apply right to left
