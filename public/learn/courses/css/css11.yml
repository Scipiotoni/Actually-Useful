        answer: 1
        why: "The rightmost function is applied first; order changes the result."
      - type: tf
        prompt: Interface transitions of about 2 seconds feel responsive.
        answer: false
        why: "150–300ms feels responsive; 2 seconds feels slow."
      - type: code
        prompt: |
          `.link` transitions `color` over `0.2s`. On hover it's `crimson`.
          Also define `@keyframes wiggle` with `rotate(-5deg)` at `25%` and
          `rotate(5deg)` at `75%`, and run it on `.bell` over `0.5s`, `3` times.
        given:
          index.html: |
            <a class="link" href="#">Notifications</a> <span class="bell">🔔</span>
        files:
          style.css: |
        solution:
          style.css: |
            .link {
              transition: color 0.2s;
            }

            .link:hover {
              color: crimson;
            }

            @keyframes wiggle {
              25% {
                transform: rotate(-5deg);
              }
              75% {
                transform: rotate(5deg);
              }
            }

            .bell {
              display: inline-block;
              animation: wiggle 0.5s 3;
            }
        harness: |
          check(style('.link', 'transition-property'), 'color');
          check(style('.link', 'transition-duration'), '0.2s');
          check(color(hover('.link', 'color')), color('crimson'));
          const frames = [...document.styleSheets].flatMap((s) => [...s.cssRules]).find((r) => r.type === 7 && r.name === 'wiggle');
          check(frames ? [...frames.cssRules].map((k) => k.keyText + ' ' + k.style.transform.replace(/\s/g, '')).sort() : null, ['25% rotate(-5deg)', '75% rotate(5deg)']);
          check(style('.bell', 'animation-name'), 'wiggle');
          check(style('.bell', 'animation-duration'), '0.5s');
          check(style('.bell', 'animation-iteration-count'), '3');
