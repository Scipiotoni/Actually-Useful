      - type: mcq
        prompt: Which is the right order for a mobile-first stylesheet?
        options:
          - "Rules for phones, then `@media (min-width: 600px)`, then `@media (min-width: 900px)`"
          - "`@media (min-width: 900px)` first, then smaller ones"
          - "Only media queries, no rules outside"
          - "Any order"
        answer: 0
        why: "Base first, then growing breakpoints, so later rules override."
      - type: code
        prompt: |
          Mobile first: `.side` is hidden (`display: none`) on small
          screens, and from `800px` wide it is shown (`display: block`) and
          exactly `250px` wide.
        given:
          index.html: |
            <aside class="side">Filters</aside>
            <main>Results</main>
        files:
          style.css: |
        solution:
          style.css: |
            .side {
              display: none;
            }

            @media (min-width: 800px) {
              .side {
                display: block;
                width: 250px;
              }
            }
        harness: |
          await viewport(500);
          check(style('.side', 'display'), 'none');
          await viewport(900);
          check(style('.side', 'display'), 'block');
          check(box('.side').width, 250);
          await viewport(800);
