    questions:
      - type: mcq
        prompt: What does a responsive page do?
        options:
          - Loads faster
          - Adapts its layout to the screen width
          - Responds to clicks
          - Works without CSS
        answer: 1
        why: "One page, every screen."
      - type: mcq
        prompt: "Which rules apply at 500px wide?"
        code: |
          .a { color: red; }
          @media (min-width: 600px) { .a { color: blue; } }
        options:
          - red
          - blue
          - both
          - neither
        answer: 0
        why: "500 < 600, so the query doesn't apply."
      - type: fill
        prompt: Rules for screens up to 599px wide.
        code: |
          @media (___: 599px) { … }
        blanks:
