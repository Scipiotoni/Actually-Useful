        why: "`max-width`."
      - type: tf
        prompt: Breakpoints should match the exact widths of popular phones.
        answer: false
        why: "Put them where your design breaks."
      - type: mcq
        prompt: "`clamp(16px, 2vw, 24px)` on a 600px wide screen is…"
        options:
          - 12px
          - 16px
          - 24px
          - 2px
        answer: 1
        why: "2vw = 12px, below the 16px minimum."
      - type: mcq
        prompt: Which keeps an image from being squashed when its box has a different shape?
        options:
          - "`object-fit: cover`"
          - "`background-size: cover`"
          - "`aspect-ratio: auto`"
          - "`image-rendering: crisp`"
        answer: 0
        why: "`object-fit` is for `<img>`; `background-size` for backgrounds."
      - type: mcq
        prompt: How do you respond to a reader who uses dark mode?
        options:
