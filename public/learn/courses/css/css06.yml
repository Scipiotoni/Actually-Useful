      - type: code
        prompt: |
          Using `border-box` sizing, make `.box` exactly `200px` wide and
          `100px` tall (border to border), with `20px` padding, a
          `5px dashed` border in `orange`, `8px` rounded corners, centred
          with auto margins.
        given:
          index.html: |
            <div class="box">Hello</div>
        files:
          style.css: |
        solution:
          style.css: |
            * {
              box-sizing: border-box;
            }

            .box {
              width: 200px;
              height: 100px;
              padding: 20px;
              border: 5px dashed orange;
              border-radius: 8px;
              margin: 0 auto;
            }
        harness: |
          const b = box('.box');
          const page = box('body');
          check([b.width, b.height], [200, 100]);
          check(style('.box', 'padding-top'), '20px');
          check(style('.box', 'border-top-style'), 'dashed');
          check(style('.box', 'border-top-color'), color('orange'));
          check(style('.box', 'border-bottom-left-radius'), '8px');
          check(Math.abs((b.x - page.x) - (page.x + page.width - b.x - b.width)) <= 1, true);
