id: css08
number: 8
part: css-p2
title: Grid
blurb: Two-dimensional layouts — rows and columns at once — for galleries, dashboards and whole pages.
hours: 3
goals:
  - Define columns and rows with `grid-template-columns`, `fr` and `repeat()`
  - Place and span items by line numbers
  - Lay out a page with named grid areas
  - Build responsive grids with `auto-fit` and `minmax()`, no media queries needed
  - Choose between Flexbox and Grid

items:
  - type: video
    id: css8-video-grid
    title: "Watch: Grid makes layouts"
    body: |
      **What you just saw**

      - `display: grid` with `grid-template-columns` makes columns: `1fr 1fr 1fr` is three equal ones.
      - `fr` means a *fraction of the free space*; `gap` spaces rows and columns.
      - `grid-column: span 2` makes an item two columns wide.
      - `repeat(auto-fit, minmax(120px, 1fr))` fits as many columns as there's room for.
